name: App Store release tools

on:
    push:
        branches: [fitfight-app-store-review]
        paths:
            - "scripts/app-store-release-audit.rb"
            - ".github/workflows/app-store-release-tools.yml"

concurrency:
    group: ios-distribution
    cancel-in-progress: false

jobs:
    audit:
        runs-on: ubuntu-latest
        timeout-minutes: 20
        permissions:
            contents: write
        steps:
            - uses: actions/checkout@v4
            - uses: ruby/setup-ruby@v1
              with:
                  ruby-version: "3.3"
                  bundler-cache: true
            - name: Select 1.2.0 build 232 and submit it for App Review
              env:
                  FITFIGHT_RELEASE_VERSION: "1.2.0"
                  APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
                  APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
                  APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
              run: bundle exec ruby scripts/app-store-release-audit.rb submit 232
            - name: Admit the submitted build as the production review build
              env:
                  APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
                  APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
                  APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
              run: bash scripts/publish-app-releases.sh
