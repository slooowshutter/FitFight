name: App Store release tools

on:
    push:
        branches: [update-app-store-copy]
        paths:
            - "scripts/app-store-release-audit.rb"
            - ".github/workflows/app-store-release-tools.yml"

jobs:
    audit:
        runs-on: ubuntu-latest
        timeout-minutes: 10
        permissions:
            contents: read
        steps:
            - uses: actions/checkout@v4
            - uses: ruby/setup-ruby@v1
              with:
                  ruby-version: "3.3"
                  bundler-cache: true
            - name: Configure authorized automatic publication
              env:
                  FITFIGHT_RELEASE_VERSION: "1.1.2"
                  APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
                  APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
                  APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
              run: bundle exec ruby scripts/app-store-release-audit.rb configure
