name: Selective Bugbot review

on:
    pull_request_target:
        types: [opened, reopened, synchronize, ready_for_review, labeled, edited]

concurrency:
    group: bugbot-review-${{ github.event.pull_request.number }}
    cancel-in-progress: false

permissions:
    contents: read
    pull-requests: read

jobs:
    request-review:
        if: vars.BUGBOT_ROUTING_ENABLED == 'true'
        runs-on: ubuntu-latest
        timeout-minutes: 5
        steps:
            # pull_request_target uses the trusted default-branch SHA, never PR code.
            - uses: actions/checkout@v4
              with:
                  ref: ${{ github.sha }}
                  persist-credentials: false
                  sparse-checkout: .github/scripts

            - uses: actions/github-script@v7
              env:
                  BUGBOT_GITHUB_TOKEN: ${{ secrets.BUGBOT_GITHUB_TOKEN }}
              with:
                  # Unselected PRs need only read access. Selected reviews fail without the secret.
                  github-token: ${{ secrets.BUGBOT_GITHUB_TOKEN || github.token }}
                  script: |
                      await require('./.github/scripts/bugbot-review.cjs')({
                          github,
                          context,
                          core,
                          triggerTokenAvailable: Boolean(process.env.BUGBOT_GITHUB_TOKEN),
                      });
