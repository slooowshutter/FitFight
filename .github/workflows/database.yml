# Local Postgres via the Supabase CLI. GitHub-hosted Ubuntu, never a Mac.
name: Database

on:
  pull_request:
  push:
    branches: [main, develop]

concurrency:
  group: database-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Migrations and RLS
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Forbid destructive SQL
        run: python3 scripts/forbid-destructive-sql.py

      - uses: supabase/setup-cli@v1
        with:
          version: 2.115.0

      - name: Start local database
        run: supabase db start

      - name: Lint schema
        run: supabase db lint --local --schema public,private --fail-on error

      - name: pgTAP
        run: supabase test db --local

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install backend dependencies
        working-directory: web
        run: npm ci

      - name: TypeScript database transactions
        working-directory: web
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: npm run test:db
