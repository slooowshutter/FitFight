# Compile on GitHub-hosted macOS. Never self-hosted. Never a home Mac.
name: iOS simulator build

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  design-previews:
    name: Design catalog
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Re-render previews from tokens
        run: python3 scripts/render_design_catalog.py
      - name: Previews must match themes.json
        run: git diff --exit-code -- docs/design

  build:
    name: Simulator
    runs-on: macos-26
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Build for iOS Simulator
        run: |
          set -o pipefail
          xcodebuild \
            -project FitFight.xcodeproj \
            -scheme FitFight \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build
