# Compile on GitHub-hosted macOS. Never self-hosted. Never a home Mac.
name: iOS simulator build

on:
    push:
        branches: [preview]

concurrency:
    group: ios-build-${{ github.ref }}
    cancel-in-progress: true

jobs:
    design-previews:
        name: Design tokens
        runs-on: ubuntu-latest
        timeout-minutes: 5
        permissions:
            contents: read
        steps:
            - uses: actions/checkout@v4
            - name: Release availability
              run: ruby fastlane/testflight_test.rb
            - name: Purchase notification setup syntax
              run: ruby -c scripts/apple-specials-notifications.rb
            - name: Native API boundary
              run: python3 scripts/check_native_api_boundary.py
            - name: tokens.json is valid and in sync
              run: |
                  python3 - <<'PY'
                  import json
                  from pathlib import Path
                  app = json.loads(Path("FitFight/DesignSystem/tokens.json").read_text())
                  source = json.loads(Path("docs/design/source/tokens.json").read_text())
                  if app != source:
                      raise SystemExit("FitFight/DesignSystem/tokens.json must match docs/design/source/tokens.json")
                  print("tokens ok", len(app.get("colors", {}).get("accents", {})), "accents")
                  PY

    build:
        name: Simulator
        runs-on: macos-26
        timeout-minutes: 30
        permissions:
            contents: read
        steps:
            - uses: actions/checkout@v4

            - name: Validate English and French localizations
              run: python3 scripts/check_localizations.py

            - name: Verify app update reminders and production gate
              timeout-minutes: 1
              run: |
                  swiftc -swift-version 5 -target "$(uname -m)-apple-macosx13.0" FitFight/AppUpdateChecker.swift tests/AppUpdateCheckerTests.swift -o /tmp/fitfight-update-tests
                  /tmp/fitfight-update-tests

            - name: Verify Google sign-in and environment selection
              run: python3 scripts/test_google_sign_in.py

            - name: Verify account preferences and language switching
              run: python3 scripts/test_account_preferences.py

            - name: Verify offline Fight localization
              run: python3 scripts/test_fight_localization.py

            - name: Verify remaining-time labels
              run: |
                  swiftc -swift-version 5 -target "$(uname -m)-apple-macosx14.0" FitFight/AppLocalization.swift FitFight/RemainingTime.swift tests/RemainingTimeTests.swift -o /tmp/fitfight-remaining-tests
                  /tmp/fitfight-remaining-tests

            - name: Verify remote photo cache keys
              run: |
                  swiftc -swift-version 5 -target "$(uname -m)-apple-macosx13.0" FitFight/RemoteImageCache.swift tests/RemoteImageCacheTests.swift -o /tmp/fitfight-image-cache-tests
                  /tmp/fitfight-image-cache-tests

            - name: Verify live standings and snapshot ordering
              run: python3 scripts/test_fight_live_updates.py

            - name: Verify Fight charts use confirmed scores
              run: python3 scripts/test_fight_chart_scores.py

            - name: Verify slide haptic ramps and fast swipes
              run: python3 scripts/test_slide_haptics.py

            - name: Verify native refresh and feed state
              run: python3 scripts/test_native_state.py

            - name: Verify companion prompt retention and reuse
              run: python3 scripts/test_companion_state.py

            - name: Verify Special purchase recovery
              run: python3 scripts/test_special_purchases.py

            - name: Verify remote photo loading
              run: python3 scripts/check_remote_photo_loading.py

            - name: Verify push signout and session restoration
              run: python3 scripts/test_push_state.py

            - name: Verify notification preferences and released clients
              run: python3 scripts/test_notification_preferences.py

            - name: Verify notification targets and activity loading
              run: python3 scripts/test_feed_activity.py

            - name: Verify fight discovery caching
              run: python3 scripts/test_fight_discovery.py

            - name: Verify calendar rematches
              run: python3 scripts/test_profile_challenges.py

            - name: Verify first-Fight onboarding progress and account isolation
              run: python3 scripts/test_onboarding_state.py

            - name: Verify Profile joins and round navigation
              run: python3 scripts/test_profile_interactions.py

            - name: Verify native API contracts
              run: |
                  swiftc -swift-version 5 -target "$(uname -m)-apple-macosx14.0" FitFight/AppLocalization.swift FitFight/AIWorkflowRequest.swift FitFight/Media.swift FitFight/Profile.swift FitFight/FightSnapshot.swift tests/APIContractTests.swift -o /tmp/fitfight-contract-tests
                  /tmp/fitfight-contract-tests contracts/fixtures

            - name: Verify generation recovery and account isolation
              run: python3 scripts/test_ai_companion_state.py

            - name: Verify feedback and released-client decoding
              run: python3 scripts/test_feedback_compatibility.py

            - name: Verify profile access and response ordering
              run: |
                  swiftc -swift-version 5 -target "$(uname -m)-apple-macosx13.0" FitFight/SharedProfile.swift FitFight/ProfileScreenStore.swift tests/ProfileScreenStoreTests.swift -o /tmp/fitfight-profile-tests
                  /tmp/fitfight-profile-tests contracts/fixtures

            - name: Verify profile history navigation and rematches
              run: python3 scripts/test_profile_navigation.py

            - name: Verify Profile refresh after HealthKit upload
              run: python3 scripts/test_profile_refresh.py

            - name: Build for iOS Simulator
              run: |
                  set -o pipefail
                  xcodebuild \
                    -project FitFight.xcodeproj \
                    -scheme FitFight \
                    -configuration Debug \
                    -destination 'generic/platform=iOS Simulator' \
                    -derivedDataPath build \
                    CODE_SIGNING_ALLOWED=YES \
                    CODE_SIGNING_REQUIRED=YES \
                    CODE_SIGN_STYLE=Manual \
                    CODE_SIGN_IDENTITY=- \
                    build

            - name: Render limited companion previews
              if: github.ref == 'refs/heads/exclusive-animal-avatars'
              run: |
                  set -euo pipefail
                  RUNTIME=$(xcrun simctl list runtimes --json | python3 -c "import json,sys; rs=[r for r in json.load(sys.stdin)['runtimes'] if r['isAvailable'] and 'iOS' in r['name']]; print(sorted(rs,key=lambda r:r['version'])[-1]['identifier'])")
                  DEVICE_TYPE=$(xcrun simctl list devicetypes --json | python3 -c "import json,sys; ds=[d for d in json.load(sys.stdin)['devicetypes'] if d['name'] in ('iPhone 16','iPhone 15','iPhone 17')]; print(ds[0]['identifier'])")
                  UDID=$(xcrun simctl create limited-companions "$DEVICE_TYPE" "$RUNTIME")
                  xcrun simctl boot "$UDID"
                  xcrun simctl bootstatus "$UDID" -b
                  xcrun simctl install "$UDID" build/Build/Products/Debug-iphonesimulator/FitFight.app
                  CONTAINER=$(xcrun simctl get_app_container "$UDID" com.fitfight.mvp data)
                  for LANGUAGE in en fr; do
                      SIMCTL_CHILD_FF_COMPANION_PREVIEW=1 SIMCTL_CHILD_FF_COMPANION_EXPORT=1 xcrun simctl launch "$UDID" com.fitfight.mvp -AppleLanguages "($LANGUAGE)" -AppleLocale "$LANGUAGE"
                      for ((i = 0; i < 45; i++)); do
                          if [ -f "$CONTAINER/Documents/companion-shots/done.txt" ]; then break; fi
                          sleep 2
                      done
                      test -f "$CONTAINER/Documents/companion-shots/done.txt"
                      mkdir -p "limited-previews/$LANGUAGE"
                      cp "$CONTAINER/Documents/companion-shots/"*picker*.png "$CONTAINER/Documents/companion-shots/"*you-special*.png "limited-previews/$LANGUAGE/"
                      xcrun simctl terminate "$UDID" com.fitfight.mvp
                      rm "$CONTAINER/Documents/companion-shots/done.txt"
                      for THEME in day night; do
                          SIMCTL_CHILD_FF_COMPANION_PREVIEW=1 SIMCTL_CHILD_FF_COMPANION_PICKER=1 SIMCTL_CHILD_FF_COMPANION_THEME="$THEME" xcrun simctl launch "$UDID" com.fitfight.mvp -AppleLanguages "($LANGUAGE)" -AppleLocale "$LANGUAGE"
                          sleep 4
                          xcrun simctl io "$UDID" screenshot "limited-previews/$LANGUAGE/$THEME-picker-running.png"
                          xcrun simctl terminate "$UDID" com.fitfight.mvp
                      done
                  done

            - uses: actions/upload-artifact@v4
              if: github.ref == 'refs/heads/exclusive-animal-avatars'
              with:
                  name: limited-companion-previews
                  path: limited-previews
                  retention-days: 7

            - name: Package simulator app with Keychain capabilities
              run: python3 scripts/package_simulator_app.py build/Build/Products/Debug-iphonesimulator/FitFight.app FitFight-Simulator.zip

            - uses: actions/upload-artifact@v4
              with:
                  name: FitFight-Simulator
                  path: FitFight-Simulator.zip
                  retention-days: 7
