# Renders every screen in the simulator and publishes the PNGs as an artifact,
# so agents (and Marc) can see the UI without installing a build.
name: Screenshots

on:
  pull_request:
    paths:
      - "FitFight/**"
      - "FitFight.xcodeproj/**"
      - "scripts/check_localizations.py"
      - ".github/workflows/ios-screenshots.yml"
  push:
    branches: [main, develop]
    paths:
      - "FitFight/**"
      - "FitFight.xcodeproj/**"
      - "scripts/check_localizations.py"
      - ".github/workflows/ios-screenshots.yml"
  workflow_dispatch:

concurrency:
  group: ios-screenshots-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shots:
    name: Render screens
    runs-on: macos-26
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Validate English and French localizations
        run: python3 scripts/check_localizations.py

      - name: Write production screenshot environment
        run: |
          python3 <<'PY'
          from pathlib import Path

          Path("FitFight/Generated/BuildEnv.swift").write_text(
              "/// Written by screenshot CI before build.\n"
              "enum BuildEnv {\n"
              '    static let supabaseURL = "https://pvqntpteehdvhqyctwum.supabase.co"\n'
              '    static let supabasePublishableKey = "sb_publishable_6wP1KNFvJwIE_hX1U2aTfg_u3sk40Li"\n'
              '    static let apiBaseURL = "https://fitfight.app"\n'
              '    static let latestTestFlightURL = ""\n'
              "}\n"
          )
          PY

      - name: Build for the simulator
        run: |
          set -o pipefail
          xcodebuild \
            -project FitFight.xcodeproj \
            -scheme FitFight \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            MARKETING_VERSION=1.0.0 \
            CURRENT_PROJECT_VERSION=1 \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Render the app in English and French
        run: |
          set -euo pipefail
          RUNTIME=$(xcrun simctl list runtimes --json | python3 -c "import json,sys;rs=[r for r in json.load(sys.stdin)['runtimes'] if r['isAvailable'] and 'iOS' in r['name']];print(sorted(rs,key=lambda r:r['version'])[-1]['identifier'])")
          DEVICE_TYPE=$(xcrun simctl list devicetypes --json | python3 -c "import json,sys;ds=[d for d in json.load(sys.stdin)['devicetypes'] if d['name'] in ('iPhone 16','iPhone 15','iPhone 17')];print(ds[0]['identifier'])")
          echo "runtime=$RUNTIME devicetype=$DEVICE_TYPE"
          UDID=$(xcrun simctl create ff-shots "$DEVICE_TYPE" "$RUNTIME")
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" build/Build/Products/Debug-iphonesimulator/FitFight.app
          CONTAINER=$(xcrun simctl get_app_container "$UDID" com.fitfight.mvp data)

          SIMCTL_CHILD_FF_SHOOT=1 \
            SIMCTL_CHILD_AppleLanguages='(en)' \
            SIMCTL_CHILD_AppleLocale='en_US' \
            xcrun simctl launch "$UDID" com.fitfight.mvp
          for i in $(seq 1 60); do
            if [ -f "$CONTAINER/Documents/shots/done.txt" ]; then break; fi
            sleep 2
          done
          mkdir -p shots/en
          find "$CONTAINER/Documents/shots" -maxdepth 1 \
            \( -name '*.png' -o -name '*.jpg' \) \
            -exec cp {} shots/en/ \;
          cp shots/en/* shots/
          test -n "$(find shots -maxdepth 1 -type f -print -quit)" || (echo "no screenshots written"; exit 1)

          xcrun simctl terminate "$UDID" com.fitfight.mvp
          rm -rf "$CONTAINER/Documents/shots"
          SIMCTL_CHILD_FF_SHOOT=1 \
            SIMCTL_CHILD_AppleLanguages='(fr)' \
            SIMCTL_CHILD_AppleLocale='fr_FR' \
            xcrun simctl launch "$UDID" com.fitfight.mvp
          for i in $(seq 1 60); do
            if [ -f "$CONTAINER/Documents/shots/done.txt" ]; then break; fi
            sleep 2
          done
          mkdir -p shots/fr
          find "$CONTAINER/Documents/shots" -maxdepth 1 \
            \( -name '*.png' -o -name '*.jpg' \) \
            -exec cp {} shots/fr/ \;
          test -n "$(find shots/fr -maxdepth 1 -type f -print -quit)" || (echo "no French screenshots written"; exit 1)
          ls -la shots

      - name: Compare against the design mocks
        run: |
          set -euo pipefail
          python3 -m venv .venv
          .venv/bin/pip install --quiet pillow numpy
          .venv/bin/python scripts/compare_screens.py shots compare

      - name: Validate App Store screenshots
        run: |
          set -euo pipefail
          .venv/bin/python - <<'PY'
          from pathlib import Path
          from PIL import Image

          for language in ("en", "fr"):
              paths = sorted(Path("shots", language).glob("appstore-*.jpg"))
              if len(paths) != 5:
                  raise SystemExit(f"Expected 5 {language} App Store screenshots, found {len(paths)}")
              for path in paths:
                  with Image.open(path) as image:
                      if image.size != (1320, 2868):
                          raise SystemExit(f"{path}: expected 1320x2868, got {image.size}")
                      if image.mode not in ("RGB", "L"):
                          raise SystemExit(f"{path}: alpha channel is not allowed ({image.mode})")
                  print(f"validated {path}")
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screens
          path: shots
          retention-days: 14

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: design-comparison
          path: compare
          retention-days: 14

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: app-store-screenshots
          path: shots/en/appstore-*.jpg
          retention-days: 30

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: app-store-screenshots-fr
          path: shots/fr/appstore-*.jpg
          retention-days: 30
