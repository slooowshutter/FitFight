# Archive + upload to TestFlight on GitHub-hosted macOS.
# Never use self-hosted runners or a home Mac.
name: TestFlight

# Archive + upload to TestFlight on GitHub-hosted macOS.
# Never use self-hosted runners or a home Mac.
name: TestFlight

on:
  # Any app push — PR branch or main — so Marc can Update without tapping Actions.
  # `push` (not pull_request) so this works before the workflow exists on main.
  push:
    paths:
      - "FitFight/**"
      - "FitFight.xcodeproj/**"
      - "fastlane/**"
      - "Gemfile"
      - "Gemfile.lock"
      - ".github/workflows/ios-testflight.yml"
  schedule:
    # 18:00 UTC — evening in western Europe; change if you want a different time
    - cron: "0 18 * * *"
  workflow_dispatch:

concurrency:
  group: testflight
  cancel-in-progress: false

jobs:
  beta:
    name: Upload
    runs-on: macos-26
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Require App Store Connect secrets
        run: |
          missing=0
          for name in APP_STORE_CONNECT_KEY_ID APP_STORE_CONNECT_ISSUER_ID APP_STORE_CONNECT_API_KEY APPLE_TEAM_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing GitHub secret: $name. Add it under Settings → Secrets and variables → Actions."
              missing=1
            fi
          done
          exit "$missing"

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"

      - name: Install Fastlane
        run: bundle install

      - name: Upload to TestFlight
        run: bundle exec fastlane beta
