# Archive + upload to TestFlight on GitHub-hosted macOS.
# Never use self-hosted runners or a home Mac.
name: TestFlight

on:
  # Any non-main app push so every TestFlight build is staging-only.
  # `push` (not pull_request) so this works before the workflow exists on main.
  push:
    branches-ignore:
      - main
    paths:
      - "FitFight/**"
      - "FitFight.xcodeproj/**"
      - "fastlane/**"
      - "Gemfile"
      - "Gemfile.lock"
      - ".github/workflows/ios-testflight.yml"
  schedule:
    # 18:00 UTC — evening in western Europe; change if you want a different time
    - cron: "0 18 * * *"
  workflow_dispatch:

concurrency:
  group: ios-distribution
  cancel-in-progress: false

jobs:
  beta:
    if: github.event_name == 'schedule' || (github.ref_type == 'branch' && github.ref_name != 'main')
    name: Upload
    runs-on: macos-26
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      # Scheduled workflows run from GitHub's default branch (`main`), but the
      # daily internal TestFlight must build `develop` and use staging.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'schedule' && 'develop' || github.ref_name }}

      - name: Require App Store Connect secrets
        run: |
          missing=0
          for name in APP_STORE_CONNECT_KEY_ID APP_STORE_CONNECT_ISSUER_ID APP_STORE_CONNECT_API_KEY APPLE_TEAM_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing GitHub secret: $name. Add it under Settings → Secrets and variables → Actions."
              missing=1
            fi
          done
          exit "$missing"

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"

      - name: Install Fastlane
        run: bundle install

      # Every TestFlight build talks to staging. Production ships through the App Store flow.
      # Values go into FitFight/Generated/BuildEnv.swift (compiled in). Never print them.
      - name: Write backend environment
        env:
          SUPABASE_STAGING_URL: ${{ vars.SUPABASE_STAGING_URL || secrets.SUPABASE_STAGING_URL }}
          SUPABASE_STAGING_PUBLISHABLE_KEY: ${{ vars.SUPABASE_STAGING_PUBLISHABLE_KEY || secrets.SUPABASE_STAGING_PUBLISHABLE_KEY }}
          FITFIGHT_API_URL: ${{ vars.FITFIGHT_API_URL || secrets.FITFIGHT_API_URL }}
        run: |
          set -euo pipefail
          mkdir -p FitFight/Generated
          echo "TestFlight target: staging"
          echo "staging url set: ${#SUPABASE_STAGING_URL}"
          echo "staging key set: ${#SUPABASE_STAGING_PUBLISHABLE_KEY}"
          echo "staging api url set: ${#FITFIGHT_API_URL}"
          if [ -z "${SUPABASE_STAGING_URL}" ] || [ -z "${SUPABASE_STAGING_PUBLISHABLE_KEY}" ]; then
            echo "GitHub staging variables empty; using the compiled develop project fallback."
          fi
          python3 <<'PY'
          import os
          import re
          from pathlib import Path

          def swift_string(value: str) -> str:
              escaped = (
                  value.replace("\\", "\\\\")
                  .replace("\"", "\\\"")
                  .replace("\n", "\\n")
                  .replace("\r", "\\r")
              )
              return f'"{escaped}"'

          develop_url = "https://zstzbfocunthczzubggz.supabase.co"
          develop_key = "sb_publishable_7lCDQ1YbMJVUyKZ6Ezq1LA_I-0rZGig"

          url = os.environ.get("SUPABASE_STAGING_URL", "").strip() or develop_url
          api = os.environ.get("FITFIGHT_API_URL", "").strip()
          import sys
          import urllib.error
          import urllib.request

          def staging_key_works(candidate: str) -> bool:
              req = urllib.request.Request(
                  url.rstrip("/") + "/auth/v1/health",
                  headers={"apikey": candidate, "Authorization": "Bearer " + candidate},
              )
              try:
                  with urllib.request.urlopen(req, timeout=20) as response:
                      print("staging auth health:", response.status)
                      return True
              except urllib.error.HTTPError as error:
                  body = error.read().decode()[:400]
                  if "Invalid API key" in body or "another Supabase project" in body:
                      print("staging key rejected by host")
                      return False
                  sys.exit(f"Staging auth health HTTP {error.code}")
              except Exception as error:
                  sys.exit(f"Staging host unreachable: {error}")

          seen = []
          key = ""
          for candidate in (
              os.environ.get("SUPABASE_STAGING_PUBLISHABLE_KEY", "").strip(),
              develop_key,
          ):
              if not candidate or candidate in seen:
                  continue
              seen.append(candidate)
              if staging_key_works(candidate):
                  key = candidate
                  break
          if not key:
              sys.exit(
                  "No staging publishable key matched "
                  "https://zstzbfocunthczzubggz.supabase.co"
              )

          repo = os.environ.get("GITHUB_REPOSITORY", "").strip()
          latest_url = ""
          if re.fullmatch(r"[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+", repo):
              latest_url = (
                  f"https://raw.githubusercontent.com/{repo}/testflight-latest/latest.json"
              )
          print("latest TestFlight pointer:", latest_url or "off")

          path = Path("FitFight/Generated/BuildEnv.swift")
          path.write_text(
              "/// Written by TestFlight CI before archive. Empty strings use fallbacks.\n"
              "enum BuildEnv {\n"
              f"    static let supabaseURL = {swift_string(url)}\n"
              f"    static let supabasePublishableKey = {swift_string(key)}\n"
              f"    static let apiBaseURL = {swift_string(api)}\n"
              f"    static let latestTestFlightURL = {swift_string(latest_url)}\n"
              "}\n"
          )
          print("Wrote FitFight/Generated/BuildEnv.swift")
          PY

      - name: Upload to TestFlight
        run: bundle exec fastlane beta

      - name: Publish latest TestFlight build
        if: success()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          json="/tmp/fitfight-testflight-latest.json"
          if [ ! -f "$json" ]; then
            echo "No TestFlight pointer written; skip."
            exit 0
          fi
          python3 - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(Path("/tmp/fitfight-testflight-latest.json").read_text())
          build = payload.get("build")
          if not isinstance(build, int) or build < 1:
              raise SystemExit(f"Invalid TestFlight pointer: {payload!r}")
          print(f"Publishing TestFlight pointer version={payload.get('version')} build={build}")
          PY
          work=$(mktemp -d)
          cp "$json" "$work/latest.json"
          git -C "$work" init
          git -C "$work" checkout -b testflight-latest
          git -C "$work" add latest.json
          git -C "$work" \
            -c user.name="github-actions[bot]" \
            -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "Latest TestFlight build pointer"
          git -C "$work" remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git -C "$work" push --force origin testflight-latest
