name: Web API

on:
    pull_request:
        paths:
            - "web/**"
            - "contracts/**"
            - ".github/workflows/web.yml"
    push:
        branches: [main, develop, preview, profiles-friends-and-stats, rename-profile-id-api-v2]
        paths:
            - "web/**"
            - "contracts/**"
            - ".github/workflows/web.yml"

concurrency:
    group: web-${{ github.ref }}
    cancel-in-progress: true

jobs:
    typecheck:
        name: Typecheck and tests
        runs-on: ubuntu-latest
        timeout-minutes: 10
        defaults:
            run:
                working-directory: web
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: "22"
                  cache: npm
                  cache-dependency-path: web/package-lock.json
            - run: npm ci
            - run: npm run typecheck
            - run: npm test
            - name: Parse API contracts
              run: ruby -ryaml -e 'YAML.load_file("../contracts/openapi.yaml"); puts "API contract YAML parsed"'
            - name: Render Profile privacy disclosures
              if: github.ref == 'refs/heads/profiles-friends-and-stats'
              run: node ../scripts/check-profile-privacy-pages.mjs
            - uses: actions/upload-artifact@v4
              if: github.ref == 'refs/heads/profiles-friends-and-stats' && always()
              with:
                  name: profile-privacy-pages
                  path: |
                      ${{ runner.temp }}/profile-privacy-pages/*.png
                      ${{ runner.temp }}/profile-privacy-pages/next.log
