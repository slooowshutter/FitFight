                        "schema": {
                            "$ref": "#/components/schemas/AdministerFightRequest"
                        }
                    }
                }
            },
            "responses": {
                "200": {
                    "description": "Authorized current state. Cache-Control no-store.",
                    "content": {
                        "application/json": {
                            "schema": {
                                "$ref": "#/components/schemas/FightSummary"
                            }
                        }
                    }
                },
                "400": {
                    "description": "Invalid input"
                },
                "401": {
                    "description": "Missing or invalid session"
                },
                "403": {
                    "description": "Access not permitted"
                },
                "404": {
                    "description": "Unavailable or blocked profile or Fight"
                },
                "409": {
                    "description": "Transition no longer available"
                },
                "426": {
                    "description": "App update required where enforced"
                },
                "429": {
                    "description": "Rate limit"
                }
            }
        }
    }
    /fights/snapshot:
        post:
            operationId: readFightSnapshot
            summary: Read confirmed Fight standings and chart data without maintenance.
            description: >
                Private Realtime fights_changed events prompt this read. Uses the same
                snapshot contract and access rules as /fights/refresh. Response is never cached.
            security: [{ bearerAuth: [] }]
            parameters:
                - { $ref: "#/components/parameters/AppVersion" }
                - { $ref: "#/components/parameters/AppBuild" }
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            additionalProperties: false
                            required: [time_zone]
                            properties:
                                time_zone:
                                    {
                                        type: string,
                                        minLength: 1,
                                        maxLength: 100,
                                        example: Europe/Paris,
                                    }
            responses:
                "200":
                    description: One confirmed snapshot under the authenticated User's current access.
                    content:
                        application/json:
                            schema:
                                { $ref: "#/components/schemas/FightSnapshot" }
                "401": { description: Invalid session or deleted account }
                "400": { description: Invalid time zone or request body }
                "426": { description: App update required }
    /posts/{postID}/comments/{commentID}/like:
        put:
            operationId: setFightPostCommentLike
            summary: Set the authenticated user's heart on a visible comment or reply.
            description: |
                Idempotent desired state. Comment list and creation responses also include
                additive like_count and liked_by_me fields. Installed clients can omit or
                ignore these fields; their comment bodies, sorting and cursors stay valid.
            security: [{ bearerAuth: [] }]
            parameters:
                - { $ref: "#/components/parameters/AppVersion" }
                - { $ref: "#/components/parameters/AppBuild" }
                - name: postID
                  in: path
                  required: true
                  schema: { type: string, format: uuid }
                - name: commentID
                  in: path
                  required: true
                  schema: { type: string, format: uuid }
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            additionalProperties: false
                            required: [liked]
                            properties:
                                liked: { type: boolean }
            responses:
                "200":
                    description: Confirmed count and the authenticated user's saved heart.
                    content:
                        application/json:
                            schema:
                                type: object
                                additionalProperties: false
                                required: [like_count, liked_by_me]
                                properties:
                                    like_count: { type: integer, minimum: 0 }
                                    liked_by_me: { type: boolean }
                "400": { description: Invalid path or desired state }
                "401": { description: Invalid session or deleted account }
                "403": { description: The viewer cannot access the post }
                "404": { description: Post or comment unavailable }
                "426": { description: App update required }
    /posts/{postID}/reactions:
        get:
            operationId: listFightPostReactionPeople
            summary: List the people who reacted to a visible post, excluding hidden or deleted people.
            security: [{ bearerAuth: [] }]
            parameters:
                - { $ref: "#/components/parameters/AppVersion" }
                - { $ref: "#/components/parameters/AppBuild" }
                - name: postID
                  in: path
                  required: true
                  schema: { type: string, format: uuid }
                - name: cursor
                  in: query
                  description: Last user_id from the previous page. Results are ordered by user_id.
                  schema: { type: string, format: uuid }
                - name: limit
                  in: query
                  schema:
                      { type: integer, minimum: 1, maximum: 80, default: 40 }
            responses:
                "200":
                    description: Reaction identities. The existing POST reaction summary is unchanged.
                    content:
                        application/json:
                            schema:
                                type: object
                                additionalProperties: false
                                required: [people, next_cursor]
                                properties:
                                    people:
                                        type: array
                                        items:
                                            type: object
                                            additionalProperties: false
                                            required:
                                                [
                                                    user_id,
                                                    handle,
                                                    display_name,
                                                    emoji,
                                                ]
                                            properties:
                                                user_id:
                                                    {
                                                        type: string,
                                                        format: uuid,
                                                    }
                                                handle: { type: string }
                                                display_name: { type: string }
                                                emoji: { type: string }
                                    next_cursor:
                                        { type: [string, "null"], format: uuid }
                "400":
                    description: Invalid post ID, cursor, or limit.
                "401":
                    description: Authentication required.
                "403":
                    description: The viewer cannot access the post.
                "404":
                    description: Post not found.
    /referrals:
        post:
            operationId: claimReferral
            summary: Record the first referrer for the authenticated User.
            security: [{ bearerAuth: [] }]
            parameters:
                - { $ref: "#/components/parameters/AppVersion" }
                - { $ref: "#/components/parameters/AppBuild" }
            requestBody:
                required: true
                content:
                    application/json:
                        schema: { $ref: "#/components/schemas/ReferralLink" }
            responses:
                "200":
                    description: recorded is false for self-referrals, unavailable codes/accounts, or existing attribution.
                    content:
                        application/json:
                            schema:
                                type: object
                                additionalProperties: false
                                required: [recorded]
                                properties:
                                    recorded: { type: boolean }
    /app-release:
        servers: [{ url: /api }]
        get:
            operationId: getAppReleasePolicy
            summary: Read the latest installable release and the Apple review candidate for this channel.
            security: []
            responses:
                "200":
                    description: Public release policy for this backend environment. Cache-Control is no-store.
                    content:
                        application/json:
                            schema:
                                {
                                    $ref: "#/components/schemas/AppReleasePolicy",
                                }
                "503":
                    description: Release metadata or environment configuration is unavailable.
    /provider-connections/apple-health:
        post:
            operationId: connectAppleHealth
            summary: Create or refresh the Apple Health data_sources row.
            security: [{ bearerAuth: [] }]
            parameters:
                - { $ref: "#/components/parameters/AppVersion" }
                - { $ref: "#/components/parameters/AppBuild" }
            responses:
                "200":
                    description: Existing or created source
                    content:
                        application/json:
                            schema: { $ref: "#/components/schemas/DataSource" }
    /provider-uploads:
        post:
            operationId: createProviderUpload
            summary: Authorize one exact private Storage object for an authenticated provider archive.
            security: [{ bearerAuth: [] }]
            parameters:
                - { $ref: "#/components/parameters/AppVersion" }
                - { $ref: "#/components/parameters/AppBuild" }
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            {
                                $ref: "#/components/schemas/CreateProviderUpload",
                            }
            responses:
                "201":
                    description: New upload authorization
                    content:
                        application/json:
                            schema:
                                {
                                    $ref: "#/components/schemas/ProviderUploadAuthorization",
                                }
                "200":
                    description: Replay of the same upload authorization
                    content:
                        application/json:
                            schema:
                                {
                                    $ref: "#/components/schemas/ProviderUploadAuthorization",
                                }
    /provider-uploads/context:
        get:
            operationId: getProviderUploadContext
            summary: Return server-authoritative Fight windows for Apple Health synchronization.
            security: [{ bearerAuth: [] }]
            parameters:
                - { $ref: "#/components/parameters/AppVersion" }
                - { $ref: "#/components/parameters/AppBuild" }
            responses:
                "200":
                    description: Current server time and relevant Fight windows
                    content:
                        application/json:
                            schema:
                                {
                                    $ref: "#/components/schemas/ProviderUploadContext",
                                }
    /healthkit/steps:
        post:
            operationId: syncHealthKitSteps
            summary: Store Apple-merged Steps totals for exact Fight windows and relevant chart days.
            security: [{ bearerAuth: [] }]
            parameters:
                - { $ref: "#/components/parameters/AppVersion" }
                - { $ref: "#/components/parameters/AppBuild" }
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            { $ref: "#/components/schemas/HealthKitStepSync" }
            responses:
                "200":
                    description: Aggregates stored and standings updated
                    content:
                        application/json:
                            schema:
                                {
                                    $ref: "#/components/schemas/HealthKitStepSyncResult",
                                }
    /healthkit/diagnostics:
        post:
            operationId: saveHealthKitDiagnosticSnapshot
            summary: Overwrite the authenticated User's latest private HealthKit diagnostic snapshot.
            security: [{ bearerAuth: [] }]
            parameters:
                - { $ref: "#/components/parameters/AppVersion" }
                - { $ref: "#/components/parameters/AppBuild" }
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            {
                                $ref: "#/components/schemas/HealthKitDiagnosticSnapshot",
                            }
            responses:
                "200":
                    description: Latest snapshot stored
                    content:
                        application/json:
                            schema:
                                {
                                    $ref: "#/components/schemas/HealthKitDiagnosticSnapshotResult",
                                }
    /provider-uploads/{uploadID}:
        get:
            operationId: getProviderUpload
            summary: Read current processing state or replay a completed receipt.
            security: [{ bearerAuth: [] }]
            parameters:
                - { $ref: "#/components/parameters/AppVersion" }
                - { $ref: "#/components/parameters/AppBuild" }
                - $ref: "#/components/parameters/UploadID"
            responses:
                "200":
                    description: Current state
                    content:
                        application/json:
                            schema:
                                {
                                    $ref: "#/components/schemas/ProviderUploadStatus",
                                }
    /provider-uploads/{uploadID}/process:
        post:
            operationId: processProviderUpload
            summary: Verify, process, and delete the authorized Storage object.
            security: [{ bearerAuth: [] }]
            parameters:
                - { $ref: "#/components/parameters/AppVersion" }
                - { $ref: "#/components/parameters/AppBuild" }
                - $ref: "#/components/parameters/UploadID"
            responses:
                "200":
                    description: Processing completed, or completed receipt replayed
                    content:
                        application/json:
                            schema:
                                {
                                    $ref: "#/components/schemas/ProviderUploadStatus",
                                }
                "202":
                    description: Database committed; Storage cleanup remains pending
                    content:
                        application/json:
                            schema:
                                {
                                    $ref: "#/components/schemas/ProviderUploadStatus",
                                }
                "409":
                    description: This upload is already being processed
                    content:
                        application/json:
                            schema: { $ref: "#/components/schemas/ApiError" }
    /auth/apple:
        post:
            operationId: storeAppleAuthorization
            summary: Exchange and securely store the native Apple authorization needed for account deletion.
            security: [{ bearerAuth: [] }]
            parameters:
                - { $ref: "#/components/parameters/AppVersion" }
                - { $ref: "#/components/parameters/AppBuild" }
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            additionalProperties: false
                            required: [authorization_code]
                            properties:
                                authorization_code:
                                    {
                                        type: string,
                                        minLength: 1,
                                        maxLength: 2048,
                                    }
            responses:
                "200":
                    description: Apple authorization stored
                    content:
                        application/json:
                            schema:
                                type: object
                                required: [stored]
                                properties:
                                    stored: { const: true }
    /me/specials:
        get:
            operationId: readSpecialStore
            summary: Read the authenticated account's purchase token and exclusive inventory.
            description: Unpaid holds older than 30 minutes are released before the inventory is read. On production, accounts configured for App Review use the separate Sandbox shelf.
            security: [{ bearerAuth: [] }]
            responses:
                "200":
                    description: Current purchase state, never cached. No other owner identifiers are returned.
                    content:
                        application/json:
                            schema: { $ref: "#/components/schemas/SpecialStore" }
                "401": { description: Invalid or deleted account. }
                "503": { description: Purchase configuration unavailable. }
    /me/specials/checkout:
        post:
            operationId: specialCheckout
            summary: Reserve an edition before Apple checkout or cancel the matching attempt.
            description: An unpaid hold lapses 30 minutes after it is made. A later verified charge is owned if the Special is still free and the account has no other Special, otherwise a refundable conflict. Only a matching unfulfilled reservation can be cancelled. One held or permanently owned Special per account.
            security: [{ bearerAuth: [] }]
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            additionalProperties: false
                            required: [action, companion_id, attempt_id]
                            properties:
                                action: { type: string, enum: [reserve, cancel] }
                                companion_id: { type: string, pattern: '^limited-' }
                                attempt_id: { type: string, format: uuid }
            responses:
                "200":
                    description: Applied or idempotently replayed.
                    content:
                        application/json:
                            schema:
                                type: object
                                required: [saved]
                                properties:
                                    saved: { const: true }
                "400": { description: Invalid command. }
                "401": { description: Invalid or deleted account. }
                "409": { description: companion_taken or special_limit. }
                "503": { description: Sales disabled or configuration unavailable. }
    /me/specials/transactions:
        post:
            operationId: claimSpecialPurchase
            summary: Verify Apple evidence and durably record ownership, refund or conflict.
            description: The server verifies both submitted and current Apple records. The account token, product and environment must match server state. A conflict is a recorded charge requiring an Apple refund request, never a grant.
            security: [{ bearerAuth: [] }]
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            additionalProperties: false
                            required: [companion_id, signed_transaction]
                            properties:
                                companion_id: { type: string, pattern: '^limited-' }
                                signed_transaction: { type: string, minLength: 1, maxLength: 30000 }
            responses:
                "200":
                    description: Durable outcome, safe to replay.
                    content:
                        application/json:
                            schema: { $ref: "#/components/schemas/SpecialClaimResult" }
                "400": { description: Invalid or unsupported signed purchase. }
                "401": { description: Invalid or deleted account. }
                "403": { description: Account, product or environment mismatch. }
                "409": { description: Immutable purchase binding conflicts. }
                "502": { description: Current Apple evidence could not be verified. }
                "503": { description: Verification or configuration temporarily unavailable. }
    /api/apple/specials/notifications/{environment}:
        servers: [{ url: / }]
        post:
            operationId: receiveSpecialNotification
            summary: Apply a verified App Store Server Notification V2.
            description: Apple signature authentication. The envelope and any transaction are verified for the configured environment before acknowledgement. A notification without a transaction changes nothing.
            parameters:
                - name: environment
                  in: path
                  required: true
                  schema: { type: string, enum: [sandbox, production] }
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            required: [signedPayload]
                            properties:
                                signedPayload: { type: string, minLength: 1, maxLength: 100000 }
            responses:
                "200":
                    description: Handled or replayed.
                    content:
                        application/json:
                            schema:
                                type: object
                                required: [received]
                                properties:
                                    received: { const: true }
                "400": { description: Invalid signature, payload or deployment environment. }
                "404": { description: Unknown environment. }
                "503": { description: Verification temporarily unavailable. }
    /me:
        get:
            operationId: readProfile
            summary: Read the authenticated User's profile.
            security: [{ bearerAuth: [] }]
            parameters:
                - { $ref: "#/components/parameters/AppVersion" }
                - { $ref: "#/components/parameters/AppBuild" }
            responses:
                "200":
                    description: Current profile
                    content:
                        application/json:
                            schema: { $ref: "#/components/schemas/Profile" }
                "401":
                    description: unauthorized for an invalid session; profile_missing for a missing or deleted account.
        patch:
            operationId: updateProfile
            summary: Update the authenticated User's handle, display name, or both.
            description: Omitted fields remain unchanged. The server derives ownership and sets handle_set_at when a handle is supplied. Equipping an unowned Special returns 403 special_purchase_required; paid ownership is never changed by this endpoint.
            security: [{ bearerAuth: [] }]
            parameters:
                - { $ref: "#/components/parameters/AppVersion" }
                - { $ref: "#/components/parameters/AppBuild" }
            requestBody:
                required: true
                content:
                    application/json:
                        schema: { $ref: "#/components/schemas/UpdateProfile" }
            responses:
                "200":
                    description: Updated profile
                    content:
                        application/json:
                            schema: { $ref: "#/components/schemas/Profile" }
                "400":
                    description: validation for an empty patch, invalid field, or caller-supplied ownership/timestamp.
                "401":
                    description: unauthorized for an invalid session; profile_missing for a missing or deleted account.
                "403": { description: special_purchase_required when equipping a Special this account does not own. }
                "409":
                    description: handle_taken when the username already belongs to an account.
        delete:
            operationId: deleteAccount
            summary: Permanently delete the account, its data, memberships, and Fights it owns.
            security: [{ bearerAuth: [] }]
            parameters:
                - { $ref: "#/components/parameters/AppVersion" }
                - { $ref: "#/components/parameters/AppBuild" }
            responses:
                "200":
                    description: Account deleted
                    content:
                        application/json:
                            schema:
                                type: object
                                required: [apple_authorization_revoked, deleted]
                                properties:
                                    apple_authorization_revoked:
                                        { type: boolean }
                                    deleted: { const: true }
    /fights:
        post:
            operationId: createFight
            security: [{ bearerAuth: [] }]
            parameters:
                - { $ref: "#/components/parameters/AppVersion" }
                - { $ref: "#/components/parameters/AppBuild" }
                - in: header
                  name: Idempotency-Key
                  required: true
                  schema: { type: string }
            requestBody:
                required: true
                content:
                    application/json:
                        schema: { $ref: "#/components/schemas/CreateFight" }
            responses:
                "201":
                    description: Created fight
                    content:
                        application/json:
                            schema:
                                { $ref: "#/components/schemas/FightSummary" }
    /fights/sync-due:
        post:
            operationId: syncDueFights
            summary: Close this user's fights whose clock has run out. Safe to call on every app open.
            security: [{ bearerAuth: [] }]
            parameters:
                - { $ref: "#/components/parameters/AppVersion" }
                - { $ref: "#/components/parameters/AppBuild" }
            responses:
                "200":
                    description: How many due fights were recalculated
                    content:
                        application/json:
                            schema: { $ref: "#/components/schemas/SyncDue" }
    /fights/{fightID}/invites:
        post:
            operationId: inviteByHandle
            security: [{ bearerAuth: [] }]
            parameters:
                - { $ref: "#/components/parameters/AppVersion" }
                - { $ref: "#/components/parameters/AppBuild" }
                - in: path
                  name: fightID
                  required: true
                  schema: { type: string, format: uuid }
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            required: [handle]
                            properties:
                                handle: { type: string }
            responses:
                "200":
                    description: Invite created
                    content:
                        application/json:
                            schema:
                                { $ref: "#/components/schemas/InviteCreated" }
    /invites/{token}/accept:
        post:
            operationId: acceptInvite
            security: [{ bearerAuth: [] }]
            parameters:
                - { $ref: "#/components/parameters/AppVersion" }
                - { $ref: "#/components/parameters/AppBuild" }
                - in: path
                  name: token
                  required: true
                  schema: { type: string }
            requestBody:
                content:
                    application/json:
                        schema:
                            type: object
                            properties:
                                personalTarget: { type: number }
            responses:
                "200":
                    description: Accepted
                    content:
                        application/json:
                            schema:
                                { $ref: "#/components/schemas/FightSummary" }
    /fights/{fightID}/accept:
        post:
            operationId: acceptFight
            summary: Accept an in-app invite (caller is already an invited member).
            security: [{ bearerAuth: [] }]
            parameters:
                - { $ref: "#/components/parameters/AppVersion" }
                - { $ref: "#/components/parameters/AppBuild" }
                - in: path
                  name: fightID
                  required: true
                  schema: { type: string, format: uuid }
            responses:
                "200":
                    description: Accepted
                    content:
                        application/json:
                            schema:
                                { $ref: "#/components/schemas/FightSummary" }
    /fights/{fightID}/decline:
        post:
            operationId: declineFight
            summary: Decline an in-app invitation belonging to the caller.
            security: [{ bearerAuth: [] }]
            parameters:
                - { $ref: "#/components/parameters/AppVersion" }
                - { $ref: "#/components/parameters/AppBuild" }
                - in: path
                  name: fightID
                  required: true
                  schema: { type: string, format: uuid }
            responses:
                "200":
                    description: Declined, including an already declined invitation
                    content:
                        application/json:
                            schema:
                                { $ref: "#/components/schemas/FightSummary" }
                "403":
                    description: Caller has no membership in this fight
                "409":
                    description: Membership or fight no longer permits declining
    /fights/{fightID}/start:
        post:
            operationId: startFight
            security: [{ bearerAuth: [] }]
            parameters:
                - { $ref: "#/components/parameters/AppVersion" }
                - { $ref: "#/components/parameters/AppBuild" }
                - in: path
                  name: fightID
                  required: true
                  schema: { type: string, format: uuid }
            requestBody:
                content:
                    application/json:
                        schema:
                            type: object
                            properties:
                                when:
                                    type: string
                                    enum: [now, scheduled]
            responses:
                "200":
                    description: Fight is live or scheduled
                    content:
                        application/json:
                            schema:
                                { $ref: "#/components/schemas/FightSummary" }
    /fights/{fightID}/cancel:
        post:
            operationId: cancelFight
            security: [{ bearerAuth: [] }]
            parameters:
                - { $ref: "#/components/parameters/AppVersion" }
                - { $ref: "#/components/parameters/AppBuild" }
                - in: path
                  name: fightID
                  required: true
                  schema: { type: string, format: uuid }
            responses:
                "200":
                    description: Cancelled
components:
    parameters:
        AppVersion:
            in: header
            name: X-FitFight-Version
            required: true
            schema: { type: string, pattern: '^\d+\.\d+\.\d+$' }
        AppBuild:
            in: header
            name: X-FitFight-Build
            required: true
            schema: { type: string, pattern: '^[1-9]\d*$' }
        UploadID:
            in: path
            name: uploadID
            required: true
            schema: { $ref: "#/components/schemas/UUIDv4" }
    securitySchemes:
        bearerAuth:
            type: http
            scheme: bearer
            bearerFormat: JWT
    schemas:
        SharedProfileIdentity: {
            "type": "object",
            "required": [
                "user_id",
                "handle",
                "display_name",
                "companion_id",
                "avatar_url"
            ],
            "properties": {
                "user_id": {
                    "type": "string",
                    "format": "uuid"
                },
                "handle": {
                    "type": "string"
                },
                "display_name": {
                    "type": "string"
                },
                "companion_id": {
                    "anyOf": [
                        {
                            "type": "string"
                        },
                        {
                            "type": "null"
                        }
                    ]
                },
                "avatar_url": {
                    "anyOf": [
                        {
                            "type": "string",
                            "format": "uri"
                        },
                        {
                            "type": "null"
                        }
                    ]
                }
            }
        }
        SharedProfileSettings: {
            "type": "object",
            "required": [
                "competitive",
                "audience",
                "activity_audience",
                "activity_days",
                "artwork_allowed",
                "revision"
            ],
            "properties": {
                "competitive": {
                    "type": "boolean"
                },
                "audience": {
                    "type": "string",
                    "enum": [
                        "private",
                        "public"
                    ]
                },
                "activity_audience": {
                    "type": "string",
                    "enum": [
                        "off",
                        "friends",
                        "opponents",
                        "public"
                    ]
