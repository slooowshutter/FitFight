openapi: 3.1.0
info:
  title: FitFight iOS API
  version: 0.9.0
  description: >
    Next.js Route Handlers under /api/v1. Swift sends the User JWT.
    Clients never write fights, scores, sources, or private.metric_observations.
    Apple Health Steps use merged exact-window aggregates. The older signed
    Storage-object routes remain temporarily available to legacy clients.
servers:
  - url: /api/v1
paths:
  /provider-connections/apple-health:
    post:
      operationId: connectAppleHealth
      summary: Create or refresh the Apple Health data_sources row.
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Existing or created source
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DataSource" }
  /provider-uploads:
    post:
      operationId: createProviderUpload
      summary: Authorize one exact private Storage object for an authenticated provider archive.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateProviderUpload" }
      responses:
        "201":
          description: New upload authorization
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProviderUploadAuthorization" }
        "200":
          description: Replay of the same upload authorization
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProviderUploadAuthorization" }
  /provider-uploads/context:
    get:
      operationId: getProviderUploadContext
      summary: Return server-authoritative Fight windows for Apple Health synchronization.
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Current server time and relevant Fight windows
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProviderUploadContext" }
  /healthkit/steps:
    post:
      operationId: syncHealthKitSteps
      summary: Store Apple-merged Steps totals for exact Fight windows and relevant chart days.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/HealthKitStepSync" }
      responses:
        "200":
          description: Aggregates stored and standings updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthKitStepSyncResult" }
  /provider-uploads/{uploadID}:
    get:
      operationId: getProviderUpload
      summary: Read current processing state or replay a completed receipt.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/UploadID"
      responses:
        "200":
          description: Current state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProviderUploadStatus" }
  /provider-uploads/{uploadID}/process:
    post:
      operationId: processProviderUpload
      summary: Verify, process, and delete the authorized Storage object.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/UploadID"
      responses:
        "200":
          description: Processing completed, or completed receipt replayed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProviderUploadStatus" }
        "202":
          description: Database committed; Storage cleanup remains pending
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProviderUploadStatus" }
        "409":
          description: This upload is already being processed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
  /me:
    delete:
      operationId: deleteAccount
      summary: Delete private data and login credentials, preserving anonymized Fight history where required.
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Account deleted
          content:
            application/json:
              schema:
                type: object
                required: [deleted]
                properties:
                  deleted: { const: true }
  /fights:
    post:
      operationId: createFight
      security: [{ bearerAuth: [] }]
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateFight" }
      responses:
        "201":
          description: Created fight
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FightSummary" }
  /fights/sync-due:
    post:
      operationId: syncDueFights
      summary: Close this user's fights whose clock has run out. Safe to call on every app open.
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: How many due fights were recalculated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SyncDue" }
  /fights/{fightID}/invites:
    post:
      operationId: inviteByHandle
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: fightID
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [handle]
              properties:
                handle: { type: string }
      responses:
        "200":
          description: Invite created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InviteCreated" }
  /invites/{token}/accept:
    post:
      operationId: acceptInvite
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: token
          required: true
          schema: { type: string }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                personalTarget: { type: number }
      responses:
        "200":
          description: Accepted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FightSummary" }
  /fights/{fightID}/accept:
    post:
      operationId: acceptFight
      summary: Accept an in-app invite (caller is already an invited member).
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: fightID
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Accepted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FightSummary" }
  /fights/{fightID}/start:
    post:
      operationId: startFight
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: fightID
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                when:
                  type: string
                  enum: [now, scheduled]
      responses:
        "200":
          description: Fight is live or scheduled
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FightSummary" }
  /fights/{fightID}/cancel:
    post:
      operationId: cancelFight
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: fightID
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Cancelled
components:
  parameters:
    UploadID:
      in: path
      name: uploadID
      required: true
      schema: { $ref: "#/components/schemas/UUIDv4" }
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    ApiError:
      type: object
      additionalProperties: false
      required: [error, code]
      properties:
        error: { type: string }
        code: { type: string }
    UUIDv4:
      type: string
      format: uuid
      pattern: "^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-4[0-9a-fA-F]{3}-[89aAbB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$"
    DataSource:
      type: object
      required: [id, provider, sourceLabel]
      properties:
        id: { type: string, format: uuid }
        provider: { type: string, enum: [apple_health] }
        sourceLabel: { type: string }
        contributingSourceLabels:
          type: array
          items: { type: string }
    CreateProviderUpload:
      type: object
      additionalProperties: false
      required: [upload_id, provider, connection_route, metric, format_version, byte_size, sha256]
      properties:
        upload_id: { $ref: "#/components/schemas/UUIDv4" }
        provider: { const: apple_health }
        connection_route: { const: healthkit }
        metric: { const: steps }
        format_version: { const: 1 }
        byte_size: { type: integer, minimum: 1, maximum: 536870912 }
        sha256: { type: string, pattern: "^[0-9a-f]{64}$" }
    ProviderUploadAuthorization:
      type: object
      required: [upload_id, status, object_path, tus_url, tus_headers, tus_metadata]
      properties:
        upload_id: { $ref: "#/components/schemas/UUIDv4" }
        status: { $ref: "#/components/schemas/ProviderUploadState" }
        object_path: { type: string }
        tus_url: { type: string, format: uri }
        tus_headers:
          type: object
          required: [x-signature, x-upsert]
          properties:
            x-signature: { type: string }
            x-upsert: { const: "false" }
        tus_metadata:
          type: object
          required: [bucketName, objectName, contentType, cacheControl]
          properties:
            bucketName: { const: provider-inbox }
            objectName: { type: string }
            contentType: { const: application/x-ndjson }
            cacheControl: { const: "3600" }
    ProviderUploadState:
      type: string
      enum: [issued, processing, committed, completed, rejected, retryable_failure]
    ProviderUploadReceipt:
      type: object
      required: [upload_id, samples, deletions, merged_days, source_days, fight_aggregates, completed_at]
      properties:
        upload_id: { $ref: "#/components/schemas/UUIDv4" }
        samples: { type: integer, minimum: 0 }
        deletions: { type: integer, minimum: 0 }
        merged_days: { type: integer, minimum: 0 }
        source_days: { type: integer, minimum: 0 }
        fight_aggregates: { type: integer, minimum: 0 }
        completed_at: { type: string, format: date-time }
    ProviderUploadStatus:
      type: object
      required: [upload_id, status]
      properties:
        upload_id: { $ref: "#/components/schemas/UUIDv4" }
        status: { $ref: "#/components/schemas/ProviderUploadState" }
        receipt: { $ref: "#/components/schemas/ProviderUploadReceipt" }
        error_code: { type: string }
    ProviderUploadContext:
      type: object
      required: [server_now, fight_windows]
      properties:
        server_now: { type: string, format: date-time }
        fight_windows:
          type: array
          items: { $ref: "#/components/schemas/FightUploadWindow" }
    FightUploadWindow:
      type: object
      additionalProperties: false
      required: [fight_id, state, starts_at, ends_at, cutoff_at]
      properties:
        fight_id: { $ref: "#/components/schemas/UUIDv4" }
        state: { type: string, enum: [live, awaiting_final_sync] }
        starts_at: { type: string, format: date-time }
        ends_at: { type: string, format: date-time }
        cutoff_at:
          type: string
          format: date-time
          description: The earlier of server_now and ends_at.
    HealthKitStepSync:
      type: object
      additionalProperties: false
      required: [complete_through, time_zone, merged_days, fight_aggregates]
      properties:
        complete_through: { type: string, format: date-time }
        time_zone: { type: string, minLength: 1, maxLength: 100 }
        merged_days:
          type: array
          maxItems: 400
          items: { $ref: "#/components/schemas/HealthKitMergedDay" }
        fight_aggregates:
          type: array
          maxItems: 100
          items: { $ref: "#/components/schemas/HealthKitFightAggregate" }
    HealthKitMergedDay:
      type: object
      additionalProperties: false
      required: [day, starts_at, ends_at, steps]
      properties:
        day: { type: string, format: date }
        starts_at: { type: string, format: date-time }
        ends_at: { type: string, format: date-time }
        steps: { type: integer, minimum: 0, maximum: 2147483647 }
    HealthKitFightAggregate:
      type: object
      additionalProperties: false
      required: [fight_id, starts_at, ends_at, cutoff_at, steps]
      properties:
        fight_id: { $ref: "#/components/schemas/UUIDv4" }
        starts_at: { type: string, format: date-time }
        ends_at: { type: string, format: date-time }
        cutoff_at: { type: string, format: date-time }
        steps: { type: integer, minimum: 0, maximum: 2147483647 }
    HealthKitStepSyncResult:
      type: object
      additionalProperties: false
      required: [complete_through, synced_days, synced_fights]
      properties:
        complete_through: { type: string, format: date-time }
        synced_days: { type: integer, minimum: 0 }
        synced_fights: { type: integer, minimum: 0 }
    CreateFight:
      type: object
      required: [name, startsAt, endsAt, timeZone, outcomeRule, stakeKind]
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time }
        timeZone: { type: string }
        outcomeRule:
          type: string
          enum: [highest_total, proportional, hit_your_goal]
        goalPolicy:
          type: string
          enum: [shared, personal]
          default: shared
        defaultGoalValue: { type: number }
        stakeKind:
          type: string
          enum: [bragging, money, action]
        stakeMinor: { type: integer, minimum: 0 }
        currency: { type: string, default: USD }
        actionText: { type: string }
        inviteHandles:
          type: array
          items: { type: string }
        start:
          type: string
          enum: [now, scheduled]
          default: now
    FightSummary:
      type: object
      required: [id, state]
      properties:
        id: { type: string, format: uuid }
        state: { type: string }
    InviteCreated:
      type: object
      required: [token, invitedUserId]
      properties:
        token: { type: string }
        invitedUserId: { type: string, format: uuid }
    SyncDue:
      type: object
      required: [checked, closed]
      properties:
        checked: { type: integer }
        closed: { type: integer }
        fightIds:
          type: array
          items: { type: string, format: uuid }
