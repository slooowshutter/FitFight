openapi: 3.1.0
info:
    title: FitFight iOS API
    version: 1.0.0
    description: >
        Next.js Route Handlers under /api/v1. Swift sends the User JWT.
        All application database reads and writes use this API; Supabase Auth and private Realtime invalidations stay direct.
        Database columns are not a client contract. Clients must tolerate additional response fields.
        Apple Health Steps use merged exact-window aggregates. The older signed
        Storage-object routes remain temporarily available to legacy clients.
        TestFlight updates are advisory: staging does not reject version/build mismatches.
        Production requires X-FitFight-Version and X-FitFight-Build when enforcement is on;
        a mismatch returns 426 with code update_required before business logic runs unless
        the build matches latest, review, or internal. The public release endpoint returns
        503 with code release_unavailable for missing metadata; authenticated commands
        continue to authentication when release metadata is unavailable.
servers:
    - url: /api/v1
paths:
