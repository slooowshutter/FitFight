            if (thumbs && thumb) thumbs.scrollTo({ left: thumb.offsetLeft + thumb.offsetWidth / 2 - thumbs.clientWidth / 2, behavior: smooth });
        });
        const spacer = `<span class="cp-stage-spacer" style="width:${(width - pageW) / 2}px"></span>`;
        const pages = animals.map((id) => {
            const a = BY_ID[id];
            const text = label(id);
            return `<div class="cp-page ${id === selection ? "on" : ""}" style="width:${pageW}px;height:${height}px" aria-label="${esc(a.name)}"><img src="${companionArt(id)}" alt=""><b class="cp-meta cp-page-name">${esc(a.name)}</b><span class="cp-meta cp-page-cap">${esc(a.caption)}</span>${text ? `<span class="cp-meta cp-page-label">${esc(text)}</span>` : ""}</div>`;
        }).join("");
        const thumbs = animals.map((id) => `<button type="button" class="cp-thumb ${id === selection ? "on" : ""}" aria-label="${esc(BY_ID[id].name)}" aria-pressed="${id === selection}"${o.disabled ? " disabled" : ""}${on(o.on ? `${o.on}=${id}` : "")}><img src="${companionArt(id)}" alt=""></button>`).join("");
        return `<div class="cp-stage-wrap"><div class="cp-stage ${o.disabled ? "disabled" : ""}" data-stage="${esc(key)}" data-stage-on="${esc(o.on || "")}" data-step="${step}" data-animals="${animals.join(",")}" data-selected="${esc(selection || "")}" style="height:${height}px">${spacer}${pages}${spacer}</div><div class="cp-thumbs" data-thumbs="${esc(key)}">${thumbs}</div></div>`;
    }
    // Swiping settles on a page: that page becomes the selection (scrollPosition(id:)).
    let stageTimer;
    document.addEventListener("scroll", (event) => {
        const el = event.target;
        if (!(el instanceof Element) || !el.matches(".cp-stage")) return;
        clearTimeout(stageTimer);
        stageTimer = setTimeout(() => {
            if (!el.isConnected || el.classList.contains("disabled") || !el.dataset.stageOn) return;
            const animals = el.dataset.animals.split(",");
            const id = animals[Math.max(0, Math.min(animals.length - 1, Math.round(el.scrollLeft / Number(el.dataset.step))))];
            if (id !== el.dataset.selected) run(`${el.dataset.stageOn}=${id}`, el);
        }, 140);
    }, true);

    // ═══ CUSTOM CHARACTERS: the fake server (drawing timers) ═══
    // A character: { id, description, phase: ready|portraits|choosing|poses|complete|retryable|needsSupport,
    //   candidates: [{ slot, status: pending|completed|failed, at, fails }], picked (slot), portrait (bool),
    //   suggestions ([{name,line}] or null), suggestionsPending, ideasAt, moreLeft, batches, name, line, posesAt, poses (bool), seen }
    const IN_PROGRESS = ["portraits", "choosing", "poses", "retryable", "needsSupport"];
    let tickTimer = null;
    function nextAt(c) {
        const times = [];
        if (c.phase === "portraits") c.candidates.forEach((cd) => cd.status === "pending" && cd.at && times.push(cd.at));
        if (c.suggestionsPending && c.ideasAt) times.push(c.ideasAt);
        if (c.phase === "poses" && c.posesAt) times.push(c.posesAt);
        return Math.min(Infinity, ...times);
    }
    function scheduleTick() {
        clearTimeout(tickTimer);
        const next = Math.min(Infinity, ...shop().characters.map(nextAt));
        if (next === Infinity) return;
        tickTimer = setTimeout(() => { if (tickCharacters()) render(); }, Math.max(60, next - Date.now()));
    }
    function tickCharacters() {
        const now = Date.now();
        let changed = false;
        // A Snake game in progress holds the drawing back, so the board is not replaced mid-game.
        if (!snakePlaying()) {
            for (const c of shop().characters) {
                if (c.phase === "portraits") {
                    for (const cd of c.candidates) if (cd.status === "pending" && cd.at && cd.at <= now) { cd.status = cd.fails ? "failed" : "completed"; changed = true; }
                    if (c.candidates.every((cd) => cd.status !== "pending")) {
                        c.phase = c.candidates.some((cd) => cd.status === "completed") ? "choosing" : "retryable";
                        changed = true;
                    }
                }
                if (c.suggestionsPending && c.ideasAt && c.ideasAt <= now) {
                    c.suggestions = [...(c.suggestions || []), ...BATCHES[c.batches % BATCHES.length]];
                    c.batches += 1;
                    c.suggestionsPending = false;
                    changed = true;
                }
                if (c.phase === "poses" && c.posesAt && c.posesAt <= now) {
                    c.phase = "complete";
                    c.poses = true;
                    changed = true;
                    // The open character screen equips a character the moment it finishes.
                    for (const entry of S.modals.filter((m) => m.id === "paidCharacter")) {
                        const ui = uiOf(keyOf(entry));
                        if (focusedOf(ui)?.id !== c.id) continue;
                        ui.finishedID = c.id;
                        ui.focusID = c.id;
                        c.seen = true;
                        setCompanion(CUSTOM_ART, c.id);
                    }
                }
            }
        }
        syncCard();
        scheduleTick();
        return changed;
    }
    const hasPortrait = (c) => c.poses || c.portrait || c.candidates.some((cd) => cd.status === "completed");
    // The Fights card (PaidCharacterProgressCard, fights part) reads D().customCharacter: keep it on the character drawn here.
    function syncCard() {
        const list = shop().characters;
        const card = D().customCharacter;
        const c = list.find((x) => IN_PROGRESS.includes(x.phase)) || list.find((x) => x.phase === "complete" && !x.seen) || (card && list.find((x) => x.id === card.id));
        if (c) D().customCharacter = { id: c.id, phase: c.phase, seen: c.seen, description: c.description, image: hasPortrait(c) ? PIG : null };
    }
    // A character the Fights card describes (its own fixture) opens here in the same state.
    function importCard() {
        const card = D().customCharacter;
        if (!card || shop().characters.some((c) => c.id === card.id)) return;
        const state = { portraits: "portraits", choosing: "choosing", poses: "poses", complete: "done", retryable: "problem", needsSupport: "problem" }[card.phase];
        if (!state) return;
        const c = fixture(state, { poses: "1", support: card.phase === "needsSupport" ? "1" : "" });
        upsert({ ...c, id: card.id, description: card.description || c.description, seen: card.seen ?? true });
    }
    // After a change made here: the Fights card follows, the timers restart, the screen redraws.
    function changed() {
        syncCard();
        scheduleTick();
        render();
    }
    function newCharacter(description, fast = true) {
        const now = Date.now();
        const times = fast ? FLOW.portraits : [0, 6000, 8000];
        return {
            id: `cc-${now.toString(36)}`, description, phase: "portraits",
            candidates: [1, 2, 3].map((slot, i) => ({ slot, status: times[i] ? "pending" : "completed", at: times[i] ? now + times[i] : null, fails: false })),
            picked: null, portrait: false, suggestions: [], suggestionsPending: false, ideasAt: null, moreLeft: 0, batches: 0,
            name: null, line: null, posesAt: null, poses: false, seen: false, createdAt: now,
        };
    }
    const upsert = (c) => { const list = shop().characters; const i = list.findIndex((x) => x.id === c.id); if (i >= 0) list[i] = c; else list.unshift(c); return c; };
    const characters = () => { tickCharacters(); return shop().characters; };

    // ═══ COMPANION PICKER (CompanionPicker) ═══
    // Params: tab=all|specials|yours, selection=<id>, grid=1, required=1 (first launch), custom=1 ("Make it yours"),
    // free=N, store=off (no StoreKit product), sales=off, unclaimed=1, conflict=1, editions=loading|error, error=1,
    // fresh=1 (a new player: Badger, nothing owned), characters=demo (one character in every state on Yours).
    const ownedOf = (ui) => ui.freshOwned || shop().owned;
    const currentOf = (ui) => ui.freshCurrent ?? D().companion;
    const charactersOf = (ui) => (ui.fresh ? [] : characters()).filter((c) => c.phase !== "refunded");
    const statusOf = (ui, id) => (ownedOf(ui).includes(id) ? "yours" : "available");
    const priceOf = (ui) => (ui.storeOff ? null : SPECIAL_PRICE);
    const specialLabel = (ui, id) => (isLimited(id) ? (statusOf(ui, id) === "yours" ? "Yours" : priceOf(ui) ?? "Available") : null);
    const equippedStock = (ui) => (isCustom(currentOf(ui)) ? null : currentOf(ui));
    const shows = (ui, id) => !isLimited(id) || !ui.salesOff || statusOf(ui, id) === "yours";
    function animalsIn(ui, category) {
        if (category !== "yours") return (category === "all" ? ALL : LIMITED).filter((id) => shows(ui, id));
        const owned = LIMITED.filter((id) => statusOf(ui, id) === "yours");
        const current = equippedStock(ui);
        return [...(current && !owned.includes(current) ? [current] : []), ...owned];
    }
    function categoryChanged(ui) {
        ui.error = "";
        // The stage always shows an animal, so keep the draft on one from this tab.
        const visible = animalsIn(ui, ui.category);
        if (ui.category !== "yours" && !ui.pickingCustom && visible.length && !visible.includes(ui.draft)) {
            ui.draft = visible[0];
            ui.pickingCustom = false;
        }
    }
    function pickerInit(p, ui, defaultTab) {
        const s = shop();
        if (p.fresh === "1") { ui.fresh = true; ui.freshOwned = []; ui.freshCurrent = "badger"; }
        if (p.free != null) s.free = Math.max(0, Number(p.free) || 0);
        importCard();
        if (p.characters === "demo") demoCharacters();
        ui.storeOff = p.store === "off";
        ui.salesOff = p.sales === "off";
        ui.unclaimed = p.unclaimed === "1";
        ui.conflict = p.conflict === "1";
        ui.editions = ["loading", "error"].includes(p.editions) ? p.editions : "";
        ui.message = ui.conflict ? "This purchase could not be assigned. Request a refund from Apple below." : ui.unclaimed ? "You paid for a Special that is not unlocked yet. Pick one and tap Unlock." : "";
        const current = currentOf(ui);
        const custom = isCustom(current);
        const required = p.required === "1";
        const startWithCustom = p.custom === "1";
        const selection = BY_ID[p.selection] ? p.selection : custom ? s.lastStock : current;
        ui.category = startWithCustom ? "yours" : isLimited(selection) && !required ? "limited" : "all";
        const tab = p.tab || defaultTab;
        if (tab) ui.category = { all: "all", specials: "limited", limited: "limited", yours: "yours" }[tab] || ui.category;
        if ((custom && !p.selection) || startWithCustom) { ui.draft = null; ui.pickingCustom = true; }
        else { ui.draft = required && !p.selection ? null : selection; ui.pickingCustom = false; }
        ui.grid = p.grid === "1";
        categoryChanged(ui);
        ui.error = p.error === "1" ? OFFLINE : "";
    }
    function demoCharacters() {
        const now = Date.now();
        const base = { description: "A cowboy pig with a big hat and a sheriff star.", picked: null, portrait: false, suggestions: [], suggestionsPending: false, ideasAt: null, moreLeft: 0, batches: 0, name: null, line: null, posesAt: null, poses: false, seen: true, createdAt: now };
        const done = (slot) => ({ slot, status: "completed", at: null, fails: false });
        shop().characters = shop().characters.filter((c) => !c.id.startsWith("demo-"));
        [
            { ...base, id: "demo-ready", phase: "complete", picked: 1, portrait: true, candidates: [done(1), done(2), done(3)], suggestions: BATCHES[0], batches: 1, moreLeft: 2, poses: true, name: "Sheriff Snout", line: "Rounds up steps before breakfast." },
            { ...base, id: "demo-choosing", phase: "choosing", candidates: [done(1), done(2), done(3)] },
            { ...base, id: "demo-drawing", phase: "poses", picked: 1, portrait: true, candidates: [done(1)], suggestions: BATCHES[0], batches: 1, moreLeft: 2, posesAt: now + 45000 },
            { ...base, id: "demo-retry", phase: "retryable", description: "A tiny furious chihuahua wearing a huge gold chain.", candidates: [] },
        ].reverse().forEach(upsert);
    }
    const pickerLocked = () => S.modals.some((m) => ["companionPicker", "specials"].includes(m.id) && (m.p?.required === "1" || uiOf(keyOf(m)).saving));

    function pickerRender(p, ui, ctx, defaultTab) {
        if (freshStart(ui, ctx)) pickerInit(p, ui, defaultTab);
        const s = shop();
        const required = p.required === "1";
        const visible = animalsIn(ui, ui.category);
        const busy = ui.saving;
        const out = [];
        after(() => {
            const title = hostOf(ctx.key)?.querySelector(".cp-title");
            if (!title) return;
            title.style.fontSize = "";
            if (title.scrollWidth > title.clientWidth) title.style.fontSize = `${Math.max(0.7, title.clientWidth / title.scrollWidth) * 26}px`;
        });
        out.push(`<div class="cp-head"><h1 class="cp-title">Choose your companion</h1>${ui.category !== "yours" && visible.length ? `<button type="button" class="cp-glyph ff-press" aria-label="${ui.grid ? "Show one at a time" : "Show all"}" data-on="toggle:grid">${icon(ui.grid ? "rectangle.portrait" : "square.grid.2x2")}</button>` : ""}${required ? "" : `<button type="button" class="cp-close" data-on="close"${busy ? " disabled" : ""}>Close</button>`}</div>`);
        out.push(`<p class="cp-copy">How others see you in fights and Feed. Change it anytime.</p>`);
        if (s.free > 0) out.push(`<div class="hstack" style="gap:10px">${freeBadge(s.free)}<span class="t-caption c-2">Unlock any Special or create your own.</span></div>`);
        const tabs = [["all", "All"], ...(LIMITED.some((id) => shows(ui, id)) ? [["limited", "Specials"]] : []), ["yours", "Yours"]];
        out.push(FF.segmented(tabs, ui.category, { on: "cpCategory:", fill: true }));
        if (ui.category === "limited" || (ui.category === "all" && isLimited(ui.draft))) {
            out.push(`<p class="t-caption c-2">Buy any Special once and keep it forever. Collect as many as you like.</p>`);
            if (ui.message) out.push(`<p class="t-caption c-2">${esc(ui.message)}</p>`);
            if (ui.conflict) out.push(`<div>${FF.button("Request a refund from Apple", { kind: "secondary", on: "cpRefund" })}</div>`);
        }
        if (ui.category === "limited") {
            if (ui.editions === "loading") out.push(`<div class="cp-progress">${spinner(20, "textSecondary")}<span class="t-caption c-2">Checking availability…</span></div>`);
            else if (ui.editions === "error") out.push(`<p class="t-caption c-ember">Couldn’t load specials. Try again.</p><div>${FF.button("Retry", { kind: "secondary", on: "cpRetryEditions" })}</div>`);
        }
        const showBar = ui.draft && !ui.pickingCustom && visible.includes(ui.draft);
        if (ui.category !== "yours" && visible.length && !ui.grid) {
            const reserved = ui.category === "limited" || isLimited(ui.draft) ? 280 : 240;
            // containerRelativeFrame: the visible scroll height (sheet minus top inset, bottom bar and home indicator).
            const container = 812 - 8 - 34 - (showBar ? 69 + (ui.error ? 24 : 0) : 0) - 6;
            out.push(stage({
                animals: visible, selection: ui.pickingCustom ? null : ui.draft, key: `picker-${ui.category}`,
                on: "cpPick:", label: (id) => specialLabel(ui, id), disabled: busy, height: container - reserved,
            }));
        }
        if (ui.category !== "yours" && visible.length && ui.grid) {
            const groups = ui.category === "limited"
                ? SERIES.map(([series, title]) => [title, visible.filter((id) => BY_ID[id].series === series)]).filter(([, ids]) => ids.length)
                : [[null, visible]];
            out.push(`<div class="cp-grid">${groups.map(([title, ids]) => `${title ? `<div class="cp-grid-header">${esc(title)}</div>` : ""}${ids.map((id) => {
                const selected = ui.draft === id && !ui.pickingCustom;
                return tile({ name: BY_ID[id].name, caption: specialLabel(ui, id), selected, art: `<img src="${companionArt(id)}" alt="">`, on: `cpPick:=${id}`, disabled: busy });
            }).join("")}`).join("")}</div>`);
        }
        if (ui.category === "yours") {
            const owned = animalsIn(ui, "yours");
            const chars = charactersOf(ui);
            if (!chars.length && !owned.some(isLimited)) out.push(`<p class="t-body c-2">Specials you buy and characters you create live here.</p>`);
            const tiles = owned.map((id) => tile({
                name: BY_ID[id].name, caption: equippedStock(ui) === id ? "Equipped" : specialLabel(ui, id),
                selected: ui.draft === id && !ui.pickingCustom, art: `<img src="${companionArt(id)}" alt="">`, on: `cpPick:=${id}`, disabled: busy,
            }));
            for (const c of chars) {
                const equipped = isCustom(currentOf(ui)) && s.equipped === c.id;
                const caption = c.phase === "complete" ? (equipped ? "Equipped" : null) : c.phase === "choosing" ? "Pick one" : ["portraits", "poses"].includes(c.phase) ? "Being drawn" : "Finish it";
                        const art = hasPortrait(c) ? `<img src="${PIG}" alt="">` : ["portraits", "poses", "complete"].includes(c.phase) ? spinner(20) : `<span class="cp-pencil">${icon("pencil")}</span>`;
                const named = c.phase === "complete" && c.suggestions != null;
                tiles.push(tile({
                    name: c.name || c.suggestions?.[0]?.name || c.description || "Your character", caption, selected: equipped && ui.pickingCustom, art,
                    on: `cpCharacter:${c.id}`, disabled: busy, menu: named ? c.id : null,
                }));
            }
            if (ui.fresh || !ui.salesOff || chars.length) {
                tiles.push(tile({
                    name: "Create your own", caption: s.free > 0 ? `${s.free} free` : ui.storeOff ? null : CHARACTER_PRICE,
                    selected: false, art: `<span class="cp-plus">${icon("plus")}</span>`, on: "cpCreate", disabled: busy,
                }));
            }
            out.push(`<div class="cp-grid">${tiles.join("")}</div>`);
            if (ui.error && (!ui.draft || ui.pickingCustom)) out.push(`<p class="t-caption c-ember">${esc(ui.error)}</p>`);
        }
        let bar = "";
        if (showBar) {
            const a = BY_ID[ui.draft];
            const owned = statusOf(ui, ui.draft) === "yours";
            const paid = a.limited;
            const unlocksFree = s.free > 0 && !ui.unclaimed;
            const canBuy = !ui.salesOff && !ui.storeOff && !owned;
            const title = paid && !owned
                ? ui.unclaimed ? "Unlock this Special" : unlocksFree ? "Unlock with 1 free" : priceOf(ui) ? `Buy for ${priceOf(ui)}` : "Purchases unavailable"
                : "Save companion";
            bar = `<div class="cp-bar">${ui.grid ? `<div class="cp-bar-pick"><img src="${companionArt(ui.draft)}" alt=""><div class="vstack" style="gap:4px"><b class="t-label">${esc(a.name)}</b><span class="t-body c-2">${esc(a.caption)}</span>${isCustom(currentOf(ui)) || ui.draft !== currentOf(ui) ? `<span class="t-caption c-2">Not saved yet</span>` : ""}</div></div>` : ""}${ui.error ? `<p class="t-caption c-ember">${esc(ui.error)}</p>` : ""}${FF.button(title, { full: true, on: "cpSave", busy, enabled: !paid || owned || canBuy || unlocksFree || ui.unclaimed })}</div>`;
        }
        // safeAreaInset(edge: .bottom) keeps the system spacing (6) between the scroll content and the bar.
        return FF.screen(out.join(""), { clearance: false, bottom: bar, bodyStyle: `padding-bottom:${bar ? 26 : 20}px` });
    }
    // One closet tile (collectionTile), the same shape as the grid tiles on All and Specials.
    function tile(o) {
        return `<button type="button" class="cp-tile ${o.selected ? "on" : ""}"${on(o.on)}${o.disabled ? " disabled" : ""}${o.menu ? ` data-cp-menu="${esc(o.menu)}"` : ""} aria-pressed="${!!o.selected}"><span class="cp-tile-art">${o.art}</span><span class="cp-tile-name">${esc(o.name)}</span><span class="cp-tile-caption">${esc(o.caption || " ")}</span></button>`;
    }

    const pickerDef = (defaultTab) => ({
        kind: "sheet",
        title: "Choose your companion",
        get dismissable() { return !pickerLocked(); },
        render: (p, ui, ctx) => pickerRender(p, ui, ctx, defaultTab),
    });
    screen("companionPicker", pickerDef(null));
    // The Specials shop: the same picker, opened on Specials.
    screen("specials", pickerDef("specials"));

    action("cpCategory", (arg, ctx) => {
        ctx.ui.category = arg.replace(/^.*=/, "");
        categoryChanged(ctx.ui);
        render();
    });
    action("cpPick", (arg, ctx) => {
        const id = arg.replace(/^.*=/, "");
        if (!BY_ID[id] || ctx.ui.saving) return;
        Object.assign(ctx.ui, { draft: id, pickingCustom: false, error: "" });
        render();
    });
    function closeEntry(key) {
        const entry = entryOf(key);
        if (!entry) return;
        S.modals.splice(S.modals.indexOf(entry), 1);
        render();
    }
    // saveStock: a Special that is not owned is bought (or unlocked with a free character) first, then worn.
    action("cpSave", (_, ctx) => {
        const ui = ctx.ui;
        const id = ui.draft;
        if (!id || ui.saving) return;
        const s = shop();
        Object.assign(ui, { error: "", pickingCustom: false });
        const owned = statusOf(ui, id) === "yours";
        const limited = isLimited(id);
        // A Special needs the server's ownership check, so it is never saved offline; an animal saves locally first.
        const offline = S.scenario === "offline" && limited;
        if (limited && !owned && !ui.unclaimed && !(s.free > 0) && !offline) {
            const then = `cpBought:${id}`;
            if (SCREENS.sysStoreKit) present("sysStoreKit", { title: "Special companion", price: SPECIAL_PRICE, then });
            else run(then, ctx.el);
            return;
        }
        ui.saving = true;
        render();
        setTimeout(() => {
            ui.saving = false;
            if (offline) { ui.error = OFFLINE; render(); return; }
            if (limited && !owned) {
                if (ui.unclaimed) ui.unclaimed = false;
                else s.free -= 1;
                unlock(ui, id);
                ui.message = "";
                render();
                return;
            }
            setCompanion(id);
            if (ui.fresh) ui.freshCurrent = id;
            closeEntry(ctx.key);
        }, FLOW.busy);
    });
    function unlock(ui, id) {
        if (!shop().owned.includes(id)) shop().owned.push(id);
        if (ui.freshOwned && !ui.freshOwned.includes(id)) ui.freshOwned.push(id);
        // After a purchase the picker stays open, so the buyer sees the Special marked as theirs. It is worn at once.
        setCompanion(id);
        if (ui.fresh) ui.freshCurrent = id;
    }
    // Run by the StoreKit sheet's Buy.
    action("cpBought", (id) => {
        const entry = [...S.modals].reverse().find((m) => ["companionPicker", "specials"].includes(m.id));
        const ui = entry ? uiOf(keyOf(entry)) : {};
        unlock(ui, id);
        ui.message = "";
        render();
    });
    action("cpRefund", (_, ctx) => {
        ctx.ui.message = "Refund requested. Apple will decide and notify you.";
        render();
    });
    action("cpRetryEditions", (_, ctx) => {
        ctx.ui.editions = "loading";
        render();
        setTimeout(() => { ctx.ui.editions = ""; render(); }, 900);
    });
    action("cpCharacter", (id, ctx) => {
        const c = shop().characters.find((x) => x.id === id);
        if (!c || ctx.ui.saving) return;
        if (c.phase === "complete") {
            // equip: wear the resting pose and close the picker.
            Object.assign(ctx.ui, { error: "", pickingCustom: true, draft: null, saving: true });
            render();
            setTimeout(() => {
                ctx.ui.saving = false;
                if (S.scenario === "offline") { ctx.ui.error = OFFLINE; render(); return; }
                setCompanion(CUSTOM_ART, c.id);
                closeEntry(ctx.key);
            }, FLOW.busy);
        } else {
            present("paidCharacter", { id });
        }
    });
    action("cpCreate", () => present("paidCharacter", { new: "1" }));
    action("cpNameIt", (id) => present("paidCharacter", { id }));

    // Long press (or right click) on a finished character opens its context menu.
    let press = null, swallowClick = false;
    const openTileMenu = (el) => menu([{ title: "Name your companion", icon: "pencil", on: `cpNameIt:${el.dataset.cpMenu}` }], el);
    phone.addEventListener("contextmenu", (event) => {
        const el = event.target.closest("[data-cp-menu]");
        if (!el) return;
        event.preventDefault();
        openTileMenu(el);
    });
    phone.addEventListener("pointerdown", (event) => {
        const el = event.target.closest("[data-cp-menu]");
        if (!el || event.button > 0) return;
        press = { el, x: event.clientX, y: event.clientY, timer: setTimeout(() => { swallowClick = true; openTileMenu(el); press = null; }, 500) };
    });
    phone.addEventListener("pointermove", (event) => {
        if (press && Math.hypot(event.clientX - press.x, event.clientY - press.y) > 10) { clearTimeout(press.timer); press = null; }
    });
    window.addEventListener("pointerup", () => { if (press) { clearTimeout(press.timer); press = null; } });
    phone.addEventListener("click", (event) => {
        if (!swallowClick) return;
        swallowClick = false;
        if (event.target.closest(".sys-menu")) return;
        event.stopImmediatePropagation();
        event.preventDefault();
    }, true);

    // ═══ NEW COMPANION (PaidCharacterView) ═══
    // Params: state=describe|checking|review|portraits|choosing|poses|done|problem (the Simulator fixture states),
    // id=<character> (open on it), new=1 ("Create your own"), free=N, store=off, pending=1 (purchase pending),
    // ready=1 (a purchase made before descriptions), check=failed, failed=1 (one portrait fails),
    // ideas=pending|none, poses=1 (done with the five poses), support=1 (problem needing support), notifications=denied.
    const FIXTURE_STATES = ["portraits", "choosing", "poses", "done", "problem"];
    function fixture(state, p) {
        const now = Date.now();
        const done = (slot) => ({ slot, status: "completed", at: null, fails: false });
        const base = {
            id: "cc-preview", description: "A cowboy pig with a big hat and a sheriff star.", picked: null, portrait: false,
            candidates: [], suggestions: [], suggestionsPending: false, ideasAt: null, moreLeft: 0, batches: 0,
            name: null, line: null, posesAt: null, poses: false, seen: true, createdAt: now,
        };
        const named = p.ideas === "none" ? { suggestions: [], moreLeft: 3 }
            : p.ideas === "pending" ? { suggestions: [], suggestionsPending: true, ideasAt: now + 6000, moreLeft: 3 }
            : { suggestions: BATCHES[0], batches: 1, moreLeft: 2 };
        switch (state) {
            case "portraits":
                return { ...base, phase: "portraits", candidates: [done(1), { slot: 2, status: "pending", at: now + 6000, fails: false }, { slot: 3, status: "pending", at: now + 8000, fails: p.failed === "1" }] };
            case "choosing":
                return { ...base, phase: "choosing", candidates: [done(1), done(2), p.failed === "1" ? { slot: 3, status: "failed", at: null, fails: false } : done(3)] };
            case "poses":
                return { ...base, ...named, phase: "poses", picked: 1, portrait: true, candidates: [done(1)], posesAt: now + 12000 };
            case "done":
                return { ...base, ...named, phase: "complete", picked: 1, portrait: true, candidates: [done(1)], poses: p.poses === "1" };
            default:
                return { ...base, phase: p.support === "1" ? "needsSupport" : "retryable" };
        }
    }
    function focusedOf(ui) {
        const list = shop().characters;
        if (ui.focusID) {
            const c = list.find((x) => x.id === ui.focusID);
            if (c && c.phase !== "ready" && c.phase !== "refunded") return c;
        }
        return list.find((c) => IN_PROGRESS.includes(c.phase) && !(ui.ignored || []).includes(c.id)) || list.find((c) => c.id === ui.finishedID) || null;
    }
    const stepOf = (ui, c) => (!c ? (ui.options ? "review" : "describe") : { portraits: "portraits", choosing: "choosing", poses: "poses", complete: "done" }[c.phase] || "problem");
    const partOf = (step, c) => ({ describe: 0, review: 1, portraits: 2, choosing: 2, poses: 3, done: 3 }[step] ?? (c?.portrait ? 3 : 2));
    function characterInit(p, ui) {
        const s = shop();
        Object.assign(ui, { description: "", options: null, note: null, chosen: 0, checking: false, checkFailed: false, restoring: false, busy: false, ignored: [], picked: {}, labels: {}, error: "", message: "", focusID: null, finishedID: null });
        if (p.free != null) s.free = Math.max(0, Number(p.free) || 0);
        ui.storeOff = p.store === "off";
        ui.pending = p.pending === "1";
        ui.pushDenied = p.notifications === "denied";
        importCard();
        if (p.ready === "1") upsert({ ...newCharacter(null), id: "cc-ready", phase: "ready", candidates: [] });
        const ids = () => s.characters.map((c) => c.id);
        const state = p.state;
        if (["describe", "checking", "review"].includes(state)) {
            ui.ignored = ids();
            ui.description = "A cowboy pig";
            if (state !== "describe") startCheck(ui, ui.description, state === "checking" ? 6000 : FLOW.check, p.check === "failed");
        } else if (FIXTURE_STATES.includes(state)) {
            const c = upsert(fixture(state, p));
            ui.focusID = c.id;
            ui.ignored = ids().filter((id) => id !== c.id);
        } else if (p.new === "1") {
            ui.ignored = ids();
        } else if (p.id) {
            ui.focusID = p.id;
            ui.ignored = ids().filter((id) => id !== p.id);
        } else {
            ui.finishedID = s.characters.find((c) => c.phase === "complete" && !c.seen)?.id ?? null;
        }
        // A new character leaves the Fights card of a finished one for when its owner sees it.
        if (p.new !== "1") s.characters.forEach((c) => { if (c.phase === "complete") c.seen = true; });
    }
    // Opens "Pick the words we draw" at once with the owner's words; the rewrites join them when the check ends.
    function startCheck(ui, text, ms = FLOW.check, fail = false) {
        Object.assign(ui, { options: [text], note: null, chosen: 0, checkFailed: false, checking: true });
        const gen = (ui.checkGen = (ui.checkGen || 0) + 1);
        setTimeout(() => {
            // Editing or paying stops waiting.
            if (ui.checkGen !== gen || !ui.options || stepOf(ui, focusedOf(ui)) !== "review") { ui.checking = false; return; }
            ui.checking = false;
            if (fail) ui.checkFailed = true;
            else if (/\bpig\b/i.test(text)) { ui.note = PIG_NOTE; ui.options = [text, ...PIG_VARIATIONS]; }
            else {
                const core = text.replace(/^(an?|the)\s+/i, "").replace(/[.!\s]+$/, "");
                ui.note = "What colours should it wear? A colour or two makes the portraits closer to what you imagine.";
                ui.options = [text, `A ${core} with a bright headband, big sneakers and a proud grin.`, `A ${core} in a tracksuit with a whistle around the neck, looking determined.`, `A tiny ${core} in huge running shoes, with rosy cheeks and a gold medal.`];
            }
            render();
        }, ms);
    }
    const characterLocked = () => snakePlaying();

    function characterRender(p, ui, ctx) {
        if (freshStart(ui, ctx)) characterInit(p, ui);
        tickCharacters();
        const s = shop();
        const c = focusedOf(ui);
        const step = stepOf(ui, c);
        const current = partOf(step, c);
        if (ui.lastStep !== step) {
            ui.error = "";
            ui.lastStep = step;
        }
        // The open part is always in view, finished parts fold above it.
        if (ui.lastPart !== current) {
            const first = ui.lastPart === undefined;
            ui.lastPart = current;
            after(() => scrollInto(hostOf(ctx.key)?.querySelector(`[data-part="${current}"]`), "top", !first));
        }
        const summary0 = `“${ui.options?.[0] ?? (ui.description ? ui.description : c?.description ?? "")}”`;
        const summary1 = `“${c?.description ?? ui.options?.[ui.chosen] ?? ""}”`;
        const parts = [
            part(0, "Describe your animal", "", summary0, current, () => describeHTML(ui, s)),
            part(1, "Pick the words we draw", "After you write, we suggest richer versions.", summary1, current, () => reviewHTML(ui)),
            part(2, "Pick a portrait", "Drawn after you pay. About a minute.", "Portrait chosen", current, () => (!c ? "" : step === "choosing" ? choosingHTML(c, ui) : step === "problem" ? problemHTML(c) : portraitsHTML(c)), c?.portrait),
            part(3, "Name it", "Five fitness poses, then a name.", null, current, () => (!c ? "" : step === "done" ? doneHTML(c, ui) : step === "problem" ? problemHTML(c) : posesHTML(c, ui))),
        ];
        if (ui.error) parts.push(`<p class="t-caption c-ember">${esc(ui.error)}</p>`);
        const html = FF.screen(parts.join(""), {
            top: `<div class="cpc-header">${FF.sheetHeader("New companion", { on: "close" })}</div>`,
            clearance: false, bodyStyle: "padding:20px 20px 26px", bottom: `<div class="cp-bar cpc-bar">${characterBar(step, c, ui, s)}</div>`,
        });
        // A down swipe in Snake must steer, not scroll.
        return snakePlaying() ? html.replace('class="ff-scroll"', 'class="ff-scroll cp-locked"') : html;
    }
    // One part of the page: open now, finished (folded to one line), or still to come (dashed).
    function part(index, title, later, summary, current, content, thumbnail) {
        const state = index < current ? "done" : index === current ? "open" : "later";
        const sub = state === "later" && later ? `<span class="cpc-sub">${esc(later)}</span>` : state === "done" && summary != null ? `<span class="cpc-sub ellipsis">${esc(summary)}</span>` : "";
        const dash = state === "later" ? `<svg class="cpc-dash" aria-hidden="true"><rect x="0.5" y="0.5" width="100%" height="100%" rx="21.5" ry="21.5"/></svg>` : "";
        return `<section class="cpc-part ${state}" data-part="${index}">${dash}<div class="cpc-head"><span class="cpc-num ${state}">${state === "done" ? icon("checkmark") : index + 1}</span><span class="grow vstack" style="gap:1px"><span class="cpc-title">${esc(title)}</span>${sub}</span>${state === "done" && thumbnail ? `<img class="cpc-thumb" src="${PIG}" alt="">` : ""}</div>${state === "open" ? content() : ""}</section>`;
    }
    const messageHTML = (ui) => (ui.message ? `<p class="t-caption c-2">${esc(ui.message)}</p>` : "");
    function describeHTML(ui, s) {
        return [
            s.free > 0 ? `<div>${freeBadge(s.free)}</div>` : "",
            FF.field("", { bind: "description", value: ui.description, multiline: true, rows: 4, max: 1000, minHeight: 88, placeholder: "Species, breed, accessories, colors…", counter: `${ui.description.length}/1000` }),
            `<div class="cpc-ideas-wrap"><p class="t-label c-2">Need an idea? Tap one.</p><div class="cpc-ideas">${IDEAS.map(([image, text], i) => `<button type="button" class="cpc-idea ${ui.description === text ? "on" : ""}" aria-pressed="${ui.description === text}" data-on="cpcIdea:${i}"><img src="${asset(image)}" alt=""><span>${esc(text)}</span></button>`).join("")}</div></div>`,
            messageHTML(ui),
        ].join("");
    }
    function reviewHTML(ui) {
        const out = [];
        if (ui.checking) out.push(FF.card(`<div class="hstack" style="gap:12px">${spinner()}<div class="vstack" style="gap:2px"><b class="t-heading">Reading your idea</b><span class="t-caption c-2">Better versions show up here in about a minute. You can also create it now with your words.</span></div></div>`));
        else if (ui.note) out.push(FF.notice(ui.note, { tone: "neutral", icon: "sparkles" }));
        else if (ui.checkFailed) out.push(`<p class="t-caption c-2">We could not check your idea. You can still create it as you wrote it.</p>`);
        (ui.options || []).forEach((text, i) => {
            const selected = ui.chosen === i;
            out.push(FF.card(`<div class="cpc-option"><div class="grow vstack" style="gap:4px"><span class="t-micro" style="color:var(--${selected ? "mossText" : "textTertiary"})">${i === 0 ? "Your words" : `Idea ${i}`}</span><span class="t-body">${esc(text)}</span></div><span class="cpc-radio ${selected ? "on" : ""}">${icon(selected ? "checkmark.circle.fill" : "circle")}</span></div>`, {
                fill: selected ? "var(--mossWash)" : null, stroke: selected ? "var(--mossEdge)" : null, on: ui.busy ? null : `cpcChoose:${i}`,
            }));
        });
        // Words can change until paying; portraits are never redone.
        if (!ui.busy) out.push(`<div><button type="button" class="cpc-link" data-on="cpcChangeWords">Change my words</button></div>`);
        out.push(messageHTML(ui));
        return out.join("");
    }
    function portraitTile(status, picked) {
        const inner = status === "completed" ? `<img src="${PIG}" alt="">` : status === "failed" ? `<span class="c-ember">${icon("exclamationmark.triangle")}</span>` : spinner();
        return `<span class="cpc-tile ${picked ? "picked" : ""}">${inner}${picked ? `<svg class="cpc-check" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10" fill="var(--mossFill)"/><path d="M7.5 12.5l3 3 6-6.5" fill="none" stroke="var(--mossOn)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>` : ""}</span>`;
    }
    const snakeSection = (key) => `<div class="cpc-snake" id="snake"><b class="t-heading">Play Snake while you wait</b>${snakeHTML({ key })}</div>`;
    function portraitsHTML(c) {
        const tiles = [1, 2, 3].map((slot) => {
            const cd = c.candidates.find((x) => x.slot === slot);
            return portraitTile(cd?.status === "completed" ? "completed" : cd?.status === "failed" ? "failed" : "pending", false);
        }).join("");
        return `<div class="vstack" style="gap:16px"><div class="cpc-tiles">${tiles}</div><p class="t-caption c-2">Drawing three portraits. This takes about a minute.</p>${snakeSection("character-portraits")}</div>`;
    }
    const pickedSlot = (c, ui) => ui.picked[c.id] ?? c.candidates.find((cd) => cd.status === "completed")?.slot;
    function choosingHTML(c, ui) {
        const selection = pickedSlot(c, ui);
        const tiles = c.candidates.map((cd) => `<button type="button" class="cpc-tile-button" aria-label="Portrait ${cd.slot}" aria-pressed="${selection === cd.slot}" data-on="cpcPick:${cd.slot}"${cd.status !== "completed" ? " disabled" : ""}>${portraitTile(cd.status === "completed" ? "completed" : "failed", selection === cd.slot)}</button>`).join("");
        const failed = c.candidates.some((cd) => cd.status === "failed");
        return `<div class="vstack" style="gap:16px"><div class="cpc-hero" style="height:260px">${selection != null ? `<img src="${PIG}" alt="">` : ""}</div><div class="cpc-tiles">${tiles}</div><p class="t-caption c-2">Pick your favourite. The other portraits stay saved in your account.</p>${failed ? FF.button("Redraw the failed portraits", { kind: "ghost", size: "small", full: true, on: "cpcRedraw", enabled: !ui.busy, busy: ui.busy }) : ""}</div>`;
    }
    function posesHTML(c, ui) {
        return `<div class="vstack" style="gap:16px"><div class="hstack" style="gap:10px">${spinner()}<span class="t-caption c-2">Making five fitness poses. This takes a few minutes.</span></div>${labelEditor(c, ui)}${snakeSection("character-poses")}</div>`;
    }
    function doneHTML(c, ui) {
        const art = c.poses
            ? `<div class="cpc-hero" style="height:220px"><img src="${PIG}" alt=""></div><div class="cpc-poses">${POSE_STAGES.map((stage) => `<img src="${PIG}" alt="${stage}">`).join("")}</div>`
            : c.portrait ? `<div class="cpc-hero" style="height:220px"><img src="${PIG}" alt=""></div>` : "";
        return `<div class="vstack" style="gap:16px">${art}${labelEditor(c, ui)}</div>`;
    }
    const problemHTML = (c) => `<p class="t-body c-ember">${c.phase === "needsSupport" ? "We could not confirm whether this drawing started. Contact support and we will finish your character at no cost." : "The images could not be completed. Retry this character without another purchase."}</p>`;

    // CompanionLabelEditor: the written ideas as cards, then Name and Line fields to save either one or your own.
    function labelEditor(c, ui) {
        if (c.suggestions == null) return "";
        if (ui.labelFor !== c.id) {
            if (ui.labelFor) ui.labels[ui.labelFor] = { name: ui.cpName, line: ui.cpLine, fromCard: ui.cpFromCard };
            const draft = ui.labels[c.id] || { name: c.name || "", line: c.line || "", fromCard: false };
            Object.assign(ui, { labelFor: c.id, cpName: draft.name, cpLine: draft.line, cpFromCard: draft.fromCard });
        }
        const name = (ui.cpName || "").trim(), line = (ui.cpLine || "").trim();
        const suggestions = c.suggestions;
        const more = c.moreLeft > 0 && !c.suggestionsPending
            ? `<button type="button" class="cpc-more" data-on="cpcMore"${ui.asking ? " disabled" : ""}>${ui.asking ? spinner(14, "mossText") : icon("arrow.clockwise")}<span>${suggestions.length ? "Four more" : "Get four ideas"}</span></button>` : "";
        const cards = suggestions.map((sg, i) => {
            const picked = name === sg.name && line === sg.line;
            return FF.card(`<div class="vstack" style="gap:2px"><b class="t-heading">${esc(sg.name)}</b><span class="t-caption c-2">${esc(sg.line)}</span></div>`, { fill: picked ? "var(--mossWash)" : null, stroke: picked ? "var(--mossEdge)" : null, on: `cpcLabelPick:${i}`, attrs: { "aria-pressed": String(picked) } });
        }).join("");
        const pending = c.suggestionsPending ? FF.card(`<div class="hstack" style="gap:10px">${spinner()}<span class="t-caption c-2">Writing four ideas. This takes about a minute.</span></div>`) : "";
        const changed = name !== (c.name || "") || line !== (c.line || "");
        return `<div class="cpc-label"><div class="hstack"><b class="grow t-heading">Name your companion</b>${more}</div><p class="t-caption c-2">${!suggestions.length && !c.suggestionsPending ? "No ideas yet." : "Pick an idea, change it, or write your own."}</p>${cards}${pending}${FF.field("Name", { bind: "cpName", value: ui.cpName, max: 24, placeholder: "Your companion’s name", counter: `${(ui.cpName || "").length}/24` })}${FF.field("Line", { bind: "cpLine", value: ui.cpLine, max: 60, placeholder: "A short, funny line", counter: `${(ui.cpLine || "").length}/60` })}${FF.button("Save", { kind: "secondary", full: true, on: "cpcLabelSave", enabled: !!name && !!line && changed, busy: ui.labelSaving })}${ui.labelError ? `<p class="t-caption c-ember">${esc(ui.labelError)}</p>` : ""}</div>`;
    }

    function characterBar(step, c, ui, s) {
        const trimmed = (ui.description || "").trim();
        switch (step) {
            case "describe":
                return FF.button("Next", { size: "large", full: true, on: "cpcNext", enabled: !!trimmed && !ui.restoring })
                    + FF.button("Restore purchases", { kind: "ghost", size: "small", full: true, on: "cpcRestore", enabled: !ui.busy, busy: ui.restoring });
            case "review": {
                const ready = s.characters.find((x) => x.phase === "ready");
                let button;
                if (ready) button = FF.button("Create character", { size: "large", full: true, on: `cpcStart:${ready.id}`, enabled: !ui.busy, busy: ui.busy });
                else if (s.free > 0) button = FF.button("Create for free", { size: "large", full: true, on: "cpcFree", enabled: !ui.busy, busy: ui.busy });
                else {
                    const title = ui.pending ? "Purchase pending" : ui.storeOff ? "Purchases unavailable" : `Create for ${CHARACTER_PRICE}`;
                    button = FF.button(title, { size: "large", full: true, on: "cpcBuy", enabled: !ui.storeOff && !ui.pending && !ui.busy, busy: ui.busy });
                }
                return `${button}<p class="t-caption c-2 cpc-note">Three portraits in about a minute. You pick your favourite.</p>`;
            }
            case "portraits":
            case "poses": {
                const denied = ui.pushDenied || s.pushStatus === "denied";
                return FF.button(denied ? "Close" : "Notify me when it’s ready", { kind: "secondary", size: "large", full: true, on: "cpcNotify" })
                    + `<p class="t-caption c-2 cpc-note">${denied ? "Notifications are off. The Fights tab shows when it is ready." : "You can close the app. We keep drawing."}</p>`;
            }
            case "choosing":
                return FF.button("Use this portrait", { size: "large", full: true, on: "cpcUsePortrait", enabled: pickedSlot(c, ui) != null && !ui.choosing, busy: ui.choosing });
            case "done": {
                const equipped = isCustom(D().companion) && s.equipped === c.id;
                return (equipped || !c.poses
                    ? FF.button("Done", { size: "large", full: true, on: "close" })
                    : FF.button("Use as companion", { size: "large", full: true, on: "cpcSelect", enabled: !ui.selecting, busy: ui.selecting }))
                    + FF.button("Create another", { kind: "ghost", size: "small", full: true, on: "cpcAnother" });
            }
            default:
                return c?.phase === "needsSupport"
                    ? FF.button("Contact support", { size: "large", full: true, on: "cpcSupport" })
                    : FF.button("Try again", { size: "large", full: true, on: "cpcRetry", enabled: !ui.busy, busy: ui.busy });
        }
    }

    screen("paidCharacter", {
        kind: "sheet",
        title: "New companion",
        get dismissable() { return !characterLocked(); },
        render: characterRender,
    });
    const characterUI = () => { const entry = [...S.modals].reverse().find((m) => m.id === "paidCharacter"); return entry ? uiOf(keyOf(entry)) : null; };
    action("cpcIdea", (i, ctx) => { ctx.ui.description = IDEAS[Number(i)][1]; render(); });
    action("cpcNext", (_, ctx) => {
        const text = (ctx.ui.description || "").trim();
        if (text) { startCheck(ctx.ui, text); render(); }
    });
    action("cpcRestore", (_, ctx) => {
        const ui = ctx.ui;
        Object.assign(ui, { restoring: true, message: "" });
        render();
        setTimeout(() => {
            ui.restoring = false;
            ui.message = shop().characters.length ? "Your character purchases are linked to this FitFight account." : "No character purchases were found for this FitFight account.";
            render();
        }, 900);
    });
    action("cpcChoose", (i, ctx) => { ctx.ui.chosen = Number(i); render(); });
    action("cpcChangeWords", (_, ctx) => {
        const ui = ctx.ui;
        Object.assign(ui, { description: ui.options?.[ui.chosen] ?? ui.description, options: null, note: null, error: "", checking: false, checkFailed: false });
        render();
    });
    function begin(ui, character) {
        ui.focusID = upsert(character).id;
        ui.checking = false;
    }
    action("cpcBuy", () => {
        const then = "cpcBought";
        if (SCREENS.sysStoreKit) present("sysStoreKit", { title: "Custom character", price: CHARACTER_PRICE, then });
        else ACT.cpcBought();
    });
    // Run by the StoreKit sheet's Buy: the description goes with the purchase and the portraits start.
    action("cpcBought", () => {
        const ui = characterUI();
        if (!ui) return;
        begin(ui, newCharacter(ui.options?.[ui.chosen] ?? ui.description));
        changed();
    });
    action("cpcFree", (_, ctx) => {
        const ui = ctx.ui;
        ui.busy = true;
        render();
        setTimeout(() => {
            ui.busy = false;
            shop().free = Math.max(0, shop().free - 1);
            begin(ui, newCharacter(ui.options?.[ui.chosen] ?? ui.description));
            changed();
        }, FLOW.busy);
    });
    action("cpcStart", (id, ctx) => {
        const ui = ctx.ui;
        const ready = shop().characters.find((c) => c.id === id);
        if (!ready) return;
        ui.busy = true;
        render();
        setTimeout(() => {
            ui.busy = false;
            begin(ui, { ...newCharacter(ui.options?.[ui.chosen] ?? ui.description), id: ready.id });
            changed();
        }, FLOW.busy);
    });
    action("cpcPick", (slot, ctx) => {
        const c = focusedOf(ctx.ui);
        if (c) ctx.ui.picked[c.id] = Number(slot);
        render();
    });
    action("cpcUsePortrait", (_, ctx) => {
        const ui = ctx.ui;
        const c = focusedOf(ui);
        const slot = c && pickedSlot(c, ui);
        if (!c || slot == null || ui.choosing) return;
        ui.choosing = true;
        render();
        setTimeout(() => {
            const now = Date.now();
            ui.choosing = false;
            Object.assign(c, { phase: "poses", picked: slot, portrait: true, suggestions: [], suggestionsPending: true, ideasAt: now + FLOW.ideas, moreLeft: 3, posesAt: now + FLOW.poses });
            changed();
        }, FLOW.busy);
    });
    action("cpcRedraw", (_, ctx) => {
        const ui = ctx.ui;
        const c = focusedOf(ui);
        if (!c) return;
        ui.busy = true;
        render();
        setTimeout(() => {
            ui.busy = false;
            const now = Date.now();
            c.candidates.forEach((cd, i) => { if (cd.status === "failed") Object.assign(cd, { status: "pending", at: now + 2500 + i * 600, fails: false }); });
            c.phase = "portraits";
            changed();
        }, FLOW.busy);
    });
    action("cpcRetry", (_, ctx) => {
        const ui = ctx.ui;
        const c = focusedOf(ui);
        if (!c) return;
        ui.busy = true;
        render();
        setTimeout(() => {
            ui.busy = false;
            const now = Date.now();
            if (c.portrait) Object.assign(c, { phase: "poses", posesAt: now + FLOW.poses, suggestions: c.suggestions || [] });
            else Object.assign(c, { phase: "portraits", candidates: newCharacter(c.description).candidates });
            changed();
        }, FLOW.busy);
    });
    action("cpcSupport", () => present("sysExternal", { url: S.environment === "staging" ? "https://staging.fitfight.app/support" : "https://fitfight.app/support" }));
    action("cpcNotify", (_, ctx) => {
        const s = shop();
        const ask = s.pushStatus === "notDetermined" && !ctx.ui.pushDenied;
        closeEntry(ctx.key);

            s.pushStatus = "asked";

        const ui = ctx.ui;
        const c = focusedOf(ui);
        if (!c || ui.selecting) return;

        setTimeout(() => {
            ui.selecting = false;
            if (S.scenario === "offline") ui.error = OFFLINE;
            else setCompanion(CUSTOM_ART, c.id);
            render();
        }, FLOW.busy);
    });
    action("cpcAnother", (_, ctx) => {
        Object.assign(ctx.ui, { ignored: shop().characters.map((c) => c.id), focusID: null, finishedID: null, options: null, note: null, description: "", checking: false, checkFailed: false });
        render();

    action("cpcLabelPick", (i, ctx) => {

    // Marc's rule: round down, never up. 999,999 is "999K", 1,099,999 is "1M" and 2.68 is "2.6".
    function adminNumber(value) {
        const magnitude = Math.abs(value);
        const tier = [[1e15, "Q"], [1e12, "T"], [1e9, "B"], [1e6, "M"], [1e3, "K"]].find(([size]) => magnitude >= size);
        const scaled = magnitude / (tier ? tier[0] : 1);
        let digits;
        if (scaled < (tier ? 100 : 10)) {
            const tenths = Math.floor(scaled * 10 + 1e-9);
            digits = tenths % 10 === 0 ? `${tenths / 10}` : `${Math.floor(tenths / 10)}.${tenths % 10}`;
        } else digits = `${Math.floor(scaled + 1e-9)}`;
        return (value < 0 && digits !== "0" ? "-" : "") + digits + (tier ? tier[1] : "");
    }
    const UNIT_SUFFIX = { percent: "%", days: " d", hours: " h", minutes: " min", seconds: " s" };
    function adminValue(value, unit, exact = false) {
        const suffix = UNIT_SUFFIX[unit] || "";
        if (exact) return Number(value).toLocaleString("en-US", { maximumFractionDigits: unit === "steps" ? 0 : 1 }) + suffix;

        ], charts: [
            chart("sync_outcomes", (w) => `Sync outcomes ${w.per}`, "bar", "count", "date", {

                    { name: "Finished", previous: false, points: points(w, flow((t, e) => opensOn(t, e) * 1.6, env)) },

            chart("builds_in_use", "Builds in use, last 7 days", "bar", "count", "label", {
                definition: () => "People who opened the app in the last 7 days, by the build they used last.",
                example: (r) => (r.top ? `${r.top.x} is the most used: ${r.count(r.top.y, "person", "people")}.` : null),
                rows: (env) => labelRows([["1.2.0 (230)", 402], ["1.1.3 (226)", 151], ["1.1.2 (219)", 63], ["Older", 28]], env),
            }),
        ] },
    ];
    const SECTION_TITLES = Object.fromEntries(SECTIONS.map((s) => [s.id, s.id[0].toUpperCase() + s.id.slice(1)]));
    // Signup cohorts, newest first: W0 is 100%, then each later week keeps fewer people.
    function cohorts(prefix, count, letter, spanDays, env) {
        const today = startOfToday();
        return Array.from({ length: count }, (_, i) => {
            const start = spanDays === 7 ? addDays(today, -((today.getDay() + 6) % 7) - 7 * i) : new Date(today.getFullYear(), today.getMonth() - i, 1);
            const name = spanDays === 7 ? `${prefix} ${dayMonth(start)}` : `${MONTHS_LONG[start.getMonth()]} ${start.getFullYear()}`;
            const steps = i + 1;
            const pts = Array.from({ length: steps }, (_, k) => ({ x: `${letter}${k}`, y: k === 0 ? 100 : Math.round((100 * Math.pow(0.72 + 0.1 * noise(`ch${env}${i}`, k), k)) * 10) / 10 }));
            return { name, previous: false, points: pts };
        });
    }

    function buildCard(spec, env) {
        const [value, previous] = spec.values(env);
        const r = { value, format: (v, unit = spec.unit) => readable(v, unit), count: counted, against: (when) => (previous == null ? "" : `, against ${readable(previous, spec.unit)} ${when}`) };
        return { id: spec.id, title: spec.title, unit: spec.unit, value, previous, higherIsBetter: spec.better, definition: spec.definition, example: value == null ? null : spec.example(r) || null, note: `${spec.note} Took ${took(spec.id)} s.` };
    }
    const took = (id) => String(Math.floor(1 + noise("took", id.length * 7 + id.charCodeAt(0)) * 14) / 10);
    function buildChart(spec, env, w) {
        const series = spec.gen ? spec.gen(w, env) : spec.series ? spec.series(env) : spec.rows ? [{ name: typeof spec.title === "function" ? spec.title(w) : spec.title, previous: false, points: spec.rows(env) }] : [];
        const cells = spec.cells ? spec.cells(env) : [];
        if (spec.unit === "count" || spec.unit === "steps") for (const s of series) for (const pt of s.points) pt.y = Math.round(pt.y);
        const title = typeof spec.title === "function" ? spec.title(w) : spec.title;
        const built = { id: spec.id, title, kind: spec.kind, unit: spec.unit, xKind: spec.x, series, cells, definition: spec.definition(w) };
        const note = spec.note ? spec.note(w) : null;
        built.note = note ? `${note} Took ${took(spec.id)} s.` : `Took ${took(spec.id)} s.`;
        built.example = spec.example ? spec.example(exampleReader(built, w)) : null;
        return built;
    }
    // What a chart's example sentence reads, like the server's exampleReader.
    function exampleReader(c, w) {
        const named = (name) => (name ? c.series.find((s) => s.name === name) : c.series[0]);
        const n = w.buckets.length;
        const dayLabel = (x) => { const d = new Date(`${x}T00:00:00`); return `${WEEKDAYS[d.getDay()]} ${d.getDate()} ${MONTHS[d.getMonth()]}`; };
        const period = (x) => { const d = new Date(`${x}T00:00:00`); return w.bucket === "day" ? dayLabel(x) : w.bucket === "week" ? `the week of ${dayMonth(d)}` : `${MONTHS_LONG[d.getMonth()]} ${d.getFullYear()}`; };
        const target = n > 1 ? ymd(w.buckets[n - 2].start) : n ? ymd(w.buckets[n - 1].start) : null;
        const when = n > 1 ? (w.bucket === "day" ? `on ${period(target)}` : `in ${period(target)}`) : "today so far";
        const rows = c.series[0]?.points || [];
        const total = rows.reduce((s, p) => s + p.y, 0);
        const top = rows.length ? rows.reduce((a, b) => (b.y > a.y ? b : a)) : undefined;
        const peak = c.cells.length ? c.cells.reduce((a, b) => (b.value > a.value ? b : a)) : undefined;
        return {
            when, series: c.series, rows, total, top, peak, period, day: dayLabel,
            at: (name) => named(name)?.points.find((p) => p.x === target)?.y,
            latest: (name) => { const p = named(name)?.points; return p?.length ? p[p.length - 1].y : undefined; },
            first: (name) => named(name)?.points[0],
            row: (label) => rows.find((p) => p.x === label)?.y,
            format: (v, unit = c.unit) => readable(v, unit),
            count: counted,
        };
    }
    function dashboard(env, sectionID, days, bucket) {
        const w = windowFor(days, bucket);
        const section = SECTIONS.find((s) => s.id === sectionID) || SECTIONS[0];
        return { w, cards: section.cards.map((c) => buildCard(c, env)), charts: section.charts.map((c) => buildChart(c, env, w)) };
    }
    // Card or chart by id, for its detail page.
    function findMetric(id, env, days, bucket) {
        const w = windowFor(days, bucket);
        for (const s of SECTIONS) {
            const c = s.cards.find((x) => x.id === id);
            if (c) return { card: buildCard(c, env) };
            const ch = s.charts.find((x) => x.id === id);
            if (ch) return { chart: buildChart(ch, env, w), w };
        }
        return null;
    }

    // ═══ CHARTS: AdminChart drawn as SVG ═══
    const SERIES_COLORS = ["var(--mossFill)", "var(--gold)", "var(--emberFill)"];
    const DASHES = ["", "6 3", "1 3"];
    const seriesStyle = (c) => c.series.map((s, i) => ({
        color: s.previous ? "var(--textSecondary)" : c.series.length <= 3 ? SERIES_COLORS[i] : `color-mix(in srgb, var(--mossText) ${Math.round((1 - (0.55 * i) / (c.series.length - 1)) * 100)}%, transparent)`,
        dash: s.previous ? "4 3" : c.series.length <= 3 ? DASHES[i] : "",
    }));
    function niceTicks(lo, hi) {
        if (hi <= lo) hi = lo + 1;
        const raw = (hi - lo) / 4;
        const mag = Math.pow(10, Math.floor(Math.log10(raw)));
        const step = [1, 2, 2.5, 5, 10].map((m) => m * mag).find((s) => s >= raw);
        const ticks = [];
        for (let v = Math.floor(lo / step) * step; v <= hi + step * 0.001; v += step) ticks.push(Math.round(v * 1e6) / 1e6);
        if (ticks[ticks.length - 1] < hi) ticks.push(ticks[ticks.length - 1] + step);
        return ticks;
    }
    const W = 328;
    function legend(c, styles) {
        if (c.series.length <= 1 || c.kind === "heatmap") return "";
        return `<div class="ad-legend t-micro c-2">${c.series.map((s, i) => `<span class="hstack" style="gap:6px">${c.kind === "line" ? `<svg width="16" height="2" viewBox="0 0 16 2"><path d="M1 1H15" stroke="${styles[i].color}" stroke-width="2" stroke-linecap="round" ${styles[i].dash ? `stroke-dasharray="${styles[i].dash}"` : ""}/></svg>` : `<span class="ad-swatch" style="background:${styles[i].color}"></span>`}${esc(s.name)}</span>`).join("")}</div>`;
    }
    // A chart over time: the readout, then lines or columns, with the latest bucket marked as still filling.
    function dateChart(c, w, o) {
        const styles = seriesStyle(c);
        const days = [...new Set(c.series.flatMap((s) => s.points.map((p) => p.x)))].sort();
        const n = days.length;
        const latest = days[n - 1];
        const lastBucket = w.buckets[w.buckets.length - 1];
        const open = latest && new Date(`${latest}T00:00:00`) >= lastBucket.start ? latest : null;
        const focus = o.focus != null && days[o.focus] ? days[o.focus] : null;
        const shown = focus || latest;
        const d = new Date(`${shown}T00:00:00`);
        const dateText = w.bucket === "week" ? `Week of ${dayMonth(d)}` : w.bucket === "month" ? `${MONTHS[d.getMonth()]} ${d.getFullYear()}` : ymd(d) === ymd(startOfToday()) ? "Today" : `${WEEKDAYS[d.getDay()]} ${dayMonth(d)}`;
        const numbers = c.series.map((s) => { const p = s.points.find((x) => x.x === shown); return p ? (c.series.length > 1 ? `${s.name} ${adminValue(p.y, c.unit, true)}` : adminValue(p.y, c.unit, true)) : null; }).filter(Boolean).join(" · ");
        const readout = `<div class="ad-readout"><span class="c-2">${esc(dateText)}${shown === open ? " so far" : ""}   </span><span class="c-text">${esc(numbers)}</span></div>`;
        // Values per bucket; bars stack positives up and negatives down.
        const at = (s, x) => s.points.find((p) => p.x === x)?.y;
        let hi = 0, lo = 0;
        for (const x of days) {
            if (c.kind === "line") for (const s of c.series) { const v = at(s, x) ?? 0; hi = Math.max(hi, v); lo = Math.min(lo, v); }
            else { let up = 0, down = 0; for (const s of c.series) { const v = at(s, x) ?? 0; if (v >= 0) up += v; else down += v; } hi = Math.max(hi, up); lo = Math.min(lo, down); }
        }
        const ticks = niceTicks(lo, hi);
        const top = ticks[ticks.length - 1], bottom = ticks[0];
        const labels = ticks.map((v) => adminValue(v, c.unit, Math.abs(v) < 10));
        const yW = Math.max(...labels.map((l) => l.length)) * 6 + 8;
        const H = o.height, plotW = W - yW, plotH = H - 18;
        const band = plotW / Math.max(1, n);
        const xc = (i) => (i + 0.5) * band;
        const yv = (v) => plotH - ((v - bottom) / (top - bottom || 1)) * plotH;
        let svg = "";
        ticks.forEach((v, i) => { svg += `<line x1="0" x2="${plotW}" y1="${yv(v)}" y2="${yv(v)}" class="grid"/><text x="${plotW + 6}" y="${yv(v) + 3.5}">${esc(labels[i])}</text>`; });
        const xStep = Math.max(1, Math.ceil(n / 4));
        for (let i = 0; i < n; i += xStep) {
            const x = i * band;
            svg += `<line x1="${x}" x2="${x}" y1="0" y2="${plotH}" class="grid"/>`;
            if (x + 34 <= plotW + 4) svg += `<text x="${x + 2}" y="${plotH + 13}">${esc(dayMonth(new Date(`${days[i]}T00:00:00`)))}</text>`;
        }
        if (c.kind === "line") {
            const few = c.series.every((s) => s.points.length <= 14);
            c.series.forEach((s, si) => {
                const pts = s.points.map((p) => [xc(days.indexOf(p.x)), yv(p.y)]);
                svg += `<path d="${pts.map(([x, y], i) => `${i ? "L" : "M"}${x.toFixed(1)} ${y.toFixed(1)}`).join("")}" fill="none" stroke="${styles[si].color}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" ${styles[si].dash ? `stroke-dasharray="${styles[si].dash}"` : ""}/>`;
                if (few) pts.forEach(([x, y]) => { svg += `<circle cx="${x}" cy="${y}" r="3" fill="${styles[si].color}"/>`; });
                const last = s.points.find((p) => p.x === open);
                if (last) svg += `<circle cx="${xc(days.indexOf(open))}" cy="${yv(last.y)}" r="3.5" fill="var(--card)" stroke="${styles[si].color}" stroke-width="2"/>`;
            });
        } else {
            const barW = Math.max(1.5, band * 0.72);
            days.forEach((x, i) => {
                let up = 0, down = 0;
                c.series.forEach((s, si) => {
                    const v = at(s, x) ?? 0;
                    if (!v) return;
                    const from = v >= 0 ? up : down;
                    const to = from + v;
                    if (v >= 0) up = to; else down = to;
                    svg += `<rect x="${(xc(i) - barW / 2).toFixed(2)}" y="${Math.min(yv(from), yv(to)).toFixed(2)}" width="${barW.toFixed(2)}" height="${Math.abs(yv(to) - yv(from)).toFixed(2)}" fill="${styles[si].color}" ${x === open ? 'opacity="0.45"' : ""}/>`;
                });
            });
        }
        if (focus) { const x = xc(days.indexOf(focus)); svg += `<line x1="${x}" x2="${x}" y1="0" y2="${plotH}" stroke="color-mix(in srgb, var(--textSecondary) 40%, transparent)" stroke-width="1"/>`; }
        return `${readout}<svg class="ad-svg" viewBox="0 0 ${W} ${H}" width="100%" height="${H}" data-ad-plot="${plotW}" data-ad-n="${n}" preserveAspectRatio="none">${svg}</svg>${legend(c, styles)}`;
    }
    // A line over labels (retention curves): label axis at the bottom, value gridlines.
    function labelLine(c, o) {
        const styles = seriesStyle(c);
        const xs = [...new Set(c.series.flatMap((s) => s.points.map((p) => p.x)))];
        const hi = Math.max(0, ...c.series.flatMap((s) => s.points.map((p) => p.y)));
        const ticks = niceTicks(0, hi);
        const top = ticks[ticks.length - 1];
        const labels = ticks.map((v) => adminValue(v, c.unit));
        const yW = Math.max(...labels.map((l) => l.length)) * 6 + 8;
        const H = o.height, plotW = W - yW, plotH = H - 18;
        const band = plotW / xs.length;
        const xc = (i) => (i + 0.5) * band;
        const yv = (v) => plotH - (v / top) * plotH;
        let svg = "";
        ticks.forEach((v, i) => { svg += `<line x1="0" x2="${plotW}" y1="${yv(v)}" y2="${yv(v)}" class="grid"/><text x="${plotW + 6}" y="${yv(v) + 3.5}">${esc(labels[i])}</text>`; });
        xs.forEach((x, i) => { svg += `<text x="${xc(i)}" y="${plotH + 13}" text-anchor="middle">${esc(x)}</text>`; });
        c.series.forEach((s, si) => {
            svg += `<path d="${s.points.map((p, i) => `${i ? "L" : "M"}${xc(xs.indexOf(p.x)).toFixed(1)} ${yv(p.y).toFixed(1)}`).join("")}" fill="none" stroke="${styles[si].color}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" ${styles[si].dash ? `stroke-dasharray="${styles[si].dash}"` : ""}/>`;
        });
        return `<svg class="ad-svg" viewBox="0 0 ${W} ${H}" width="100%" height="${H}" preserveAspectRatio="none">${svg}</svg>${legend(c, styles)}`;
    }
    // Horizontal bars so long labels read in full, with each value at the bar's end.
    function rowBars(c) {
        const styles = seriesStyle(c);
        const labels = [...new Set(c.series.flatMap((s) => s.points.map((p) => p.x)))];
        const values = c.series.flatMap((s) => s.points.map((p) => p.y));
        const lo = Math.min(0, ...values), hi = Math.max(Math.max(...values) * 1.25, 1);
        const labelW = Math.min(150, Math.max(...labels.map((l) => [...l].length)) * 5.6 + 8);
        const H = labels.length * 26, plotW = W - labelW;
        const xv = (v) => labelW + ((v - lo) / (hi - lo)) * plotW;
        const bar = Math.min(16, 18 / c.series.length);
        let svg = "";
        labels.forEach((label, li) => {
            const mid = li * 26 + 13;
            svg += `<text x="0" y="${mid + 3.5}">${esc(label)}</text>`;
            c.series.forEach((s, si) => {
                const v = s.points.find((p) => p.x === label)?.y;
                if (v == null) return;
                const y = mid - (bar * c.series.length) / 2 + si * bar;
                svg += `<rect x="${Math.min(xv(0), xv(v))}" y="${y}" width="${Math.abs(xv(v) - xv(0))}" height="${bar - 1}" fill="${styles[si].color}"/><text x="${Math.max(xv(0), xv(v)) + 4}" y="${y + bar / 2 + 3}">${esc(adminValue(v, c.unit))}</text>`;
            });
        });
        return `<svg class="ad-svg" viewBox="0 0 ${W} ${H}" width="100%" height="${H}" preserveAspectRatio="none">${svg}</svg>${legend(c, styles)}`;
    }
    // One moss shade per cell, darker for more. About six column labels, so hours don't overlap.
    function heatmap(c) {
        const peak = Math.max(0, ...c.cells.map((x) => x.value));
        const xs = [...new Set(c.cells.map((x) => x.x))], ys = [...new Set(c.cells.map((x) => x.y))];
        const labelW = 30, H = ys.length * 24 + 24, plotW = W - labelW, cw = plotW / xs.length;
        const step = Math.max(1, Math.ceil(xs.length / 6));
        let svg = "";
        ys.forEach((y, yi) => { svg += `<text x="0" y="${yi * 24 + 15.5}">${esc(y)}</text>`; });
        c.cells.forEach((cell) => {
            const shade = peak > 0 ? 0.08 + 0.92 * Math.max(cell.value / peak, 0) : 0.08;
            svg += `<rect x="${(labelW + xs.indexOf(cell.x) * cw).toFixed(2)}" y="${ys.indexOf(cell.y) * 24}" width="${cw.toFixed(2)}" height="24" fill="color-mix(in srgb, var(--mossText) ${Math.round(shade * 100)}%, transparent)"/>`;
        });
        xs.forEach((x, i) => { if (i % step === 0) svg += `<text x="${(labelW + i * cw + cw / 2).toFixed(1)}" y="${ys.length * 24 + 15}" text-anchor="middle">${esc(x)}</text>`; });
        return `<svg class="ad-svg" viewBox="0 0 ${W} ${H}" width="100%" height="${H}" preserveAspectRatio="none">${svg}</svg>`;
    }
    function adminChart(c, w, o = {}) {
        const height = o.height || 160;
        const hasData = c.kind === "heatmap" ? c.cells.some((x) => x.value !== 0) : c.series.some((s) => s.points.some((p) => p.y !== 0));
        let body;
        if (!hasData) body = '<p class="t-body c-2">No data yet</p>';
        else if (c.kind === "heatmap") body = heatmap(c);
        else if (c.xKind === "date") body = dateChart(c, w, { height, focus: o.focus });
        else if (c.kind === "line") body = labelLine(c, { height });
        else body = rowBars(c);
        return `<div class="ad-chart">${body}</div>`;
    }

    // ═══ ADMIN DASHBOARD: the Admin tab of Profile > Dashboard ═══
    const TIMEFRAMES = [["week", "7D", 7], ["month", "30D", 30], ["quarter", "90D", 90], ["year", "1Y", 365], ["all", "All", 3650]];
    const GRANULARITIES = [["auto", "Auto"], ["day", "Day"], ["week", "Week"], ["month", "Month"]];
    // The detail pages read the dashboard's current choices.
    const last = { server: "production", days: 30, bucket: "auto" };
    let loadSeq = 0;
    function dashState(ui, o = {}) {
        if (ui.adServer) return;
        ui.adServer = o.server || "production";
        ui.adSection = "overview";
        ui.adTimeframe = "month";
