// ═══ 30-fight-detail.js ═══
{
    // ═══ FIGHT DETAIL: FightDetailView.swift, FightDayCharts.swift, SeriesStats.swift, CompanionFightSummary ═══
    // Screens: fight (push), fightRound (drawer), fightStop / fightOwnerLeave / fightLeaveFriend (dialogs).
    // Exports FIGHT_DETAIL.joinPreview (JoinFightPreview) and FIGHT_DETAIL.leaderboardRow (FFLeaderboardRow).

    // ─── Data ───────────────────────────────────────────────────────
    DATA_HOOKS.push((d) => {
        for (const f of d.fights) {
            // CompanionPreview copies a template fight owned by you; only Step it Up and the invitation name an owner.
            if (!f.inviter) f.inviter = d.you;
            // History rounds copy the live round's days: give each day its own civil date, like the Swift fixture.
            (f.days || []).forEach((day, i) => { day.day = iso(new Date(f.windowStart).getTime() + i * DAY).slice(0, 10); });
        }
    });

    // ─── Formatting (Fight in AppModel.swift, RemainingTime.swift) ───
    const MONTHS = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
    const WEEKDAYS = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
    const ms = (date) => new Date(date).getTime();
    const two = (n) => String(n).padStart(2, "0");
    const plural = (n, one, other) => `${n} ${n === 1 ? one : other}`;
    // Fight.deadlineStamp: abbreviated date, short time (the Simulator shows 24-hour time).
    const stamp = (date) => { const d = new Date(date); return `${MONTHS[d.getMonth()]} ${d.getDate()}, ${d.getFullYear()} at ${two(d.getHours())}:${two(d.getMinutes())}`; };
    const dayMonth = (date) => { const d = new Date(date); return `${MONTHS[d.getMonth()]} ${d.getDate()}`; };
    const dateSpan = (start, end) => {
        const a = new Date(start), b = new Date(end);
        if (a.toDateString() === b.toDateString()) return `${WEEKDAYS[a.getDay()]}, ${dayMonth(a)}`;
        return `${dayMonth(a)} - ${dayMonth(b)}`;
    };
    const full = (value) => Math.round(value).toLocaleString("en-US");
    // AppModel.formatScore: compact name, one decimal from 1,000.
    const score = (value) => new Intl.NumberFormat("en-US", { notation: "compact", maximumFractionDigits: value >= 1000 ? 1 : 0 }).format(value);
    const compact1 = (value) => new Intl.NumberFormat("en-US", { notation: "compact", maximumFractionDigits: 1 }).format(value);
    function remaining(end, now = Date.now()) {
        const target = ms(end);
        if (target <= now) return "";
        let months = 0;
        for (;;) { const next = new Date(now); next.setMonth(next.getMonth() + months + 1); if (next.getTime() <= target) months++; else break; }
        const from = new Date(now); from.setMonth(from.getMonth() + months);
        const rest = target - from.getTime();
        const days = Math.floor(rest / DAY), hours = Math.floor((rest % DAY) / HOUR), minutes = Math.floor((rest % HOUR) / 60e3);
        let parts;
        if (months > 0) parts = [plural(months, "month", "months")];
        else if (days >= 7) parts = [plural(Math.floor(days / 7), "week", "weeks")];
        else if (days >= 2) parts = [plural(days, "day", "days")];
        else if (days >= 1) parts = [plural(days, "day", "days"), hours ? plural(hours, "hour", "hours") : null];
        else if (hours >= 2) parts = [plural(hours, "hour", "hours")];
        else if (hours === 1) parts = [plural(1, "hour", "hours"), minutes ? plural(minutes, "minute", "minutes") : null];
        else parts = [plural(Math.max(1, minutes), "minute", "minutes")];
        return parts.filter(Boolean).join(" and ");
    }
    function lastSync(date, now = Date.now()) {
        if (!date) return "Not synced yet";
        const elapsed = Math.max(0, (now - ms(date)) / 1000);
        if (elapsed < 60) return "Just now";
        if (elapsed < 3600) return `${plural(Math.floor(elapsed / 60), "minute", "minutes")} ago`;
        if (elapsed < 86400) return `${plural(Math.floor(elapsed / 3600), "hour", "hours")} ago`;
        return `${plural(Math.floor(elapsed / 86400), "day", "days")} ago`;
    }

    // ─── Fight model helpers ────────────────────────────────────────
    const isYou = (id) => id === D().you;
    const who = (id) => person(id) || { id, name: id, handle: id, initials: String(id || "?").slice(0, 2).toUpperCase() };
    const nameOf = (id) => (isYou(id) ? "You" : who(id).name);
    const racing = (f) => f.standings.filter((s) => !s.invited && !s.deferred);
    const youRow = (f) => f.standings.find((s) => isYou(s.person));
    // Fight.rank: your place among the racers.
    const fightRank = (f) => {
        const mine = youRow(f);
        if (!mine) return 0;
        return mine.invited || mine.deferred ? mine.rank ?? 0 : 1 + racing(f).filter((s) => s.score > mine.score).length;
    };
    const tiedForFirst = (f) => racing(f).filter((s) => s.rank === 1).length > 1;
    const isUpcoming = (f) => f.serverState === "scheduled" && ms(f.windowStart) > Date.now();
    const passed = (f) => f.status === "finished" || f.status === "pending" || ms(f.windowEnd) <= Date.now();
    const deadlineLabel = (f) => `${passed(f) ? "Ended" : "Ends"} ${stamp(f.windowEnd)}`;
    const timeLeftLabel = (f) => (isUpcoming(f) ? `Starts ${stamp(f.windowStart)}` : passed(f) ? deadlineLabel(f) : `${remaining(f.windowEnd)} left`);
    const durationLabel = (f) => {
        const hours = Math.max(1, Math.round((ms(f.windowEnd) - ms(f.windowStart)) / HOUR));
        return hours <= 6 ? plural(hours, "hour", "hours") : plural(f.lengthDays, "day", "days");
    };
    const hasAction = (f) => !!(f.actionText || "").trim();
    function listTitle(f) {
        if (f.friends) { const friend = f.standings.find((s) => !isYou(s.person)); if (friend) return who(friend.person).name; }
        const stored = (f.name || "").trim(), action = (f.actionText || "").trim();
        if (!stored || stored === "Steps Fight") return action || stored || "Steps Fight";
        return stored;
    }
    const canOwnerEdit = (f) => isYou(f.inviter) && (f.status === "live" || isUpcoming(f));
    const otherMembers = (f) => f.standings.filter((s) => !isYou(s.person) && !s.invited);
    const seriesHistory = (f) => (f.seriesId ? D().fights.filter((x) => x.seriesId === f.seriesId && x.id !== f.id).sort((a, b) => ms(b.windowStart) - ms(a.windowStart)) : []);
    const showsHistory = (f) => !!(f.recurring && f.seriesId && seriesHistory(f).length);
    // AppModel.trophies: final rounds won outright up to and including this one.
    function trophies(f) {
        const out = {};
        for (const round of [f, ...seriesHistory(f).filter((x) => ms(x.windowStart) < ms(f.windowStart))]) {
            if (round.serverState !== "final") continue;
            const leaders = racing(round).filter((s) => s.rank === 1);
            if (leaders.length === 1) out[leaders[0].person] = (out[leaders[0].person] || 0) + 1;
        }
        return out;
    }
    function lastRound(f) {
        if (!f.recurring || f.status !== "live") return null;
        const previous = seriesHistory(f).find((x) => ms(x.windowStart) < ms(f.windowStart));
        if (!previous || Math.abs(ms(previous.windowEnd) - ms(f.windowStart)) >= 1000 || previous.serverState !== "final") return null;
        const mine = youRow(previous);
        return mine && !mine.invited && !mine.deferred ? previous : null;
    }
    function fightResult(f) {
        if (f.standings.some((s) => isYou(s.person) && s.deferred)) return "D";
        if (f.status === "pending") return "P";
        if (f.serverState && f.serverState !== "final" && f.serverState !== "cancelled") return "P";
        if (tiedForFirst(f)) return "D";
        return fightRank(f) === 1 ? "W" : "L";
    }
    function freshness(row, f, now = Date.now()) {
        if (ms(f.windowEnd) > now) return lastSync(row.lastSyncedAt, now);
        if (row.finalStepsComplete === true) return row.lastSyncedAt ? `Final steps synced · ${lastSync(row.lastSyncedAt, now)}` : "Final steps synced";
        if (f.serverState === "final" && !row.invited && !row.deferred) return row.rank === 1 && !tiedForFirst(f) ? "Last sync counted" : "Didn’t sync in time";
        const finalized = f.serverState === "final" || f.serverState === "cancelled";
        if (row.lastSyncedAt) return `${finalized ? "Finalized from last available steps" : "Waiting for final steps"} · ${lastSync(row.lastSyncedAt, now)}`;
        return finalized ? "Finalized without synced steps" : "Waiting for first sync";
    }
    function winnerStandings(rows, f) {
        if (!rows.length) return [];
        if (f.status === "finished" || f.status === "pending") {
            const leaders = rows.filter((s) => s.rank === 1);
            if (leaders.length) return leaders;
        }
        const top = Math.max(...rows.map((s) => s.score));
        return rows.filter((s) => s.score === top);
    }
    // AppModel.localizeFight, pending branch: the settlement hero's title.
    function settlementKicker(f) {
        const mine = youRow(f);
        if (mine?.deferred) return "Started next round";
        if (mine && mine.finalStepsComplete === true) {
            const joined = racing(f);
            if (joined.some((s) => s.score > mine.score)) return "Tentative loss";
            return joined.some((s) => s.person !== mine.person && s.score === mine.score) ? "Tied" : "Tentative lead";
        }
        return "Pending. Open the app";
    }
    function rerank(f) {
        const rows = racing(f);
        for (const s of f.standings) s.rank = 1 + rows.filter((x) => x.score > s.score).length;
        f.standings.sort((a, b) => b.score - a.score);
    }

    // ─── Shared drawing ─────────────────────────────────────────────
    // CompanionAvatar: full-body companion art in a square, initials when the person has none.
    function avatar(id, size, o = {}) {
        const p = who(id);
        if (p.companion) return companionImg(p, { w: size, h: size, style: `flex:none;${o.pending ? "opacity:0.55;" : ""}${o.style || ""}` });
        return FF.avatar(p.initials, { size, dimmed: o.pending });
    }
    const profileSpec = (id) => `fdProfile:${id}`;
    // FFLeaderboardRow. o: { rank, person, value, isYou, trophies, caption, captionUrgent, radius, on, avatar }
    function leaderboardRow(o) {
        const trophyCount = o.trophies || 0;
        const inner = `<span class="rank ${o.rank === 1 ? "first" : ""}">${o.rank}</span>${o.avatar ?? avatar(o.person, 38)}<span class="grow vstack" style="gap:2px"><span class="hstack" style="gap:6px;min-width:0"><span class="t-rowTitle ellipsis">${esc(o.name ?? who(o.person).name)}</span>${trophyCount > 0 ? `<span class="fdv-trophy" aria-label="Won ${trophyCount} round${trophyCount === 1 ? "" : "s"}">${icon("fd.trophy.fill")}${trophyCount > 1 ? `<span>×${trophyCount}</span>` : ""}</span>` : ""}</span>${o.caption ? `<span class="t-micro ellipsis ${o.captionUrgent ? "c-ember" : "c-2"}">${esc(o.caption)}</span>` : ""}</span><span class="dash">-</span><span class="val">${esc(o.value)}</span>`;
        const style = o.radius != null ? ` style="border-radius:${o.radius}px"` : "";
        return o.on
            ? `<button type="button" class="fdv-lrow ${o.isYou ? "you" : ""}"${style} data-on="${esc(o.on)}">${inner}</button>`
            : `<div class="fdv-lrow ${o.isYou ? "you" : ""}"${style}>${inner}</div>`;
    }
    const showAllButton = (expanded, count, spec) => `<button type="button" class="fdv-showall" data-on="${esc(spec)}">${expanded ? "Show less" : `Show all ${count}`}</button>`;

    // ─── JoinFightPreview ───────────────────────────────────────────
    const PREVIEWED = {};
    // joinPreview(fight, ui, [key], o). o: { joinNow, joinNext, dismiss } action specs (default: join or decline here),
    // `joining` and `error` (default: this screen's ui.fdJoining and ui.fdError).
    function joinPreview(f, ui = {}, key = "", o = {}) {
        if (key && typeof key === "object") o = key;
        PREVIEWED[f.id] = f;
        const joining = !!(o.joining ?? ui.fdJoining);
        const error = o.error ?? ui.fdError;
        const joinable = f.pendingJoin || f.suggested;
        const now = o.joinNow || o.onJoinNow || `fdJoin:${f.id}|now`;
        const next = o.joinNext || o.onJoinNext || `fdJoin:${f.id}|next`;
        const dismiss = o.dismiss || o.onDismiss || `fdDecline:${f.id}`;
        const rules = [
            `<p class="t-label">${esc(durationLabel(f))} · Most steps wins</p>`,
            `<p class="t-caption c-2">${esc(joinable ? `${stamp(f.windowStart)} → ${stamp(f.windowEnd)}` : deadlineLabel(f))}</p>`,
            f.recurring && joinable ? `<p class="t-caption c-2">Repeats until you leave. Each round has its own result.</p>` : "",
            hasAction(f) && f.actionText !== listTitle(f) ? `<p class="t-body">${esc(f.actionText)}</p>` : "",
        ].join("");
        const buttons = f.offersJoinNext
            ? `<div class="vstack" style="gap:10px"><p class="t-caption c-2">This round started ${esc(stamp(f.windowStart))}. Join now and your steps count from that date.</p>${FF.cta(joining ? "Joining…" : "Join this round", { busy: joining, on: now })}</div><div class="vstack" style="gap:10px"><p class="t-caption c-2">Or start next round, from ${esc(stamp(f.windowEnd))}.</p>${FF.button("Start next round", { kind: "secondary", full: true, enabled: !joining, on: next })}</div>`
            : FF.cta(joining ? "Joining…" : f.pendingJoin ? "Join fight" : "Accept challenge", { busy: joining, on: now });
        return FF.card(`<div class="fdv-join"><div class="head"><h2 class="t-title">${esc(listTitle(f))}</h2>${f.invitePitch ? `<p class="t-body c-2">${esc(f.invitePitch)}</p>` : ""}</div><div class="vstack" style="gap:8px">${rules}</div><div class="fdv-rule"></div>${joinable ? `<p class="t-caption c-2">Participants see your identity, Fight Steps, standings, and posts you share in this Fight. Joining does not enable profile or daily-history sharing.</p>` : ""}<div class="vstack" style="gap:16px">${buttons}</div>${FF.button(f.pendingJoin ? "Not now" : "Decline", { kind: "ghost", full: true, enabled: !joining, on: dismiss })}${error ? `<p class="t-caption c-ember">${esc(error)}</p>` : ""}</div>`, { padding: 20 });
    }

    // ─── Nav and the Manage Fight menu ──────────────────────────────
    function nav(f, pendingJoin) {
        const canEdit = !pendingJoin && (canOwnerEdit(f) || (f.friends && f.status === "live"));
        const manage = S.admin && !pendingJoin;
        return `<div class="fdv-nav"><button type="button" class="fdv-back ff-press" aria-label="Back" data-on="back">${icon("fd.chevron.left")}</button><div class="titles"><span class="title">${esc(listTitle(f))}</span>${!pendingJoin && hasAction(f) && f.actionText !== listTitle(f) ? `<span class="sub">${esc(f.actionText)}</span>` : ""}</div>${manage ? `<button type="button" class="fdv-manage" aria-label="Manage Fight" data-on="toggle:fdMenu">${icon("slider.horizontal.3")}</button>` : ""}${canEdit ? `<button type="button" class="fdv-edit" data-on="present:editFight?id=${esc(f.id)}">Edit</button>` : ""}</div>`;
    }
    function manageMenu(f, ui) {
        if (!ui.fdMenu || !S.admin) return "";
        const isPublic = f.visibility === "joinable";
        const item = (title, spec, o = {}) => `<button type="button" class="${o.destructive ? "destructive" : ""}"${o.disabled ? " disabled" : ""} data-on="set:fdMenu=false ; ${esc(spec)}"><span>${esc(title)}</span></button>`;
        return `<div class="fdv-menu-catch" data-on="set:fdMenu=false"></div><div class="sys-menu fdv-menu" role="menu">${[
            item(f.suggested ? "Remove suggestion" : "Suggest", `fdAdmin:${f.id}|suggest`, { disabled: !f.suggested && !isPublic }),
            // A Text inside a SwiftUI Menu is an inert, greyed item, not a footnote.
            isPublic ? "" : `<button type="button" class="text" disabled><span>Only public Fights can be suggested.</span></button>`,
            item(isPublic ? "Make private" : "Make public", `fdAdmin:${f.id}|visibility`),
            item(f.recurring ? "Turn recurrence off" : "Turn recurrence on", `fdAdmin:${f.id}|recurring`),
            item("Stop future rounds", `present:fightStop?id=${f.id}&action=pause_series`, { destructive: true }),
            item("Stop current and future rounds", `present:fightStop?id=${f.id}&action=stop_round`, { destructive: true, disabled: f.status === "finished" }),
        ].join("")}</div>`;
    }

    // ─── Stats pane ─────────────────────────────────────────────────
    // CompanionFightSummary in the Companion preview: the race scene for four racers, otherwise you and your rival.
    function summary(f) {
        const racers = racing(f);
        const mine = racers.find((s) => isYou(s.person));
        const rival = racers.find((s) => !isYou(s.person));
        const others = racers.filter((s) => !isYou(s.person)).map((s) => s.score);
        const gap = !isUpcoming(f) && mine && others.length ? mine.score - Math.max(...others) : null;
        let art;
        if (racers.length === 4) {
            art = `<div class="fdv-race"><img src="${ROOT}FitFight/PreviewAssets.xcassets/Companion-race.imageset/${S.theme === "day" ? "day" : "night"}.png" alt="Rabbit, Turtle, Fox and Badger running together"></div>`;
        } else {
            const today = D().todaySteps || 0;
            const stage = [15000, 10000, 6000, 3000, 0].findIndex((min) => today >= min);
            const yours = D().companion || you().companion;
            art = `<div class="fdv-chars">${mine ? `<img class="companion" src="${companionArt(yours, `effort-${5 - stage}`)}" alt="">` : ""}${rival && who(rival.person).companion ? `<img class="companion" src="${companionArt(who(rival.person).companion)}" alt="">` : ""}</div>`;
        }
        const rank = fightRank(f);
        const rankText = isUpcoming(f) ? "Scheduled" : tiedForFirst(f) && mine?.rank === 1 ? "Tied" : f.status === "finished" ? `Finished #${rank}` : `#${rank} of ${racers.length}`;
        const gapTone = gap == null ? "" : gap < 0 ? "c-ember" : gap > 0 ? "c-moss" : "c-2";
        return `<div class="fdv-sum">${art}<div class="rankrow"><span class="t-label grow ${!isUpcoming(f) && rank === 1 ? "c-moss" : "c-2"}">${esc(rankText)}</span><span class="t-caption c-2" style="text-align:right">${esc(timeLeftLabel(f))}</span></div><div class="steps"><div class="vstack grow" style="gap:3px"><span class="fdv-big">${mine ? full(mine.score) : "-"}</span><span class="t-caption c-2">Your steps · ${esc(durationLabel(f))}</span></div>${gap != null ? `<div class="vstack ${gapTone}" style="gap:3px;align-items:flex-end"><span class="fdv-gap">${gap === 0 ? "Tied" : `${gap > 0 ? "+" : "−"}${full(Math.abs(gap))}`}</span>${gap !== 0 ? `<span class="t-caption">${gap > 0 ? "steps ahead" : "steps behind"}</span>` : ""}</div>` : ""}</div>${FF.divider(0)}</div>`;
    }
    function deferredHero(f) {
        return FF.card(`<div class="vstack" style="gap:8px;align-items:flex-start">${FF.tag("Next round")}<h2 class="t-title">You start next round</h2><p class="t-caption c-2">Your steps count from ${esc(stamp(f.windowEnd))}. This round’s standings are still visible.</p></div>`, { padding: 24 });
    }
    function settlementHero(f) {
        const mine = youRow(f);
        let tone = "var(--emberText)";
        if (mine && mine.finalStepsComplete === true) {
            const rivals = racing(f).filter((s) => s.person !== mine.person);
            tone = rivals.some((s) => s.score > mine.score) ? "var(--emberText)" : rivals.some((s) => s.score === mine.score) ? "var(--text)" : "var(--mossText)";
        }
        const grace = f.graceEndsAt && ms(f.graceEndsAt) > Date.now() ? `<p class="t-caption" style="color:var(--goldInk)">${esc(remaining(f.graceEndsAt))} left to sync</p>` : "";
        return FF.card(`<div class="vstack" style="gap:10px;align-items:flex-start">${FF.result("P")}<h2 class="t-title" style="color:${tone}">${esc(settlementKicker(f))}</h2><p class="t-caption c-2">${esc(deadlineLabel(f))}</p>${grace}</div>`, { padding: 24 });
    }
    function standingRow(index, row, f, inBand = false) {
        const radius = inBand ? 18 : 22;
        if (row.invited || row.deferred) {
            return `<button type="button" class="fdv-lrow" data-on="${profileSpec(row.person)}"><span class="rank faint">-</span>${avatar(row.person, 38, { pending: true })}<span class="grow t-rowTitle c-2 ellipsis">${esc(who(row.person).name)}</span>${FF.pill(row.deferred ? "Next round" : "Invited", "gold")}</button>`;
        }
        if (f.status === "pending") {
            const needsSync = row.finalStepsComplete !== true;
            const rank = racing(f).filter((s) => s.score > row.score).length + 1;
            return `<button type="button" class="fdv-lrow ${isYou(row.person) ? "you" : ""}" style="border-radius:${radius}px" data-on="${profileSpec(row.person)}"><span class="rank ${needsSync ? "faint" : rank === 1 ? "first" : ""}">${needsSync ? "-" : rank}</span>${avatar(row.person, 38, { pending: needsSync })}<span class="grow vstack" style="gap:2px"><span class="t-rowTitle ellipsis ${needsSync ? "c-2" : ""}">${esc(who(row.person).name)}</span><span class="t-micro ellipsis ${needsSync && isYou(row.person) ? "c-ember" : "c-2"}">${esc(freshness(row, f))}</span></span>${FF.pill(needsSync ? "Pending" : "Synced", needsSync ? "gold" : "neutral")}<span class="val">${esc(score(row.score))}</span></button>`;
        }
        return leaderboardRow({
            rank: f.status === "finished" ? row.rank ?? index + 1 : index + 1,
            person: row.person,
            value: score(row.score),
            isYou: isYou(row.person),
            trophies: trophies(f)[row.person] || 0,
            caption: freshness(row, f),
            captionUrgent: !inBand && isYou(row.person) && f.status === "live",
            radius,
            on: profileSpec(row.person),
        });
    }
    // `expandable` is a History round: a plain ranking, the top three plus you until Show all.
    function standingsBands(f, ui, expandable = false) {
        const rows = racing(f);
        const winners = winnerStandings(rows, f);
        const losers = rows.filter((row) => !winners.includes(row));
        if (expandable) {
            const expanded = !!(ui.fdExpanded || {})[f.id];
            const shown = [...winners, ...losers].map((row, i) => [i, row]).filter(([i, row]) => expanded || i < 3 || isYou(row.person));
            return shown.map(([i, row]) => standingRow(i, row, f)).join("") + (expanded || rows.length > shown.length ? showAllButton(expanded, rows.length, `fdExpand:${f.id}`) : "");
        }
        const band = `<div class="fdv-band">${winners.map((row, i) => standingRow(i, row, f, true)).join("")}</div>`;
        if (!losers.length) return band;
        return `${band}<div class="fdv-sep"><span class="t-eyebrow c-3">${f.status === "live" ? "Chasing the lead" : "Everyone else"}</span><span class="line"></span></div>${losers.map((row, i) => standingRow(i + winners.length, row, f)).join("")}`;
    }
    function standingsSection(f, ui) {
        const waiting = f.standings.filter((s) => s.deferred).length;
        const meta = waiting ? `<p class="t-caption c-2">${racing(f).length} racing · ${waiting} start next</p>` : "";
        return FF.section("Standings", `${meta}${standingsBands(f, ui)}${f.standings.filter((s) => s.invited || s.deferred).map((row) => standingRow(0, row, f)).join("")}`);
    }
    function statsPane(f, ui) {
        const mine = youRow(f);
        const deferred = mine?.deferred === true;
        const hero = deferred ? deferredHero(f) : f.status === "pending" ? settlementHero(f) : summary(f);
        const charts = FF.section("Every day so far", FF.card(dayCharts(f, ui, f.status === "pending" && !deferred ? "pace" : null)));
        let leave = "";
        if (f.status === "live" || f.status === "pending") {
            const owner = isYou(f.inviter);
            const alone = !otherMembers(f).length;
            const spec = f.friends ? `present:fightLeaveFriend?id=${f.id}` : owner ? `present:fightOwnerLeave?id=${f.id}` : `fdLeave:${f.id}`;
            leave = `<div style="padding-top:20px">${FF.button(owner && alone && !f.friends ? "Delete fight" : "Leave fight", { kind: "ghost", full: true, on: spec })}</div>${ui.fdLeaveError ? `<p class="t-caption c-ember" style="padding-top:10px">${esc(ui.fdLeaveError)}</p>` : ""}`;
        }
        return hero + standingsSection(f, ui) + charts + leave;
    }

    // ─── FightDayChartsView ─────────────────────────────────────────
    const KINDS = [["oval", "Oval"], ["bars", "Bars"], ["line", "Line"], ["histogram", "Histogram"], ["pace", "Pace"]];
    const OTHER_COLORS = ["var(--gold)", "var(--emberFill)", "var(--mossEdge)", "var(--emberText)", "var(--textSecondary)"];
    // Card content width: 402 phone - 2 x 20 screen padding - 2 x 22 card padding.
    const CHART_W = 318;
    function chartModel(f) {
        const days = f.days || [];
        let labels = days.map((day) => day.label);
        let other = 0;
        const series = racing(f).map((s) => {
            const daily = days.map((day) => { const sc = day.scores.find((x) => x.person === s.person); return sc && sc.hasData !== false ? sc.value : null; });
            let running = null;
            const cumulative = daily.map((v) => { if (v != null) running = (running ?? 0) + v; return running; });
            const color = isYou(s.person) ? "var(--mossFill)" : OTHER_COLORS[Math.min(other++, 4)];
            return { person: s.person, color, daily, cumulative, total: s.score };
        });
        // A curve must belong to the same score revision. Missing history is a gap, not a wipe.
        for (const se of series) {
            if (se.daily.some((v) => v != null) && se.cumulative[se.cumulative.length - 1] !== se.total) { se.daily = se.daily.map(() => null); se.cumulative = se.cumulative.map(() => null); }
        }
        if (labels.length && series.every((se) => se.daily.every((v) => v == null))) { labels = []; series.forEach((se) => { se.daily = []; se.cumulative = []; }); }
        if (!labels.length && series.length) { labels = ["So far"]; series.forEach((se) => { se.daily = [se.total]; se.cumulative = [se.total]; }); }
        return { labels, series };
    }
    const peakDaily = (series) => Math.max(0, ...series.flatMap((se) => se.daily).filter((v) => v != null));
    const peakTotal = (series) => Math.max(0, ...series.map((se) => se.total));
    function dayCharts(f, ui, initialKind) {
        const kind = ui.fdKind || initialKind || D().fdChartKind || "oval";
        const model = chartModel(f);
        const toggled = new Set(ui.fdToggled || []);
        const defaults = new Set([...model.series.slice(0, 4).map((se) => se.person), ...model.series.filter((se) => isYou(se.person)).map((se) => se.person)]);
        const shown = new Set(model.series.map((se) => se.person).filter((id) => defaults.has(id) !== toggled.has(id)));
        const visible = kind === "oval" ? model.series : model.series.filter((se) => shown.has(se.person));
        const count = model.labels.length;
        const chips = `<div class="fdv-chips">${KINDS.map(([value, title]) => `<button type="button" class="fdv-chip" aria-pressed="${value === kind}" data-on="fdChart:${value}">${title}</button>`).join("")}</div>`;
        if (!model.series.length) return `<div class="fdv-charts">${chips}</div>`;
        const legend = (shownSet, day) => `<div class="fdv-legend ${day == null ? "" : "day"}">${model.series.map((se) => {
            const on = shownSet ? shownSet.has(se.person) : true;
            const value = day == null ? "" : `<b>${(kind === "pace" ? se.cumulative[day] : se.daily[day]) == null ? "-" : full(kind === "pace" ? se.cumulative[day] : se.daily[day])}</b>`;
            const chip = `<span class="dot" style="border-color:${se.color};background:${on ? se.color : "transparent"}"></span><span class="ellipsis">${esc(nameOf(se.person))}</span>${value}`;
            return shownSet ? `<button type="button" class="fdv-leg" style="opacity:${on ? 1 : 0.45}" aria-pressed="${on}" data-on="fdTogglePerson:${se.person}">${chip}</button>` : `<span class="fdv-leg">${chip}</span>`;
        }).join("")}</div>`;
        const parts = [chips];
        if (kind === "oval") parts.push(`<p class="t-micro c-2">Confirmed Fight totals</p>`);
        if (kind === "oval" || count > 0) parts.push({ oval: ovalChart, bars: barsChart, line: lineChart, pace: lineChart, histogram: histogramChart }[kind](model, visible, ui, kind));
        else parts.push(`<p class="t-caption c-2">Daily history isn't available yet. Confirmed totals are shown in Oval and standings.</p>`);
        if (["line", "histogram", "pace"].includes(kind) && count > 0) {
            const day = Math.min(ui.fdDay ?? count - 1, count - 1);
            parts.push(`<div class="vstack" style="gap:10px"><div class="hstack"><span class="t-label grow">${esc(model.labels[day])}</span><span class="t-micro c-2">${kind === "pace" ? "Cumulative steps" : "Daily steps"}</span></div>${legend(shown, day)}</div>`);
            parts.push(`<p class="t-micro c-faint">${kind === "histogram" ? "Tap a day to see its steps. Tap a name to show or hide it." : "Touch or slide to inspect a day. Tap a name to show or hide it."}</p>`);
            parts.push(`<p class="t-micro c-faint">Only synced steps are shown. Missing daily data is marked with a dash.</p>`);
        } else if (kind === "bars") {
            parts.push(legend(shown, null));
            parts.push(`<p class="t-micro c-faint">Tap a name to show or hide it.</p>`);
        } else {
            parts.push(legend(null, null));
        }
        return `<div class="fdv-charts">${parts.join("")}</div>`;
    }
    function pointOnCircuit(progress, rect, corner) {
        const radius = Math.min(corner, rect.w / 2, rect.h / 2);
        const left = rect.x + radius, right = rect.x + rect.w - radius, top = rect.y + radius, bottom = rect.y + rect.h - radius;
        const maxX = rect.x + rect.w, maxY = rect.y + rect.h, midX = rect.x + rect.w / 2;
        const horiz = Math.max(right - left, 0), vert = Math.max(bottom - top, 0), arc = (Math.PI / 2) * radius, half = horiz / 2;
        const segments = [
            [half, (t) => [midX + half * t, maxY]],
            [arc, (t) => { const a = (Math.PI / 2) * (1 - t); return [right + Math.cos(a) * radius, bottom + Math.sin(a) * radius]; }],
            [vert, (t) => [maxX, bottom - vert * t]],
            [arc, (t) => { const a = (-Math.PI / 2) * t; return [right + Math.cos(a) * radius, top + Math.sin(a) * radius]; }],
            [horiz, (t) => [right - horiz * t, rect.y]],
            [arc, (t) => { const a = -Math.PI / 2 - (Math.PI / 2) * t; return [left + Math.cos(a) * radius, top + Math.sin(a) * radius]; }],
            [vert, (t) => [rect.x, top + vert * t]],
            [arc, (t) => { const a = -Math.PI - (Math.PI / 2) * t; return [left + Math.cos(a) * radius, bottom + Math.sin(a) * radius]; }],
        ];
        const total = Math.max(segments.reduce((sum, [length]) => sum + length, 0) + half, 0.0001);
        let distance = Math.min(Math.max(progress, 0), 0.999) * total;
        for (const [length, point] of segments) {
            if (distance <= length) return point(length === 0 ? 0 : distance / length);
            distance -= length;
        }
        return [left + half * Math.min(Math.max(distance / Math.max(half, 0.0001), 0), 1), maxY];
    }
    function ovalChart(model) {
        const W = CHART_W, H = 220, rect = { x: 22, y: 22, w: W - 44, h: H - 44 }, corner = 28;
        const peak = peakTotal(model.series);
        const [sx, sy] = pointOnCircuit(0, rect, corner);
        const leader = model.series[0];
        const racers = [...model.series].sort((a, b) => a.total - b.total).map((se) => {
            const [x, y] = pointOnCircuit(peak === 0 ? 0.02 : 0.04 + 0.9 * (se.total / peak), rect, corner);
            return `<span class="fdv-oval-racer" style="left:${x - 15}px;top:${y - 15}px;--ring:${se.color}">${avatar(se.person, 30)}</span>`;
        }).join("");
        return `<div class="fdv-oval" style="height:${H}px"><svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" aria-hidden="true"><rect x="22" y="22" width="${rect.w}" height="${rect.h}" rx="${corner}" fill="none" stroke="var(--track)" stroke-width="14"/><rect x="22" y="22" width="${rect.w}" height="${rect.h}" rx="${corner}" fill="none" stroke="var(--line)" stroke-width="1"/><path d="M${sx} ${sy - 12}V${sy + 12}" stroke="var(--gold)" stroke-width="2" stroke-linecap="round"/></svg><div class="lead">${leader ? `<span class="t-label ellipsis">${esc(nameOf(leader.person))}</span><span class="score" style="color:${leader.color}">${esc(score(leader.total))}</span>` : ""}</div>${racers}</div>`;
    }
    function polyline(values, peak, w, h) {
        const y = (v) => (peak > 0 ? h - Math.min(Math.max(v / peak, 0), 1) * h : h);
        if (!values.length) return [];
        if (values.length === 1) return values[0] == null ? [null, null] : [[0, y(values[0])], [w, y(values[0])]];
        return values.map((v, i) => (v == null ? null : [(i / (values.length - 1)) * w, y(v)]));
    }
    function lineChart(model, series, ui, kind) {
        const cumulative = kind === "pace";
        const W = CHART_W - 42, H = 156, count = model.labels.length;
        const peak = cumulative ? peakTotal(series) : peakDaily(series);
        const day = Math.min(ui.fdDay ?? count - 1, count - 1);
        const xAt = (d) => (count === 1 ? W / 2 : (d / (count - 1)) * W);
        const yAt = (v) => (peak > 0 ? H - Math.min(Math.max(v / peak, 0), 1) * H : H);
        let svg = [0, 0.5, 1].map((fr) => `<path d="M0 ${H * fr}H${W}" stroke="var(--line)" stroke-width="1" stroke-dasharray="3 4"/>`).join("");
        if (ui.fdDay != null && ui.fdDay < count) svg += `<path d="M${xAt(ui.fdDay)} 0V${H}" stroke="var(--textTertiary)" stroke-width="1" stroke-dasharray="3 3"/>`;
        for (const se of series) {
            const values = cumulative ? se.cumulative : se.daily;
            const points = polyline(values, peak, W, H);
            if (isYou(se.person) && points.length && points.every(Boolean)) {
                svg += `<path d="M${points[0][0]} ${H}${points.map(([x, y]) => `L${x} ${y}`).join("")}L${points[points.length - 1][0]} ${H}Z" fill="${se.color}" fill-opacity="0.12"/>`;
            }
            let d = "", started = false;
            for (const point of points) {
                if (!point) { started = false; continue; }
                d += `${started ? "L" : "M"}${point[0]} ${point[1]}`;
                started = true;
            }
            svg += `<path d="${d}" fill="none" stroke="${se.color}" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>`;
            if (values[day] != null) svg += `<circle cx="${xAt(day)}" cy="${yAt(values[day])}" r="3.5" fill="${se.color}"/>`;
        }
        return `<div class="fdv-line"><div class="hstack" style="gap:8px;align-items:stretch"><div class="fdv-yaxis"><span>${compact1(peak)}</span><span>${compact1(peak / 2)}</span><span>0</span></div><div class="fdv-plot" data-count="${count}" aria-label="Steps chart"><svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" overflow="visible" aria-hidden="true">${svg}</svg></div></div>${axisLabels(model.labels, W)}</div>`;
    }
    function axisLabels(labels, W) {
        const count = labels.length;
        let ticks = [...Array(count).keys()];
        if (count > 7) { const set = new Set([0, Math.floor(count / 2), count - 1]); if (count >= 14) { set.add(Math.floor(count / 4)); set.add(Math.floor((count * 3) / 4)); } ticks = [...set].sort((a, b) => a - b); }
        const width = W / Math.max(ticks.length, 1);
        return `<div class="fdv-axis">${ticks.map((i) => {
            const first = i === 0, last = i === count - 1;
            const x = count === 1 ? W / 2 : first ? width / 2 : last ? W - width / 2 : (W * i) / (count - 1);
            return `<span style="left:${x - width / 2}px;width:${width}px;text-align:${count === 1 ? "center" : first ? "left" : last ? "right" : "center"}">${esc(labels[i])}</span>`;
        }).join("")}</div>`;
    }
    function histogramChart(model, series, ui) {
        const count = model.labels.length, people = Math.max(series.length, 1), gap = 8;
        const peak = peakDaily(series);
        const natural = count * (people * 9 + 10) + Math.max(count - 1, 0) * gap;
        const contentWidth = Math.max(CHART_W, natural);
        const groupWidth = (contentWidth - Math.max(count - 1, 0) * gap) / Math.max(count, 1);
        const barWidth = Math.max((groupWidth - (people - 1) * 2) / people, 3);
        const groups = model.labels.map((label, day) => `<button type="button" class="fdv-hgroup" style="width:${groupWidth}px" data-on="set:fdDay=${day}"><span class="bars">${series.map((se) => `<span style="width:${barWidth}px;height:${peak === 0 ? 0 : ((se.daily[day] ?? 0) / peak) * 140}px;background:${se.color}"></span>`).join("")}</span><span class="t-micro ellipsis" style="color:var(--${ui.fdDay === day ? "mossText" : "textFaint"})">${esc(label)}</span></button>`).join("");
        return `<div class="vstack" style="gap:10px"><p class="t-micro c-2">0-${compact1(peak)} steps</p><div class="fdv-hist"><div class="row" style="width:${contentWidth}px">${groups}</div></div></div>`;
    }
    function barsChart(model, series) {
        const peak = peakDaily(series);
        return `<div class="fdv-barsday">${model.labels.map((label, day) => `<div class="day">${FF.eyebrow(label)}<div class="vstack" style="gap:10px">${series.map((se) => {
            const value = se.daily[day];
            return `<div class="fdv-barrow">${avatar(se.person, 16)}<span class="t-micro c-2 ellipsis name">${esc(nameOf(se.person))}</span><span class="track"><span style="width:${peak === 0 ? 0 : Math.min(1, (value ?? 0) / peak) * 100}%;background:${se.color}"></span></span><span class="t-micro c-2 value">${value == null ? "-" : esc(score(value))}</span></div>`;
        }).join("")}</div></div>`).join("")}</div>`;
    }

    // ─── History pane (SeriesStats) ─────────────────────────────────
    function seriesStats(rounds) {
        const byId = new Map(), days = {}, finishes = [];
        const record = () => ({ holder: null, value: 0, start: null, end: null, you: null });
        const offer = (rec, id, value, start, end) => {
            if (isYou(id)) rec.you = Math.max(rec.you ?? value, value);
            if (rec.holder == null || value > rec.value) Object.assign(rec, { holder: id, value, start, end });
        };
        const st = { rounds: 0, together: 0, since: null, yourPlaces: [], bestDay: record(), bestRound: record(), closestFinish: null, biggestWin: null, entries: [] };
        for (const round of rounds) {
            if (round.serverState === "cancelled") continue;
            const racers = racing(round);
            const final = round.serverState === "final";
            const start = ms(round.windowStart), end = ms(round.windowEnd) - 1000;
            st.rounds++;
            st.since = Math.min(st.since ?? start, start);
            for (const row of racers) {
                if (!byId.has(row.person)) byId.set(row.person, { person: row.person, rounds: 0, wins: 0, podiums: 0, steps: 0 });
                const entry = byId.get(row.person);
                entry.rounds++;
                entry.steps += row.score;
                st.together += row.score;
                if (!final || row.rank == null) continue;
                if (row.rank <= 3) entry.podiums++;
                offer(st.bestRound, row.person, row.score, start, end);
            }
            // A tied first place gives nobody the win, like the trophy.
            const leaders = racers.filter((s) => s.rank === 1);
            if (final && leaders.length === 1) byId.get(leaders[0].person).wins++;
            const mine = racers.find((s) => isYou(s.person));
            if (final && mine?.rank != null) st.yourPlaces.push({ rank: mine.rank, round });
            // A racer who never sent final steps forfeits, so their stale score is not a finish.
            if (final && leaders.length === 1) {
                const second = racers.filter((s) => s.person !== leaders[0].person && s.finalStepsComplete !== false).reduce((best, s) => (!best || s.score > best.score ? s : best), null);
                if (second && second.score <= leaders[0].score) finishes.push({ winner: leaders[0].person, runnerUp: second.person, margin: leaders[0].score - second.score, start, end });
            }
            for (const day of round.days || []) {
                if (!day.day) continue;
                for (const sc of day.scores) if (sc.hasData !== false) { (days[sc.person] ||= {})[day.day] = (days[sc.person][day.day] || 0) + sc.value; }
            }
        }
        st.closestFinish = finishes.reduce((best, x) => (!best || x.margin < best.margin ? x : best), null);
        if (finishes.length > 1) st.biggestWin = finishes.reduce((best, x) => (!best || x.margin > best.margin ? x : best), null);
        for (const id of byId.keys()) {
            for (const key of Object.keys(days[id] || {}).sort()) {
                const [y, m, d] = key.split("-").map(Number);
                const noon = new Date(y, m - 1, d, 12).getTime();
                offer(st.bestDay, id, days[id][key], noon, noon);
            }
        }
        st.entries = [...byId.values()];
        return st;
    }
    const MEDALS = { 1: ["medalGold", "medalGoldWash"], 2: ["medalSilver", "medalSilverWash"], 3: ["medalBronze", "medalBronzeWash"] };
    function recordRow(title, holder, headline, value, when, mine) {

    }
    function historyPane(f, ui) {

        const ranked = [...stats.entries].sort((a, b) => valueOf(b) - valueOf(a) || b.steps - a.steps);
        const shown = ranked.map((e, i) => [i, e]).filter(([i, e]) => ui.wholeBoard || i < 3 || isYou(e.person));
        const places = stats.yourPlaces.length ? `<div class="vstack" style="gap:8px"><span class="t-eyebrow c-3">${stats.yourPlaces.length > 10 ? "Your place, last 10 rounds" : "Your place each round"}</span><div class="hstack" style="gap:6px">${stats.yourPlaces.slice(0, 10).map(({ rank, round }) => {

        const head = `<div class="vstack" style="gap:12px;padding-top:4px"><div class="hstack" style="gap:12px;align-items:baseline"><span class="t-label c-2 grow">${esc([plural(stats.rounds, "round", "rounds"), stats.since != null ? `since ${dayMonth(stats.since)}` : null].filter(Boolean).join(" · "))}</span><span class="t-caption c-2">${plural(stats.entries.length, "racer", "racers")}</span></div><div class="vstack" style="gap:3px;padding-bottom:8px"><span class="fdv-big">${full(stats.together)}</span><span class="t-caption c-2">steps together</span></div>${places}</div>`;
        const boardRows = shown.map(([i, e]) => leaderboardRow({ rank: i + 1, person: e.person, value: board === "steps" ? score(e.steps) : String(valueOf(e)), isYou: isYou(e.person), caption: plural(e.rounds, "round", "rounds"), on: profileSpec(e.person) })).join("");

        const records = [["Best day", stats.bestDay], ["Best round", stats.bestRound]].filter(([, r]) => r.holder != null && r.value > 0).map(([title, r]) => recordRow(title, r.holder, isYou(r.holder) ? "You" : who(r.holder).name, r.value, r.start != null && r.end != null ? dateSpan(r.start, r.end) : null, isYou(r.holder) || r.you == null ? null : `Your best: ${full(r.you)}`));
        const finishes = [["Closest finish", stats.closestFinish], ["Biggest win", stats.biggestWin]].filter(([, x]) => x).map(([title, x]) => recordRow(title, x.winner, `${nameOf(x.winner)} over ${nameOf(x.runnerUp)}`, x.margin, dateSpan(x.start, x.end)));
        const recordsCard = FF.section("Records", FF.card(`<div class="vstack" style="gap:14px">${[...records, ...finishes].join(FF.divider(0))}</div>`));
        const rounds = history.map((round) => {
            const leaders = winnerStandings(racing(round), round);
            const result = leaders.length > 1 ? "Tied" : leaders.length ? (isYou(leaders[0].person) ? "You won" : `${who(leaders[0].person).name} won`) : "No result yet";
            return FF.section(dateSpan(round.windowStart, ms(round.windowEnd) - 1000), FF.card(`<div class="vstack" style="gap:12px"><div class="hstack" style="gap:12px;align-items:flex-start">${FF.result(fightResult(round))}<span class="grow vstack" style="gap:4px"><span class="t-caption c-2">${esc(deadlineLabel(round))}</span><span class="t-rowTitle">${esc(result)}</span></span></div>${standingsBands(round, ui, true)}</div>`));
        }).join("");
        return head + allTime + recordsCard + rounds;
    }
    // The round summary sheet, opened from Your place each round.
    function roundSummary(round) {

        const detail = (title, value) => FF.groupedRow({ title, trailing: `<span class="fdv-detail-value">${esc(value)}</span>` });
        const rows = racers.map((row, i) => [i, row]).filter(([i, row]) => i < 3 || isYou(row.person)).map(([i, row]) => leaderboardRow({ rank: row.rank ?? i + 1, person: row.person, value: full(row.score), isYou: isYou(row.person) })).join("");

    function joinVariant(f, variant) {

        if (variant === "challenge") return { ...f, status: "invited", pendingJoin: false, offersJoinNext: false };

    function lastRoundNotice(f) {
        const round = lastRound(f);
        if (!round || (D().fdDismissedRounds || []).includes(round.id)) return "";
        const tied = fightRank(round) === 1 && tiedForFirst(round);
        const of = racing(round).length;
        const mine = youRow(round);
        const rival = round.standings.find((s) => !isYou(s.person) && !s.invited && !s.deferred);
        let text;
        if (of === 2 && mine && rival) {
            const score2 = `${full(mine.score)} to ${full(rival.score)}`;
            text = tied ? `Last round: a draw, ${score2}. New round started. See more in History.` : fightRank(round) === 1 ? `Last round: you won ${score2}. New round started. See more in History.` : `Last round: you lost ${score2}. New round started. See more in History.`;
        } else {
            text = tied ? `Last round: you tied for 1st of ${of}. New round started. See more in History.` : `Last round: you came ${fmt.ordinal(fightRank(round))} of ${of}. New round started. See more in History.`;

    function renderFight(p, ui, ctx) {

                f = clone(PREVIEWED[id]);

            f.status = "live";
            f.serverState = "live";

    // Line and Pace: touch or slide across the plot to inspect a day; mostly vertical drags still scroll.
    let drag = null;
    function pickDay(event) {
        const plot = [...phone.querySelectorAll(".fdv-plot")].find((el) => el.closest("[data-key]")?.dataset.key === drag.key);
        if (!plot) return;
        if (event.type === "pointermove" && Math.abs(event.clientX - drag.x) < Math.abs(event.clientY - drag.y)) return;
        const box = plot.getBoundingClientRect();
        const count = Number(plot.dataset.count);
        const day = Math.round(Math.min(1, Math.max(0, (event.clientX - box.left) / Math.max(box.width, 1))) * Math.max(count - 1, 0));
        const ui = uiOf(drag.key);
        if (ui.fdDay !== day) { ui.fdDay = day; render(); }
    }
    phone.addEventListener("pointerdown", (event) => {
        const plot = event.target.closest(".fdv-plot");
        if (!plot) return;
        drag = { key: plot.closest("[data-key]").dataset.key, x: event.clientX, y: event.clientY };
        pickDay(event);
    });
    window.addEventListener("pointermove", (event) => { if (drag) pickDay(event); });
    window.addEventListener("pointerup", () => { drag = null; });

    // ─── Drafts: the Swift @State of NewFightView and EditFightView ───
    function newDraft() {
        const d = uiOf("newFight");
        if (!d.init) {
            const base = Math.ceil(Date.now() / MIN) * MIN;
            Object.assign(d, {
                init: true, username: "", invites: [], usernameError: null, days: 7, custom: false, tz: null,
                start: base + HOUR, end: base + 7 * DAY + HOUR, title: "", action: "", joinable: false, recurring: true,
                joinCode: "", lookingUp: false, creating: false, joining: false, createError: null, healthOff: false,
            });
        }
        return d;
    }
    const newZone = (d) => d.tz || profileZone();
    // Applies a link's one-off query keys to the draft (once per link).
    function seedNew(d, p, key) {
        if (d.seeded === key) return;
        d.seeded = key;
        if (p.custom) d.custom = true;
        if (p.days) { d.days = Number(p.days); d.custom = false; }
        if (p.public) d.joinable = true;
        if (p.people) d.invites = p.people.split(",").map(strippedHandle).filter(isValidHandle);
        if (p.title) d.title = p.title;
        if (p.action) d.action = p.action;
        if (p.health === "0") d.healthOff = true;
        if (p.bad === "start") { d.custom = true; d.start = Math.floor(Date.now() / MIN) * MIN - HOUR; }
        if (p.bad === "end") { d.custom = true; d.end = d.start - HOUR; }
        if (p.code) d.joinCode = typedJoinCode(p.code);
        if (p.username) { d.username = p.username; if (p.add) addUsername(d, d.invites, (h) => d.invites.push(h)); }
        const errors = {
            handle: "That username does not have a FitFight account yet.", failed: "Couldn’t start the fight.", signin: "Sign in to start a fight.",
            notfound: "Fight not found", network: "Couldn’t find that fight.", joinSignin: "Sign in to join this fight.", code: "Enter a code of 4 to 12 letters or numbers.", full: "This fight is full.",
        };
        d.createError = p.error ? errors[p.error] || null : d.createError;
        if (p.preview) {
            const summary = findSummary(p.preview);
            if (summary) D().pendingJoinable = pendingFromSummary(summary);
        }
    }
    function newScheduleError(d) {
        if (!d.custom) return null;
        if (d.start <= Date.now()) return "Choose a start time in the future.";
        if (d.end <= d.start) return "The end must be after the start.";
        return null;
    }
    // NewFightView.addUsername and EditFightView.addUsername share these three errors.
    function addUsername(d, existing, append) {
        const handle = strippedHandle(d.username);
        d.usernameError = null;
        if (!isValidHandle(handle)) { d.usernameError = "Use 2-30 letters, numbers, or underscores."; return; }
        if (handle === handleOf(D().you)) { d.usernameError = "Add someone else’s username."; return; }
        if (existing.includes(handle)) { d.usernameError = `@${handle} is already in this fight.`; return; }
        append(handle);
        d.username = "";
    }

    // Leaving the New tab destroys NewFightView, so its state starts over (ContentView's tab switch).
    OVERLAYS.push(() => {
        if (!S.flow && S.tab !== "newFight") {
            if (S.stacks.newFight.length) S.stacks.newFight = [];
            if (S.ui.newFight?.init) S.ui.newFight = {};
        }
        return "";
    });

    // ─── Small pieces ───
    const fieldBox = (o) => `<div class="nf-box ${o.error ? "error" : ""}"><input type="text" placeholder="${esc(o.placeholder)}" value="${esc(o.value)}" data-bind="${esc(o.bind)}"${o.max ? ` maxlength="${o.max}"` : ""}${o.enter ? ` data-nf-enter="${esc(o.enter)}"` : ""} autocomplete="off" autocapitalize="${o.caps || "none"}" autocorrect="off" spellcheck="false"></div>`;
    const headingBlock = (title, body) => `<div class="vstack" style="gap:6px"><h2 class="t-heading">${esc(title)}</h2><p class="t-body c-2 nf-lines">${esc(body)}</p></div>`;
    const checkmark = () => `<span class="nf-check">${icon("checkmark")}</span>`;
    const changeText = () => `<span class="t-caption c-moss">Change</span>`;
    const emberNotice = (text, glyph = "exclamationmark.triangle") => FF.notice(text, { tone: "ember", icon: glyph });
    // SwiftUI Toggle tinted moss (the composer and Edit fight use the system switch, not FFSwitch): white pill knob.
    const sysToggle = (isOn, spec, label) => `<button type="button" class="nf-systoggle" role="switch" aria-checked="${!!isOn}" aria-label="${esc(label)}" data-on="${esc(spec)}"></button>`;

    // FightComposerMetricPage
    function metricPage() {
        return `<div class="vstack" style="gap:16px">${headingBlock("What are you competing on?", "Every fight tracks one metric. Steps is the only metric available right now.")}${FF.grouped([
            FF.groupedRow({ title: "Steps", subtitle: "Highest total wins · Apple Health", icon: "figure.walk", subtitleTone: "moss", trailing: checkmark() }),
        ])}</div>`;
    }

    // A compact DatePicker: label, then the date and time pills. Native inputs sit over the pills.
    function datePicker(label, which, ms, tz, minMs) {
        const pill = (part, text, value, min) => `<label class="nf-date-pill"><span>${esc(text)}</span><input type="${part}" value="${value}"${min ? ` min="${min}"` : ""} data-nf-date="${which}:${part}"${minMs != null ? ` data-min="${minMs}"` : ""} aria-label="${esc(`${label} ${part}`)}"></label>`;
        return `<div class="nf-date-row"><span class="t-rowTitle">${esc(label)}</span><span class="nf-date-pills">${pill("date", dayText(ms, tz), inputDate(ms, tz), minMs != null ? inputDate(minMs, tz) : "")}${pill("time", timeText(ms, tz), inputTime(ms, tz))}</span></div>`;
    }

    // FightComposerDurationPage. o: { d, tz, canEditStart, startsImmediately, constrainEnd, scheduleError, tzSpec }
    function durationPage(o) {
        const d = o.d;
        const body = d.custom
            ? "Choose the exact start and end. Only steps inside this window count."
            : o.startsImmediately ? "It starts immediately. Steps after the exact end time do not count." : "Steps after the exact end time do not count.";
        const now = Math.ceil(Date.now() / MIN) * MIN;
        const custom = d.custom ? `${FF.card(`<div class="vstack nf-custom">${o.canEditStart ? `${datePicker("Start", "start", d.start, o.tz, now)}${FF.divider(0)}` : ""}${datePicker("End", "end", d.end, o.tz, o.constrainEnd ? (o.canEditStart ? d.start : now) : null)}${o.canEditStart
            ? `<button type="button" class="nf-tz-row ff-press" data-on="${esc(o.tzSpec)}"><span>Time zone</span><span class="grow"></span><span class="c-2 nf-tz-value">${esc(o.tz.replace(/_/g, " "))}</span><span class="c-faint">${icon("chevron.right")}</span></button>`
            : `<span class="t-caption c-2">${esc(o.tz)}</span>`}</div>`)}${o.scheduleError ? emberNotice(o.scheduleError, "calendar") : ""}` : "";
        return `<div class="vstack" style="gap:16px">${headingBlock("How long will the fight last?", body)}
            <div class="vstack" style="gap:10px"><span class="t-rowTitle">Duration</span>${FF.duration(PRESETS.map(([, t]) => [t, t]), durationLabel(d.days, d.custom), { on: "nfPreset:x" })}${FF.button("Custom", { kind: d.custom ? "primary" : "secondary", full: true, on: "nfCustom" })}</div>
            ${custom}
            ${FF.grouped([FF.groupedRow({ title: "Repeat when it ends", subtitle: "The next window starts when this one ends", icon: "arrow.clockwise", subtitleTone: d.recurring ? "moss" : "neutral", trailing: sysToggle(d.recurring, "toggle:recurring", "Repeat when it ends") })])}
        </div>`;
    }

    // FightComposerPeoplePage. o: { d, people: [{ id, handle, name, isOwner, invited, deferred, pendingAdd, link }], createMode, addSpec, removeSpec }
    function peoplePage(o) {
        const d = o.d;
        const subtitle = (p) => (p.isOwner ? "Created this fight" : p.pendingAdd ? (o.createMode ? "Added to this fight" : "Will be invited") : p.deferred ? "Next round" : p.invited ? "Invited" : "In this fight");
        const rows = o.people.map((p) => {
            const identity = `${FF.avatar(p.handle.slice(0, 2).toUpperCase(), { size: 36 })}<span class="vstack" style="gap:1px;min-width:0"><span class="t-rowTitle ellipsis">${esc(p.name)}</span><span class="t-caption ${p.isOwner || o.createMode || p.pendingAdd ? "c-moss" : "c-2"}">${esc(subtitle(p))}</span></span>`;
            return `<div class="nf-person">${p.link ? `<button type="button" class="nf-identity ff-press" data-on="${esc(p.link)}">${identity}</button>` : `<span class="nf-identity">${identity}</span>`}<span class="grow"></span>${p.isOwner ? FF.pill("Owner", "softMoss") : `<button type="button" class="nf-remove ff-press" aria-label="${esc(`Remove @${p.handle}`)}" data-on="${esc(`${o.removeSpec}:${p.id}`)}">${icon("xmark")}</button>`}</div>`;
        });
        return `<div class="vstack" style="gap:16px">${headingBlock("Who can join?", d.joinable ? "Listed on Join. Anyone with the code or invite link can join. Usernames are optional." : "New fights start private. People still join with the code or invite link. Usernames are optional.")}
            ${FF.grouped([
                FF.groupedRow({ title: "Private", subtitle: "Default · code or invite link", icon: "lock", subtitleTone: d.joinable ? "neutral" : "moss", trailing: d.joinable ? "" : checkmark(), on: "set:joinable=false" }),
                FF.groupedRow({ title: "Public", subtitle: "Listed on Join", icon: "link", subtitleTone: d.joinable ? "moss" : "neutral", trailing: d.joinable ? checkmark() : "", on: "set:joinable=true" }),
            ])}
            <div class="vstack" style="gap:8px"><span class="t-rowTitle">Username</span><div class="hstack" style="gap:8px">${fieldBox({ placeholder: "@username", value: d.username, bind: "username", error: !!d.usernameError, enter: `${o.addSpec} ; nfBlur` })}${FF.button("Add", { size: "small", enabled: !!d.username.trim(), on: o.addSpec })}</div>${d.usernameError ? `<span class="t-caption c-ember">${esc(d.usernameError)}</span>` : ""}</div>
            ${rows.length ? `<div class="ff-grouped">${rows.join('<div class="ff-divider"></div>')}</div>` : ""}
        </div>`;
    }

    // FightComposerLimitedField
    const limitedField = (label, placeholder, bind, value, enter) => `<div class="vstack" style="gap:8px"><span class="t-rowTitle">${esc(label)}</span>${fieldBox({ placeholder, value, bind, max: 120, enter, caps: "sentences" })}<span class="t-caption c-faint" style="text-align:right">${[...value].length}/120</span></div>`;

    // FightComposerDetailsPage
    function detailsPage(d) {
        return `<div class="vstack" style="gap:16px">${headingBlock("Title and action", "Both are optional. If you skip a title, the action is the name of the fight.")}${limitedField("Title", "Weekend walk-off", "title", d.title, "nfFocus:action")}${limitedField("Loser action", "Cook dinner", "action", d.action, "nfBlur")}</div>`;
    }

    // FightComposerReviewPage. o: { isEditing, d, tz, durationStart, handles, healthConnected, changeSpec(stepName), connectSpec }
    function reviewPage(o) {
        const d = o.d;
        const title = d.title.trim(), action = d.action.trim();
        const listing = d.joinable ? "Listed on Join" : "Join with code or invite link";
        const opponents = conjunction(o.handles.map((h) => `@${h}`));
        const duration = durationLabel(d.days, d.custom);
        const windowEnd = d.custom ? d.end : addDays(o.durationStart, d.days, o.tz);
        const change = (step) => o.changeSpec(step);
        return `<div class="vstack" style="gap:16px">
            <div class="vstack" style="gap:6px"><h2 class="t-heading">${o.isEditing ? "This fight" : "Ready to fight?"}</h2><p class="t-body c-2">${o.isEditing ? "Change a row, then save." : "Check the agreement before you start."}</p></div>
            ${FF.grouped([
                FF.groupedRow({ title: "Metric", subtitle: "Steps · highest total wins", icon: "figure.walk", subtitleTone: "neutral", trailing: changeText(), on: change("metric") }),
                FF.groupedRow({ title: "Duration", subtitle: `${d.custom ? `${stamp(d.start, o.tz)} → ${stamp(d.end, o.tz)}` : `${duration} · ends ${stamp(windowEnd, o.tz)}`} · ${o.tz}`, icon: "calendar", subtitleTone: "neutral", trailing: changeText(), on: change("duration") }),
                FF.groupedRow({ title: d.joinable ? "Public" : "Private", subtitle: opponents ? `${listing} · ${opponents}` : listing, icon: d.joinable ? "link" : "lock", subtitleTone: "neutral", trailing: changeText(), on: change("people") }),
                FF.groupedRow({ title: "Title", subtitle: title || (action ? "Uses the action" : "None"), icon: "textformat", subtitleTone: "neutral", trailing: changeText(), on: change("details") }),
                FF.groupedRow({ title: "Loser action", subtitle: action || "None", icon: "flag", subtitleTone: "neutral", trailing: changeText(), on: change("details") }),
                FF.groupedRow({ title: "Apple Health Steps", subtitle: o.healthConnected ? "Ready to score this fight" : "Connect to score this fight", icon: "heart", subtitleTone: o.healthConnected ? "moss" : "ember", trailing: FF.pill(o.healthConnected ? "Connected" : "Connect", o.healthConnected ? "softMoss" : "solidMoss"), on: o.healthConnected ? null : o.connectSpec }),
            ])}
            ${FF.card(`<div class="vstack" style="gap:5px"><span class="t-rowTitle">${esc(`You vs ${opponents || "people who join"}`)}</span><span class="t-body c-2">${esc(d.custom ? "Most Steps inside the selected window wins." : `Most Steps wins after ${duration.toLowerCase()}.`)}</span>${d.recurring ? '<span class="t-body c-2">When it ends, the next window starts automatically.</span>' : ""}${action ? `<span class="t-body">${esc(`The loser will ${action}.`)}</span>` : ""}</div>`, { fill: "var(--mossWash)", stroke: "color-mix(in srgb, var(--mossText) 18%, transparent)" })}
        </div>`;
    }

    // ─── NewFightView ───
    const offerRow = (s) => {
        const o = { title: displayTitle(s.name, s.actionText), subtitle: `${s.memberCount} participants`, pill: ["accepted", "deferred"].includes(s.membershipState) ? "Open fight" : "Join", monogram: s.ownerHandle.slice(0, 2).toUpperCase(), on: `nfOpenJoinable:${s.id || s.fightId}` };
        return `<button type="button" class="nf-offer ff-press" data-on="${esc(o.on)}">${FF.avatar(o.monogram)}<span class="grow vstack" style="gap:2px"><span class="t-heading">${esc(o.title)}</span><span class="t-caption c-2">${esc(o.subtitle)}</span></span>${FF.pill(o.pill, "solidMoss")}</button>`;
    };

    // CompanionIntroduction(surface: .newFight), used only when the fights part has not drawn it.
    function introFallback() {
        const steps = D().todaySteps || 0;
        const stage = steps >= 15000 ? 5 : steps >= 10000 ? 4 : steps >= 6000 ? 3 : steps >= 3000 ? 2 : 1;
        return `<div class="nf-intro"><img class="companion nf-intro-art" src="${companionArt(you().companion, `effort-${stage}`)}" alt=""><div class="nf-intro-copy">Steps. Highest total wins.</div></div>`;
    }

    function chooseStep() {
        const disc = D().discovery;
        const rows = D().suggestedFights || [];
        let suggested = "";
        if (disc.error) suggested += emberNotice(disc.error);
        if (disc.loading && !rows.length) suggested += FF.loading();
        else if (!rows.length && !disc.error) suggested += '<p class="t-body c-2">No suggested fights right now.</p>';
        else suggested += rows.map((s) => globalThis.FIGHTS?.joinOfferRow?.(s, { on: `nfOpenJoinable:${s.id || s.fightId}` }) ?? offerRow(s)).join("");
        return `<div class="vstack" style="gap:16px">
            ${globalThis.COMPANION_INTRO?.("newFight") ?? introFallback()}
            ${headingBlock("Create, join, or post?", "Start a new fight, join one that's already going, or post to the Feed.")}
            ${FF.grouped([
                FF.groupedRow({ title: "Create", subtitle: "Start a new fight", icon: "plus", subtitleTone: "neutral", on: "nfOpen:create" }),
                FF.groupedRow({ title: "Join", subtitle: "Code, invite link, or a public fight", icon: "nf.person.badge.plus", subtitleTone: "neutral", on: "nfOpen:join" }),
                FF.groupedRow({ title: "Post", subtitle: "Share a note, photo, or video on the Feed", icon: "square.and.pencil", subtitleTone: "neutral", on: "present:feedCompose" }),
            ])}
            <div class="vstack" style="gap:12px">${FF.sectionHeader("Suggested")}${suggested}</div>
        </div>`;
    }

    function joinStep(d) {
        const disc = D().discovery;
        const rows = disc.public;
        let list = "";
        if (disc.error) list += emberNotice(disc.error);
        if (disc.loading && !rows.length) list += FF.loading();
        else if (!rows.length && !disc.error) list += '<p class="t-body c-2">No live public fights right now. Use a code or invite link.</p>';
        else if (rows.length) list += FF.grouped(rows.map((s) => FF.groupedRow({
            title: displayTitle(s.name, s.actionText), subtitle: `@${s.ownerHandle} · ${s.memberCount} in${s.recurring ? " · repeats" : ""}`, icon: "figure.walk", subtitleTone: "neutral",
            trailing: `<span class="t-caption c-2">${esc(s.joinCode)}</span>`, on: `nfOpenJoinable:${s.fightId}`,
        })));
        return `<div class="vstack" style="gap:16px">
            ${headingBlock("Join a fight", "Private fights join with a code or invite link. Public fights also show below.")}
            <div class="vstack" style="gap:8px"><span class="t-rowTitle">Code</span>${fieldBox({ placeholder: "K7M2", value: d.joinCode, bind: "joinCode", enter: "nfLookup", caps: "characters" })}</div>
            ${FF.sectionHeader("Live public fights")}
            ${list}
        </div>`;
    }

    // JoinFightPreview (FightDetailView.swift), used only when the fight detail part has not drawn it.
    function joinPreviewFallback(f, joining, error) {
        const tz = localZone();
        const start = Date.parse(f.windowStart), end = Date.parse(f.windowEnd);
        const hours = Math.max(1, Math.round((end - start) / HOUR));
        const duration = hours <= 6 ? `${hours} hours` : `${f.lengthDays} days`;
        const title = displayTitle(f.name, f.actionText);
        const act = (f.actionText || "").trim();
        const choice = f.offersJoinNext
            ? `<div class="vstack" style="gap:10px"><p class="t-caption c-2">${esc(`This round started ${stamp(start, tz)}. Join now and your steps count from that date.`)}</p>${FF.cta(joining ? "Joining…" : "Join this round", { busy: joining, on: "nfJoin:now" })}</div><div class="vstack" style="gap:10px"><p class="t-caption c-2">${esc(`Or start next round, from ${stamp(end, tz)}.`)}</p>${FF.button("Start next round", { kind: "secondary", full: true, enabled: !joining, on: "nfJoin:next" })}</div>`
            : FF.cta(joining ? "Joining…" : f.pendingJoin ? "Join fight" : "Accept challenge", { busy: joining, on: "nfJoin:now" });
        return FF.card(`<div class="vstack" style="gap:20px">
            <div class="vstack" style="gap:8px;align-items:center;text-align:center"><h2 class="t-title">${esc(title)}</h2>${f.invitePitch ? `<p class="t-body c-2">${esc(f.invitePitch)}</p>` : ""}</div>
            <div class="vstack" style="gap:8px"><span class="t-label">${esc(`${duration} · Most steps wins`)}</span><span class="t-caption c-2">${esc(`${stamp(start, tz)} → ${stamp(end, tz)}`)}</span>${f.recurring ? '<span class="t-caption c-2">Repeats until you leave. Each round has its own result.</span>' : ""}${act && act !== title ? `<span class="t-body">${esc(act)}</span>` : ""}</div>
            <div style="height:1px;background:var(--line)"></div>
            <p class="t-caption c-2">Participants see your identity, Fight Steps, standings, and posts you share in this Fight. Joining does not enable profile or daily-history sharing.</p>
            <div class="vstack" style="gap:16px">${choice}</div>
            ${FF.button(f.pendingJoin ? "Not now" : "Decline", { kind: "ghost", full: true, enabled: !joining, on: "nfDecline" })}
            ${error ? `<p class="t-caption c-ember">${esc(error)}</p>` : ""}
        </div>`, { padding: 20 });
    }

    function createStep(d, step) {
        const tz = newZone(d);
        switch (STEPS[step]) {
            case "metric": return metricPage();
            case "duration": return durationPage({ d, tz, canEditStart: true, startsImmediately: true, constrainEnd: false, scheduleError: newScheduleError(d), tzSpec: "nfTzOpen:for=new" });
            case "people": return peoplePage({ d, people: d.invites.map((h) => ({ id: h, handle: h, name: `@${h}`, pendingAdd: true, invited: true })), createMode: true, addSpec: "nfAdd", removeSpec: "nfRemove" });
            case "details": return detailsPage(d);
            default: return reviewPage({ isEditing: false, d, tz, durationStart: Date.now(), handles: d.invites, healthConnected: healthAsked() && !d.healthOff, changeSpec: (s) => `nfStep:${STEPS.indexOf(s)}`, connectSpec: "nfHealth" });
        }
    }

    function renderNew(opening, p, ctx) {
        ensureData();
        const d = newDraft();
        S.ui[ctx.key] = d;
        seedNew(d, p, ctx.key);
        if (d.joinCode !== typedJoinCode(d.joinCode)) d.joinCode = typedJoinCode(d.joinCode);
        if (typeof D().pendingJoinable === "string") {
            const summary = findSummary(D().pendingJoinable);
            D().pendingJoinable = summary ? pendingFromSummary(summary) : null;
        }
        const pending = D().pendingJoinable;
        const preview = !!pending && opening !== "create";
        const effective = preview ? "join" : opening;
        const step = opening === "create" ? Math.min(4, Math.max(0, Number(p.step) || 0)) : 0;

        const head = effective === "choose"
            ? '<h1 class="t-title nf-head-cell">New</h1>'
            : `<button type="button" class="nf-back ff-press" data-on="nfBack">${icon("chevron.left")}<span>Back</span></button>`;
        const progress = `<div class="vstack" style="gap:10px"><div class="hstack">${head}<span class="grow"></span>${opening === "create" ? `<span class="t-caption c-2 nf-head-cell">Step ${step + 1} of 5</span>` : ""}</div>${opening === "create" ? `<div class="nf-bar" role="img" aria-label="Step ${step + 1} of 5">${[0, 1, 2, 3, 4].map((i) => `<span class="${i <= step ? "on" : ""}"></span>`).join("")}</div>` : ""}</div>`;

        let content;
        if (preview) {
            content = globalThis.FIGHT_DETAIL?.joinPreview?.(pending, d, ctx.key, { joinNow: "nfJoin:now", joinNext: "nfJoin:next", dismiss: "nfDecline", joining: !!d.joining, error: d.createError || "" })
                ?? joinPreviewFallback(pending, d.joining, d.createError);
        } else if (opening === "choose") content = chooseStep();
        else if (opening === "join") content = joinStep(d);
        else content = createStep(d, step);

        const action = [];
        if (effective === "choose" || preview) {
            // EmptyView
        } else if (effective === "join") {
            action.push(FF.cta(d.lookingUp ? "Looking up…" : "Open fight", { enabled: codeOK(d.joinCode), busy: d.lookingUp, on: "nfLookup" }));
            if (d.createError) action.push(emberNotice(d.createError));
        } else if (step === 4) {
            const scheduleError = newScheduleError(d);
            const canStart = healthAsked() && !d.healthOff && [...d.title.trim()].length <= 120 && [...d.action.trim()].length <= 120 && !scheduleError && !d.creating;
            action.push(FF.slide(d.creating ? "Starting…" : d.custom ? "Slide to schedule" : "Slide to start", { enabled: canStart, busy: d.creating, on: "nfStart" }));
            if (!(healthAsked() && !d.healthOff)) action.push('<p class="t-caption c-2" style="text-align:center">Connect Apple Health above to start this fight.</p>');
            if (d.createError) action.push(emberNotice(d.createError));
            if (scheduleError) action.push(emberNotice(scheduleError, "calendar"));
        } else {
            action.push(FF.cta("Next", { enabled: step !== 1 || !newScheduleError(d), on: "nfNext" }));
        }

        return `<div class="nf-noanim nf-glyphs" style="position:absolute;inset:0">${FF.screen(`<div class="nf-flow">${progress}${content}<div class="nf-spacer"></div>${action.join("")}</div>`, {

    screen("newFight", { kind: "root", title: "New", render: (p, ui, ctx) => renderNew("choose", p, ctx) });
    screen("newJoin", { kind: "push", title: "Join a fight", render: (p, ui, ctx) => renderNew("join", p, ctx) });
    screen("newCreate", { kind: "push", title: "Create a fight", render: (p, ui, ctx) => renderNew("create", p, ctx) });

    const newTop = () => S.stacks.newFight[S.stacks.newFight.length - 1];
    // Moves the Create flow to another step: the same entry, so the draft and the screen stay put.
    function setNewStep(step) {
        const top = newTop();
        if (top?.id === "newCreate") top.p = { step: String(step) };
        render();
    }

    action("nfOpen", (which) => {
        const d = newDraft();
        if (which === "create") push("newCreate", { step: "0" });
        else push("newJoin");
        d.seeded = null;
    });
    // NewFightView.goBack
    action("nfBack", () => {
        const d = newDraft();
        const top = newTop();
        const opening = top?.id === "newCreate" ? "create" : top?.id === "newJoin" ? "join" : "choose";
        if (D().pendingJoinable && opening !== "create") return ACT.nfDecline();
        if (opening === "join" || (opening === "create" && Number(top.p.step || 0) === 0)) {
            S.stacks.newFight = [];

        }
        if (opening === "create") setNewStep(Number(top.p.step || 0) - 1);

    action("nfStep", (step) => setNewStep(Number(step)));
    action("nfPreset", (arg, ctx) => {
        const label = arg.split("=").slice(1).join("=");
        ctx.ui.custom = false;
        ctx.ui.days = (PRESETS.find(([, t]) => t === label) || PRESETS[1])[0];

    action("nfAdd", (arg, ctx) => {

    action("nfRemove", (handle, ctx) => { ctx.ui.invites = ctx.ui.invites.filter((h) => h !== handle); render(); });
    action("nfFocus", (bind) => { setTimeout(() => phone.querySelector(`[data-bind="${bind}"]`)?.focus(), 0); });
    action("nfBlur", () => document.activeElement?.blur?.());
    action("nfHealth", (arg, ctx) => {

        ctx.ui.healthOff = false;
