            <span class="row foot"><span>${esc(upcoming ? durationLabel(f) : `Day ${day} of ${f.lengthDays}`)}</span><span class="ellipsis"${urgent ? ' style="color:var(--emberText)"' : ""}>${esc(timeLeft(f))}</span></span>
        </button>`;
    }
    // JoinOfferRow: an invitation (a Fight) or a suggested fight (a joinable summary with memberCount).
    function joinOfferRow(item, o = {}) {
        const suggested = item.memberCount != null;
        const title = suggested ? displayTitle(item.name, item.actionText) : listTitle(item);
        const inviter = item.inviter || item.standings?.[0]?.person;
        const subtitle = suggested ? `${item.memberCount} participants` : `${person(inviter)?.name || "Someone"} · ${durationLabel(item)}`;
        const pill = suggested && ["accepted", "deferred"].includes(item.membershipState) ? "Open fight" : "Join";
        const art = suggested ? FF.avatar(item.ownerHandle.slice(0, 2).toUpperCase(), { size: 44 }) : avatar(inviter, 44);
        return `<button type="button" class="fl-offer ff-press"${on(o.on || (suggested ? `flOpenJoinable:${item.id}` : `push:fight?id=${item.id}`))}>${art}<span class="grow vstack" style="gap:2px"><span class="t-heading">${esc(title)}</span><span class="t-caption c-2">${esc(subtitle)}</span></span>${FF.pill(pill, "solidMoss")}</button>`;
    }
    // FinishedRow: rounds of one series share a name, so the window tells them apart. Opens that exact round.
    function finishedRow(f, o = {}) {
        const r = result(f);
        const window = `${stamp(f.windowStart)} - ${stamp(f.windowEnd)}`;
        return `<button type="button" class="fl-finished ff-press"${on(o.on || `push:fight?id=${f.id}`)}>${FF.result(r)}<span class="grow vstack" style="gap:2px"><span class="t-rowTitle">${esc(listTitle(f))}</span><span class="t-caption c-2">${esc(r === "P" ? `Pending · ${window}` : window)}</span></span>${avatarStack(f.standings.map((s) => s.person), { visible: 2, size: 26, ring: "var(--card)", half: true })}</button>`;
    }
    // FightGroupCard: Friends or Fight Marc.
    const groupCard = (title, subtitle, badge, spec) => `<button type="button" class="fl-group ff-press"${on(spec)}><span class="grow vstack" style="gap:2px"><span class="t-heading">${esc(title)}</span><span class="t-caption c-2">${esc(subtitle)}</span></span>${badge ? FF.pill(badge) : ""}${FF.chevron()}</button>`;

    // ─── Today's steps and the companion's effort stage ───
    const STAGES = [
        { n: 1, name: "Rest", min: 0 },
        { n: 2, name: "Heading out", min: 3000 },
        { n: 3, name: "On the move", min: 6000 },
        { n: 4, name: "Pushing", min: 10000 },
        { n: 5, name: "Peak", min: 15000 },
    ];
    const stepsStatus = () => D().stepsStatus || "steps";
    const todayCount = () => (stepsStatus() === "steps" ? D().todaySteps : null);
    const stageFor = (count) => (count == null ? STAGES[0] : STAGES.filter((s) => count >= s.min).pop());
    // CompanionCharacter's art for a stage; a custom character uses its own picture.
    function stageArt(stage) {
        const id = youCompanion();
        if (isCustom(id)) return globalThis.COMPANION?.info?.(id)?.image || you().companionImage || asset("CharacterIdea-pig");
        return companionArt(id, stage ? `effort-${stage.n}` : "");
    }

    // ─── 10K streak (TenKStreakPill, TenKStreakDrawer) ───
    const streakCurrent = (streak, today) => streak.current - (streak.todayCounted ? 1 : 0) + (streak.todayCounted || (today ?? 0) >= streak.goal ? 1 : 0);
    const streakPill = (days, spec = "present:streak") => `<button type="button" class="fl-streak" aria-label="${esc(`10K streak · ${plural(days, "day", "days")}`)}"${on(spec)}><span class="cap ${days > 0 ? "hot" : ""}">${icon("flame.fill")}<b>${days}</b></span></button>`;

    // ─── Pull to refresh (FFScreen refresh: locked header, rotating status, error notice) ───
    const LINES = {
        readingHealth: ["Syncing your step activity…", "Asking Apple Health how far you walked…"],
        uploading: ["Updating the database…", "Filing your steps where they belong…"],
        updatingFights: ["Updating the challenges…", "Counting how far you are from your friend…", "Checking whether you’re still ahead…"],
    };
    const OFFLINE_REFRESH = "Not up to date. Check your internet connection.";
    const OFFLINE_LOAD = "The Internet connection appears to be offline.";
    const R = { on: false, message: "", error: null, timers: [] };
    const refreshing = () => R.on || S.scenario === "loading";
    const refreshError = () => R.error ?? (S.scenario === "offline" ? OFFLINE_REFRESH : null);
    action("flRefresh", () => {
        if (R.on) return;
        R.on = true;
        R.error = null;
        const steps = [["readingHealth", 0], ["readingHealth", 1], ["uploading", 0], ["updatingFights", 0], ["updatingFights", 1]];
        steps.forEach(([phase, line], i) => R.timers.push(setTimeout(() => { R.message = LINES[phase][line]; render(); }, i * 1150)));
        R.timers.push(setTimeout(() => {
            R.on = false;
            R.message = "";
            R.timers = [];
            R.error = S.scenario === "offline" ? OFFLINE_REFRESH : null;
            render();
        }, steps.length * 1150));
    });
    const refreshHeader = (message) => `<div class="fl-refresh"><span class="spinner"></span>${message ? `<span class="t-caption c-2">${esc(message)}</span>` : ""}</div>`;
    const pullMarker = '<i data-fl-pull hidden></i>';
    // Drag the list down from the top (touch, mouse or trackpad) to refresh, like the app.
    {
        let pull = null;
        const zoom = () => phone.getBoundingClientRect().width / phone.offsetWidth || 1;
        const start = (target, y) => {
            const scroll = target.closest?.(".ff-scroll");
            if (!scroll || !scroll.querySelector("[data-fl-pull]") || scroll.scrollTop > 0 || R.on) return;
            pull = { scroll, y, dy: 0 };
        };
        const move = (y) => {
            if (!pull) return;
            pull.dy = Math.max(0, (y - pull.y) / zoom());
            const body = pull.scroll.querySelector(".ff-body");
            if (body) body.style.transform = pull.dy > 4 ? `translateY(${Math.min(pull.dy * 0.45, 90)}px)` : "";
        };
        const end = () => {
            if (!pull) return;
            const fire = pull.dy > 90;
            const body = pull.scroll.querySelector(".ff-body");
            if (body) { body.style.transition = "transform 0.25s var(--ease)"; body.style.transform = ""; setTimeout(() => (body.style.transition = ""), 260); }
            pull = null;
            if (fire) ACT.flRefresh();
        };
        phone.addEventListener("touchstart", (e) => start(e.target, e.touches[0].clientY), { passive: true });
        phone.addEventListener("touchmove", (e) => move(e.touches[0].clientY), { passive: true });
        phone.addEventListener("touchend", end);
        phone.addEventListener("mousedown", (e) => { if (!e.target.closest("button, input, textarea, a")) start(e.target, e.clientY); });
        window.addEventListener("mousemove", (e) => move(e.clientY));
        window.addEventListener("mouseup", end);
        let wheel = 0, wheelTimer;
        phone.addEventListener("wheel", (e) => {
            const scroll = e.target.closest(".ff-scroll");
            if (!scroll || !scroll.querySelector("[data-fl-pull]") || scroll.scrollTop > 0 || e.deltaY >= 0) { wheel = 0; return; }
            wheel -= e.deltaY;
            clearTimeout(wheelTimer);
            wheelTimer = setTimeout(() => (wheel = 0), 300);
            if (wheel > 260 && !R.on) { wheel = 0; ACT.flRefresh(); }
        }, { passive: true });
    }

    // ─── CompanionIntroduction(surface: .fights / .newFight / .you) ───
    const COMPANIONS = {
        "badger": ["Badger", "Quietly competitive."], "raccoon": ["Raccoon", "Always has a plan."], "red-panda": ["Red Panda", "Looks relaxed. Isn’t."], "otter": ["Otter", "Here for a good time."], "rabbit": ["Rabbit", "Always one more lap."], "fox": ["Fox", "Just a little smug."], "bear": ["Bear", "Big strides. Soft heart."], "boar": ["Boar", "A little unstoppable."], "sloth": ["Sloth", "Slow is still forward."], "dog": ["Dog", "Always up for a walk."], "goat": ["Goat", "Takes the uphill route."], "turtle": ["Turtle", "Never out of the race."],
        "limited-black-panther": ["Black Panther", "Doesn't count steps. Steps count him."], "limited-lone-wolf": ["Lone Wolf", "Runs alone. Finishes first."], "limited-snow-leopard": ["Snow Leopard", "Cold start. Hot finish."], "limited-tiger": ["Tiger", "Wraps on. Excuses off."], "limited-night-owl": ["Night Owl", "Up at 3 a.m. Still ahead of you."], "limited-crocodile": ["Crocodile", "Smiles at the finish line. Bad sign."],
        "limited-peacock": ["Peacock", "Dressed to win. Also wins."], "limited-flamingo": ["Flamingo", "Stands on one leg. Still out-walks you."], "limited-persian-cat": ["Persian Cat", "Pearls on. Pinky up. Pace up."], "limited-ostrich": ["Ostrich", "Never buries her head. Only the competition."], "limited-cheetah": ["Cheetah", "Fashionably fast. Never fashionably late."], "limited-bald-eagle": ["Bald Eagle", "Spotted your step count from up here."],
        "limited-silverback": ["Silverback", "Skips nothing. Especially not leg day."], "limited-kangaroo": ["Kangaroo", "Counts jumps as steps. Nobody argues."], "limited-bull": ["Bull", "Charges first. Asks questions never."], "limited-moose": ["Moose", "Coach says one more lap. Coach is me."], "limited-bison": ["Bison", "Skipping rope. Never skipping cardio."], "limited-camel": ["Camel", "Hydrated in 2019. Still going."],
        "limited-panda": ["Panda", "Bubble tea first. Then domination."], "limited-capybara": ["Capybara", "Unbothered. Undefeated."], "limited-hedgehog": ["Hedgehog", "Prickly before coffee. Fast after."], "limited-ginger-cat": ["Ginger Cat", "Woke up at noon. Won by dinner."], "limited-alpaca": ["Alpaca", "Spits on rest days only."], "limited-seal": ["Seal", "Warm flippers. Cold competition."],
        "limited-hamster": ["Hamster", "Small legs. Unreasonable cardio."], "limited-tree-frog": ["Tree Frog", "Hops count double. Allegedly."], "limited-mouse": ["Mouse", "Small steps. So many of them."], "limited-guinea-pig": ["Guinea Pig", "Squeaks politely. Walks relentlessly."], "limited-duck": ["Duck", "Small duck. Big lift. Bigger quack."], "limited-donkey": ["Donkey", "Stubborn about cardio. In a good way."],
    };
    function dailySteps() {
        const status = stepsStatus();
        if (status === "steps") return `<div class="fl-daily"><span class="fl-count">${steps(D().todaySteps)}</span><span class="t-caption c-2">steps today</span></div>`;
        if (status === "syncing") return `<div class="fl-daily"><span class="spinner" style="color:var(--gold)"></span><span class="fl-sync">Synchronizing your steps.</span></div>`;
        return `<div class="fl-daily"><span class="t-metric">-</span><span class="t-caption c-2">${status === "connect" ? "Connect Apple Health" : "Today’s steps unavailable"}</span></div>`;
    }
    function introCopy(surface) {
        if (surface === "newFight") return `<div class="fl-copy"><span class="fl-copy-title" style="font-size:24px">Steps. Highest total wins.</span></div>`;
        const id = youCompanion();
        const known = globalThis.COMPANION?.info?.(id);
        const [name, line] = known ? [known.name, known.caption] : isCustom(id) ? [you().companionName || "Custom", you().companionLine || "Your own animal."] : COMPANIONS[id] || [id, ""];
        return `<div class="fl-copy"><span class="fl-copy-title">${esc(name)}</span><span class="fl-copy-line">${esc(line)}</span><button type="button" class="fl-link" data-on="present:companionPicker?custom=1">Make it yours</button><button type="button" class="fl-link" data-on="present:companionPicker">Change animal</button></div>`;
    }
    const greetArt = (cls, style = "") => `<button type="button" class="fl-art ${cls}" style="${style}" aria-label="${esc(`Say hello to ${(COMPANIONS[youCompanion()] || ["your companion"])[0]}`)}" data-on="flGreet"><img src="${esc(stageArt(stageFor(todayCount())))}" alt=""></button>`;
    function companionIntro(surface = "fights") {
        if (surface === "fights") {
            const live = listed().filter((f) => f.status === "live" && !isUpcoming(f));
            const leading = live.filter((f) => listRank(f) === 1).length;
            const streak = D().streak;
            return `<div class="fl-head">
                <div class="fl-head-copy">
                    <div class="fl-title-row"><h1 class="t-title">Fights</h1>${streak ? streakPill(streakCurrent(streak, todayCount())) : ""}</div>
                    ${live.length ? `<div class="fl-leading" style="color:${leading > 0 ? "var(--mossText)" : "var(--emberText)"}">Leading ${leading} of ${live.length}</div>` : ""}
                    ${dailySteps()}
                </div>
                <button type="button" class="fl-art fl-art-fights ff-press" aria-label="Companion levels" data-on="present:companionLevels"><img src="${esc(stageArt(stageFor(todayCount())))}" alt=""></button>
            </div>`;
        }
        if (surface === "you") return `<div class="fl-intro-you">${introCopy("you")}${greetArt("fl-art-you")}</div>`;
        return `<div class="fl-intro-new">${greetArt("fl-art-new")}${introCopy("newFight")}</div>`;
    }
    // CompanionCharacter greeting: a small tilt and lift, then back.
    action("flGreet", (_, ctx) => {
        const el = ctx.el;
        el.classList.remove("greet");
        void el.offsetWidth;
        el.classList.add("greet");
        setTimeout(() => el.classList.remove("greet"), 460);
    });

    // ─── PaidCharacterProgressCard ───
    const CHARACTER_COPY = {
        portraits: ["Your character is being drawn", "Three portraits are on the way."],
        choosing: ["Pick your favourite", "Three portraits are ready."],
        poses: ["Your character is being drawn", "Creating five fitness images."],
        complete: ["Your character is ready", "Make it your companion."],
        retryable: ["Your character needs attention", "Try again at no cost."],
        needsSupport: ["Your character needs attention", "Contact support."],
    };
    // The companion area's characters first (inProgress, then unseenReady), then this part's link states.
    function shownCharacter() {
        const shop = globalThis.COMPANION;
        const theirs = shop?.inProgress?.()[0] || shop?.unseenReady?.()[0];
        if (theirs) return { ...theirs, image: theirs.portrait || theirs.candidates?.some((cd) => cd.status === "completed") ? shop.portrait : null };
        const mine = D().customCharacter;
        return mine && !(mine.phase === "complete" && mine.seen) ? mine : null;
    }
    function characterCard() {
        const c = shownCharacter();
        // The container stays when the card hides, so it still takes a slot (and its 12pt spacing) in the list.
        if (!c || !CHARACTER_COPY[c.phase]) return "<div></div>";
        const [title, subtitle] = CHARACTER_COPY[c.phase];
        const tile = c.image ? `<img src="${esc(c.image)}" alt="">` : '<span class="spinner" style="color:var(--gold)"></span>';
        return FF.card(`<span class="hstack" style="gap:13px"><span class="fl-char-tile">${tile}</span><span class="grow vstack" style="gap:2px"><span class="t-heading">${esc(title)}</span><span class="t-caption c-2">${esc(subtitle)}</span></span><span class="c-3" style="font-size:17px">${icon("chevron.right")}</span></span>`, { on: "flCharacter" });
    }
    // model.characterRouteID = nil: the character screen opens on whichever character is in progress.
    action("flCharacter", () => {

    });

    // ═══ FIGHTS TAB ROOT ═══
    screen("fights", {
        kind: "root",
        title: "Fights",
        render(p, ui) {
            const filter = ui.filter || "current";
            const sort = ui.sort || "endingSoonest";
            const live = liveFights(), invited = invitations(), finished = finishedFights();
            const friends = friendsSummary();
            const hosted = hostedSummary();
            const hasFriendRounds = (friends?.rounds || 0) > 0;
            const isEmpty = !live.length && !invited.length && !finished.length && !hosted && !hasFriendRounds;
            const selected = { current: live, invited, past: finished }[filter];
            const error = refreshError();
            const out = [pullMarker];
            if (error) out.push(FF.notice(error, { tone: "ember", icon: "exclamationmark.triangle", actionTitle: "Try again", on: "flRefresh" }));
            out.push(companionIntro("fights"), characterCard());
            out.push(`<div class="fl-challenges"><div class="hstack"><span class="grow fl-label">Challenges</span><button type="button" class="fl-sort" aria-label="Sort by" data-on="present:fightsSort">${icon("arrow.up.arrow.down")}<span>${esc(SORTS.find(([v]) => v === sort)[1])}</span></button></div>${FF.segmented([["current", "Current"], ["invited", "Invited", invited.length], ["past", "Past"]], filter, { on: "set:filter", fill: true })}</div>`);
            if (filter === "current" && friends) out.push(groupCard("Friends", friendsSubtitle(friends), friends.requests > 0 ? plural(friends.requests, "request", "requests") : null, "push:friends"));
            if (isEmpty && refreshing()) out.push('<div class="fl-skeleton" aria-label="Loading"></div>'.repeat(3));
            if (isEmpty && !refreshing()) out.push(FF.empty({ icon: "trophy", title: "No fights yet", message: "Start one under New. Add people with their username. They must have signed in once.", actionTitle: "Start one", on: "tab:newFight" }));
            if (!isEmpty && !selected.length && (filter !== "current" || (!hosted && !hasFriendRounds))) {
                out.push(`<div class="fl-none t-body c-2">${filter === "current" ? "No current fights" : filter === "invited" ? "No invitations" : "No past fights"}</div>`);
            }

                out.push(...(D().suggestedFights || []).filter((s) => !s.alreadyMember).map((s) => joinOfferRow(s)));
            }
            if (filter === "current") {
                if (hosted) out.push(groupCard(hosted.name, `Leading ${hosted.leading} of ${hosted.rounds}`, null, "push:hosted"));
                out.push(...sorted(live, sort).map((f) => liveCard(f)));
            }
            if (filter === "past") out.push(...sorted(finished, sort).map((f) => finishedRow(f)));
            return FF.screen(out.join(""), { top: refreshing() ? refreshHeader(R.message || (S.scenario === "loading" ? LINES.updatingFights[0] : "")) : "" });
        },
    });
    // Suggested rows open the New tab's join preview (AppModel.openJoinable), or the fight when you're already in it.
    action("flOpenJoinable", (id) => {
        const item = (D().suggestedFights || []).find((s) => s.id === id);
        if (item?.alreadyMember && item.fightId) { setTab("fights"); push("fight", { id: item.fightId }); return; }

    // ─── FightsSortSheet: medium drawer ───
    screen("fightsSort", {
        kind: "drawer",

        title: "Sort by",
        render() {

            return `<div class="fl-drawer" style="gap:16px">${FF.sheetHeader("Sort by")}${FF.grouped(rows)}</div>`;
        },
    });
    action("flSort", (value) => { uiOf("fights").sort = value; dismiss(); });

    // ─── TenKStreakDrawer: large drawer ───
    screen("streak", {
        kind: "drawer",
        detent: "large",
        title: "10K streak",
        render() {
            const streak = D().streak;
            if (!streak) return `<div class="fl-drawer"></div>`;
            const today = todayCount() ?? 0;
            const current = streakCurrent(streak, todayCount());
            const todayHit = streak.todayCounted || today >= streak.goal;
            const progress = todayHit ? 1 : Math.min(1, today / streak.goal);
            const best = Math.max(streak.best?.days || 0, current);
            const goal = steps(streak.goal);
            const subline = current === 0 ? `Walk ${goal} steps today to start one.`
                : todayHit ? `Today counts: ${plural(current, "day", "days")} of ${goal}+ in a row.`
                : `Walk ${steps(streak.goal - today)} more today to make it ${current + 1}.`;
            const cell = (hit) => `<span class="fl-cell ${hit ? "hit" : ""}">${hit ? icon("flame.fill") : ""}</span>`;
            const ring = `<span class="fl-cell today"><svg viewBox="0 0 24 24" preserveAspectRatio="none"><rect x="1.5" y="1.5" width="21" height="21" rx="5" pathLength="100" stroke-dasharray="${progress * 100} 100"/></svg></span>`;
            const run = streak.best;
            const day = (raw, year) => new Date(`${raw}T00:00:00Z`).toLocaleDateString("en-US", { timeZone: "UTC", month: "short", day: "numeric", ...(year ? { year: "numeric" } : {}) });
            // lineLimit(1).minimumScaleFactor(0.7): the dates shrink to fit beside the number instead of truncating.
            const datesText = run && run.days === best ? `${day(run.from)} to ${day(run.through, true)}` : "";
            const datesSize = Math.max(8.4, Math.min(12, (12 * 112) / (datesText.length * 6.3 + (String(best).length - 1) * 11)));
            const dates = datesText ? `<span class="fl-best-dates" style="font-size:${datesSize.toFixed(1)}px">${esc(datesText)}</span>` : "";
            return `<div class="fl-drawer fl-streak-drawer" data-scroll>
                <div class="hstack" style="gap:14px"><span class="fl-flame-tile">${icon("flame.fill")}</span><span class="grow vstack" style="gap:2px"><span class="fl-streak-big">${esc(current > 0 ? plural(current, "day", "days") : "No streak")}</span><span class="t-caption c-2">${esc(subline)}</span></span></div>
                <div class="vstack" style="gap:6px"><div class="hstack t-caption c-2"><span class="grow">Today</span><span>${esc(`${steps(today)} / ${goal}`)}</span></div><div class="fl-track"><i style="width:${progress * 100}%"></i></div></div>
                <div class="vstack" style="gap:6px" aria-hidden="true"><div class="fl-cells">${(streak.recent || []).map((d) => cell((d.steps ?? 0) >= streak.goal)).join("")}${todayHit ? cell(true) : ring}</div><div class="hstack fl-cells-labels"><span class="grow">2 weeks ago</span><span>Today</span></div></div>
                <div class="fl-split"><div><span class="n">${current}</span><span class="t-caption c-2">current streak</span></div><i></i><div><span class="hstack" style="gap:8px;align-items:baseline"><span class="n">${best}</span>${dates}</span><span class="t-caption c-2">best streak</span></div></div>
                <p class="t-caption c-2">${esc(`A day with ${goal} steps or more keeps it going, a day under starts it over. Today counts once you pass ${goal}. Counted from all your Apple Health history, not only since you joined.`)}</p>

            </div>`;

    // ─── CompanionLevelsSheet: medium drawer, scrolls to large ───
    screen("companionLevels", {

    // ─── Pushed screens: Fight Marc (hosted) and Friends ───
    const pushNav = (title, subtitle) => `<div class="fl-nav"><button type="button" class="fl-back" aria-label="Back" data-on="back">${icon("chevron.left")}</button><div class="grow vstack" style="gap:3px;min-height:44px;justify-content:center"><span class="fl-nav-title">${esc(title)}</span>${subtitle ? `<span class="t-caption c-2">${esc(subtitle)}</span>` : ""}</div></div>`;
    const loadError = () => (S.scenario === "offline" ? OFFLINE_LOAD : null);
    const errorNotice = (text) => FF.notice(text, { tone: "ember", icon: "exclamationmark.triangle", actionTitle: "Try again", on: "flRefresh" });

    screen("hosted", {
        kind: "push",
        title: "Fight Marc",
        render() {
            const hosted = hostedCounts();
            const rounds = hostedRounds().slice().sort((a, b) => new Date(a.windowEnd) - new Date(b.windowEnd) || (a.id < b.id ? -1 : 1));
            const error = loadError();
            const body = [pullMarker, error ? errorNotice(error) : "", ...rounds.map((f) => liveCard(f, { title: person(f.inviter)?.name || "" }))].join("");
            return FF.screen(body, { top: pushNav(hosted?.name || "", hosted ? `Leading ${hosted.leading} of ${hosted.rounds}` : "") + (refreshing() ? refreshHeader(R.message || "Loading") : "") });
        },
    });

    // One round per friend, ordered by the friend's name (the round's title).
    function onePerFriend(rounds) {
        const latest = {};
        for (const f of rounds) {
            const friend = f.standings.find((s) => !isMe(s.person))?.person || f.id;
            if (latest[friend] && new Date(latest[friend].windowStart) >= new Date(f.windowStart)) continue;
            latest[friend] = f;
        }
        return Object.values(latest).sort((a, b) => listTitle(a).localeCompare(listTitle(b)) || (a.id < b.id ? -1 : 1));
    }
    // FriendsGroupView.personRow: the name opens the Player card; actions on the right.
    const personRow = (id, actions) => {
        const p = person(id);
        return FF.card(`<span class="hstack" style="gap:10px"><button type="button" class="grow hstack fl-person" style="gap:12px" data-on="present:profileSheet?id=${esc(id)}">${avatar(id, 44)}<span class="grow vstack" style="gap:4px;min-width:0"><span class="t-label ellipsis">${esc(p?.name || "")}</span><span class="t-caption c-2 ellipsis">${esc(p?.handle || "")}</span></span></button><span class="hstack" style="gap:8px">${actions}</span></span>`);
    };
    // FriendsGroupView.addRow: Add, then Requested or Friends once the server answered.
    function addRow(id, ui) {
        const asked = D().friendsGroup?.asked?.[id];
        if (asked === "friends") return personRow(id, FF.button("Friends", { kind: "secondary", size: "small", enabled: false }));
        if (asked === "outgoing") return personRow(id, FF.button("Requested", { kind: "secondary", size: "small", enabled: false }));
        return personRow(id, FF.button("Add", { size: "small", busy: ui.busy?.[id], on: `flFriend:request@${id}` }));
    }
    // FriendLookupField (+ the found person): exact username, Find appears once there's text.
    function friendLookup(ui, o = {}) {
        const handle = ui.flHandle || "";
        const field = `<div class="fl-lookup"><span class="c-2" style="font-size:17px">${icon("magnifyingglass")}</span><input type="text" placeholder="Add a friend by username" value="${esc(handle)}" data-bind="flHandle" data-fl-find autocomplete="off" autocapitalize="none" spellcheck="false" enterkeyhint="search">${handle ? '<button type="button" class="fl-find" data-on="flFind">Find</button>' : ""}</div>`;
        if (!ui.flFound) return field;
        const found = o.mode === "open"
            ? FF.card(`<button type="button" class="hstack" style="gap:12px;width:100%" data-on="present:profileSheet?id=${esc(ui.flFound)}">${avatar(ui.flFound, 44)}<span class="grow vstack" style="gap:4px"><span class="t-label">${esc(person(ui.flFound)?.name || "")}</span><span class="t-caption c-2">${esc(person(ui.flFound)?.handle || "")}</span></span><span class="c-faint">${icon("chevron.right")}</span></button>`)
            : addRow(ui.flFound, ui);
        return field + found;
    }
    action("flFind", (_, ctx) => {
        const handle = (ctx.ui.flHandle || "").trim().replace(/^@/, "").toLowerCase();
        ctx.ui.flFound = null;
        ctx.ui.flError = null;
        if (!handle) return render();
        const match = Object.values(D().people).find((p) => p.handle.replace(/^@/, "").toLowerCase() === handle);
        if (match) ctx.ui.flFound = match.id;
        else ctx.ui.flError = "Profile unavailable";
        render();
    });
    // Enter in the lookup field searches, like .onSubmit.
    phone.addEventListener("keydown", (event) => {
        if (event.key !== "Enter" || !event.target.matches?.("[data-fl-find]")) return;
        event.preventDefault();
        run("flFind", event.target, event);
    });
    // accept / decline answer a request, request asks someone. Accepting starts this month's fight.
    action("flFriend", (arg, ctx) => {
        const [verb, id] = arg.split("@");
        const ui = ctx.ui;
        if (ui.busy?.[id]) return;
        ui.busy = { ...(ui.busy || {}), [id]: true };
        ui.flError = null;
        render();
        setTimeout(() => {
            ui.busy = { ...ui.busy, [id]: false };
            const d = D();
            const group = d.friendsGroup || (d.friendsGroup = { requests: [], suggestions: [], asked: {} });
            if (verb === "request") {
                if (isMe(id)) ui.flError = "Choose another person";
                else if (group.requests.includes(id)) { /* They asked first: the server keeps it incoming and the screen reloads. */ }
                else group.asked = { ...group.asked, [id]: d.friends.includes(id) ? "friends" : "outgoing" };
            } else {
                group.requests = group.requests.filter((r) => r !== id);
                if (verb === "accept" && !d.friends.includes(id)) {
                    d.friends.push(id);
                    const month = monthWindow(0);
                    d.fights.push(makeRound(d, { id: `friend-${id}-${new Date(month.start).getMonth() + 1}`, name: "Friends", cast: [d.you, id], totals: [YOUR_MONTH, 0], start: month.start, end: month.end, extra: { friends: true } }));
                }
            }
            render();
        }, 550);
    });

    screen("friends", {
        kind: "push",
        title: "Friends",
        render(p, ui) {
            const group = D().friendsGroup;
            const summary = friendsSummary();
            const now = NOW();
            const rounds = friendRounds();
            const thisMonth = onePerFriend(rounds.filter((f) => new Date(f.windowEnd).getTime() > now));
            const lastMonth = onePerFriend(rounds.filter((f) => new Date(f.windowEnd).getTime() <= now));
            const requests = group?.requests || [];
            const suggestions = group?.suggestions || [];
            const error = loadError();
            const out = [pullMarker];
            if (error) out.push(errorNotice(error));
            if (ui.flError) out.push(FF.notice(ui.flError, { tone: "ember", icon: "exclamationmark.triangle" }));
            if (requests.length) {
                out.push(FF.section("Requests", requests.map((id) => personRow(id, FF.button("Accept", { size: "small", busy: ui.busy?.[id], on: `flFriend:accept@${id}`, attrs: { "aria-label": `Accept ${person(id)?.name}` } }) + FF.button("Decline", { kind: "secondary", size: "small", enabled: !ui.busy?.[id], on: `flFriend:decline@${id}`, attrs: { "aria-label": `Decline ${person(id)?.name}` } }))).join(""), { extraTop: false }));
            }
            if (thisMonth.length) out.push(FF.section("This month", thisMonth.map((f) => liveCard(f)).join(""), { extraTop: requests.length > 0 }));
            if (lastMonth.length) out.push(FF.section("Last month", lastMonth.map((f) => finishedRow(f)).join(""), { extraTop: requests.length > 0 || thisMonth.length > 0 }));
            const add = friendLookup(ui) + (suggestions.length ? `<div class="t-label c-2" style="padding-top:8px">People you’ve fought with</div>${suggestions.map((id) => addRow(id, ui)).join("")}` : "");
            out.push(FF.section("Add friends", add, { extraTop: requests.length > 0 || thisMonth.length > 0 || lastMonth.length > 0 }));
            return FF.screen(out.join(""), { top: pushNav("Friends", summary ? friendsSubtitle(summary) : "") + (refreshing() ? refreshHeader(R.message || "Loading") : "") });
        },
    });

    // ─── State setter for links: #fights/~flState?filter=past&steps=syncing ... applies, then closes itself. ───
    // The list filter and the Health / character states have no URL in the app, so links reach them through this.
    const STREAKS = {
        running: [9940, 7220, 13150, 6980, 8450, 10260, 4760, 9310, 12880, 8050, 11430, 12020, 10870],
        none: [9940, 7220, 13150, 6980, 8450, 10260, 4760, 9310, 12880, 11050, 10420, 7430, 9870],
    };
    function streakData(kind) {
        const today = new Date();
        const recent = STREAKS[kind === "running" ? "running" : "none"].map((value, i) => ({ day: new Date(today.getFullYear(), today.getMonth(), today.getDate() - 13 + i, 12).toISOString().slice(0, 10), steps: value }));
        return { goal: 10000, current: kind === "running" ? 3 : 0, todayCounted: false, best: kind === "new" ? null : { days: 9, from: "2026-08-02", through: "2026-08-10" }, recent: kind === "new" ? recent.map((d) => ({ ...d, steps: null })) : recent };
    }
    screen("flState", {
        kind: "drawer",
        title: "State",
        render(p) {
            const d = D();
            if (p.filter) uiOf("fights").filter = p.filter;
            if (p.steps) d.stepsStatus = p.steps;
            if (p.today) { d.todaySteps = Number(p.today); d.stepsStatus = "steps"; }
            if (p.streak) d.streak = streakData(p.streak);
            if (p.character) d.customCharacter = p.character === "none" ? null : { id: "character-1", phase: p.character, seen: false, description: "A cowboy pig with a big hat and a sheriff star.", image: ["retryable", "needsSupport"].includes(p.character) ? null : asset("CharacterIdea-pig") };
            if (p.scheduled && !d.fights.some((f) => f.id === "scheduled")) {
                const start = Date.now() + 2 * DAY;
                d.fights.push(makeRound(d, { id: "scheduled", name: "Monday march", cast: [d.you, "nina", "sam"], totals: [0, 0, 0], start, end: start + 7 * DAY, extra: { serverState: "scheduled", actionText: "Carries the picnic basket", joinCode: "M4R7", inviter: d.you } }));
            }
            if (p.error) R.error = OFFLINE_REFRESH;
            setTimeout(() => {
                S.modals = S.modals.filter((m) => m.id !== "flState");
                render();
                if (p.refresh) ACT.flRefresh();
            }, 0);
            return "";
        },
    });

    // ═══ DATA: friend rounds, Fight Marc, requests, streak, suggestions, Health and character states ═══
    const YOUR_MONTH = 142300;
    function monthWindow(offset) {
        const now = new Date();
        return { start: new Date(now.getFullYear(), now.getMonth() + offset, 1).getTime(), end: new Date(now.getFullYear(), now.getMonth() + offset + 1, 1).getTime() };
    }
    // A fight in the shell's shape (shell-core makeData), for rounds this part owns.
    function makeRound(d, o) {
        const now = Date.now();
        const lengthDays = Math.max(1, Math.round((o.end - o.start) / DAY));
        const done = o.end <= now;
        const standings = o.cast.map((who, i) => ({
            person: who, score: o.totals[i], lastSyncedAt: o.totals[i] ? iso(now - (i + 1) * 420e3) : null,
            rank: 1 + o.totals.filter((t) => t > o.totals[i]).length, ...(done ? { finalStepsComplete: true } : {}),
        })).sort((a, b) => b.score - a.score);
        const dayCount = Math.min(lengthDays, Math.max(1, Math.ceil((Math.min(now, o.end) - o.start) / DAY)));
        const w = Array.from({ length: now < o.start ? 0 : dayCount }, (_, i) => [0.8, 1.1, 1.3, 0.9][i % 4]);
        const wTotal = sum(w) || 1;
        const days = w.map((_, day) => {
            const before = sum(w.slice(0, day));
            return { label: `Day ${day + 1}`, day: iso(o.start + day * DAY).slice(0, 10), scores: o.cast.map((who, i) => ({ person: who, value: Math.round((o.totals[i] * (before + w[day])) / wTotal) - Math.round((o.totals[i] * before) / wTotal) })) };
        });
        return {
            id: o.id, name: o.name, joinCode: null, lengthDays, windowStart: iso(o.start), windowEnd: iso(o.end),
            status: done ? "finished" : "live", serverState: done ? "final" : "live", standings, days, actionText: "",
            recurring: false, seriesId: null, inviter: d.you, metric: "steps", ...o.extra,
        };
    }
    function addFightsData(d, scenario) {
        const now = Date.now();
        const empty = scenario === "empty" || scenario === "loading";
        // People only the Friends screen knows: Maya asked you, Ivy and Max fought you once.
        Object.assign(d.people, {
            maya: { id: "maya", name: "Maya", handle: "@maya", initials: "MA", companion: "fox" },
            ivy: { id: "ivy", name: "Ivy", handle: "@ivy", initials: "IV", companion: "otter" },
            max: { id: "max", name: "Max", handle: "@max", initials: "MA", companion: "bear" },
        });
        d.friendsGroup = scenario === "loading" ? null : { requests: empty ? [] : ["maya"], suggestions: empty ? [] : ["ivy", "max"], asked: {} };
        d.hosted = scenario === "loading" ? null : { name: "Fight Marc" };
        d.stepsStatus = "steps";
        d.streak = streakData(scenario === "empty" ? "new" : "running");
        d.customCharacter = null;
        d.pendingJoinable = null;
        d.suggestedFights = empty ? [] : [
            { id: "suggested-october", fightId: "suggested-october", name: "October step-off", actionText: "", ownerHandle: "marc", memberCount: 24, startsAt: iso(now - 16 * DAY), endsAt: iso(now + 14 * DAY), recurring: true, alreadyMember: false, membershipState: null, joinCode: "OCT26", lengthDays: 30 },
            { id: "suggested-lunch", fightId: "suggested-lunch", name: "Steps Fight", actionText: "Buys the team coffee", ownerHandle: "theo", memberCount: 5, startsAt: iso(now - 2 * DAY), endsAt: iso(now + 5 * DAY), recurring: true, alreadyMember: false, membershipState: "deferred", joinCode: "L4P9", lengthDays: 7 },
        ];
        d.flVersion = 1;
        if (empty) return;
        // Monthly 1v1s with friends: this month you lead Leo and Theo, trail Nina. Last month: W, L, W.
        const month = monthWindow(0), last = monthWindow(-1);
        const tag = (ms) => new Date(ms).getMonth() + 1;
        for (const [friend, mine, theirs] of [["leo", YOUR_MONTH, 131800], ["nina", YOUR_MONTH, 151240], ["theo", YOUR_MONTH, 139860]]) {
            d.fights.push(makeRound(d, { id: `friend-${friend}-${tag(month.start)}`, name: "Friends", cast: [d.you, friend], totals: [mine, theirs], start: month.start, end: month.end, extra: { friends: true } }));
        }
        for (const [friend, mine, theirs] of [["leo", 268400, 251100], ["nina", 268400, 279950], ["theo", 268400, 262880]]) {
            d.fights.push(makeRound(d, { id: `friend-${friend}-${tag(last.start)}`, name: "Friends", cast: [d.you, friend], totals: [mine, theirs], start: last.start, end: last.end, extra: { friends: true } }));

        for (const [challenger, daysIn, mine, theirs] of [["theo", 26.5, 236100, 248520], ["sam", 11.5, 98700, 91240], ["nina", 3.5, 31200, 27940]]) {

            d.fights.push(makeRound(d, { id: `fight-marc-${challenger}`, name: "Fight Marc", cast: [d.you, challenger], totals: [mine, theirs], start, end: start + 30 * DAY, extra: { hostedRound: true, inviter: challenger, actionText: "" } }));
        }
    }

    for (const id of ["fights", "fightsSort", "streak", "companionLevels", "hosted", "friends"]) {
