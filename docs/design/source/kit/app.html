                if (theme === "day") document.documentElement.dataset.theme = "day";

        <style>

            :root, [data-theme="night"] { --googleFill: #FFFFFF; --googleInk: #1F1F1F; --googleBorder: #747775; --canvas: #0C0D08; --bg: #171912; --overlay: #1E211A; --card: #24271E; --control: #2E3227; --controlAlt: #383D2F; --text: #F0EDE1; --textDim: #D9D5C6; --textSecondary: #9E9C8E; --textTertiary: #8C8A7D; --textFaint: #6F6D62; --hairline: rgba(255,255,255,0.07); --line: rgba(255,255,255,0.10); --dash: rgba(255,255,255,0.13); --track: rgba(255,255,255,0.09); --chip: rgba(255,255,255,0.05); --disabledBg: rgba(255,255,255,0.03); --disabledLine: rgba(255,255,255,0.06); --disabledText: #5E5C53; --scrim: rgba(6,7,4,0.68); --mossFill: #35804F; --mossEdge: #4B9A65; --mossText: #8FD6A6; --mossSoft: #DCF0E2; --mossOn: #FFFFFF; --mossWash: rgba(53,128,79,0.18); --emberFill: #C2551D; --emberText: #EF9457; --emberOn: #FFFFFF; --emberWash: rgba(194,85,29,0.16); --gold: #F6C450; --goldInk: #42320A; --medalGold: #F6C450; --medalGoldWash: rgba(246,196,80,0.16); --medalSilver: #DDE2EA; --medalSilverWash: rgba(221,226,234,0.22); --medalBronze: #E0A06A; --medalBronzeWash: rgba(205,127,50,0.18); --tabBar: rgba(20,22,16,0.94); --chipInk: #B7B4A6; --chipEdgeOn: #3F9159; --monogram: #E3DFD0; --overlayLine: rgba(255,255,255,0.12); --switchOff: rgba(255,255,255,0.14); --dotIdle: rgba(255,255,255,0.18); --chipEdge: rgba(255,255,255,0.08); --skeleton: rgba(255,255,255,0.05); --skeletonHi: rgba(255,255,255,0.11); --handle: rgba(255,255,255,0.22); --heroTagFill: rgba(255,255,255,0.16); --heroAvatarPlate: rgba(0,0,0,0.28); --heroAvatarLine: rgba(255,255,255,0.25); --heroProgressTrack: rgba(0,0,0,0.32); --tabBarLine: rgba(255,255,255,0.07); --tabPillOn: rgba(53,128,79,0.24); --tabInkOn: #8FD6A6; --tabInkOff: #8C8A7D; --plateAlt: #333829; }
            [data-theme="day"] { --googleFill: #FFFFFF; --googleInk: #1F1F1F; --googleBorder: #747775; --canvas: #FDFAF4; --bg: #F6F3EB; --overlay: #FDFAF4; --card: #FDFAF4; --control: #F2EDE3; --controlAlt: #DFD8C6; --text: #33302B; --textDim: #33302B; --textSecondary: #6B665C; --textTertiary: rgba(51,48,43,0.55); --textFaint: rgba(51,48,43,0.42); --hairline: rgba(51,48,43,0.08); --line: rgba(51,48,43,0.12); --dash: #DFD8C6; --track: #F3EDE3; --chip: rgba(51,48,43,0.05); --disabledBg: rgba(51,48,43,0.04); --disabledLine: rgba(51,48,43,0.08); --disabledText: rgba(51,48,43,0.32); --scrim: rgba(51,48,43,0.35); --mossFill: #2F6B44; --mossEdge: #4B9A65; --mossText: #2F6B44; --mossSoft: #DCF0E2; --mossOn: #FFFFFF; --mossWash: #EDF3EA; --emberFill: #C2551D; --emberText: #8F5A30; --emberOn: #FFFFFF; --emberWash: #FAEDE2; --gold: #F6C450; --goldInk: #42320A; --medalGold: #8A6200; --medalGoldWash: #FBF0D2; --medalSilver: #5E6470; --medalSilverWash: #ECEDEF; --medalBronze: #8F5323; --medalBronzeWash: #F6E6D7; --tabBar: rgba(253,250,244,0.92); --chipInk: #6B665C; --chipEdgeOn: #2F6B44; --monogram: #33302B; --overlayLine: rgba(51,48,43,0.14); --switchOff: rgba(51,48,43,0.16); --dotIdle: rgba(51,48,43,0.20); --chipEdge: rgba(51,48,43,0.10); --skeleton: rgba(51,48,43,0.05); --skeletonHi: rgba(51,48,43,0.10); --handle: rgba(51,48,43,0.22); --heroTagFill: rgba(255,255,255,0.16); --heroAvatarPlate: rgba(0,0,0,0.28); --heroAvatarLine: rgba(255,255,255,0.25); --heroProgressTrack: rgba(0,0,0,0.32); --tabBarLine: #F0E9DB; --tabPillOn: #E4F3E9; --tabInkOn: #2F6B44; --tabInkOff: #6B6F66; --plateAlt: #EAE4D8; }
            /* The app bundles Nunito; the mirror loads the same files from the repo. */
            @font-face { font-family: Nunito; font-weight: 500; font-display: block; src: url("../../../../FitFight/Fonts/Nunito-Medium.ttf"); }
            @font-face { font-family: Nunito; font-weight: 600; font-display: block; src: url("../../../../FitFight/Fonts/Nunito-SemiBold.ttf"); }
            @font-face { font-family: Nunito; font-weight: 700; font-display: block; src: url("../../../../FitFight/Fonts/Nunito-Bold.ttf"); }
            @font-face { font-family: Nunito; font-weight: 800; font-display: block; src: url("../../../../FitFight/Fonts/Nunito-ExtraBold.ttf"); }
            @font-face { font-family: "Google Sans"; src: url("../../../../FitFight/Fonts/GoogleSans.ttf"); }
            /* iPhone 17, the Simulator's device: 402 x 874 points, 62 top and 34 bottom safe area. */
            :root { --phone-w: 402px; --phone-h: 874px; --safe-top: 62px; --safe-bottom: 34px; --ease: cubic-bezier(0.16, 1, 0.3, 1); --tabbar-h: 101px; }

            /* ═══ PAGE: phone on the left, map on the right ═══ */
            * { box-sizing: border-box; }
            html, body { margin: 0; height: 100%; }
            body { text-wrap: pretty; background: var(--canvas); color: var(--text); font: 700 13px/1.364 Nunito, -apple-system, sans-serif; font-variant-numeric: tabular-nums; -webkit-font-smoothing: antialiased; -webkit-text-size-adjust: 100%; }
            button { font: inherit; color: inherit; background: none; border: 0; padding: 0; margin: 0; cursor: pointer; text-align: inherit; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
            input, textarea { font: inherit; color: inherit; background: none; border: 0; outline: 0; padding: 0; margin: 0; width: 100%; resize: none; }
            h1, h2, h3, p, ul, ol { margin: 0; padding: 0; }
            img { display: block; }
            [hidden] { display: none !important; }
            .page { display: grid; grid-template-columns: auto minmax(300px, 420px); gap: 40px; justify-content: center; align-items: start; min-height: 100dvh; padding: 24px; }
            .phone-wrap { position: sticky; top: 24px; width: calc(var(--phone-w) * var(--zoom, 1)); height: calc(var(--phone-h) * var(--zoom, 1)); }
            .phone { position: relative; width: var(--phone-w); height: var(--phone-h); transform: scale(var(--zoom, 1)); transform-origin: top left; border-radius: 52px; overflow: hidden; background: #000; box-shadow: 0 0 0 1px var(--line); isolation: isolate; }
            body.shot { background: var(--bg); }
            body.shot .page { display: block; padding: 0; }
            body.shot .phone-wrap { position: static; margin: 0; }
            body.shot .phone { border-radius: 0; box-shadow: none; }
            body.shot .panel, body.shot .map-fab { display: none; }

            /* Map panel */
            .panel { position: sticky; top: 24px; max-height: calc(100dvh - 48px); overflow-y: auto; display: grid; gap: 14px; padding: 18px; border-radius: 22px; background: var(--overlay); border: 1px solid var(--overlayLine); scrollbar-width: thin; }
            .panel h1 { font-size: 20px; font-weight: 800; letter-spacing: -0.02em; }
            .panel .sub { font-size: 12px; color: var(--textSecondary); margin-top: 2px; }
            .panel .row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
            .panel .seg { display: inline-grid; grid-auto-flow: column; padding: 3px; border-radius: 999px; background: var(--chip); }
            .panel .seg button { min-height: 30px; padding: 0 12px; border-radius: 999px; font-size: 12px; font-weight: 800; color: var(--textSecondary); white-space: nowrap; }
            .panel .seg button[aria-pressed="true"] { background: var(--mossFill); color: var(--mossOn); }
            .panel select { font: 800 12px Nunito, sans-serif; color: var(--text); background: var(--control); border: 1px solid var(--line); border-radius: 999px; padding: 6px 10px; }
            .panel .small-btn { min-height: 30px; padding: 0 12px; border-radius: 999px; font-size: 12px; font-weight: 800; background: var(--control); border: 1px solid var(--line); }
            .panel .eyebrow { font-size: 11px; font-weight: 800; letter-spacing: 0.14em; text-transform: uppercase; color: var(--mossText); display: flex; gap: 10px; align-items: center; }
            .panel .eyebrow::after { content: ""; flex: 1; height: 1px; background: var(--track); }
            .panel details { border-radius: 16px; background: var(--card); border: 1px solid var(--hairline); }
            .panel summary { list-style: none; cursor: pointer; padding: 10px 14px; font-size: 14px; font-weight: 800; display: flex; justify-content: space-between; align-items: center; }
            .panel summary::-webkit-details-marker { display: none; }
            .panel summary small { font-size: 11px; color: var(--textFaint); font-weight: 800; }
            .panel .links { display: grid; padding: 0 6px 6px; }
            .panel .link { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: center; padding: 7px 8px; border-radius: 10px; font-size: 13px; font-weight: 700; color: var(--textDim); text-decoration: none; }
            .panel .link:hover { background: var(--chip); }
            .panel .link[aria-current="true"] { background: var(--mossWash); color: var(--mossText); }
            .panel .link small { font-size: 10px; font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase; color: var(--textFaint); }
            .panel .link .note { grid-column: 1 / -1; font-size: 11px; color: var(--textSecondary); font-weight: 700; margin-top: -2px; }
            .panel .feature { display: grid; gap: 8px; padding: 12px; border-radius: 16px; background: var(--mossWash); border: 1px solid color-mix(in srgb, var(--mossText) 25%, transparent); }
            .panel .feature b { font-size: 14px; }
            .panel .feature p { font-size: 12px; color: var(--textSecondary); }
            .panel .option { display: grid; gap: 2px; padding: 8px 10px; border-radius: 12px; background: var(--card); border: 1px solid var(--hairline); text-align: left; }
            .panel .option[aria-pressed="true"] { border-color: var(--mossEdge); box-shadow: inset 0 0 0 1px var(--mossEdge); }
            .panel .option small { font-size: 11px; color: var(--textSecondary); }
            .panel .where { font-size: 12px; color: var(--textSecondary); }
            .panel .where a { color: var(--mossText); }
            .panel .gap-list { font-size: 12px; color: var(--textSecondary); padding-left: 16px; }
            .map-fab { display: none; }
            @media (max-width: 860px) {
                .page { display: block; padding: 0; }
                .phone-wrap { position: relative; top: 0; margin: 0 auto; }
                .phone { border-radius: 0; box-shadow: none; }
                body.phone-fit { overflow: hidden; }
                .panel { position: fixed; z-index: 100; inset: auto 8px 8px 8px; top: 15dvh; max-height: none; transform: translateY(110%); transition: transform 0.32s var(--ease); }
                body.panel-open .panel { transform: none; }
                .map-fab { display: flex; position: fixed; z-index: 101; right: 12px; bottom: calc(110px * var(--zoom, 1)); align-items: center; gap: 6px; min-height: 40px; padding: 0 14px; border-radius: 999px; background: var(--text); color: var(--bg); font-size: 13px; font-weight: 800; box-shadow: 0 6px 20px rgba(0,0,0,0.35); }
            }

            /* ═══ PHONE CHROME: status bar, screen shell, tab bar ═══ */
            .app { position: absolute; inset: 0; background: var(--bg); color: var(--text); overflow: hidden; }
            .statusbar { position: absolute; z-index: 60; top: 0; left: 0; right: 0; height: 54px; display: flex; align-items: center; justify-content: space-between; padding: 6px 36px 0 52px; font: 600 17px/1 -apple-system, "SF Pro Text", sans-serif; letter-spacing: -0.02em; pointer-events: none; color: var(--text); }
            .statusbar .icons { display: flex; gap: 7px; align-items: center; }
            .statusbar svg { display: block; }
            .base { position: absolute; inset: 0; display: flex; flex-direction: column; background: var(--bg); transform-origin: 50% 0; transition: transform 0.32s var(--ease), border-radius 0.32s var(--ease), filter 0.32s var(--ease); }
            .base.recessed { transform: translateY(12px) scale(0.92); border-radius: 38px; overflow: hidden; filter: brightness(0.75); }
            .tab-body { position: relative; flex: 1; min-height: 0; }
            .env-strip { flex: none; display: flex; align-items: center; justify-content: center; gap: 6px; min-height: 32px; margin-top: var(--safe-top); font-size: 13px; font-weight: 800; }
            .env-strip + .tab-body { --safe-top: 0px; }

            /* FFScreen: pinned top (safe area + optional header) and a scroll view. */
            .ff-screen { position: absolute; inset: 0; display: flex; flex-direction: column; background: var(--bg); }
            .ff-top { flex: none; padding-top: var(--safe-top); min-height: calc(var(--safe-top) + 8px); background: var(--bg); position: relative; z-index: 2; }
            .ff-scroll { flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden; overscroll-behavior: contain; scrollbar-width: none; }
            .ff-scroll::-webkit-scrollbar { display: none; }
            .ff-body { display: flex; flex-direction: column; gap: 12px; padding: 16px 20px 112px; }
            .ff-body.no-clearance { padding-bottom: calc(20px + var(--safe-bottom)); }
            .ff-body > * { flex: none; }

            .tabbar { position: absolute; z-index: 20; left: 0; right: 0; bottom: 0; display: flex; padding: 8px 10px calc(8px + var(--safe-bottom)); background: var(--tabBar); border-top: 1px solid var(--tabBarLine); -webkit-backdrop-filter: blur(20px) saturate(1.4); backdrop-filter: blur(20px) saturate(1.4); }
            .tabbar button { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; color: var(--tabInkOff); font-size: 11px; font-weight: 700; line-height: 15px; }
            .tabbar .glyph { display: grid; place-items: center; width: 32px; height: 32px; border-radius: 9px; }
            .tabbar .glyph svg { width: 25px; height: 25px; margin: -2.5px; }
            .tabbar button[aria-current="page"] { color: var(--tabInkOn); font-weight: 800; }
            .tabbar button[aria-current="page"] .glyph { background: var(--tabPillOn); }

            /* ═══ MODAL LAYERS: sheets, drawers, alerts, action sheets, menus ═══ */
            .layer { position: absolute; inset: 0; z-index: 30; }
            .layer .scrim { position: absolute; inset: 0; background: var(--scrim); }
            .layer.sheet .scrim { background: rgba(0,0,0,0.25); }
            .sheet-card { --safe-top: 0px; position: absolute; left: 0; right: 0; bottom: 0; top: 62px; border-radius: 38px 38px 0 0; background: var(--bg); overflow: hidden; display: flex; flex-direction: column; transition: transform 0.32s var(--ease), filter 0.32s var(--ease); transform-origin: 50% 0; }
            .sheet-card.recessed { transform: translateY(-10px) scale(0.94); filter: brightness(0.75); }
            .sheet-card .ff-screen { position: absolute; inset: 0; }
            .sheet-grabber { position: absolute; z-index: 5; top: 5px; left: 50%; width: 36px; height: 5px; margin-left: -18px; border-radius: 999px; background: var(--handle); }
            .layer.cover .sheet-card { top: 0; border-radius: 0; --safe-top: 62px; }
            .drawer-card { --safe-top: 0px; position: absolute; left: 8px; right: 8px; bottom: 8px; max-height: calc(100% - 70px); border-radius: 38px; background: var(--bg); overflow: hidden; display: flex; flex-direction: column; }
            .drawer-card .ff-screen { position: relative; inset: auto; flex: 1; min-height: 0; }
            .drawer-card .ff-body { padding-bottom: calc(20px + 26px); }
            .drawer-card.medium { height: 50%; }
            .drawer-card.large { top: 62px; }
            .layer.enter .sheet-card, .layer.enter .drawer-card { animation: rise 0.36s var(--ease); }
            .layer.enter .scrim { animation: fade 0.25s ease-out; }
            .push-enter { animation: push 0.34s var(--ease); }
            @keyframes rise { from { transform: translateY(100%); } }
            @keyframes fade { from { opacity: 0; } }
            @keyframes push { from { transform: translateX(100%); } }
            @keyframes pop { from { opacity: 0; transform: scale(1.08); } }
            @media (prefers-reduced-motion: reduce) { .layer.enter .sheet-card, .layer.enter .drawer-card, .layer.enter .scrim, .push-enter, .sys-alert { animation: none !important; } }

            /* iOS system alert (SwiftUI .alert) */
            .sys-alert { position: absolute; left: 50%; top: 50%; width: 300px; transform: translate(-50%, -50%); padding: 22px 18px 16px; border-radius: 34px; background: color-mix(in srgb, var(--overlay) 92%, transparent); -webkit-backdrop-filter: blur(30px); backdrop-filter: blur(30px); box-shadow: 0 20px 60px rgba(0,0,0,0.35); font-family: -apple-system, "SF Pro Text", sans-serif; text-align: center; animation: pop 0.25s var(--ease); }
            .sys-alert h2 { font-size: 17px; font-weight: 600; line-height: 1.3; letter-spacing: -0.02em; }
            .sys-alert p { font-size: 13px; font-weight: 400; line-height: 1.38; margin-top: 6px; color: var(--text); }
            .sys-alert .sys-field { margin-top: 14px; padding: 10px 12px; border-radius: 12px; background: var(--chip); border: 1px solid var(--line); font-size: 15px; font-weight: 400; text-align: left; }
            .sys-alert .buttons { display: grid; gap: 8px; margin-top: 18px; }
            .sys-alert .buttons.two { grid-template-columns: 1fr 1fr; }
            .sys-alert button { min-height: 48px; border-radius: 999px; background: var(--chip); font-size: 17px; font-weight: 500; color: var(--text); text-align: center; }
            .sys-alert button.default { font-weight: 600; background: color-mix(in srgb, #0A84FF 85%, transparent); color: #fff; }
            .sys-alert button.destructive { color: #FF453A; }
            .sys-alert button:disabled { opacity: 0.35; cursor: default; }
            /* iOS action sheet (SwiftUI .confirmationDialog) */
            .sys-sheet { position: absolute; left: 8px; right: 8px; bottom: calc(8px + var(--safe-bottom) - 26px); display: grid; gap: 8px; font-family: -apple-system, "SF Pro Text", sans-serif; animation: rise 0.32s var(--ease); }
            .sys-sheet .group { border-radius: 26px; overflow: hidden; background: color-mix(in srgb, var(--overlay) 94%, transparent); -webkit-backdrop-filter: blur(30px); backdrop-filter: blur(30px); }
            .sys-sheet .head { padding: 14px 16px; text-align: center; font-size: 13px; color: var(--textSecondary); border-bottom: 1px solid var(--line); }
            .sys-sheet .head b { display: block; font-weight: 600; }
            .sys-sheet button { display: block; width: 100%; min-height: 56px; font-size: 18px; font-weight: 400; text-align: center; color: #0A84FF; border-top: 1px solid var(--line); }
            [data-theme="night"] .sys-sheet button { color: #0A84FF; }
            .sys-sheet .head + button, .sys-sheet .group > button:first-child { border-top: 0; }
            .sys-sheet button.destructive { color: #FF453A; }
            .sys-sheet button.cancel { font-weight: 600; }
            /* SwiftUI Menu popover */
            .sys-menu { position: absolute; z-index: 40; min-width: 220px; max-width: 280px; padding: 6px 0; border-radius: 22px; background: color-mix(in srgb, var(--overlay) 92%, transparent); -webkit-backdrop-filter: blur(30px); backdrop-filter: blur(30px); box-shadow: 0 16px 48px rgba(0,0,0,0.4); font-family: -apple-system, "SF Pro Text", sans-serif; animation: pop 0.2s var(--ease); }
            .sys-menu button { display: flex; width: 100%; align-items: center; justify-content: space-between; gap: 12px; min-height: 44px; padding: 0 16px; font-size: 17px; font-weight: 400; }
            .sys-menu button.destructive { color: #FF453A; }
            .sys-menu .sep { height: 8px; background: var(--chip); }
            .sys-menu .note { padding: 6px 16px 10px; font-size: 13px; color: var(--textSecondary); }
            .sys-menu button:disabled { color: var(--textFaint); cursor: default; }
            .sys-menu svg { width: 18px; height: 18px; }

            /* Toasts and overlays above everything */
            .toast-layer { position: absolute; z-index: 50; left: 20px; right: 20px; top: calc(var(--safe-top) + 8px); animation: fade 0.2s ease-out; }

            /* ═══ KIT: DesignSystem/Components.swift and Controls.swift ═══ */
            svg.i { width: 1em; height: 1em; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; display: inline-block; vertical-align: middle; }
            svg.i.f { fill: currentColor; stroke: none; }
            .t-metric { font-size: 34px; font-weight: 800; letter-spacing: -0.03em; }
            .t-title { font-size: 26px; font-weight: 800; letter-spacing: -0.025em; }
            .t-heading { font-size: 16px; font-weight: 800; letter-spacing: -0.01em; }
            .t-rowTitle { font-size: 15px; font-weight: 800; letter-spacing: -0.01em; }
            .t-button { font-size: 14px; font-weight: 800; }
            .t-buttonLarge { font-size: 16px; font-weight: 800; letter-spacing: 0.01em; }
            .t-buttonSmall { font-size: 12px; font-weight: 800; }
            .t-label { font-size: 13px; font-weight: 800; }
            .t-body { font-size: 13px; font-weight: 700; }
            .t-caption { font-size: 12px; font-weight: 700; }
            .t-micro { font-size: 11px; font-weight: 700; }
            .t-eyebrow { font-size: 12px; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; }
            .t-sectionEyebrow { font-size: 12px; font-weight: 800; letter-spacing: 0.16em; text-transform: uppercase; }
            .t-tag { font-size: 10px; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; }
            .c-text { color: var(--text); } .c-dim { color: var(--textDim); } .c-2 { color: var(--textSecondary); } .c-3 { color: var(--textTertiary); } .c-faint { color: var(--textFaint); }
            .c-moss { color: var(--mossText); } .c-ember { color: var(--emberText); } .c-gold { color: var(--gold); }
            .grow { flex: 1; min-width: 0; }
            .hstack { display: flex; align-items: center; }

            function icon(name, cls = "") {
                const body = ICONS[name];
                if (!body) return `<svg class="i ${cls}" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="3" stroke-dasharray="3 3"/><title>${esc(name)}</title></svg>`;

                return `<svg class="i ${filled ? "f" : ""} ${cls}" viewBox="0 0 24 24" aria-hidden="true">${body}</svg>`;
            }

            // ─── Registries ─────────────────────────────────────────────────
            // SCREENS[id] = { kind, title, render(p, ui, ctx), alert(p, ui), detent, tab }
            //   kind: "root" (a tab), "push" (NavigationStack), "sheet" (large), "drawer" (medium or fit), "cover" (full screen),
            //         "alert" (SwiftUI .alert), "actions" (SwiftUI .confirmationDialog), "flow" (replaces the whole app: welcome, onboarding)
            const SCREENS = {};
            const ACT = {};
            const LINKS = [];
            const VARIANTS = {};
            const DATA_HOOKS = [];
            const CSS = [];
            const screen = (id, def) => { SCREENS[id] = def; };
            const action = (name, fn) => { ACT[name] = fn; };
            // links("Fights", [["Fights list", "#fights", { note, scenario, kind }], ...])
            const links = (group, items) => LINKS.push({ group, items });
            const addCSS = (text) => CSS.push(text);
            // A feature still being designed. Remove the entry and every losing option once Marc picks one.
            const variant = (key, def) => { VARIANTS[key] = def; };
            const V = (key) => S.variants[key] || VARIANTS[key]?.options[0].id;

            // ─── State ──────────────────────────────────────────────────────
            const TABS = ["fights", "newFight", "feed", "feedback", "you"];
            const SCENARIOS = { populated: "Populated", tied: "Tied", solo: "Solo", deferred: "Next round", pending: "Pending final sync", finished: "Finished", empty: "Empty", loading: "Loading", offline: "Cached / offline" };
            const ACCOUNTS = { signedIn: "Signed in", welcome: "Signed out", onboarding: "Onboarding", restoring: "Restoring session", unavailable: "Account missing" };
            const S = {
                theme: document.documentElement.dataset.theme || "night",
                scenario: "populated",
                account: "signedIn",
                admin: false,
                environment: "staging",
                tab: "fights",
                stacks: { fights: [], newFight: [], feed: [], feedback: [], you: [] },
                rootParams: {},
                modals: [],
                flow: null,
                menu: null,
                toast: null,
                ui: {},
                variants: {},
                data: null,
            };
            const D = () => S.data;

            // ═══ FAKE DATA: the same people and fights as FitFight/CompanionPreview.swift ═══
            // Times are relative to now, like the Swift fixture, so "2 days left" stays true.
            // Areas add their own data (feedback board, changelog...) with DATA_HOOKS.push((d, scenario) => {...}).
            function makeData(scenario) {
                const now = Date.now();
                const people = [
                    { id: "alex", name: "Alex", handle: "@alex", initials: "AL", isYou: true, companion: "limited-tiger" },
                    { id: "leo", name: "Leo", handle: "@leo", initials: "LE", companion: "limited-silverback" },
                    { id: "nina", name: "Nina", handle: "@nina", initials: "NI", companion: "limited-capybara" },
                    { id: "sam", name: "Sam", handle: "@sam", initials: "SA", companion: "limited-hedgehog" },
                    { id: "theo", name: "Theo", handle: "@theo", initials: "TH", companion: "limited-panda" },
                ];
                const [alex, leo, nina, sam, theo] = people.map((p) => p.id);
                const weights = [0.8, 1.1, 1.3, 0.9];
                function fight(id, name, code, totals, cast, length, hoursLeft, extra = {}) {
                    const windowEnd = now + hoursLeft * HOUR;
                    const windowStart = windowEnd - length * DAY;
                    const standings = cast.map((person, i) => ({
                        person, score: totals[i], lastSyncedAt: iso(now - (i + 1) * 300e3),
                        rank: 1 + totals.filter((t) => t > totals[i]).length,
                    })).sort((a, b) => b.score - a.score);
                    const dayCount = Math.min(length, Math.max(1, length - Math.floor(hoursLeft / 24)));
                    const w = Array.from({ length: dayCount }, (_, i) => weights[i % 4]);
                    const wTotal = w.reduce((a, b) => a + b, 0);
                    const days = w.map((_, day) => {
                        const before = w.slice(0, day).reduce((a, b) => a + b, 0);
                        return {
                            label: `Day ${day + 1}`, day: iso(windowStart + day * DAY).slice(0, 10),
                            scores: cast.map((person, i) => ({ person, value: Math.round(totals[i] * (before + w[day]) / wTotal) - Math.round(totals[i] * before / wTotal) })),
                        };
                    });
                    return {
                        id, name, joinCode: code, lengthDays: length, windowStart: iso(windowStart), windowEnd: iso(windowEnd),
                        status: hoursLeft < 0 ? "finished" : "live", serverState: hoursLeft < 0 ? "final" : "live",
                        standings, days, actionText: "Buy the croissants", recurring: false, seriesId: null, inviter: null,
                        metric: "steps", ...extra,
                    };
                }
                const group = fight("group", "Step it Up", "K7M2", [28430, 25590, 22340, 20840], [alex, leo, nina, sam], 7, 54, { recurring: true, seriesId: "series-group", inviter: alex });
                const duel = fight("duel", "Roommate Rumble", "H8P4", [18420, 19680], [alex, theo], 7, 124, { actionText: "Takes the stairs all next week" });
                const weekend = fight("weekend", "Walk Wars", "R3V6", [12680, 11820, 11240, 10740], [alex, nina, leo, sam], 3, 32, { actionText: "Plans our next Sunday walk" });
                const showdown = fight("showdown", "Office Showdown", "D6N3", [84960, 85390, 79120], [alex, sam, theo], 14, 100, { actionText: "Brings donuts on Friday" });
                const invite = fight("invite", "The breakfast club", "B4K9", [0, 0], [alex, sam], 3, 60, { status: "invited", inviter: sam, invitePitch: "Sam invited you", recurring: true, offersJoinNext: true });
                invite.standings.find((s) => s.person === alex).invited = true;
                const finished = fight("finished", "Coffee is on you", "C9F2", [24100, 21900], [alex, theo], 3, -96);
                finished.standings.forEach((s) => (s.finalStepsComplete = true));
                // Five finished rounds of Step it Up won by Alex, so the live round shows a trophy x5.
                const history = [1, 2, 3, 4, 5].map((round) => {
                    const end = new Date(group.windowStart).getTime() - (round - 1) * 7 * DAY;
                    return { ...clone(group), id: `group-r${round}`, windowEnd: iso(end), windowStart: iso(end - 7 * DAY), status: "finished", serverState: "final", standings: group.standings.map((s) => ({ ...s, finalStepsComplete: true })) };
                });
                let fights = [group, duel, weekend, showdown, invite, finished, ...history];
                if (scenario === "empty" || scenario === "loading") fights = [];
                if (scenario === "tied") { duel.standings.forEach((s) => { s.score = 18420; s.rank = 1; }); fights = [duel]; }
                if (scenario === "solo") { duel.standings = duel.standings.filter((s) => s.person === alex); fights = [duel]; }
                if (scenario === "deferred") { group.standings.forEach((s) => (s.deferred = s.person === alex)); fights = [group, ...history]; }
                if (scenario === "pending") {
                    duel.status = "pending"; duel.serverState = "awaiting_final_sync";
                    duel.windowEnd = iso(now - HOUR); duel.windowStart = iso(now - HOUR - 7 * DAY); duel.graceEndsAt = iso(now + 23 * HOUR);
                    duel.standings.forEach((s) => (s.finalStepsComplete = s.person !== alex));
                    fights = [duel];
                }
                if (scenario === "finished") fights = [finished];

                const empty = scenario === "empty" || scenario === "loading";
                const posts = empty ? [] : [
                    { id: "post1", author: leo, fightId: "group", audience: "fight", body: "Nine floors of stairs at lunch. Enjoy the lead while it lasts.", createdAt: iso(now - 12 * 60e3), reactions: [{ emoji: "🔥", count: 4, mine: true }, { emoji: "😂", count: 2, mine: false }], commentCount: 2, media: [] },
                    { id: "post2", author: nina, fightId: "weekend", audience: "fight", body: "Sunday loop done. 14,210 steps and zero regrets.", createdAt: iso(now - 60 * 60e3), reactions: [{ emoji: "👏", count: 5, mine: false }], commentCount: 0, media: [] },

                // 31 days of Apple Health steps, oldest first; the last is today.
                const steps = [6210, 9480, 4120, 8760, 12300, 7050, 5430, 10900, 8120, 3980, 7760, 11450, 9020, 6640, 18420, 8310, 5870, 9940, 7220, 13150, 6980, 8450, 10260, 4760, 9310, 12880, 8050, 7430, 11020, 9870, 8432];

                // 18 finished fights, newest first: 12 won, 5 lost, 1 draw.
                const historyNames = ["Coffee run", "Weekend walkers", "Lunch laps", "No lift, no mercy", "The long way home", "The croissant run", "Park loops", "August challenge", "Sunrise club", "Heatwave", "Stair wars", "Bakery dash", "Commute clash", "Office stairs", "Beach week", "Rooftop run", "Hill repeats", "First blood"];
                const results = ["win", "loss", "draw", "loss", "win", "win", "win", "win", "loss", "win", "win", "win", "loss", "win", "loss", "win", "win", "win"];
                const profileHistory = historyNames.map((name, i) => ({ id: `h${i}`, name, endsAt: `2026-09-${String(Math.max(1, 18 - i)).padStart(2, "0")}`, result: results[i], placement: results[i] === "loss" ? 2 : 1, fieldSize: 2 }));
                const data = {
                    version: DATA_VERSION,

                    friends: empty ? [] : [leo, nina, sam, theo],
                    fights, posts, comments, steps, workouts, profileHistory,
                    todaySteps: scenario === "empty" ? 0 : 8432,
                    record: { played: 18, wins: 12, draws: 1, losses: 5 },
                    companion: "limited-tiger",
                    app: { marketing: "1.2.1", build: 233, environment: "staging", date: "17 Oct" },
                };
                for (const hook of DATA_HOOKS) hook(data, scenario);
                return data;
            }

            // Lookups every area uses.
            const person = (id) => D().people[id];
            const you = () => person(D().you);
            const fightById = (id) => D().fights.find((f) => f.id === id);
            const companionArt = (id, pose = "") => asset(`Companion-${id}${pose ? `-${pose}` : ""}`);

            // ═══ KIT: one function per DesignSystem component, named after the Swift type ═══
            // Every interactive element takes `on`: an action string the shell routes (see "Events" below).
            const on = (spec) => (spec ? ` data-on="${esc(spec)}"` : "");
            const FF = {
                // FFButton(kind: primary | ember | secondary | ghost, size: small | medium | large)
                // FFButton greys out only when not enabled; busy keeps its colours and just stops taps.
                button: (title, o = {}) => `<button type="button" class="ff-btn ${o.kind || "primary"} ${o.size || ""} ${o.full ? "full" : ""} ${o.cls || ""}"${on(o.on)}${o.enabled === false ? " disabled" : ""}${o.busy ? ' aria-busy="true"' : ""}${attrs(o.attrs)}>${o.busy ? '<span class="spinner"></span>' : ""}${o.icon ? icon(o.icon) : ""}${esc(title)}</button>`,
                // FFScreenCTA: the one full-width large primary per screen
                cta: (title, o = {}) => FF.button(title, { ...o, size: "large", full: true }),
                compose: (label, o = {}) => `<button type="button" class="ff-compose" aria-label="${esc(label)}"${on(o.on)}>${icon("plus")}</button>`,
                tag: (text, tone = "moss") => `<span class="ff-tag ${tone}">${esc(text)}</span>`,
                pill: (text, style = "softMoss") => `<span class="ff-pill ${style}">${esc(text)}</span>`,
                result: (r) => `<span class="ff-result ${r}">${{ W: "W", L: "L", D: "\u2013", P: "P" }[r]}</span>`,
                // FFAvatar: monogram on the control fill. Pass `img` for a photo or companion face.
                avatar: (monogram, o = {}) => {
                    const size = o.size || 44;
                    const font = size < 35 ? 11 : size < 41 ? 13 : size < 49 ? 14 : size < 61 ? 16 : 20;
                    return `<span class="ff-avatar ${o.selected ? "selected" : ""} ${o.dimmed ? "dimmed" : ""}" style="width:${size}px;height:${size}px;font-size:${font}px;${size >= 54 ? "color:var(--monogram)" : ""}">${o.img ? `<img src="${esc(o.img)}" alt="">` : esc(monogram)}</span>`;
                },
                card: (content, o = {}) => {
                    const style = `${o.padding != null ? `padding:${o.padding}px;` : ""}${o.fill ? `background:${o.fill};` : ""}${o.stroke ? `box-shadow:inset 0 0 0 1px ${o.stroke};` : ""}${o.style || ""}`;
                    return o.on
                        ? `<button type="button" class="ff-card ${o.cls || ""}" style="${style}"${on(o.on)}${attrs(o.attrs)}>${content}</button>`
                        : `<div class="ff-card ${o.cls || ""}" style="${style}"${attrs(o.attrs)}>${content}</div>`;
                },
                listRow: (o) => {
                    const inner = `${o.avatar || FF.avatar(o.monogram)}<span class="grow vstack" style="gap:2px"><span class="t-heading">${esc(o.title)}</span><span class="t-caption c-2">${esc(o.subtitle)}</span></span><span class="vstack" style="align-items:flex-end;gap:2px"><span style="font-size:18px;font-weight:800;letter-spacing:-0.02em" class="${o.metricIsGap ? (o.ahead === false ? "c-ember" : "c-moss") : ""}">${esc(o.metric)}</span>${o.metricIsGap ? `<span class="t-micro ${o.ahead === false ? "c-ember" : "c-moss"}">${o.ahead === false ? "steps behind" : "steps ahead"}</span>` : ""}</span>`;
                    return o.on ? `<button type="button" class="ff-listrow ff-press"${on(o.on)}>${inner}</button>` : `<div class="ff-listrow">${inner}</div>`;
                },
                notice: (text, o = {}) => `<div class="ff-notice ${o.tone || "ember"}">${o.icon ? `<span class="glyph">${icon(o.icon)}</span>` : ""}<span class="grow t-label">${esc(text)}</span>${o.actionTitle ? `<button type="button" class="ff-press"${on(o.on)}>${FF.pill(o.actionTitle, "solidMoss")}</button>` : ""}${o.dismiss ? `<button type="button" class="x" aria-label="Dismiss"${on(o.dismiss)}>${icon("xmark")}</button>` : ""}</div>`,
                grouped: (rows) => `<div class="ff-grouped">${rows.filter(Boolean).join('<div class="ff-divider"></div>')}</div>`,
                // FFGroupedRow: title, subtitle (moss by default), 36pt icon tile, trailing view
                groupedRow: (o) => {
                    const inner = `${o.icon ? `<span class="icon">${icon(o.icon)}</span>` : ""}<span class="grow vstack"><span class="title">${esc(o.title)}</span>${o.subtitle ? `<span class="subtitle" style="color:${o.enabled === false ? "var(--textTertiary)" : `var(--${{ moss: "mossText", ember: "emberText", gold: "gold", neutral: "textSecondary" }[o.subtitleTone || "moss"]})`}">${esc(o.subtitle)}</span>` : ""}</span>${o.trailing || ""}`;
                    return o.on ? `<button type="button" class="ff-grow ${o.enabled === false ? "disabled" : ""}"${on(o.on)}>${inner}</button>` : `<div class="ff-grow ${o.enabled === false ? "disabled" : ""}">${inner}</div>`;
                },
                chevron: () => `<span class="ff-chevron">${icon("chevron.right")}</span>`,
                divider: (inset = 16) => `<div class="ff-divider" style="margin:0 ${inset}px"></div>`,
                sectionHeader: (title) => `<div class="ff-section-header t-sectionEyebrow">${esc(title)}</div>`,
                section: (title, content, o = {}) => `<section class="ff-section ${o.extraTop === false ? "flush" : ""}">${FF.sectionHeader(title)}${content}</section>`,
                eyebrow: (text) => `<div class="t-eyebrow c-3">${esc(text)}</div>`,
                sheetHeader: (title, o = {}) => `<div class="ff-sheet-header"><h2 class="t-${o.role || "title"}">${esc(title)}</h2><button type="button" class="close"${on(o.on || "close")}>Close</button></div>`,
                screenTitle: (title, subtitle, trailing = "") => `<div class="hstack" style="align-items:flex-start;gap:12px"><div class="grow vstack" style="gap:3px"><h1 class="t-title">${esc(title)}</h1>${subtitle ? `<p class="t-body c-2">${esc(subtitle)}</p>` : ""}</div>${trailing}</div>`,
                switch: (isOn, o = {}) => `<button type="button" class="ff-switch" role="switch" aria-checked="${!!isOn}"${on(o.on)}${o.label ? ` aria-label="${esc(o.label)}"` : ""}></button>`,
                // FFSegmented: items [[value, title, count?]], selected value, `on` receives "...=value"
                segmented: (items, selected, o = {}) => `<div class="ff-seg ${o.fill ? "fill" : ""}" role="group">${items.map(([value, title, count]) => `<button type="button" aria-pressed="${value === selected}"${on(`${o.on}=${value}`)}>${esc(title)}${count ? `<span class="count">${count}</span>` : ""}</button>`).join("")}</div>`,
                // FFField around an input. `bind` stores the text in the screen's ui state (see "Events").
                field: (label, o = {}) => {
                    const value = o.value ?? "";
                    const input = o.multiline
                        ? `<textarea rows="${o.rows || 3}" placeholder="${esc(o.placeholder || "")}" data-bind="${esc(o.bind || "")}"${o.max ? ` maxlength="${o.max}"` : ""}${o.enabled === false ? " disabled" : ""}>${esc(value)}</textarea>`
                        : `<input type="${o.type || "text"}" placeholder="${esc(o.placeholder || "")}" value="${esc(value)}" data-bind="${esc(o.bind || "")}"${o.max ? ` maxlength="${o.max}"` : ""}${o.enabled === false ? " disabled" : ""} autocomplete="off" autocapitalize="${o.autocapitalize || "sentences"}" spellcheck="false">`;
                    return `<div class="ff-field ${o.state || ""} ${o.enabled === false ? "disabled" : ""}">${label ? `<label class="label">${esc(label)}</label>` : ""}<div class="box"${o.minHeight ? ` style="min-height:${o.minHeight}px;align-items:flex-start"` : ""}>${o.leading || ""}${input}${o.trailing || ""}</div>${o.help ? `<div class="help">${o.state === "error" ? icon("exclamationmark.circle") : ""}${esc(o.help)}</div>` : ""}${o.counter ? `<div class="counter">${esc(o.counter)}</div>` : ""}</div>`;
                },
                toast: (o) => `<div class="ff-toast ${o.raised === false ? "" : "raised"}" style="${o.tone && o.tone !== "neutral" ? `background:linear-gradient(color-mix(in srgb, var(--${{ moss: "mossFill", ember: "emberFill", gold: "gold" }[o.tone]}) 20%, transparent), color-mix(in srgb, var(--${{ moss: "mossFill", ember: "emberFill", gold: "gold" }[o.tone]}) 20%, transparent)), var(--overlay)` : ""}"><div class="top"><span class="glyph" style="background:var(--${{ moss: "mossFill", ember: "emberFill", gold: "gold", neutral: "chip" }[o.tone || "moss"]});color:var(--${{ moss: "mossOn", ember: "emberOn", gold: "goldInk", neutral: "textSecondary" }[o.tone || "moss"]})">${icon(o.icon || "checkmark")}</span><span class="grow vstack" style="gap:2px"><span class="${o.action ? "t-label" : "t-button"}">${esc(o.title)}</span><span class="t-caption c-2">${esc(o.message)}</span></span>${o.close ? `<button type="button" class="x" aria-label="Close"${on(o.close)}>${icon("xmark")}</button>` : ""}</div>${o.action ? `<button type="button" class="action"${on(o.action.on)}>${esc(o.action.title)}</button>` : ""}</div>`,
                empty: (o) => `<div class="ff-empty"><span class="glyph">${icon(o.icon)}</span><h3>${esc(o.title)}</h3><p>${esc(o.message)}</p>${o.actionTitle ? FF.button(o.actionTitle, { on: o.on }) : ""}</div>`,
                navDetail: (title, o = {}) => `<div class="ff-nav-detail">${o.back !== false ? FF.navGlyph("chevron.left", { on: o.back || "back" }) : ""}<span class="grow t-rowTitle" style="text-align:center">${esc(title)}</span></div>`,
                navGlyph: (name, o = {}) => `<button type="button" class="ff-nav-glyph ff-press"${on(o.on)} aria-label="${esc(o.label || name)}">${icon(name)}</button>`,
                duration: (options, selected, o = {}) => `<div class="ff-duration">${options.map(([value, title]) => `<button type="button" aria-pressed="${value === selected}"${on(`${o.on}=${value}`)}>${esc(title)}</button>`).join("")}</div>`,
                // FFSlideToConfirm: drag the knob across; a tap or keyboard press also confirms, like the VoiceOver action.
                slide: (title, o = {}) => `<div class="ff-slide ${o.enabled === false ? "disabled" : ""}" data-slide="${esc(o.on || "")}"><span class="label">${o.busy ? '<span class="spinner"></span>' : ""}${esc(title)}</span><button type="button" class="knob" aria-label="${esc(title)}">${icon("arrow.right")}</button></div>`,
                loading: () => `<div class="ff-loading"><span class="spinner"></span></div>`,
                skeleton: (height, o = {}) => `<div class="skeleton" style="height:${height}px;${o.style || ""}"></div>`,
                // FFScreen: pinned `top`, scrolling content with the tab bar clearance.
                screen: (content, o = {}) => `<div class="ff-screen"><div class="ff-top">${o.top || ""}</div><div class="ff-scroll" data-scroll><div class="ff-body ${o.clearance === false ? "no-clearance" : ""}" style="${o.bodyStyle || ""}">${content}</div></div>${o.bottom || ""}</div>`,
            };
            // Companion art as the app draws it (transparent PNG straight on the background, never in a box).
            const companionImg = (personOrId, o = {}) => {
                const p = typeof personOrId === "string" ? person(personOrId) || { companion: personOrId } : personOrId;
                // A custom character (companion "custom") carries its own portrait.
                const src = p.companion === "custom" ? p.companionImage || asset("CharacterIdea-pig") : companionArt(p.companion, o.pose);
                return `<img class="companion ${o.cls || ""}" src="${src}" alt="" style="width:${o.w || 60}px;height:${o.h || o.w || 60}px;${o.style || ""}">`;
            };

            // ═══ NAVIGATION ═══
            // The URL hash is the whole navigation state, so every screen, sheet and dialog has a link:
            //   #fights/fight?id=duel/~editFight?id=duel
            //   first part: a tab (fights, newFight, feed, feedback, you) or a flow screen (welcome, onboarding...)
            //   next parts: pushed screens; parts starting with ~ are modals, in order.
            const keyOf = (entry) => `${entry.id}${Object.keys(entry.p || {}).length ? `?${new URLSearchParams(entry.p)}` : ""}`;
            function encodeNav() {
                const head = S.flow ? keyOf(S.flow) : keyOf({ id: S.tab, p: S.rootParams[S.tab] });
                return "#" + [head, ...S.stacks[S.tab].map(keyOf), ...S.modals.map((m) => "~" + keyOf(m))].join("/");
            }
            function decodeNav(hash) {
                // Split before decoding: a parameter may hold an encoded "/" or "?" (a URL, a question).
                const parts = hash.replace(/^#/, "").split("/").filter(Boolean);
                const parse = (part) => { const at = part.indexOf("?"); const id = decodeURIComponent((at < 0 ? part : part.slice(0, at)).replace(/^~/, "")); return { id, p: Object.fromEntries(new URLSearchParams(at < 0 ? "" : part.slice(at + 1))) }; };
                const head = parse(parts.shift() || "fights");
                S.stacks = { fights: [], newFight: [], feed: [], feedback: [], you: [] };
                S.rootParams = {};
                S.modals = [];
                S.menu = null;
                if (TABS.includes(head.id)) { S.tab = head.id; S.rootParams[head.id] = head.p; S.flow = null; }
                else { S.flow = head; }
                for (const part of parts) (part.startsWith("~") ? S.modals : S.stacks[S.tab]).push(parse(part));
            }
            // Only a tap inside the phone animates (push slides in, a sheet rises). Back, tab switches and jumps
            // from the map are instant, like the app, which never jumps between screens.
            let animateNext = false;
            const push = (id, p = {}) => { S.stacks[S.tab].push({ id, p }); animateNext = true; render(); };
            const present = (id, p = {}) => { S.menu = null; S.modals.push({ id, p }); animateNext = true; render(); };
            const dismiss = () => { S.modals.pop(); render(); };
            const dismissAll = () => { S.modals = []; render(); };
            const back = () => { S.stacks[S.tab].pop(); render(); };
            // ContentView switches tab bodies, so leaving a tab drops its NavigationStack: every stack starts at its root.
            const setTab = (tab) => { S.tab = tab; S.flow = null; S.modals = []; S.stacks = { fights: [], newFight: [], feed: [], feedback: [], you: [] }; render(); };
            const go = (hash) => { decodeNav(hash); render(); };
            const toast = (o, ms = 4000) => { S.toast = o; render(); clearTimeout(toast.timer); if (ms) toast.timer = setTimeout(() => { S.toast = null; render(); }, ms); };
            // SwiftUI Menu: anchored to the tapped button. items: [{ title, icon, on, destructive, disabled }], { note } or "-".
            const menu = (items, el) => {
                const phoneBox = phone.getBoundingClientRect();
                const box = el.getBoundingClientRect();
                const zoom = phoneBox.width / phone.offsetWidth;
                S.menu = { items, x: (box.right - phoneBox.left) / zoom, left: (box.left - phoneBox.left) / zoom, y: (box.bottom - phoneBox.top) / zoom };
                render();
            };
            const uiOf = (key) => (S.ui[key] ||= {});

            // ═══ EVENTS ═══
            // data-on="spec" on any element. A spec is one of:
            //   push:screen?k=v · present:screen?k=v · go:#hash · tab:fights · back · close · closeAll
            //   set:key=value   (sets this screen's ui[key]; "true"/"false"/numbers are parsed)
            //   toggle:key      (flips this screen's ui[key])
            //   toast:Title|Message
            //   name:arg        (calls ACT.name(arg, ctx) from an area)
            // Several specs can be chained with " ; ".
            // data-bind="key" on an input stores its text in this screen's ui[key] and re-renders.
            function parseValue(v) { return v === "true" ? true : v === "false" ? false : v !== "" && !isNaN(v) ? Number(v) : v; }
            function run(spec, el, event) {
                const host = el.closest("[data-key]");
                const ctx = { key: host?.dataset.key, ui: host ? uiOf(host.dataset.key) : {}, el, event, p: host ? JSON.parse(host.dataset.p || "{}") : {} };
                for (const one of spec.split(" ; ")) {
                    const [name, ...rest] = one.split(":");
                    const arg = rest.join(":");
                    const [target, query] = arg.split("?");
                    const params = Object.fromEntries(new URLSearchParams(query || ""));
                    if (name === "push") push(target, params);
                    else if (name === "present") present(target, params);
                    else if (name === "go") go(arg);
                    else if (name === "tab") setTab(arg);
                    else if (name === "back") back();
                    else if (name === "close") dismiss();
                    else if (name === "closeAll") dismissAll();
                    else if (name === "set") { const [k, v] = arg.split("="); ctx.ui[k] = parseValue(v); render(); }
                    else if (name === "toggle") { ctx.ui[arg] = !ctx.ui[arg]; render(); }
                    else if (name === "toast") { const [title, message] = arg.split("|"); toast({ title, message, icon: "checkmark", tone: "moss" }); }
                    else if (ACT[name]) ACT[name](arg, ctx);
                    else toast({ title: "Not mirrored yet", message: `No action named “${name}”.`, icon: "exclamationmark.triangle", tone: "ember" });
                }
            }
            const phone = document.getElementById("phone");
            phone.addEventListener("click", (event) => {
                if (S.menu && !event.target.closest(".sys-menu")) { S.menu = null; render(); if (!event.target.closest("[data-on]")) return; }
                const el = event.target.closest("[data-on]");
                if (!el || el.disabled || el.getAttribute("aria-busy") === "true" || el.closest("[data-slide]")) return;
                event.preventDefault();
                run(el.dataset.on, el, event);
            });
            phone.addEventListener("input", (event) => {
                const el = event.target.closest("[data-bind]");
                if (!el || !el.dataset.bind) return;
                const host = el.closest("[data-key]");
                uiOf(host.dataset.key)[el.dataset.bind] = el.value;
                render();
            });
            // Slide to confirm: drag the knob; past 85% it fires the action.
            phone.addEventListener("pointerdown", (event) => {
                const knob = event.target.closest(".ff-slide .knob");
                if (!knob) return;
                const track = knob.parentElement;
                if (track.classList.contains("disabled")) return;
                const zoom = phone.getBoundingClientRect().width / phone.offsetWidth;
                const travel = track.offsetWidth - 16 - knob.offsetWidth;
                const startX = event.clientX;
                let moved = 0;
                knob.setPointerCapture(event.pointerId);
                const move = (e) => { moved = Math.min(travel, Math.max(0, (e.clientX - startX) / zoom)); knob.style.transform = `translateX(${moved}px)`; track.querySelector(".label").style.opacity = String(1 - moved / travel); };
                const up = () => {
                    knob.removeEventListener("pointermove", move);
                    knob.removeEventListener("pointerup", up);
                    if (moved < 4 || moved >= travel * 0.85) { knob.style.transform = `translateX(${travel}px)`; run(track.dataset.slide, track, event); }
                    else { knob.style.transition = "transform 0.22s var(--ease)"; knob.style.transform = ""; track.querySelector(".label").style.opacity = ""; }
                };
                knob.addEventListener("pointermove", move);
                knob.addEventListener("pointerup", up);
            });

            // ═══ RENDER ═══
