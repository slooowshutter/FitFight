                <p class="fb-text">${esc(post.body)}</p>
                ${post.media.length ? `<div class="vstack" style="gap:8px">${mediaFull(post.media, ui)}</div>` : ""}
                ${S.admin && !post.archived ? `${ui.launched ? FF.notice("Cursor is on it. A pull request will show up when it’s done.", { tone: "moss", icon: "sparkles", actionTitle: "Open", on: `present:sysExternal?url=${encodeURIComponent(ui.launched)}` }) : ""}${FF.button(ui.launching ? "Sending…" : "Send to Cursor", { kind: "secondary", full: true, enabled: !ui.launching, on: `fbCursor:${post.id}` })}` : ""}
                <div style="padding-top:8px">${FF.sectionHeader("Comments")}</div>
                ${fb.loading && !comments.length ? PROGRESS : !comments.length ? '<p class="t-caption c-2">No comments yet.</p>' : ""}
                ${comments.map((c) => `<div class="fb-comment"><div class="hstack">${identity(c.author, "t-label c-moss")}<span class="grow"></span><span class="t-caption c-faint">${esc(relativeNamed(c.createdAt))}</span></div><p class="fb-text">${esc(c.body)}</p></div>`).join("")}` : "";
            return `<div class="fb-tab">
                ${hubBar(post)}
                <div class="fb-detail">
                    <div class="fb-nav">${FF.navDetail(post?.title || "Request")}</div>
                    ${fb.error ? `<div class="fb-error top">${FF.notice(fb.error, { tone: "ember", icon: "exclamationmark.triangle" })}</div>` : ""}
                    <div class="fb-scroll" data-scroll><div class="fb-stack ${post?.archived ? "" : "with-composer"}">${stack}</div></div>
                    ${post?.archived ? "" : `<div class="fb-composer"><div class="fb-input"><textarea rows="${lines}" placeholder="Add a comment" data-bind="comment" maxlength="2000">${esc(ui.comment || "")}</textarea></div>${FF.button("Post", { enabled: canComment, on: `fbComment:${p.id}` })}</div>`}
                </div>
            </div>`;
        },
    });

    // ─── Drawer: RequestFiltersSheet (560pt / large) ────────────────
    screen("requestFilters", {
        kind: "drawer",
        height: 560,
        render: (p, ui) => {
            const draft = (ui.draft ||= { ...filterOf() });
            const choices = [
                FF.section("Status", `<div>${FF.segmented([["open", "Open"], ["archived", "Archived"]], draft.status, { on: "fbDraft:status" })}</div>`, { extraTop: false }),
                FF.section("Type", `<div>${FF.segmented([["all", "All"], ["feature", "Features"], ["bug", "Bugs"]], draft.type, { on: "fbDraft:type" })}</div>`, { extraTop: false }),
                FF.section("Sort by", FF.grouped(SORTS.map(([value, title]) => FF.groupedRow({ title, trailing: `<span class="fb-check" style="opacity:${draft.sort === value ? 1 : 0}">${icon("checkmark")}</span>`, on: `fbDraft:sort=${value}` }))), { extraTop: false }),
            ].join("");
            return `<div class="fb-sheet">${FF.sheetHeader("Sort & filter")}<div class="fb-sheet-scroll" data-scroll><div class="vstack" style="gap:16px">${choices}</div></div>${FF.cta("Show feedback", { on: "fbApplyFilters" })}<button type="button" class="fb-reset t-label c-2" data-on="fbResetDraft">Reset to defaults</button></div>`;
        },
    });

    // ─── Drawer: RequestArchiveSheet (medium / large) ───────────────
    screen("requestArchive", {
        kind: "drawer",
        detent: "medium",
        // interactiveDismissDisabled while saving
        dismissable: (p, ui) => !ui.busy,
        render: (p, ui) => {
            const post = FB().posts.find((x) => x.id === p.id);
            const title = post?.archived ? "Reopen feedback" : "Archive feedback";
            const head = `<div class="hstack"><h2 class="t-title grow">${title}</h2><button type="button" class="fb-cancel t-label c-moss" data-on="close"${ui.busy ? " disabled" : ""}>Cancel</button></div>`;
            if (!post) return `<div class="fb-sheet">${head}</div>`;
            const reason = ui.reason || "";
            const lines = Math.min(6, Math.max(3, reason.split("\n").reduce((n, line) => n + Math.max(1, Math.ceil(line.length / 40)), 0)));
            return `<div class="fb-sheet">${head}<div class="fb-sheet-scroll" data-scroll><div class="vstack" style="gap:16px">
                <div class="t-heading">${esc(post.title)}</div>
                <p class="t-body c-2">${post.archived ? "Reopen this feedback with its existing votes and discussion. People can vote and comment again." : "Keep this feedback, its votes, and its discussion in Archived. New votes and comments will close. You can reopen it later."}</p>
                ${post.archived ? "" : `<div class="fb-reason"><textarea rows="${lines}" placeholder="Public reason (optional)" data-bind="reason"${ui.busy ? " disabled" : ""}>${esc(reason)}</textarea></div>`}
                ${FB().error ? FF.notice(FB().error, { tone: "ember", icon: "exclamationmark.triangle" }) : ""}
            </div></div>${FF.cta(title, { enabled: reason.trim().length <= 280 && !ui.busy, busy: ui.busy, on: `fbArchive:${post.id}` })}</div>`;
        },
    });

    // ─── Dialog: "Delete request?" (board and detail) ───────────────
    screen("requestDelete", {
        kind: "actions",
        alert: (p) => ({
            title: "Delete request?",
            message: "This removes the request, comments, and votes for everyone. This cannot be undone.",
            buttons: [{ title: "Delete", role: "destructive", on: `fbDelete:${p.id}` }, { title: "Cancel", role: "cancel" }],
        }),
    });

    // ─── Sheet: ComposeRequestView ──────────────────────────────────
    const FILE_TYPES = ["txt", "csv", "pdf", "json"];
    screen("requestCompose", {
        kind: "sheet",
        render: (p, ui) => {
            ui.kind ||= "bug";
            const attachments = (ui.attachments ||= []);
            const remaining = Math.max(0, 8 - attachments.length);
            const title = ui.title || "";
            const details = ui.details || "";
            const canPost = title.trim().length >= 1 && details.trim().length >= 1 && !ui.saving;
            const indexed = attachments.map((a, i) => ({ ...a, i }));
            const photos = indexed.filter((a) => a.kind === "photo");
            const lines = Math.min(12, Math.max(6, details.split("\n").reduce((n, line) => n + Math.max(1, Math.ceil(line.length / 38)), 0)));
            const attachDisabled = remaining === 0 || ui.saving ? " disabled" : "";
            // FeedbackStore.error is shared, so a failed board load or post shows here too.
            const stack = [
                FB().error ? FF.notice(FB().error, { tone: "ember", icon: "exclamationmark.triangle" }) : "",
                '<p class="t-body c-2" style="line-height:20.7px">Posted with your username. Signed-in people can see it, upvote, and comment.</p>',
                `<div>${FF.segmented([["bug", "Bug"], ["feature", "Feature"]], ui.kind, { on: "set:kind" })}</div>`,
                FF.field("Title", { bind: "title", value: title, placeholder: "Short and specific", counter: `${title.length}/80`, max: 80 }),
                FF.field("Details", { bind: "details", value: details, placeholder: "Describe it", multiline: true, rows: lines, max: 2000, minHeight: 120, help: "What happened, or what you want. Be specific.", counter: `${details.length}/2000` }),
                photos.length ? `<div class="fb-attach-photos">${photos.map((a) => `<button type="button" aria-label="Remove photo" data-on="fbRemove:${a.i}"><img src="${esc(a.url)}" alt=""></button>`).join("")}</div>` : "",
                ...indexed.filter((a) => a.kind === "video").map((a) => `<button type="button" class="fb-attach-row" data-on="fbRemove:${a.i}"><span class="c-moss">${icon("video.fill")}</span><span class="t-caption c-2">Video</span></button>`),
                ...indexed.filter((a) => a.kind === "file").map((a) => `<button type="button" class="fb-attach-row" data-on="fbRemove:${a.i}"><span class="c-moss">${icon("doc.fill")}</span><span class="t-caption c-2 ellipsis">${esc(a.name)}</span></button>`),
                '<p class="t-caption c-2">Add a photo, a video, or any file.</p>',
                `<div class="hstack" style="gap:16px"><button type="button" class="fb-attach-btn t-label c-moss" data-on="fbMedia"${attachDisabled}>${icon("photo.on.rectangle.angled")}Media</button><button type="button" class="fb-attach-btn t-label c-moss" data-on="fbFile"${attachDisabled}>${icon("paperclip")}File</button></div>`,
            ].join("");
            return `<div class="fb-compose">
                <div class="fb-compose-head">${FF.sheetHeader("New request")}</div>
                <div class="fb-scroll" data-scroll><div class="fb-compose-stack">${stack}</div></div>
                <div class="fb-compose-cta">${FF.cta(ui.saving ? "Posting…" : "Post", { enabled: canPost, busy: ui.saving, on: "fbPost" })}</div>
            </div>`;
        },
    });

    // ─── Actions ────────────────────────────────────────────────────
    const topModalIs = (id) => S.modals[S.modals.length - 1]?.id === id;
    const detailKey = (id) => keyOf({ id: "requestDetail", p: { id } });

    action("fbOpen", (id) => { S.ui[detailKey(id)] = {}; push("requestDetail", { id }); });
    action("fbProfile", (id) => (id === D().you ? setTab("you") : present("profileSheet", { id })));
    action("fbVote", (id) => {
        const post = FB().posts.find((p) => p.id === id);
        if (!post || post.archived) return;
        post.voted = !post.voted;
        post.voteCount += post.voted ? 1 : -1;
        render();
    });
    // RequestPostMenu: Report and Hide for other people's posts, Archive/Reopen for canArchive, Delete for canDelete.
    action("fbMenu", (arg, ctx) => {
        const [id, where] = arg.split("|");
        const post = FB().posts.find((p) => p.id === id);
        if (!post) return;
        menu([
            ...(!mine(post) ? [{ title: "Report", on: `fbReport:${id}` }, { title: "Hide this person", destructive: true, on: `fbHide:${id}|${where}` }] : []),
            ...(S.admin ? [{ title: post.archived ? "Reopen feedback" : "Archive feedback", icon: post.archived ? "arrow.uturn.backward" : "archivebox", on: `fbArchiveOpen:${id}` }] : []),
            ...(mine(post) || S.admin ? [{ title: "Delete request", destructive: true, on: `present:requestDelete?id=${id}` }] : []),
        ], ctx.el);
    });
    // The app sends the report and shows nothing.
    action("fbReport", (id) => { S.menu = null; FB().reported.push(id); render(); });
    action("fbHide", (arg) => {
        const [id, where] = arg.split("|");
        const post = FB().posts.find((p) => p.id === id);
        S.menu = null;
        if (post && !FB().hidden.includes(post.author)) FB().hidden.push(post.author);
        if (where === "hub") back();
        else render();
    });
    action("fbArchiveOpen", (id) => { S.ui[keyOf({ id: "requestArchive", p: { id } })] = {}; present("requestArchive", { id }); });
    action("fbArchive", (id, ctx) => {
        const post = FB().posts.find((p) => p.id === id);
        if (!post || ctx.ui.busy) return;
        ctx.ui.busy = true;
        render();
        setTimeout(() => {
            post.archived = !post.archived;
            post.archiveReason = post.archived ? (ctx.ui.reason || "").trim() || null : null;
            ctx.ui.busy = false;
            if (topModalIs("requestArchive")) dismiss();
            else render();
        }, 700);
    });
    action("fbDelete", (id) => {
        const fb = FB();
        fb.posts = fb.posts.filter((p) => p.id !== id);
        fb.comments = fb.comments.filter((c) => c.postId !== id);
        S.modals.pop();
        const stack = S.stacks.feedback;
        if (stack[stack.length - 1]?.id === "requestDetail" && stack[stack.length - 1].p.id === id) stack.pop();
        render();
    });
    action("fbComment", (id, ctx) => {
        const post = postOf(id);
        const body = (ctx.ui.comment || "").trim();
        if (!post || post.archived || body.length < 2 || body.length > 500) return;
        FB().comments.push({ id: `fc${Date.now()}`, postId: id, author: D().you, body, createdAt: iso(Date.now()) });
        post.commentCount += 1;
        ctx.ui.comment = "";
        document.activeElement?.blur?.();
        render();
    });
    action("fbCursor", (id, ctx) => {
        if (ctx.ui.launching) return;
        ctx.ui.launching = true;
        render();
        setTimeout(() => { ctx.ui.launching = false; ctx.ui.launched = `https://cursor.com/agents?id=bc-${id}`; render(); }, 1200);
    });

    // Filters: the drawer edits a draft; "Show feedback" applies it, Close drops it.
    action("fbFilters", () => { S.ui[keyOf({ id: "requestFilters", p: {} })] = { draft: { ...filterOf() } }; present("requestFilters"); });
    action("fbDraft", (arg, ctx) => { const [key, value] = arg.split("="); ctx.ui.draft[key] = value; render(); });
    action("fbResetDraft", (arg, ctx) => { ctx.ui.draft = { ...DEFAULT_FILTER }; render(); });
    action("fbApplyFilters", (arg, ctx) => { uiOf("feedback").filter = { ...ctx.ui.draft }; dismiss(); });

    // Compose: a fresh sheet every time, like SwiftUI's sheet state.
    const composeUI = () => uiOf(keyOf({ id: "requestCompose", p: {} }));
    action("fbCompose", () => { S.ui[keyOf({ id: "requestCompose", p: {} })] = {}; present("requestCompose"); });
    action("fbMedia", () => {
        const remaining = 8 - (composeUI().attachments || []).length;
        if (remaining <= 0) return;
        // Until the system picker is drawn, a tap counts as picking two photos (same as the Feed composer).
        if (SCREENS.sysPhotoPicker) present("sysPhotoPicker", { max: remaining, then: "fbAddMedia" });
        else ACT.fbAddMedia("2");
    });
    // Called back by the system photo picker with what was picked: photo URLs (comma separated) or a count.
    action("fbAddMedia", (arg) => {
        const ui = composeUI();
        const list = (ui.attachments ||= []);
        const urls = String(arg || "").split(",").map((s) => s.trim()).filter((s) => /[/.]/.test(s));
        const picked = urls.length ? urls : Array.from({ length: Math.max(1, Number(arg) || 2) }, (_, i) => `${SHOTS}${["01-fights", "05-you", "06-feed", "03-new"][(list.length + i) % 4]}.jpg`);
        for (const url of picked) if (list.length < 8) list.push(/\.(mov|mp4|m4v)$/i.test(url) ? { kind: "video", url } : { kind: "photo", url });
        render();
    });
    action("fbFile", () => {
        const list = (composeUI().attachments ||= []);
        if (list.length >= 8) return;
        // copyImportedFile renames the pick to a temporary UUID file, and the row and upload use that name.
        const name = "xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g, (c) => { const r = (Math.random() * 16) | 0; return (c === "x" ? r : (r & 3) | 8).toString(16); }).toUpperCase();
        list.push({ kind: "file", name: `${name}.${FILE_TYPES[list.filter((a) => a.kind === "file").length % FILE_TYPES.length]}` });
        render();
    });
    action("fbRemove", (index) => { composeUI().attachments.splice(Number(index), 1); render(); });
    action("fbPost", (arg, ctx) => {
        const ui = ctx.ui;
        const title = (ui.title || "").trim();
        const body = (ui.details || "").trim();
        if (!title || !body || ui.saving) return;
        ui.saving = true;
        render();
        setTimeout(() => {
            // Offline the upload fails: the sheet stays open with the error notice above.
            if (FB().error) { ui.saving = false; render(); return; }
            FB().posts.push({
                id: `req-${Date.now()}`, kind: ui.kind, title, body, voteCount: 0, commentCount: 0, voted: false, author: D().you,
                createdAt: iso(Date.now()), archived: false, archiveReason: null,
                media: (ui.attachments || []).map((a) => (a.kind === "photo" ? { kind: "photo", url: a.url, ...(a.url.startsWith(SHOTS) ? { width: 1320, height: 2868 } : {}) } : a.kind === "video" ? { kind: "video", name: "Video" } : { kind: "file", name: a.name, url: `https://fitfight.app/media/${a.name}` })),
            });
            // onPosted: the board switches to Open and the sheet closes.
            filterOf().status = "open";
            S.ui[keyOf({ id: "requestCompose", p: {} })] = {};
            if (topModalIs("requestCompose")) dismiss();
            else render();
        }, 700);
    });

    // ─── Styles ─────────────────────────────────────────────────────
    addCSS(`
        .fb-tab { position: absolute; inset: 0; display: flex; flex-direction: column; background: var(--bg); }
        .fb-hub { flex: none; display: flex; align-items: center; gap: 12px; padding: calc(var(--safe-top) + 8px) 20px 8px; }
        .fb-more { flex: none; display: grid; place-items: center; width: 32px; height: 32px; color: var(--textFaint); }
        .fb-more svg { width: 16px; height: 16px; }
        .fb-countrow { flex: none; display: flex; align-items: center; padding: 0 20px 12px; }
        .fb-filter { flex: none; display: grid; place-items: center; width: 36px; height: 44px; color: var(--mossText); }
        .fb-filter svg { width: 17px; height: 17px; stroke-width: 2; }
        .fb-error { flex: none; padding: 0 20px 8px; }
        .fb-error.top { padding: 8px 20px 0; }
        .fb-scroll { flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden; overscroll-behavior: contain; scrollbar-width: none; }
        .fb-scroll::-webkit-scrollbar { display: none; }
        .fb-list { display: flex; flex-direction: column; gap: 10px; padding: 0 20px calc(24px + var(--tabbar-h)); }
        .fb-spinner { display: grid; place-items: center; padding-top: 40px; }
        .fb-progress { width: 20px; height: 20px; stroke: var(--textSecondary); stroke-width: 2.3; stroke-linecap: round; animation: fb-tick 0.8s steps(8) infinite; }
        @keyframes fb-tick { to { transform: rotate(360deg); } }

        .fb-row { display: flex; align-items: flex-start; gap: 10px; padding: 14px; background: var(--card); box-shadow: inset 0 0 0 1px var(--hairline); border-radius: 22px; }
        .fb-vote { flex: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; width: 44px; height: 44px; color: var(--textSecondary); transition: transform 0.15s var(--ease); }
        .fb-vote:active:not(:disabled) { transform: scale(0.92); }
        .fb-vote:disabled { cursor: default; }
        .fb-vote.on { color: var(--mossText); }
        /* SF circle symbols are about as wide as their point size (22pt bold here); the 24-unit circle is 20 units. */
        .fb-vote svg { width: 26px; height: 26px; stroke-width: 2.1; }
        .fb-vote span { font-size: 11px; font-weight: 800; line-height: 15px; }
        .fb-row-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px; }
        .fb-row-head { display: flex; align-items: center; gap: 8px; }
        .fb-open { display: flex; flex-direction: column; align-items: flex-start; gap: 6px; width: 100%; text-align: left; }
        .fb-clamp { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden; }
        .fb-thumbs { display: flex; gap: 6px; }
        .fb-thumbs img, .fb-thumbs .tile { width: 44px; height: 44px; border-radius: 8px; background: var(--control); object-fit: cover; }
        .fb-thumbs .tile { display: grid; place-items: center; }
        .fb-thumbs .tile svg { width: 17px; height: 17px; }
        .fb-foot { display: flex; align-items: center; gap: 4px; font-size: 11px; font-weight: 700; color: var(--textFaint); }
        .fb-ident { min-height: 44px; }
        .fb-count-link { min-width: 44px; min-height: 44px; text-align: center; }

        /* The hub bar stays put; only the detail slides in, like the inner NavigationStack. */
        .push-enter:has(.fb-detail) { animation: none; }
        .push-enter .fb-detail { animation: push 0.34s var(--ease); }
        .fb-detail { position: relative; flex: 1; min-height: 0; display: flex; flex-direction: column; background: var(--bg); }
        .fb-nav { flex: none; padding: 12px 20px 0; }
        .fb-stack { display: flex; flex-direction: column; align-items: stretch; gap: 14px; padding: 16px 20px calc(24px + var(--tabbar-h)); }
        .fb-stack.with-composer { padding-bottom: calc(24px + 70px + var(--tabbar-h)); }
        .fb-stack > * { flex: none; }
        .fb-upvotes { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 800; color: var(--textSecondary); }
        .fb-upvotes.on { color: var(--mossText); }
        .fb-upvotes:disabled { cursor: default; }
        .fb-upvotes svg { width: 16px; height: 16px; stroke-width: 2.3; }
        .fb-text { font-size: 13px; font-weight: 700; line-height: 20.7px; color: var(--text); white-space: pre-wrap; overflow-wrap: anywhere; }
        .fb-photo { width: 100%; border-radius: 14px; overflow: hidden; background: var(--control); }
        .fb-photo img { width: 100%; height: 100%; object-fit: cover; }
        /* AVKit's VideoPlayer is black in both looks, like the system chrome the shell draws. */
        .fb-video { position: relative; display: grid; place-items: center; width: 100%; height: 220px; border-radius: 14px; overflow: hidden; background: #000; }
        .fb-video-button { display: grid; place-items: center; width: 56px; height: 56px; border-radius: 50%; background: color-mix(in srgb, var(--mossOn) 22%, transparent); color: var(--mossOn); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); }
        .fb-video-button svg { width: 22px; height: 22px; }
        .fb-video-bar { position: absolute; left: 16px; right: 16px; bottom: 14px; height: 4px; border-radius: 999px; background: color-mix(in srgb, var(--mossOn) 30%, transparent); overflow: hidden; }
        .fb-video-bar span { display: block; width: 0; height: 100%; background: var(--mossOn); }
        .fb-video.playing .fb-video-bar span { animation: fb-play 14s linear forwards; }
        @keyframes fb-play { to { width: 100%; } }
        .fb-file { display: flex; align-items: center; gap: 8px; width: 100%; padding: 12px; background: var(--card); box-shadow: inset 0 0 0 1px var(--hairline); border-radius: 14px; text-align: left; }
        .fb-file svg { width: 15px; height: 15px; }
        .fb-comment { display: flex; flex-direction: column; gap: 4px; padding: 14px; background: var(--card); box-shadow: inset 0 0 0 1px var(--hairline); border-radius: 14px; }
        .fb-comment .fb-text { line-height: 17.7px; }
        .fb-composer { position: absolute; z-index: 3; left: 0; right: 0; bottom: var(--tabbar-h); display: flex; align-items: center; gap: 10px; padding: 12px 20px; background: var(--bg); }
        .fb-input { flex: 1; min-width: 0; padding: 12px 14px; background: var(--card); border-radius: 14px; box-shadow: inset 0 0 0 1px var(--line); }
        .fb-input:focus-within { box-shadow: inset 0 0 0 1px var(--mossEdge); }
        .fb-input textarea, .fb-reason textarea { display: block; font-size: 13px; font-weight: 700; line-height: 17.7px; color: var(--text); }
        .fb-input textarea::placeholder, .fb-reason textarea::placeholder { color: var(--textFaint); }

        /* Sheets drawn on theme.overlay with the 28pt shell radius (presentationCornerRadius). */
        .drawer-card:has(.fb-sheet) { background: var(--overlay); border-radius: 28px; }
        .fb-sheet { flex: 1; min-height: 0; height: 100%; display: flex; flex-direction: column; gap: 16px; padding: 16px 20px 12px; background: var(--overlay); color: var(--text); }
        .fb-sheet > * { flex: none; }
        .fb-sheet .fb-sheet-scroll { flex: 1; min-height: 0; overflow-y: auto; scrollbar-width: none; }
        .fb-check { display: grid; place-items: center; color: var(--mossText); font-size: 17px; }
        .fb-check svg { stroke-width: 2.2; }
        .fb-reset { min-height: 44px; text-align: center; align-self: center; }
        .fb-cancel { min-width: 44px; min-height: 44px; text-align: center; }
        .fb-reason { padding: 14px; background: var(--card); border-radius: 14px; box-shadow: inset 0 0 0 1px var(--line); }

        // The fixture's week: the last four days, today included (CompanionPreview.profile).
        const week = all.slice(-4);
        return {
            scopeDays: scopeDays || null, from: days[0], through: days[days.length - 1], recordedDays: values.length, unknownDays: 0,
            totalSteps: total, averageSteps: total / values.length, bestDay: { day: days[bestIndex], steps: values[bestIndex] },

    function activity(id, days) {
        const values = stepsOf(id).slice(0, 30).slice(-days);
        return { days, values: values.map((steps, i) => ({ day: dayKey(dayOf(30 - values.length + i)), steps, timeZone: "Europe/Paris", updatedAt: iso(dayOf(31 - values.length + i).getTime() + 2 * HOUR), finalized: true })) };
    }
    // Every Fight you were both in (ProfileHistoryRow with viewerPlacement and headToHead), newest first.
    function togetherRows(id) {
        const me = D().you;
        const rows = [];
        for (const f of D().fights) {
            if (f.status === "invited") continue;
            const mine = f.standings.find((s) => s.person === me);
            const theirs = f.standings.find((s) => s.person === id);
            if (!mine || !theirs) continue;
            const live = f.status !== "finished";
            rows.push({
                id: f.id, fightId: f.id, name: f.name, endsAt: f.windowEnd, fieldSize: f.standings.length, result: live ? "ongoing" : theirs.rank === 1 ? "win" : "loss",
                placement: theirs.rank, viewerPlacement: mine.rank, liveGap: live ? mine.score - theirs.score : null,
                headToHead: live ? null : mine.score > theirs.score ? "win" : mine.score < theirs.score ? "loss" : "draw",
            });
        }
        for (const x of META[id]?.extra || []) {
            rows.push({ id: `${id}-${x.name}`, fightId: null, name: x.name, endsAt: iso(Date.now() - x.daysAgo * DAY), fieldSize: 2, result: { win: "loss", loss: "win", draw: "draw" }[x.result], placement: x.result === "win" ? 2 : 1, viewerPlacement: x.result === "loss" ? 2 : 1, headToHead: x.result });
        }
        return rows.sort((a, b) => (a.result === "ongoing") !== (b.result === "ongoing") ? (a.result === "ongoing" ? -1 : 1) : new Date(b.endsAt) - new Date(a.endsAt));
    }
    // headToHeadRecord: form is the 10 newest results, oldest first.
    function headToHead(id) {
        const finished = togetherRows(id).filter((r) => r.headToHead);
        return {
            wins: finished.filter((r) => r.headToHead === "win").length, draws: finished.filter((r) => r.headToHead === "draw").length,
            losses: finished.filter((r) => r.headToHead === "loss").length, form: finished.slice(0, 10).reverse().map((r) => r.headToHead),

                record: canSee && settings.competitive ? ownRecord() : null,

            };
        }
        const m = META[id] || { index: 1, audience: "private", shares: "off", streak: 0, memberDaysAgo: 30, record: [0, 0, 0], extra: [] };
        const fr = friendship(id);
        const isFriend = fr === "friends";
        const access = isFriend ? "friend" : m.audience === "public" ? "public" : "private";
        const visible = access !== "private";
        const shares = visible && (m.shares === "public" || (m.shares !== "off" && isFriend));

            memberSince: dayKey(Date.now() - m.memberDaysAgo * DAY),
            headToHead: visible ? headToHead(id) : null,
            tenKStreak: shares ? { current: m.streak } : null,
            friendComparison: isFriend && shares ? { since: dayKey(Date.now() - (m.friendsDaysAgo ?? 0) * DAY), days: since, you: totals(since ? mine : []), them: totals(since ? theirs : []) } : null,
        };

    // ─── Dashboard (pushed from You) ────────────────────────────────
    // Swift Charts picks a round top for the y axis: 18,420 draws on a 20,000 scale.
    const niceTop = (max) => {
        const mag = 10 ** Math.floor(Math.log10(Math.max(max, 1)));
        return [1, 2, 2.5, 5, 10].map((s) => s * mag).find((v) => v >= max);

        const steps = sports()[0]?.values || [];
        if (steps.length !== 31) return `<p class="t-body c-2">Connect Apple Health to see your Steps here.</p>`;
        const recent = sum(steps.slice(-15)) / 15;
        const before = sum(steps.slice(1, 16)) / 15;
        const change = before > 0 ? (recent - before) / before : null;
        const shown = ui.day ?? 30;
        const top = niceTop(Math.max(...steps));
        const average = sum(steps) / 31;
        const chart = `<div class="pf-chart pf-drag" data-count="31" style="height:140px">

        const averages = [0, 1, 2, 3, 4, 5, 6].map((weekday) => {
            const values = steps.filter((_, i) => (dayOf(i).getDay() + 6) % 7 === weekday);
            return values.length ? sum(values) / values.length : 0;
        });
        const best = averages.indexOf(Math.max(...averages));
        const weekTop = niceTop(Math.max(...averages));
        const names = ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday", "Sunday"];
        const ranked = steps.map((v, i) => i).sort((a, b) => steps[b] - steps[a]).slice(0, 5);
        return FF.card(`<div class="vstack" style="gap:10px">

                    <div class="hstack" style="gap:8px;align-items:baseline"><span style="font-size:34px;font-weight:800">${num(recent)}</span>${change != null ? `<span style="font-size:17px;font-weight:800" class="${change >= 0 ? "c-moss" : "c-ember"}">${change >= 0 ? "+" : "-"}${Math.round(Math.abs(change) * 100)}%</span>` : ""}</div>

                    ${chart}
                    <span class="t-micro c-2">Drag across the bars. The dashed line is your average.</span>
                </div>`)
            + FF.card(`<div class="vstack" style="gap:10px">
                    <span class="t-eyebrow c-2">Average by weekday</span>

                    <span class="t-caption c-2">${names[best]} is your best day: ${num(averages[best])} on average.</span>

    // ─── ProfileSheet ───────────────────────────────────────────────
    const friendPill = (title, glyph, style, spec) => `<button type="button" class="pf-friend-pill ${style}" data-on="${esc(spec)}"><span>${icon(glyph)}${esc(title)}</span></button>`;

    function playerCard(profile, ui) {

    function compareSteps(profile) {

    const levelColor = (level) => ({ couch: "color-mix(in srgb, var(--gold) 28%, transparent)", warming_up: "color-mix(in srgb, var(--gold) 46%, transparent)", moving: "color-mix(in srgb, var(--gold) 64%, transparent)", active: "color-mix(in srgb, var(--gold) 82%, transparent)" }[level] || "var(--gold)");
    const levelName = (level) => LEVELS.find(([l]) => l === level)?.[2] || level;
    function recentSteps(profile) {
        const s = profile.stepStatistics;

    // ProfileTogetherRow: your result against this person, both places in a group, or your live lead.

    function recordCard(r) {

    // ═══ COMPANION STAGE (CompanionStage): swipe between big animals, thumbnails below ═══
    // opts: { animals: [ids], selection: id|null, on: "set:key" (receives "=id"), label(id) -> string|null, disabled,
    //         height (stage px, default 320), width (default 402), key (keeps the scroll position between redraws) }
    function stage(o = {}) {
        const animals = o.animals || ALL;
        const selection = o.selection ?? null;
        const key = o.key || "stage";
        const width = o.width || 402;
        const pageW = width * 0.62;
        const step = pageW - 50; // pages overlap by 50 so the neighbours peek in
        const height = Math.max(320, o.height || 320);
        const label = o.label || (() => null);

        // Like onChange(of: selection): a redraw for any other reason leaves a swipe in progress alone.
        const moved = !old || old.dataset.selected !== (selection || "");

            const el = [...phone.querySelectorAll("[data-stage]")].find((x) => x.dataset.stage === key);
