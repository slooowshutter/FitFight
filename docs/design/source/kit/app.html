            id: "make-your-character", title: "Make your own character", image: `${ROOT}web/public/landing/companion-alpaca-1.webp`,
            body: "Describe anyone: a friend, your dog, yourself. Pick one of three portraits and make it your companion.",
            buttons: [{ title: "Make mine", action: "open_character", primary: true }, { title: "Not now", action: "dismiss", primary: false }],
        },
    };

    // StockCompanion: the twelve onboarding animals in OnboardingView's order, with their CompanionStage captions.
    const ANIMALS = {
        goat: ["Goat", "Takes the uphill route."], fox: ["Fox", "Just a little smug."], otter: ["Otter", "Here for a good time."],
        bear: ["Bear", "Big strides. Soft heart."], rabbit: ["Rabbit", "Always one more lap."], sloth: ["Sloth", "Slow is still forward."],
        badger: ["Badger", "Quietly competitive."], raccoon: ["Raccoon", "Always has a plan."], "red-panda": ["Red Panda", "Looks relaxed. Isn’t."],
        boar: ["Boar", "A little unstoppable."], dog: ["Dog", "Always up for a walk."], turtle: ["Turtle", "Never out of the race."],
    };
    const ANIMAL_IDS = Object.keys(ANIMALS);
    const animalName = (id) => ANIMALS[id]?.[0] ?? globalThis.COMPANION?.info?.(id)?.name ?? String(id).replace(/^limited-/, "").split("-").map((w) => w[0].toUpperCase() + w.slice(1)).join(" ");

    // The same Fight shape as the shell's fixture (makeData's fight()), for fights joined during onboarding.
    function makeFight(id, name, code, totals, cast, length, hoursLeft, extra = {}) {
        const now = Date.now();
        const weights = [0.8, 1.1, 1.3, 0.9];
        const windowEnd = now + hoursLeft * HOUR;
        const windowStart = windowEnd - length * DAY;
        const standings = cast.map((who, i) => ({
            person: who, score: totals[i], lastSyncedAt: iso(now - (i + 1) * 300e3),
            rank: 1 + totals.filter((t) => t > totals[i]).length,
        })).sort((a, b) => b.score - a.score);
        const dayCount = Math.min(length, Math.max(1, length - Math.floor(hoursLeft / 24)));
        const w = Array.from({ length: dayCount }, (_, i) => weights[i % 4]);
        const wTotal = w.reduce((a, b) => a + b, 0);
        const days = w.map((_, day) => {
            const before = w.slice(0, day).reduce((a, b) => a + b, 0);
            return {
                label: `Day ${day + 1}`, day: iso(windowStart + day * DAY).slice(0, 10),
                scores: cast.map((who, i) => ({ person: who, value: Math.round(totals[i] * (before + w[day]) / wTotal) - Math.round(totals[i] * before / wTotal) })),
            };
        });
        return {
            id, name, joinCode: code, lengthDays: length, windowStart: iso(windowStart), windowEnd: iso(windowEnd),
            status: "live", serverState: "live", standings, days, actionText: "", recurring: false, seriesId: null, inviter: null,
            metric: "steps", ...extra,
        };
    }
    // FitFightJoinableFight from /api/v1/fights/suggested: one public series that started this afternoon.
    function suggestedFight() {
        const start = new Date(Date.now() - 3 * HOUR);
        start.setMinutes(0, 0, 0);
        return {
            id: "lunch", name: "Lunch break league", owner: "nina", actionText: "Buys the first round of coffee",
            startsAt: start.getTime(), endsAt: start.getTime() + 7 * DAY, memberCount: 4, recurring: true,
        };
    }
    const when = (ms) => new Date(ms).toLocaleString("en-US", { month: "short", day: "numeric", hour: "numeric", minute: "2-digit" });
    const invitation = () => D().fights.find((f) => f.status === "invited");

    // ═══ ONBOARDING PIECES (OnboardingComponents.swift) ═══
    const PAGES = ["username", "health", "healthResult", "whoop", "companion", "founderFight", "firstFight", "reminders", "celebration"];
    const STEP = { username: 2, health: 3, healthResult: 3, whoop: 3, companion: 4, founderFight: 5, firstFight: 5, reminders: 6 };
    const PREVIOUS = { health: "username", healthResult: "health", companion: "healthResult", founderFight: "companion", firstFight: "founderFight", reminders: "firstFight" };
    const STEP_LABEL = { 1: "Your account", 2: "Your username", 3: "Apple Health", 4: "Your companion", 5: "Your first Fight", 6: "Reminders" };

    // A page's entrance plays once, when the page appears, not on every redraw.
    const seen = new WeakMap();
    function entering(entry, page) {
        const fresh = seen.get(entry) !== page;
        seen.set(entry, page);
        // Screenshots (?shot) show each page settled.
        return fresh && !reduced() && !QUERY.has("shot");
    }
    let direction = 1;

    const header = (step, back, busy, label = STEP_LABEL[step]) => `<header class="rt-ob-head">${back ? `<button type="button" class="rt-ob-back" aria-label="Back"${on(back)}${busy ? " disabled" : ""}>${icon("chevron.left")}</button>` : ""}<div class="rt-ob-progress"><div class="row"><span>${esc(label ?? "FitFight")}</span>${step ? `<span class="c-2">${step} of 6</span>` : ""}</div>${step ? `<div class="bar">${[1, 2, 3, 4, 5, 6].map((i) => `<span class="${i <= step ? "on" : ""}"></span>`).join("")}</div>` : ""}</div></header>`;
    const page = (content, actions, enter) => `<div class="rt-ob-scroll" data-scroll><div class="rt-ob-content ${enter ? "rt-enter" : ""}" style="--dir:${direction}">${content}</div></div><div class="rt-ob-actions">${actions}</div>`;
    const heading = (title, subtitle, centered = true) => `<div class="rt-ob-heading ${centered ? "" : "leading"}"><h1 class="rt-in">${esc(title)}</h1>${subtitle ? `<p class="rt-in" style="--o:1">${esc(subtitle)}</p>` : ""}</div>`;
    const speech = (animal, text) => `<div class="rt-speech"><img src="${companionArt(animal)}" alt=""><p>${esc(text)}</p></div>`;
    const skip = (title, spec, disabled) => `<button type="button" class="rt-skip"${on(spec)}${disabled ? " disabled" : ""}>${esc(title)}</button>`;
    // OnboardingAnimal: the art says hello with a small double hop.
    const hopper = (animal, enter, o = {}) => `<img class="rt-hop ${enter ? "go" : ""}" src="${companionArt(animal)}" alt="" style="--hop:${o.duration || 0.7}s;--delay:${o.delay || 0}s">`;
    // SwiftUI's plain ProgressView(): the iOS activity indicator, not the kit's gold ring.
    const activity = `<svg class="rt-activity" viewBox="0 0 24 24" aria-label="Loading">${Array.from({ length: 8 }, (_, i) => `<line x1="12" y1="2.5" x2="12" y2="7" transform="rotate(${i * 45} 12 12)" opacity="${(0.25 + (i / 8) * 0.75).toFixed(2)}"/>`).join("")}</svg>`;
    const freeBadge = (count) => `<span class="rt-free">${icon("gift")}${count} free</span>`;

    // CompanionStage, from the companion area when it is loaded; otherwise a local copy with the same layout.
    let shownAnimal = null;
    function stage(selected, disabled) {
        const shared = globalThis.COMPANION?.stage?.({ animals: ANIMAL_IDS, selection: selected, on: "rootObPick:id", disabled, key: "onboarding" });
        if (shared) return shared;
        const width = 402 * 0.62;
        const offset = (id) => (402 - width) / 2 - Math.max(0, ANIMAL_IDS.indexOf(id)) * (width - 50);
        const from = shownAnimal && shownAnimal !== selected && !reduced() ? shownAnimal : selected;
        shownAnimal = selected;
        queueMicrotask(() => {
            const row = phone.querySelector(".rt-stage-row");
            if (row && from !== selected) {
                row.getBoundingClientRect();
                row.style.transform = `translateX(${offset(selected)}px)`;
                row.querySelectorAll(".rt-stage-page").forEach((el) => el.classList.toggle("on", el.dataset.id === selected));
            }
            const strip = phone.querySelector(".rt-thumbs");
            const thumb = strip?.querySelector('[aria-pressed="true"]');
            if (thumb) strip.scrollTo({ left: thumb.offsetLeft - (strip.clientWidth - thumb.offsetWidth) / 2, behavior: from !== selected ? "smooth" : "instant" });
        });
        return `<div class="rt-stage-wrap"><div class="rt-stage" data-ids="${ANIMAL_IDS.join(",")}" data-sel="${esc(selected)}"${disabled ? ' data-disabled="1"' : ""}><div class="rt-stage-row" style="transform:translateX(${offset(from)}px)">${ANIMAL_IDS.map((id) => `<button type="button" class="rt-stage-page ${id === from ? "on" : ""}" data-id="${id}" style="width:${width}px"${on(`rootObPick:id=${id}`)}${disabled ? " disabled" : ""}><img src="${companionArt(id)}" alt=""><b>${esc(ANIMALS[id][0])}</b><span>${esc(ANIMALS[id][1])}</span></button>`).join("")}</div></div><div class="rt-thumbs">${ANIMAL_IDS.map((id) => `<button type="button" class="rt-thumb" aria-label="${esc(ANIMALS[id][0])}" aria-pressed="${id === selected}"${on(`rootObPick:id=${id}`)}${disabled ? " disabled" : ""}><img src="${companionArt(id)}" alt=""></button>`).join("")}</div></div>`;
    }
    // Swiping the local stage moves one animal, like the paged ScrollView.
    let swipe = null;
    let swallowClick = false;
    phone.addEventListener("pointerdown", (event) => {
        const el = event.target.closest(".rt-stage");
        swipe = el && !el.dataset.disabled ? { x: event.clientX, y: event.clientY } : null;
    });
    phone.addEventListener("pointerup", (event) => {
        if (!swipe) return;
        const dx = event.clientX - swipe.x, dy = event.clientY - swipe.y;
        swipe = null;
        if (Math.abs(dx) < 30 || Math.abs(dx) < Math.abs(dy)) return;
        const el = phone.querySelector(".rt-stage");
        const ids = el.dataset.ids.split(",");
        const next = ids[Math.max(0, Math.min(ids.length - 1, ids.indexOf(el.dataset.sel) + (dx < 0 ? 1 : -1)))];
        swallowClick = true;
        run(`rootObPick:id=${next}`, el, event);
    });
    phone.addEventListener("click", (event) => {
        if (!swallowClick) return;
        swallowClick = false;
        event.stopPropagation();
        event.preventDefault();
    }, true);
    phone.addEventListener("keydown", (event) => {
        if (event.key === "Enter" && event.target.matches?.('.rt-ob input[data-bind="handle"]')) run("rootObSaveHandle", event.target, event);
    });

    // HealthOnboardingView's step count rises from zero once.
    function countUp(to) {
        const start = performance.now();
        const step = (now) => {
            const el = phone.querySelector(".rt-count");
            if (!el) return;
            const t = Math.min(1, (now - start) / 1000);
            el.textContent = fmt.n(Math.round(to * (1 - Math.pow(1 - t, 3))));
            if (t < 1) requestAnimationFrame(step);
        };
        requestAnimationFrame(step);
    }

    // ═══ ONBOARDING STATE ═══
    // The page is the entry's p.step (so every page has a link). The rest of the progress lives on the entry object
    // (entry.st), so a new sign-in or a new replay sheet starts clean. Link parameters seed it.
    const replayEntry = () => [...S.modals].reverse().find((m) => m.id === "onboardingReplay");
    const obEntry = () => replayEntry() || (S.flow?.id === "onboarding" ? S.flow : null);
    function progress(entry, replay = entry.id === "onboardingReplay") {
        if (!entry.st) {
            const p = entry.p || {};
            // A new OnboardingView starts with empty fields and fresh page state.
            for (const [key, ui] of Object.entries(S.ui)) if (key === entry.id || key.startsWith(`${entry.id}?`)) for (const field of Object.keys(ui)) delete ui[field];
            entry.st = {
                replay,
                handle: p.handle ?? (replay ? you().handle.replace(/^@/, "") : ""),
                animal: p.animal || (replay ? you().companion : "goat"),
                chosen: replay || !!p.animal,
                steps: p.steps === "1",
                joined: p.joined ?? null,
                founder: p.founder === "1",
                referral: p.referral === "1",
                free: p.referral === "1" ? 1 : 0,
                drawing: p.drawing === "1",
                // A WhoopConnectionStore of its own; `whoop=connecting|connected|error` links seed it.
                whoop: { busy: p.whoop === "connecting", connected: p.whoop === "connected", failed: p.whoop === "error" },
            };
        }
        return entry.st;
    }
    function go(target, backwards = false) {
        const entry = obEntry();
        if (!entry) return;
        progress(entry);
        direction = backwards ? -1 : 1;
        entry.p = { step: target };
        render();
    }
    // An async step finishes only if the same onboarding is still on screen.
    function later(entry, ms, fn) {
        setTimeout(() => {
            if (obEntry() !== entry) return;
            fn();
            render();
        }, ms);
    }
    function finish() {
        const entry = obEntry();
        if (!entry) return;
        if (entry.id === "onboardingReplay") {
            S.modals = S.modals.filter((m) => m !== entry);
            return render();
        }
        // OnboardingView.finish: model.tab = .fights, then the tab app replaces onboarding.
        S.account = "signedIn";
        S.flow = null;
        S.tab = "fights";
        S.stacks = { fights: [], newFight: [], feed: [], feedback: [], you: [] };
        S.modals = [];
        render();
    }

    // ═══ PROPOSAL: connect WHOOP during onboarding ═══
    // The WHOOP sign-in is the same as Settings → Connectors → WHOOP. Fight steps still come only from Apple Health.
    variant("onboarding-whoop", {
        title: "Connect WHOOP in onboarding",
        note: "Where a new player can connect WHOOP next to Apple Health. Tap Connect, then Continue on the whoop.com prompt.",
        options: [
            { id: "today", name: "Today", when: "The app as it is now: WHOOP only in Settings → Connectors." },
            { id: "health", name: "On the Apple Health page", when: "Right if WHOOP should read as the second choice next to Apple Health, before anything is connected." },
            { id: "result", name: "After Apple Health", when: "Right if the Apple Health page should stay one job. The WHOOP row comes once the steps are in, with no extra page." },
            { id: "page", name: "Its own page", when: "Right if WHOOP deserves a full explanation. Everyone sees one more page, with I don't wear one to skip it." },
        ],
        // The links follow the chosen option, so each one opens where that option draws WHOOP.
        get links() {
            const at = { today: "health", health: "health", result: "healthResult&steps=1", page: "whoop" }[V("onboarding-whoop")];
            return V("onboarding-whoop") === "today"
                ? [["Apple Health", "#onboarding?step=health"], ["Health result", "#onboarding?step=healthResult&steps=1"]]
                : [
                    ["Not connected", `#onboarding?step=${at}`],
                    ["Use whoop.com to sign in", `#onboarding?step=${at}&whoop=connecting/~rootObWhoopConsent`],
                    ["Connecting", `#onboarding?step=${at}&whoop=connecting`],
                    ["Connected", `#onboarding?step=${at}&whoop=connected`],
                    ["Couldn’t connect", `#onboarding?step=${at}&whoop=error`],
                    ...(V("onboarding-whoop") === "result" ? [["No step data", "#onboarding?step=healthResult"]] : []),
                ];
        },
    });
    const privacyLink = () => `present:sysExternal?url=${encodeURIComponent(`${S.environment === "production" ? "https://fitfight.app" : "https://staging.fitfight.app"}/privacy`)}`;
    const consent = `By connecting, you agree to our <button type="button" class="c-moss"${on(privacyLink())}>Privacy Policy</button>.`;
    // The WHOOP row of the "health" and "result" options: Settings' WHOOP account row, with its logo.
    function whoopRow(w) {
        const subtitle = w.connected ? "Connected · Updates every hour" : w.failed ? "Couldn’t connect WHOOP. Tap to try again." : "Sleep, recovery, strain and workouts";
        const tone = w.connected ? "mossText" : w.failed ? "emberText" : "textSecondary";
        const pill = w.busy ? FF.pill("Connecting", "neutral") : w.connected ? FF.pill("Connected", "softMoss") : w.failed ? FF.pill("Retry", "softEmber") : FF.pill("Connect", "solidMoss");
        const row = `<button type="button" class="ff-grow ${w.busy ? "disabled" : ""}"${on(w.busy || w.connected ? null : "rootObWhoop")}${w.busy ? " disabled" : ""}><img class="rt-logo" src="${asset("Connector-WHOOP")}" alt=""><span class="grow vstack"><span class="title">WHOOP</span><span class="subtitle" style="color:var(--${tone})">${esc(subtitle)}</span></span>${pill}</button>`;
        return `<div class="rt-whoop"><p class="t-body c-2">Wear a WHOOP? Connect it too. Fight steps still come from Apple Health.</p>${FF.grouped([row])}${w.connected ? "" : `<p class="t-caption c-2">${consent}</p>`}</div>`;
    }

    // ═══ ONBOARDING VIEW (OnboardingView.swift): one page at a time under the progress header ═══
    function onboardingView(entry, ui) {
        const p = entry.p || {};
        const s = progress(entry);
        const replay = s.replay;
        const whoopAt = V("onboarding-whoop");
        // The WHOOP page exists only in the "page" option; its links fall back to the Health result.
        const current = p.step === "whoop" && whoopAt !== "page" ? "healthResult" : PAGES.includes(p.step) ? p.step : replay ? "health" : "username";
        const enter = entering(entry, current);
        const busy = !!ui.busy;
        const animal = s.animal;
        const afterHealth = whoopAt === "page" ? "whoop" : "healthResult";
        // The replay shows only Health, Fight offers and reminders.
        const previous = replay
            ? (current === "health" ? null : current === "founderFight" ? afterHealth : current === "whoop" ? "healthResult" : PREVIOUS[current])
            : current === "companion" ? afterHealth : current === "whoop" ? "healthResult" : PREVIOUS[current];
        const errorOf = (fallback) => ("error" in ui ? ui.error : fallback);
        let content = "";
        let actions = "";
        if (current === "username") {
            const handle = ui.handle ?? s.handle;
            const stripped = handle.trim().replace(/^@+|@+$/g, "").toLowerCase();
            const error = errorOf({ taken: "That username is taken.", invalid: "Use 2-30 letters, numbers, or underscore.", failed: "Couldn’t save that username." }[p.error] ?? null);
            content = heading("What should your\nopponents call you?")
                + speech(animal, "A name for the leaderboard.")
                + `<div class="rt-in" style="--o:2">${FF.field("Your username", { bind: "handle", value: handle, placeholder: "your_name", state: error ? "error" : "", help: error || "", autocapitalize: "none" })}</div>`
                + `<p class="t-caption c-2">2 to 30 characters. Letters, numbers and underscores.</p>`;
            actions = FF.cta("That's me", { enabled: /^[a-z0-9_]{2,30}$/.test(stripped) && !busy, busy, on: "rootObSaveHandle" });
        } else if (current === "health") {
            content = heading("Let your steps\ndo the talking.", "Connect Apple Health to count your steps in Fights.", false)
                + `<div class="rt-health-art"><span class="heart">${icon("heart.fill")}</span><img src="${companionArt(animal)}" alt=""></div>`
                + (s.referral ? FF.notice("Connect Apple Health to get the free character from your friend's invite. You can use it on the next step.", { tone: "moss", icon: "gift" }) : "")
                + [
                    ["figure.walk", "Uploads the Apple Health activity you allow, including individual records and workouts. Stored privately."],
                    ["person.2", "Fight participants see your steps and standings."],
                    ["lock", "You control access in Apple Health."],
                ].map(([glyph, text]) => `<div class="rt-health-row">${icon(glyph)}<span>${esc(text)}</span></div>`).join("")
                + (whoopAt === "health" ? whoopRow(s.whoop) : "");
            actions = FF.cta("Connect Apple Health", { enabled: !busy, busy, on: "rootObHealthConnect" }) + skip("I'll do this later", "rootObHealthResult:0", busy);
        } else if (current === "healthResult") {
            const steps = s.steps ? D().todaySteps : null;
            if (enter && steps) countUp(steps);
            content = heading(steps != null ? "Look at you,\nalready moving." : "Your starting line\nis still here.")
                + `<div class="rt-in" style="--o:1">${FF.card(`<div class="rt-result"><img src="${companionArt(animal)}" alt="">${steps != null
                    ? `<div class="rt-count">${enter && steps ? "0" : fmt.n(steps)}</div><div class="rt-steps-label">steps today</div>`
                    : `<div class="t-heading">No accessible step data</div><div class="t-body c-2">Connect later from Profile → Settings → Connectors.</div>`}</div>`)}</div>`
                + `<p class="t-caption c-2" style="text-align:center">Only steps taken during the Fight count.</p>`
                + (whoopAt === "result" ? whoopRow(s.whoop) : "");
            actions = FF.cta("Continue", { on: "rootObHealthContinue" });
        } else if (current === "whoop") {
            // The "page" option: WHOOP gets the Apple Health page's layout. Connected, the button moves on.
            const w = s.whoop;
            content = heading("Wear a WHOOP?\nBring it too.", "Connect WHOOP for your sleep, recovery, strain and workouts.", false)
                + `<div class="rt-health-art"><img class="rt-whoop-logo" src="${asset("Connector-WHOOP")}" alt=""><img src="${companionArt(animal)}" alt=""></div>`
                + [
                    ["waveform.path.ecg", "Gets your WHOOP data straight from WHOOP, updated every hour. Stored privately."],
                    ["shoeprints.fill", "Fight steps still come from Apple Health."],
                ].map(([glyph, text]) => `<div class="rt-health-row">${icon(glyph)}<span>${esc(text)}</span></div>`).join("")
                + (w.connected ? "" : `<div class="rt-health-row">${icon("lock")}<span>${consent}</span></div>`)
                + (w.connected ? FF.notice("WHOOP connected. Updates every hour.", { tone: "moss", icon: "checkmark.circle" })
                    : w.failed ? FF.notice("Couldn’t connect WHOOP. Try again.", { tone: "ember", icon: "exclamationmark.triangle" }) : "");
            actions = w.connected
                ? FF.cta("Continue", { on: "rootObWhoopNext" })
                : FF.cta(w.failed ? "Retry" : "Connect WHOOP", { enabled: !w.busy, busy: w.busy, on: "rootObWhoop" }) + skip("I don't wear one", "rootObWhoopNext", w.busy);
        } else if (current === "companion") {
            const error = errorOf(p.error ? OFFLINE : null);
            content = heading("Find your kind\nof competitive.")
                + `<div class="rt-in" style="--o:2">${stage(animal, busy)}</div>`
                + (s.drawing
                    ? FF.notice("We are drawing your character. Keep going, we will tell you when it is ready.", { tone: "moss", icon: "sparkles" })
                    : s.free > 0
                        ? `<button type="button" class="rt-create rt-in" style="--o:3"${on("rootObCreateOwn")}${busy ? " disabled" : ""}><span class="wand">${icon("wand.and.stars")}</span><span class="grow vstack" style="gap:2px"><span class="t-heading">Or create your own</span><span class="t-caption c-2">Describe any animal and we draw it for you.</span></span>${freeBadge(s.free)}</button>`
                        : "")
                + (error ? FF.notice(error, { tone: "ember", icon: "exclamationmark.triangle" }) : "");
            actions = FF.cta(`Go with ${animalName(animal)}`, { enabled: !busy, busy, on: "rootObSaveCompanion" });
        } else if (current === "founderFight") {
            const error = errorOf(p.error ? OFFLINE : null);
            content = heading("Fight Marc")
                + speech(animal, "FitFight's founder. 30 days, most steps wins. It starts again every 30 days.")
                + (error ? FF.notice(error, { tone: "ember", icon: "exclamationmark.triangle" }) : "");
            actions = FF.cta(error ? "Retry" : "Fight Marc", { enabled: !busy, busy, on: "rootObFounder" }) + skip("Not now", "rootObGo:firstFight", busy);
        } else if (current === "firstFight") {
            // SuggestedFightsOnboardingView: an invitation wins over a suggested public Fight.
            const forced = p.state;
            const invite = ["suggested", "empty", "error"].includes(forced) ? null : invitation();
            if (!ui.loaded && !ui.loadTimer && forced !== "loading") ui.loadTimer = setTimeout(() => { ui.loaded = true; render(); }, 700);
            const loading = forced === "loading" || (!ui.loaded && !forced);
            const offer = ["empty", "error"].includes(forced) ? null : suggestedFight();
            const error = errorOf(forced === "error" ? OFFLINE : null);
            const joined = s.joined ?? (forced === "joined" ? invitation()?.name ?? suggestedFight().name : null);
            const handle = s.handle || you().handle.replace(/^@/, "");
            let body = "";
            if (joined) body = FF.card(`<div class="vstack" style="gap:12px"><div class="t-heading">${esc(joined)}</div><div class="rt-joined">${icon("checkmark.circle")}<span>Joined</span></div></div>`);
            else if (loading) body = `<div class="rt-progress">${activity}</div>`;
            else if (invite) {
                body = `<div class="rt-in" style="--o:2">${FF.card(`<div class="vstack" style="gap:12px"><div class="t-heading">${esc(invite.name)}</div><div class="t-body">Steps. Highest total wins.</div><div class="t-caption c-ember">${esc(when(invite.windowStart))}</div>${invite.recurring ? `<div class="t-caption c-2">Repeats until you leave. Each round has its own result.</div>` : ""}${invite.actionText?.trim() ? `<div class="t-body">${esc(invite.actionText)}</div>` : ""}</div>`)}</div>`;
            } else if (offer) {
                body = `<div class="rt-in" style="--o:2">${FF.card(`<div class="vstack" style="gap:12px"><div class="t-heading">${esc(offer.name)}</div><div class="t-caption c-2">${offer.memberCount} participants</div><div class="t-body">Steps. Highest total wins.</div><div class="t-caption c-ember">${esc(`${when(offer.startsAt)} → ${when(offer.endsAt)}`)}</div>${offer.recurring ? `<div class="t-caption c-2">Repeats until you leave. Each round has its own result.</div>` : ""}${offer.actionText ? `<div class="t-body">${esc(offer.actionText)}</div>` : ""}</div>`)}</div>`;
            } else if (!error) body = `<p class="t-body c-2">No Fights to join right now. Find one later in Fights.</p>`;
            content = heading(invite ? "Your people.\nYour first rivalry." : "Everything is better\nwith a little rivalry.")
                + `<div class="rt-handle">${companionImg({ companion: animal }, { w: 32 })}<span>@${esc(handle)}</span></div>`
                + body
                + (error ? FF.notice(error, { tone: "ember", icon: "exclamationmark.triangle" }) + `<div>${FF.button("Retry", { kind: "secondary", on: "rootObRetry", enabled: !busy })}</div>` : "")
                + `<p class="t-caption c-2">Participants see your identity, Fight Steps, standings, and posts you share in this Fight. Joining does not enable profile or daily-history sharing.</p>`;
            if (joined) actions = FF.cta("Continue", { enabled: !busy, on: "rootObGo:reminders" });
            else if (invite || offer || busy) actions = FF.cta("Join this Fight", { enabled: !busy && !loading, busy, on: "rootObJoin" });
            actions += skip("Explore first", "rootObGo:reminders", busy);
        } else if (current === "reminders") {
            content = heading("A nudge when\nit matters.")
                + `<div class="rt-in" style="--o:1">${FF.card(`<div class="vstack" style="gap:12px"><div class="rt-push-top">${icon("bell")}<b>FitFight</b><span class="grow"></span><span class="t-caption c-2">now</span></div><div class="rt-push-title">Your Fight is finishing soon</div><div class="t-body c-2">Open FitFight to sync your latest steps.</div></div>`)}</div>`
                + speech(animal, "Make that last walk count.");
            actions = FF.cta("Turn on reminders", { enabled: !busy, busy, on: "rootObReminders" }) + skip("Not now", "rootObRemindersDone", busy);
        } else {
            // OnboardingCelebration: the animal hops, confetti bursts, a moss check sits at its feet.
            const confetti = enter ? Array.from({ length: 18 }, (_, i) => {
                const angle = (i * Math.PI * 2) / 18;
                return `<i style="--x:${(Math.cos(angle) * 140).toFixed(1)}px;--y:${(Math.sin(angle) * 112).toFixed(1)}px;--d:${i * 14}ms;background:var(--${["emberText", "mossText", "textSecondary"][i % 3]})"></i>`;
            }).join("") : "";
            content = `<div class="rt-celebrate"><div class="art">${hopper(animal, enter, { duration: 0.9 })}</div>${confetti}<span class="check">${icon("checkmark")}</span></div>`
                + heading(`You're in,\n${s.handle || you().handle.replace(/^@/, "")}.`, s.joined ?? (s.founder ? "Fight Marc" : null));
            actions = FF.cta("Continue", { on: "rootObFinish" });
        }
        return `<div class="rt-ob">${header(STEP[current], previous && `rootObBack:${previous}`, busy || s.whoop.busy, current === "whoop" ? "WHOOP" : undefined)}${page(content, actions, enter)}</div>`;
    }

    screen("onboarding", { kind: "flow", title: "Onboarding", render: (p, ui, ctx) => onboardingView(ctx.entry, ui) });
    // OnboardingPreviewView: Settings > Developer > Replay onboarding. Starts at Health and never saves progress.
    screen("onboardingReplay", {
        kind: "sheet", title: "Replay onboarding",
        render: (p, ui, ctx) => `<div class="rt-replay"><div class="rt-replay-top"><button type="button" class="t-label c-moss"${on("close")}>Close</button></div><div class="rt-replay-body">${onboardingView(ctx.entry, ui)}</div></div>`,
    });

    // ═══ ONBOARDING ACTIONS ═══
    action("rootObGo", (target) => go(target));
    action("rootObBack", (target) => go(target, true));
    action("rootObFinish", () => finish());
    action("rootObSaveHandle", (_, ctx) => {
        const entry = obEntry();
        if (!entry || ctx.ui.busy) return;
        const s = progress(entry);
        const handle = (ctx.ui.handle ?? s.handle).trim().replace(/^@+|@+$/g, "").toLowerCase();
        if (!/^[a-z0-9_]{2,30}$/.test(handle)) return;
        Object.assign(ctx.ui, { busy: true, error: null });
        render();
        later(entry, 700, () => {
            ctx.ui.busy = false;
            // The server refuses a handle someone already has.
            if (Object.values(D().people).some((x) => !x.isYou && x.handle === `@${handle}`) || handle === "marc") { ctx.ui.error = "That username is taken."; return; }
            s.handle = handle;
            if (!s.replay) you().handle = `@${handle}`;
            go("health");
        });
    });
    action("rootObHealthConnect", (_, ctx) => {
        if (ctx.ui.busy) return;
        ctx.ui.busy = true;
        present("sysHealthPermission", { then: "rootObHealthResult:1", deny: "rootObHealthResult:0" });
    });
    action("rootObHealthResult", (allowed) => {
        const entry = obEntry();
        if (!entry) return;
        progress(entry).steps = allowed === "1";
        go("healthResult");
    });
    // Progress saved by an older build already has its companion; the replay skips it too.
    action("rootObHealthContinue", () => {
        const entry = obEntry();
        if (entry) go(V("onboarding-whoop") === "page" ? "whoop" : progress(entry).chosen ? "founderFight" : "companion");
    });
    action("rootObWhoopNext", () => {
        const entry = obEntry();
        if (entry) go(progress(entry).chosen ? "founderFight" : "companion");
    });
    // WhoopConnectionStore.refresh(connectWith:): WHOOP's sign-in in ASWebAuthenticationSession, then the link.
    action("rootObWhoop", () => {
        const entry = obEntry();
        if (!entry) return;
        Object.assign(progress(entry).whoop, { busy: true, failed: false });
        delete entry.p.whoop;
        present("rootObWhoopConsent");
    });
    // Continue stands in for signing in on WHOOP and the app finishing the link. Cancel is no error.
    action("rootObWhoopDone", (status) => {
        const entry = obEntry();
        dismiss();
        if (!entry) return;
        const w = progress(entry).whoop;
        w.busy = status !== "cancel";
        render();
        if (w.busy) later(entry, 1200, () => Object.assign(w, { busy: false, connected: true }));
    });
    screen("rootObWhoopConsent", {
        kind: "alert", title: "Use whoop.com to sign in",
        alert: () => ({
            title: "“FitFight” Wants to Use “whoop.com” to Sign In",
            message: "This allows the app and website to share information about you.",
            buttons: [{ title: "Cancel", role: "cancel", on: "rootObWhoopDone:cancel" }, { title: "Continue", on: "rootObWhoopDone:connected" }],
        }),
    });
    action("rootObPick", (arg) => {
        const entry = obEntry();
        if (!entry) return;
        progress(entry).animal = arg.split("=").pop();
        render();
    });
    function saveCompanion(entry) {
        const ui = uiOf(keyOf(entry));
        if (ui.busy) return;
        Object.assign(ui, { busy: true, error: null });
        render();
        later(entry, 600, () => {
            ui.busy = false;
            const s = progress(entry);
            you().companion = s.animal;
            D().companion = s.animal;
            s.chosen = true;
            go("founderFight");
        });
    }
    action("rootObSaveCompanion", () => { const entry = obEntry(); if (entry) saveCompanion(entry); });
    action("rootObCreateOwn", () => {
        const entry = obEntry();
        if (entry) present("onboardingCharacter", { animal: progress(entry).animal });
    });
    action("rootObFounder", (_, ctx) => {
        const entry = obEntry();
        if (!entry || ctx.ui.busy) return;
        Object.assign(ctx.ui, { busy: true, error: null });
        render();
        later(entry, 900, () => {
            ctx.ui.busy = false;
            const d = D();
            d.people.marc ??= { id: "marc", name: "Marc", handle: "@marc", initials: "MA", companion: "fox" };
            if (!fightById("founder")) d.fights.unshift(makeFight("founder", "Fight Marc", "M4RC", [d.todaySteps, 6120], [d.you, "marc"], 30, 30 * 24 - 10, { recurring: true, seriesId: "series-founder", inviter: "marc" }));
            progress(entry).founder = true;
            go("firstFight");
        });
    });
    action("rootObJoin", (_, ctx) => {
        const entry = obEntry();
        if (!entry || ctx.ui.busy) return;
        const forced = ctx.p.state;
        const invite = ["suggested", "empty", "error"].includes(forced) ? null : invitation();
        const offer = invite ? null : suggestedFight();
        if (!invite && !offer) return;
        Object.assign(ctx.ui, { busy: true, error: null });
        render();
        later(entry, 900, () => {
            ctx.ui.busy = false;
            const d = D();
            if (invite) {
                invite.status = "live";
                invite.standings.forEach((row) => { if (row.person === d.you) row.invited = false; });
            } else if (!fightById(offer.id)) {
                const hoursLeft = (offer.endsAt - Date.now()) / HOUR;
                d.fights.unshift(makeFight(offer.id, offer.name, "L7N3", [2410, 1980, 1720, 1300, 1150], ["nina", "leo", "sam", "theo", d.you], 7, hoursLeft, { recurring: true, seriesId: "series-lunch", inviter: offer.owner, actionText: offer.actionText }));
            }
            progress(entry).joined = (invite || offer).name;
            go("reminders");
        });
    });
    action("rootObRetry", () => go("firstFight"));
    action("rootObReminders", (_, ctx) => {
        if (ctx.ui.busy) return;
        ctx.ui.busy = true;
        present("sysNotificationPermission", { then: "rootObRemindersDone", deny: "rootObRemindersDone" });
    });
    // Going back or exploring cannot undo a membership the server already accepted.
    action("rootObRemindersDone", () => {
        const entry = obEntry();
        if (!entry) return;
        const s = progress(entry);
        if (s.joined || s.founder) go("celebration");
        else finish();
    });

    // OnboardingCharacterSheet: a free character from a friend's invite. It can't be swiped away while it starts.
    let characterBusy = false;
    const IDEAS = [
        ["orangutan", "A 70s hippie orangutan with a tie-dye bandana, a peace sign necklace and round orange glasses."],
        ["parrot", "A pirate parrot with an eye patch and a tricorn hat."],
        ["flamingo", "A diva flamingo with heart sunglasses and a pink feather boa."],
        ["pig", "A cowboy pig with a big hat and a sheriff star."],
        ["chihuahua", "A tiny furious chihuahua wearing a huge gold chain."],
    ];
    screen("onboardingCharacter", {
        kind: "sheet", title: "Create your own", grabber: true,
        get dismissable() { return !characterBusy; },
        render: (p, ui) => {
            const text = ui.description ?? "";
            const busy = !!ui.busy;
            const ready = text.trim() !== "";
            return `<div class="ff-screen rt-char"><div class="ff-scroll" data-scroll><div class="rt-char-body">${FF.sheetHeader("Create your own", { on: "close" })}<div>${freeBadge(1)}</div><p class="t-body c-2">We draw three portraits from your words. You pick one, then we make its five fitness poses. It takes a few minutes, so you can keep going.</p><div class="rt-ideas"><div class="t-label c-2">Need an idea? Tap one.</div><div class="rt-ideas-row">${IDEAS.map(([image, idea], i) => `<button type="button" class="rt-idea" aria-pressed="${text === idea}"${on(`rootCharIdea:${i}`)}${busy ? " disabled" : ""}><img src="${asset(`CharacterIdea-${image}`)}" alt=""><span>${esc(idea)}</span></button>`).join("")}</div></div>${FF.field("Your animal", { bind: "description", value: text, multiline: true, rows: 4, minHeight: 120, max: 1000, counter: `${text.length}/1000`, placeholder: "Species, breed, accessories, colors…" })}${ui.error ? FF.notice(ui.error, { tone: "ember", icon: "exclamationmark.triangle" }) : ""}${FF.button("Create for free", { kind: "primary", full: true, enabled: ready, busy, cls: busy && ready ? "rt-busy" : "", on: "rootCharCreate" })}<p class="t-caption c-2">Until it is ready, you keep ${esc(animalName(p.animal || "goat"))}.</p></div></div></div>`;
        },
    });
    action("rootCharIdea", (i, ctx) => { ctx.ui.description = IDEAS[Number(i)][1]; render(); });
    action("rootCharCreate", (_, ctx) => {
        if (ctx.ui.busy) return;
        Object.assign(ctx.ui, { busy: true, error: null });
        characterBusy = true;
        render();
        setTimeout(() => {
            characterBusy = false;
            ctx.ui.busy = false;
            S.modals = S.modals.filter((m) => m.id !== "onboardingCharacter");
            const entry = obEntry();
            if (!entry) return render();
            // The drawing takes minutes, so onboarding moves on with the stock animal right away.
            Object.assign(progress(entry), { drawing: true, free: 0 });
            saveCompanion(entry);
        }, 900);
    });

    // ═══ WELCOME (WelcomeView + SignInControls) ═══
    let signingIn = false;
    screen("welcome", {
        kind: "flow", title: "Welcome",
        render: (p, ui, ctx) => {
            const enter = entering(ctx.entry, "welcome");
            const busy = signingIn || p.state === "busy";
            const error = { failed: "Couldn’t sign in. Try again.", apple: "Apple sign-in didn’t finish. Try again." }[p.error];
            const content = `<div class="rt-welcome-art"><div class="animal left">${hopper("goat", enter)}</div><div class="animal right">${hopper("fox", enter, { delay: 0.12 })}</div><span class="rt-bubble">Taking the long way?</span></div>`
                + heading("A little rivalry.\nA few more steps.", "Friendly competition for your everyday walks.");
            const actions = `<div class="rt-signin"><button type="button" class="rt-apple" aria-label="Sign in with Apple"${on("present:sysAppleSignIn?then=rootSignIn:apple")}${busy ? " disabled" : ""}>${icon("applelogo")}<span>Sign in with Apple</span></button><button type="button" class="rt-google" aria-label="Sign in with Google"${on("present:rootGoogleConsent")}${busy ? " disabled" : ""}><span class="g"><img src="${GOOGLE_ICON}" alt=""></span><span>Sign in with Google</span></button>${error ? `<p class="rt-auth-error">${esc(error)}</p>` : ""}</div>${busy ? `<p class="t-caption c-2">Signing in…</p>` : ""}`;
            return `<div class="rt-ob">${header(1, null, false)}${page(content, actions, enter)}</div>`;
        },
    });
    // A new account: Supabase signs in, then the profile has no handle yet, so onboarding starts at the username.
    action("rootSignIn", () => {
        signingIn = true;
        render();
        setTimeout(() => {
            signingIn = false;
            S.account = "onboarding";
            S.flow = { id: "onboarding", p: { step: "username" } };
            S.modals = [];
            render();
        }, 900);
    });

    // ContentView: restoring the session at cold launch, then the profile load.
    screen("restoring", { kind: "flow", title: "Restoring session", render: () => `<div class="rt-fill rt-center">${FF.loading()}</div>` });
    screen("accountUnavailable", {
        kind: "flow", title: "Account missing",
        render: (p) => p.state === "loading"
            ? `<div class="rt-fill rt-plain"><h2 class="t-heading">Loading your account…</h2></div>`
            : `<div class="rt-fill rt-plain"><h2 class="t-heading">Couldn't load your account</h2><p class="t-body c-2">Your profile is missing or the account was deleted. Sign out and start again.</p>${p.error ? `<p class="t-body c-ember">Can’t reach the staging database.</p>` : ""}<div class="rt-signout">${FF.button("Sign out", { kind: "secondary", on: "rootSignOut" })}</div></div>`,
    });
    action("rootSignOut", () => {
        S.account = "welcome";
        S.flow = { id: "welcome", p: {} };
        S.modals = [];
        render();
    });

    // ═══ ENVIRONMENT STRIP (ContentView.environmentStrip): Beta for everyone, App Store for the admin ═══
    action("environmentStrip", () => {
        const beta = S.environment === "beta";
        if (!beta && !(S.environment === "production" && S.admin)) return "";
        const name = beta ? "Beta" : "App Store";
        const label = S.admin ? `${name} · ${D().app.marketing} · build ${D().app.build}` : name;
        return `<button type="button" class="env-strip rt-env ${beta ? "beta" : "store"}"${on("rootEnvStrip")}>${icon(beta ? "flask.fill" : "rt.checkmark.seal.fill")}<span>${esc(label)}</span>${icon("chevron.right")}</button>`;
    });
    action("rootEnvStrip", () => { setTab("you"); present("betaTesting"); });
    action("rootSetEnv", (arg) => {
        const [environment, who] = arg.split(",");
        S.environment = environment;
        if (who === "player") S.admin = false;
        render();
    });

    // ═══ UPDATE TOAST (ContentView top overlay, AppUpdateChecker) ═══
    OVERLAYS.push(() => {
        const t = D()?.updateToast;
        if (!t) return "";
        return `<div class="rt-update">${FF.toast({ icon: "arrow.down.app", title: "New FitFight version", message: t.testFlight === false ? "Ready in the App Store." : "Ready in TestFlight.", tone: "neutral", raised: false, action: { title: "Update FitFight", on: "rootUpdateGo" }, close: "rootUpdateClose" })}</div>`;
    });
    function showUpdate(kind) {
        const t = { testFlight: kind !== "appstore", preview: kind === "preview" };
        D().updateToast = t;
        render();
        // A real release hides itself after 10 seconds; the admin preview stays until closed.
        if (!t.preview) setTimeout(() => { if (D().updateToast === t) { D().updateToast = null; render(); } }, 10000);
    }
    action("rootShowUpdate", (kind) => showUpdate(kind));
    // Settings > Developer > Preview update card.
    action("showUpdateToast", () => showUpdate("preview"));
    action("rootUpdateGo", () => {
        const t = D().updateToast;
        D().updateToast = null;
        if (t && !t.preview) present("sysExternal", { url: t.testFlight === false ? APP_STORE_URL : "itms-beta://" });
        else render();
    });
    action("rootUpdateClose", () => { D().updateToast = null; render(); });

    // ═══ IN-APP ALERTS (InAppAlertView over the tab app, one after another) ═══
    let shownAlert = null;
    OVERLAYS.push(() => {
        const a = D()?.inAppAlert;
        // It waits behind the check-in, the notification question and any sheet.
        if (!a || S.flow || S.modals.length) return "";
        const enter = shownAlert !== a.id;
        shownAlert = a.id;
        return `<div class="rt-iaa ${enter ? "enter" : ""}" data-key="rootInAppAlert"><div class="scrim"${on("rootIaaDismiss")}></div><div class="card" role="dialog" aria-modal="true">${a.image ? `<img src="${esc(a.image)}" alt="">` : ""}<h2>${esc(a.title)}</h2><p>${esc(a.body)}</p><div class="buttons">${a.buttons.map((b, i) => FF.button(b.title, { kind: b.primary ? "primary" : "secondary", full: true, on: `rootIaaChoose:${i}` })).join("")}</div></div></div>`;
    });
    const nextAlert = () => { D().inAppAlert = D().inAppAlertQueue?.shift() ?? null; };
    action("rootShowInAppAlert", (which) => {
        const queue = which === "queue" ? [IN_APP_ALERTS.first, IN_APP_ALERTS.character] : [IN_APP_ALERTS[which] || IN_APP_ALERTS.first];
        D().inAppAlert = clone(queue[0]);
        D().inAppAlertQueue = queue.slice(1).map(clone);
        shownAlert = null;
        render();
    });
    action("rootIaaDismiss", () => { nextAlert(); render(); });
    // Not now shows the next alert; a button that opens something leaves the rest for the next open.
    action("rootIaaChoose", (i) => {
        const choice = D().inAppAlert?.buttons[Number(i)];
        D().inAppAlert = null;
        if (choice?.action === "update") return present("sysExternal", { url: choice.url || APP_STORE_URL });
        if (choice?.action === "open_character") return present("paidCharacter");
        if (choice?.action === "new_fight") return setTab("newFight");
        nextAlert();
        render();
    });

    // ═══ DAILY CHECK-IN (DailyStatusRecapView, medium sheet from the daily_status push) ═══
    function recapBody(fight) {
        const mine = fight?.standings.find((row) => row.person === D().you);
        if (!mine) return "Your fight is moving. Open it to see today’s standings.";
        const [first, second] = fight.standings;
        if (first.person === mine.person) {
            return second
                ? `You lead ${fight.name} by ${fmt.n(mine.score - second.score)} steps. ${person(second.person).name} is closest, so keep moving today.`
                : `You’re walking ${fight.name} on your own today. Every step still counts.`;
        }
        return `You’re ${fmt.n(first.score - mine.score)} steps behind ${person(first.person).name} in ${fight.name}. A short walk tonight closes the gap.`;
    }
    screen("dailyRecap", {
        kind: "drawer", detent: "medium", title: "Today's check-in",
        render: (p) => `<div class="rt-recap rt-nograb"><h2>Today's check-in</h2><p>${esc(p.body || recapBody(fightById(p.id) || D().fights.find((f) => f.status === "live")))}</p>${FF.button("Got it", { full: true, on: "close" })}</div>`,
    });

    // ═══ MISSING FIGHT (ContentView.MissingFightView): reads friend rounds once, then says so ═══
    screen("missingFight", {
        kind: "push", title: "Missing fight",
        render: (p, ui) => {
            if (!ui.checked && !ui.timer && p.state !== "checking") ui.timer = setTimeout(() => { ui.checked = true; render(); }, 900);
            const body = ui.checked
                ? `<div class="rt-missing"><h2 class="t-heading">That fight isn’t on your list.</h2>${FF.button("Close", { kind: "secondary", on: "back" })}</div>`
                : `<div class="rt-missing center">${FF.loading()}</div>`;
            return `<div class="ff-screen"><div class="ff-top"><div class="rt-navbar"><button type="button" class="rt-glass" aria-label="Back"${on("back")}>${icon("chevron.left")}</button></div></div>${body}</div>`;
        },
    });

    // ═══ ROOT ALERTS (ContentView .alert modifiers) ═══
    screen("pushPrePrompt", {
        kind: "alert", title: "Get fight-end reminders?",
        alert: () => ({
            title: "Get fight-end reminders?",
            message: "FitFight can remind you when a fight ends and when to sync your steps. Lock-screen alerts never show scores or fight titles.",
            buttons: [{ title: "Allow notifications", on: "rootPushAllow" }, { title: "Not now", role: "cancel" }],
        }),
    });
    action("rootPushAllow", () => { dismiss(); present("sysNotificationPermission"); });
    screen("appStoreNotice", {
        kind: "alert", title: "FitFight is on the App Store",
        alert: () => ({
            title: "FitFight is on the App Store",
            message: "FitFight is now on the App Store, and your friends are there. Your steps and stats from this TestFlight beta no longer reach them. Tap below, then sign in with the same Apple ID. If the App Store shows Open, delete this TestFlight app first, then tap Get.",
            buttons: [{ title: "Open the App Store", on: "rootOpenAppStore" }, { title: "Not now", role: "cancel" }],
        }),
    });
    action("rootOpenAppStore", () => { dismiss(); present("sysExternal", { url: APP_STORE_URL }); });
    screen("referralError", {
        kind: "alert", title: "Couldn’t save referral",
        alert: () => ({
            title: "Couldn’t save referral",
            message: "Your referral hasn’t been saved yet. Check your connection and try again.",
            buttons: [{ title: "Not now", role: "cancel" }, { title: "Try again", on: "close" }],
        }),
    });
    screen("companionPreviewNotice", {
        kind: "alert", title: "Companion preview",

    screen("sysPhotoPicker", {

                const n = picked.indexOf(i);
                return `<button type="button" class="rt-photo ${n >= 0 ? "on" : ""}" aria-label="Photo ${i + 1}"${on(`rootPhotoTap:${i}`)}>${scene(i, `rt-ph-${i}`)}${n >= 0 ? `<span class="pick">${n + 1}</span>` : ""}</button>`;
            }).join("")}</div><div class="rt-picker-foot">${max > 1 ? (picked.length ? `${picked.length} Selected` : `Select up to ${max} items.`) : "Tap a photo to add it."}</div></div>`;

    const ROOT_DO = /[?&]rootdo=([^&/]*)$/;

    addCSS(`
        /* iOS system colours, only for the system UI mocks below (they are Apple's, not FitFight's). */
        [data-theme="night"] { --ios-sheet: #1C1C1E; --ios-cell: #2C2C2E; --ios-label: #FFFFFF; --ios-label2: rgba(235,235,245,0.6); --ios-sep: rgba(84,84,88,0.65); --ios-blue: #0A84FF; --ios-green: #30D158; --ios-fill: rgba(120,120,128,0.36); --ios-glass: rgba(120,120,128,0.32); --ios-glass-edge: rgba(255,255,255,0.10); --g-bg: #131314; --g-text: #E3E3E3; --g-text2: #C4C7C5; --g-line: #444746; --g-link: #A8C7FA; }

        /* OnboardingHeader, OnboardingPage */

        .rt-ob-back svg { stroke-width: 2.3; }

        .rt-ob-progress { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 8px; }
        .rt-ob-progress .row { display: flex; justify-content: space-between; font-size: 13px; font-weight: 800; }

// ═══ 20-fights.js ═══
{
    // ═══ FIGHTS TAB: FightsListView, TenKStreak, FriendsGroupView, HostedFightsView, CompanionIntroduction ═══
    // Swift: FightsListView.swift, TenKStreak.swift, FriendsGroupView.swift, FriendsView.swift (FriendLookupField),
    // RemainingTime.swift, CompanionViews.swift (CompanionIntroduction, CompanionLevelsSheet, effort stages),
    // PaidCharacterView.swift (PaidCharacterProgressCard), AppModel.swift (live / invited / finished, sort, labels).
    //
    // Data this part adds (DATA_HOOKS):
    //   fights flagged `friends: true` (monthly friend rounds) and `hostedRound: true` (Fight Marc rounds). Like the app's
    //     friendRounds / hostedRounds they stay out of the Fights lists and "Leading X of Y"; other areas listing
    //     D().fights should skip both flags.
    //   friendsGroup { requests, suggestions, asked }, hosted { name }, streak, suggestedFights, stepsStatus,
    //   customCharacter, pendingJoinable (set when an Invited suggestion opens the New tab's join preview).

    const NOW = () => Date.now();
    const sum = (list) => list.reduce((a, b) => a + b, 0);
    const steps = (value) => fmt.n(Math.round(value));
    const isMe = (id) => id === D().you;
    const plural = (n, one, other) => `${fmt.n(n)} ${n === 1 ? one : other}`;

    // ─── Labels from AppModel.swift and RemainingTime.swift ───
    // Fight.deadlineStamp: .abbreviated date + .shortened time, en_US: "Oct 13, 2026 at 9:41 AM".
    const stamp = (date) => {
        const d = new Date(date);
        return `${d.toLocaleDateString("en-US", { month: "short", day: "numeric", year: "numeric" })} at ${d.toLocaleTimeString("en-US", { hour: "numeric", minute: "2-digit" })}`;
    };
    // RemainingTime.phrase: one coarse unit, hours only under two days, minutes only under two hours, joined by ListFormatter.
    function remaining(end, now = NOW()) {
        end = new Date(end).getTime();
        if (end <= now) return "";
        const start = new Date(now);
        const plusMonths = (n) => new Date(start.getFullYear(), start.getMonth() + n, start.getDate(), start.getHours(), start.getMinutes(), start.getSeconds(), start.getMilliseconds()).getTime();
        let months = 0;
        while (plusMonths(months + 1) <= end) months++;
        let rest = end - plusMonths(months);
        const totalDays = Math.floor(rest / DAY);
        rest -= totalDays * DAY;
        const hours = Math.floor(rest / HOUR);
        const minutes = Math.floor((rest - hours * HOUR) / 60000);
        const weeks = Math.floor(totalDays / 7);
        let parts;
        if (months > 0) parts = [plural(months, "month", "months")];
        else if (weeks > 0) parts = [plural(weeks, "week", "weeks")];
        else if (totalDays >= 2) parts = [plural(totalDays, "day", "days")];
        else if (totalDays >= 1) parts = [plural(totalDays, "day", "days"), hours > 0 ? plural(hours, "hour", "hours") : null];
        else if (hours >= 2) parts = [plural(hours, "hour", "hours")];
        else if (hours === 1) parts = [plural(1, "hour", "hours"), minutes > 0 ? plural(minutes, "minute", "minutes") : null];
        else parts = [plural(Math.max(1, minutes), "minute", "minutes")];
        parts = parts.filter(Boolean);
        return parts.length === 2 ? `${parts[0]} and ${parts[1]}` : parts[0];
    }
    const isUpcoming = (f) => f.serverState === "scheduled" && new Date(f.windowStart).getTime() > NOW();
    const hasPassedDeadline = (f) => f.status === "finished" || f.status === "pending" || new Date(f.windowEnd).getTime() <= NOW();
    const deadlineLabel = (f) => (hasPassedDeadline(f) ? `Ended ${stamp(f.windowEnd)}` : `Ends ${stamp(f.windowEnd)}`);
    const timeLeft = (f) => (isUpcoming(f) ? `Starts ${stamp(f.windowStart)}` : hasPassedDeadline(f) ? deadlineLabel(f) : `${remaining(f.windowEnd)} left`);
    const durationLabel = (f) => {
        const hours = Math.max(1, Math.round((new Date(f.windowEnd) - new Date(f.windowStart)) / HOUR));
        return hours <= 6 ? plural(hours, "hour", "hours") : plural(f.lengthDays, "day", "days");
    };
    // Fight.displayTitle: a typed name wins, then the action, then "Steps Fight".
    const displayTitle = (name, action) => {
        const stored = (name || "").trim();
        const act = (action || "").trim();
        if (!stored || stored === "Steps Fight" || stored === "Défi de pas") return act || stored || "Steps Fight";
        return stored;
    };
    // Fight.listTitle: a friend round shows the friend.
    const listTitle = (f) => {
        if (f.friends) {
            const friend = f.standings.find((s) => !isMe(s.person));
            if (friend) return person(friend.person)?.name || "";
        }
        return displayTitle(f.name, f.actionText);
    };
    const youStanding = (f) => f.standings.find((s) => isMe(s.person));
    const racing = (f) => f.standings.filter((s) => !s.invited && !s.deferred);
    // AppModel.mapFight: your place among everyone racing, by score then name; the server rank otherwise.
    function listRank(f) {
        const mine = youStanding(f);
        const joined = racing(f).slice().sort((a, b) => b.score - a.score || (person(a.person)?.name || "").localeCompare(person(b.person)?.name || ""));
        const place = mine ? joined.findIndex((s) => s.person === mine.person) + 1 || mine.rank || 0 : 0;
        return (f.status === "finished" ? mine?.rank : null) ?? place;
    }
    const fieldSize = (f) => Math.max(racing(f).length, 1);
    const tiedForFirst = (f) => racing(f).filter((s) => s.rank === 1).length > 1;
    // AppModel.fightResult -> FFResult: W, L, D (draw or next round) or P (pending).
    function result(f) {
        if (youStanding(f)?.deferred) return "D";
        if (f.status === "pending") return "P";
        if (f.serverState && f.serverState !== "final" && f.serverState !== "cancelled") return "P";
        if (tiedForFirst(f)) return "D";
        return listRank(f) === 1 ? "W" : "L";
    }

    // ─── The three lists (AppModel.live / invitations / finished) ───
    const listed = () => D().fights.filter((f) => !f.friends && !f.hostedRound);
    const priority = { live: 4, pending: 3, invited: 2, finished: 1 };
    function canonical() {
        const chosen = {};
        for (const f of listed()) {
            const key = f.seriesId || f.id;
            const kept = chosen[key];
            if (!kept) { chosen[key] = f; continue; }
            if (priority[f.status] !== priority[kept.status]) { if (priority[f.status] > priority[kept.status]) chosen[key] = f; }
            else if (new Date(f.windowStart) > new Date(kept.windowStart)) chosen[key] = f;
        }
        return Object.values(chosen);
    }
    const byStartDesc = (a, b) => new Date(b.windowStart) - new Date(a.windowStart);
    const liveFights = () => canonical().filter((f) => f.status === "live").sort(byStartDesc);
    const invitations = () => canonical().filter((f) => f.status === "invited").sort(byStartDesc);
    function finishedFights() {
        const ids = new Set(canonical().map((f) => f.id));
        return listed().filter((f) => {
            if (f.status !== "pending" && f.status !== "finished") return false;
            if (ids.has(f.id)) return true;
            const mine = youStanding(f);
            return !!mine && !mine.invited && !mine.deferred;
        }).sort(byStartDesc);
    }
    const SORTS = [["recentlyStarted", "Recently started"], ["endingSoonest", "Ending soonest"], ["winningMost", "Winning most"], ["winningLeast", "Winning least"]];
    // FightsListView.sorted: Recently started uses windowStart; fights without a score yet sink to the bottom.
    function sorted(fights, sort) {
        const now = NOW();
        const lead = (f) => {
            const me = youStanding(f);
            const rivals = f.standings.filter((s) => !isMe(s.person) && !s.invited && !s.deferred).map((s) => s.score);
            if (isUpcoming(f) || !me || me.deferred || !rivals.length) return NaN;
            return me.score - Math.max(...rivals);
        };
        return fights.slice().sort((a, b) => {
            if (sort === "recentlyStarted") {
                const d = new Date(b.windowStart) - new Date(a.windowStart);
                if (d) return d;
            } else if (sort === "endingSoonest") {
                const d = Math.abs(new Date(a.windowEnd) - now) - Math.abs(new Date(b.windowEnd) - now);
                if (d) return d;
            } else {
                const l = lead(a), r = lead(b);
                if (isNaN(l) !== isNaN(r)) return isNaN(l) ? 1 : -1;
                if (!isNaN(l) && l !== r) return sort === "winningMost" ? r - l : l - r;
            }
            return a.id < b.id ? -1 : a.id > b.id ? 1 : 0;
        });
    }
    const friendRounds = () => D().fights.filter((f) => f.friends);
    const hostedRounds = () => D().fights.filter((f) => f.hostedRound);
    const strictlyAhead = (f) => {
        const me = youStanding(f);
        const rivals = f.standings.filter((s) => !isMe(s.person) && !s.invited && !s.deferred).map((s) => s.score);
        return !!me && !me.deferred && rivals.length > 0 && me.score > Math.max(...rivals);
    };
    const current = (rounds) => rounds.filter((f) => f.status === "live" && new Date(f.windowEnd).getTime() > NOW());
    // FitFightSnapshot.Friends: nil until the snapshot arrives (loading), which hides the card.
    function friendsSummary() {
        const group = D().friendsGroup;
        if (!group) return null;
        const rounds = current(friendRounds());
        return { rounds: rounds.length, leading: rounds.filter(strictlyAhead).length, requests: group.requests.length };
    }
    const friendsSubtitle = (s) => (s.rounds > 0 ? `Leading ${s.leading} of ${s.rounds}` : "Add friends to fight them every month");
    // FitFightSnapshot.Hosted: only for accounts that host something (the founder, so Admin here).
    function hostedCounts() {
        if (!D().hosted) return null;
        const rounds = current(hostedRounds());
        return { name: D().hosted.name, rounds: rounds.length, leading: rounds.filter(strictlyAhead).length };
    }
    const hostedSummary = () => (S.admin ? hostedCounts() : null);

    // ─── Companion art (CompanionAvatar, CompanionAvatarStack) ───
    const youCompanion = () => you().companion || D().companion;
    // A custom character's id starts with "custom" (the companion area wears it as an art path to its portrait).
    const isCustom = (id) => !!id && id.startsWith("custom");
    function companionSrc(p) {
        if (!p?.companion) return "";
        return p.companion === "custom" ? p.companionImage || asset("CharacterIdea-pig") : companionArt(p.companion);
    }
    // Full body in a square, or head to waist (halfBody) for the small stacks on Fights cards.
    function avatar(id, size = 44, o = {}) {
        const p = typeof id === "string" ? person(id) : id;
        const src = companionSrc(p);
        if (!src) return `<span class="fl-ring" style="--ring:${o.ring || "var(--bg)"}">${FF.avatar(p?.initials || "?", { size })}</span>`;
        if (o.half) {
            const h = size / 0.55;
            return `<span class="fl-half" style="width:${size}px;height:${size}px"><img src="${esc(src)}" alt="" style="width:${(h * 352) / 400}px;height:${h}px"></span>`;
        }
        return `<img class="fl-full" src="${esc(src)}" alt="" style="width:${size}px;height:${size}px">`;
    }
    function avatarStack(ids, o = {}) {
        const visible = o.visible || 3, size = o.size || 36, ring = o.ring || "var(--bg)";
        const shown = ids.slice(0, visible).map((id, i) => `<span class="fl-stack-item" style="z-index:${visible - i}">${avatar(id, size, { half: o.half, ring })}</span>`);
        if (ids.length > visible) shown.push(`<span class="fl-more" style="width:${size}px;height:${size}px;--ring:${ring}">+${ids.length - visible}</span>`);
        return `<span class="fl-stack" aria-hidden="true">${shown.join("")}</span>`;
    }

    // ─── Rows and cards ───
    // LiveFightCard: the number is your distance from whoever you are actually racing.
    function difference(f) {
        const mine = youStanding(f);
        if (mine?.deferred) return { text: "Next round", ahead: true, gap: false };
        const rivals = f.standings.filter((s) => !isMe(s.person) && !s.invited && !s.deferred).map((s) => s.score);
        if (!mine) return rivals.length ? { text: steps(Math.max(...rivals)), ahead: true, gap: false } : { text: "-", ahead: true, gap: false };
        if (!rivals.length) return { text: steps(mine.score), ahead: true, gap: false };
        const gap = mine.score - Math.max(...rivals);
        if (gap === 0) return { text: "Tied", ahead: true, gap: false };
        return { text: `${gap < 0 ? "−" : "+"}${steps(Math.abs(gap))}`, ahead: gap > 0, gap: true };
    }
    function liveCard(f, o = {}) {
        const start = new Date(f.windowStart).getTime(), end = new Date(f.windowEnd).getTime();
        const total = Math.max(end - start, 1);
        const elapsed = Math.min(Math.max(NOW() - start, 0), total);
        const day = Math.min(Math.floor(elapsed / DAY) + 1, Math.max(f.lengthDays, 1));
        const upcoming = isUpcoming(f);
        const diff = difference(f);
        const tone = upcoming || !diff.gap ? "var(--text)" : diff.ahead ? "var(--mossText)" : "var(--emberText)";
        const placed = !upcoming && f.standings.some((s) => isMe(s.person) && !s.deferred);
        const urgent = !upcoming && end - NOW() < 2 * DAY;
        return `<button type="button" class="fl-live ff-press"${on(o.on || `push:fight?id=${f.id}`)}>

            <span class="row who">${avatarStack(f.standings.filter((s) => !s.invited).map((s) => s.person), { visible: 4, size: 22, ring: "var(--card)", half: true })}${placed ? `<span>${esc(`${fmt.ordinal(listRank(f))} of ${fieldSize(f)}`)}</span>` : ""}</span>
