    // AppModel.openJoinable: a fight you are in opens on Fights; any other shows Join preview on New.
    function openJoinable(summary) {
        const d = newDraft();
        d.createError = null;
        if (summary.alreadyMember) {
            D().pendingJoinable = null;
            go(`#fights/fight?id=${encodeURIComponent(summary.fightId)}`);
            return;
        }
        D().pendingJoinable = pendingFromSummary(summary);
        if (S.tab !== "newFight") setTab("newFight");
        if (!S.stacks.newFight.length) S.stacks.newFight.push({ id: "newJoin", p: {} });
        render();
    }
    action("nfOpenJoinable", (id) => { const s = findSummary(id); if (s) openJoinable(s); });

    // NewFightView.lookupCode -> AppModel.openJoinCode
    action("nfLookup", (arg, ctx) => {
        const d = newDraft();
        const code = typedJoinCode(d.joinCode);
        if (!codeOK(code) || d.lookingUp) return;
        d.lookingUp = true;
        d.createError = null;
        render();
        setTimeout(() => {
            d.lookingUp = false;
            const mine = D().fights.find((f) => f.joinCode === code);
            const listed = D().discovery.public.find((s) => s.joinCode === code);
            if (mine) openJoinable(summaryOfFight(mine));
            else if (listed) openJoinable(listed);
            else { d.createError = "Fight not found"; render(); }
        }, 700);
    });

    // AppModel.acceptFight on a pending join (joinPendingFight): join now, or start with the next round.
    function joinPending(start) {
        const d = newDraft();
        const pending = D().pendingJoinable;
        if (!pending || d.joining) return;
        d.joining = true;
        d.createError = null;
        render();
        setTimeout(() => {
            d.joining = false;
            const summary = findSummary(pending.id);
            let fight = D().fights.find((f) => f.id === pending.id);
            if (fight) {
                const mine = fight.standings.find((s) => s.person === D().you);
                if (mine) { mine.invited = false; mine.deferred = start === "next"; }
                fight.status = "live";
            } else {
                const members = summary?.members || [personForHandle(summary?.ownerHandle || "sam")];
                const totals = [...(summary?.scores || members.map(() => 0)), start === "next" ? 0 : (D().todaySteps || 0) + (D().steps?.[D().steps.length - 2] || 0)];
                fight = buildFight({
                    id: pending.id, name: pending.name, code: pending.joinCode, start: Date.parse(pending.windowStart), end: Date.parse(pending.windowEnd),
                    cast: [...members, D().you], totals, action: pending.actionText, recurring: pending.recurring, seriesId: pending.seriesId,
                    owner: members[0], visibility: "joinable", flags: start === "next" ? { [D().you]: { deferred: true } } : {},
                });
                D().fights.unshift(fight);
            }
            for (const s of [...D().discovery.public, ...(D().suggestedFights || [])]) {
                if (s.fightId === pending.id) { s.alreadyMember = true; s.membershipState = start === "next" ? "deferred" : "accepted"; s.memberCount += 1; }
            }
            D().pendingJoinable = null;
            go(`#fights/fight?id=${encodeURIComponent(fight.id)}`);
        }, 800);
    }
    action("nfJoin", (start) => joinPending(start === "next" ? "next" : "now"));
    // AppModel.declineFight on a pending join: forget it and stay on Join.
    action("nfDecline", () => {
        const d = newDraft();
        d.createError = null;
        D().pendingJoinable = null;
        if (S.tab === "newFight") {
            const top = newTop();
            if (!top) S.stacks.newFight.push({ id: "newJoin", p: {} });
            else if (top.id === "newJoin" && top.p.preview) top.p = {};
        }
        render();
    });

    // NewFightView.startFight -> AppModel.createAndStartFight. Success opens the new fight on Fights.
    action("nfStart", () => {
        const d = newDraft();
        if (d.creating) return;
        d.creating = true;
        d.createError = null;
        render();
        setTimeout(() => {
            const now = Date.now();
            const tz = newZone(d);
            const start = d.custom ? d.start : now;
            const end = d.custom ? d.end : addDays(start, d.days, tz);
            const handles = [...new Set(d.invites.map(strippedHandle).filter(isValidHandle))];
            const cast = [D().you, ...handles.map(personForHandle)];
            const id = `new-${now.toString(36)}`;
            const fight = buildFight({
                id, name: storedName(d.title, d.action), code: freshCode(), start, end, cast, totals: cast.map(() => 0),
                action: d.action.trim(), recurring: d.recurring, owner: D().you, visibility: d.joinable ? "joinable" : "invite_only",
                serverState: d.custom ? "scheduled" : "live", timeZone: tz,
                flags: Object.fromEntries(cast.slice(1).map((pid) => [pid, { invited: true }])),
            });
            if (d.custom) fight.days = [];
            D().fights.unshift(fight);
            if (d.joinable) D().discovery.public.unshift({ ...summaryOfFight(fight), ownerHandle: handleOf(D().you), alreadyMember: true, membershipState: "accepted" });
            S.ui.newFight = {};
            go(`#fights/fight?id=${id}`);
        }, 900);
    });

    // ─── Time zone picker (FitFightTimeZonePicker sheet) ───
    // p.for: "new" (Create), "edit" with p.id (Edit fight), or a name another area registers in COMPOSER.timeZoneTargets.
    const timeZoneTargets = {
        new: { get: () => newZone(newDraft()), set: (zone) => { const d = newDraft(); const old = newZone(d); d.start = moveWall(d.start, old, zone); d.end = moveWall(d.end, old, zone); d.tz = zone; } },
        edit: {
            get: (p) => editDraft(p.id)?.tz || localZone(),
            set: (zone, p) => { const d = editDraft(p.id); if (!d) return; if (d.canEditStart) d.start = moveWall(d.start, d.tz, zone); d.end = moveWall(d.end, d.tz, zone); d.tz = zone; },
        },
    };
    // Other areas that open FitFightTimeZonePicker (Edit profile) add their own target here.
    globalThis.TIME_ZONE_TARGETS = timeZoneTargets;
    screen("newTimeZone", {
        kind: "sheet", title: "Time zone",
        render: (p, ui) => {
            const target = timeZoneTargets[p.for] || timeZoneTargets.new;
            const selected = target.get(p);
            const q = (ui.q || "").trim().toLowerCase();
            const zones = [...new Set([...allZones(), selected])].sort().filter((z) => !q || z.replace(/_/g, " ").toLowerCase().includes(q));
            return `<div class="ff-screen nf-tz">
                <div class="nf-tz-nav"><span class="nf-tz-title">Time zone</span><button type="button" class="nf-tz-done" data-on="close">Done</button></div>
                <div class="ff-scroll" data-scroll><div class="nf-tz-list">${zones.map((z) => `<button type="button" class="nf-tz-item" data-on="${esc(`nfTzPick:${z}`)}"><span class="grow">${esc(z.replace(/_/g, " "))}</span>${z === selected ? `<span class="c-moss">${icon("checkmark")}</span>` : ""}</button>`).join("")}</div></div>
                <div class="nf-tz-search"><span class="c-2">${icon("magnifyingglass")}</span><input type="search" placeholder="Search time zones" value="${esc(ui.q || "")}" data-bind="q" autocomplete="off" autocapitalize="none" spellcheck="false"></div>
            </div>`;
        },
    });
    // FitFightTimeZonePicker's row clears the search before it opens the sheet.
    action("nfTzOpen", (query) => {
        const p = Object.fromEntries(new URLSearchParams(query));
        delete S.ui[keyOf({ id: "newTimeZone", p })];
        present("newTimeZone", p);
    });
    action("nfTzPick", (zone, ctx) => {
        (timeZoneTargets[ctx.p.for] || timeZoneTargets.new).set(zone, ctx.p);
        dismiss();

    // Date pickers: the native inputs report a wall-clock date or time in the picker's zone.
    phone.addEventListener("change", (event) => {
        const el = event.target.closest?.("[data-nf-date]");
        if (!el || !el.value) return;
        const host = el.closest("[data-key]");
        const d = uiOf(host.dataset.key);
        const [which, part] = el.dataset.nfDate.split(":");
        const tz = d.tz || profileZone();
        const w = wall(d[which], tz);
        if (part === "date") { const [y, mo, day] = el.value.split("-").map(Number); Object.assign(w, { y, mo, d: day }); }
        else { const [h, mi] = el.value.split(":").map(Number); Object.assign(w, { h, mi }); }
        let ms = zoned(w.y, w.mo, w.d, w.h, w.mi, 0, tz);
        if (el.dataset.min) ms = Math.max(ms, Number(el.dataset.min));
        d[which] = ms;
        render();
    });
    phone.addEventListener("click", (event) => {
        const el = event.target.closest?.("input[data-nf-date]");
        if (el && typeof el.showPicker === "function") { try { el.showPicker(); } catch {} }
    });
    // FFGroupedRow draws its SF Symbol resizable, fitted to a 16pt box; the SVGs carry padding in their 24pt grid,
    // so after each draw the glyphs on these screens are cropped to their drawing and scaled to fit 16pt.
    new MutationObserver(() => {
        phone.querySelectorAll(".nf-glyphs .ff-grow .icon svg:not([data-fit])").forEach((svg) => {
            const box = svg.getBBox();
            if (!box.width || !box.height) return;
            const scale = 16 / Math.max(box.width, box.height);
            svg.setAttribute("viewBox", `${box.x} ${box.y} ${box.width} ${box.height}`);
            svg.style.width = `${box.width * scale}px`;
            svg.style.height = `${box.height * scale}px`;
            svg.setAttribute("data-fit", "");
        });
    }).observe(phone, { childList: true, subtree: true });
    // Return in a field submits, like .onSubmit.
    phone.addEventListener("keydown", (event) => {
        const el = event.target.closest?.("[data-nf-enter]");
        if (!el || event.key !== "Enter" || event.isComposing) return;
        event.preventDefault();
        run(el.dataset.nfEnter, el, event);
    });

    // ─── EditFightView (sheet, p.id; p.step for a sub-page; p.friends=1 / p.upcoming=1 preview those variants) ───
    function editDraft(id) { return S.ui[`editFight:${id}`]; }
    function initEdit(fightIn, p) {
        let fight = clone(fightIn);
        if (p.friends === "1") fight.friends = true;
        if (p.upcoming === "1" && !isUpcoming(fight)) {
            const start = Math.ceil((Date.now() + DAY) / HOUR) * HOUR;
            fight = { ...fight, serverState: "scheduled", windowStart: iso(start), windowEnd: iso(start + fight.lengthDays * DAY) };
        }
        const start = Date.parse(fight.windowStart), end = Date.parse(fight.windowEnd);
        const days = Math.max(1, Math.round((end - start) / DAY));
        const preset = [3, 7, 14, 30].includes(days);
        const stored = (fight.name || "").trim();
        return {
            fight, upcomingPreview: p.upcoming === "1",
            title: stored === "Steps Fight" || stored === "Défi de pas" ? "" : stored,
            action: fight.actionText || "", joinable: fight.visibility === "joinable", recurring: !!fight.recurring,
            days: preset ? days : 7, custom: !preset, start, end, tz: fight.timeZone || localZone(),
            joinCode: fight.joinCode || "", closesAfterGrace: !!fight.graceEndsAt, username: "", usernameError: null,
            people: fight.standings.map((row) => {
                const per = person(row.person) || { id: row.person, name: row.person, handle: row.person };
                return { id: row.person, handle: strippedHandle(per.handle), name: per.name, isOwner: row.person === fight.inviter, invited: !!row.invited, deferred: !!row.deferred, pendingAdd: false };
            }),
            saving: false, deleting: false, createError: null, canEditStart: isUpcoming(fight),
        };
    }
    function editSchedule(d) {
        const startsAt = d.canEditStart && d.custom ? d.start : Date.parse(d.fight.windowStart);
        const endsAt = d.custom ? d.end : addDays(startsAt, d.days, d.tz);
        let error = null;
        if (d.canEditStart && d.custom && d.start <= Date.now()) error = "Choose a start time in the future.";
        else if (endsAt <= startsAt) error = "The end must be after the start.";
        else if (endsAt <= Date.now()) error = "The end must be in the future.";
        return { startsAt, endsAt, error };
    }
    const deadlineRow = (d) => FF.grouped([FF.groupedRow({
        title: "Close 24 hours after the end", subtitle: d.closesAfterGrace ? "Anyone not synced by then keeps their last sync" : "Waits for everyone’s final steps",
        icon: "clock", subtitleTone: d.closesAfterGrace ? "moss" : "neutral", trailing: sysToggle(d.closesAfterGrace, "toggle:closesAfterGrace", "Close 24 hours after the end"),
    })]);

    screen("editFight", {
        kind: "sheet", title: "Edit fight",
        render: (p, ui, ctx) => {
            ensureData();
            const key = `editFight:${p.id}`;
            let d = S.ui[key];
            const source = findFight(p.id);
            if (!d || d.entry !== ctx.entry) {
                if (!source) return FF.screen(FF.empty({ icon: "exclamationmark.triangle", title: "Fight not found", message: "This fight is no longer in the fake data.", actionTitle: "Close", on: "close" }), { clearance: false });
                d = S.ui[key] = initEdit(source, p);
                d.entry = ctx.entry;
                if (p.days) { d.days = Number(p.days); d.custom = false; }
                if (p.error) d.createError = { taken: "That code is taken. Try another.", failed: "Couldn’t save the fight.", deleteFailed: "Couldn’t delete the fight." }[p.error] || null;
            }
            S.ui[ctx.key] = d;
            if (d.joinCode !== typedJoinCode(d.joinCode)) d.joinCode = typedJoinCode(d.joinCode);
            const fight = d.fight;
            const friends = fight.friends === true;
            const step = friends ? "review" : STEPS.includes(p.step) ? p.step : "review";
            const sched = editSchedule(d);
            const isOwner = fight.inviter === D().you;
            const canSave = [...d.title.trim()].length <= 120 && [...d.action.trim()].length <= 120 && !sched.error && (!fight.joinCode || codeOK(d.joinCode)) && !d.saving && !d.deleting;

            const header = `<div class="ef-head"><span class="t-rowTitle">Edit fight</span>${FF.navGlyph("xmark", { on: "close", label: "Close" })}${step !== "review" ? '<button type="button" class="ef-done t-label c-moss" data-on="efDone">Done</button>' : ""}</div>`;
            const parts = [];
            if (friends) {
                parts.push(limitedField("Loser action", "Cook dinner", "action", d.action, "nfBlur"), deadlineRow(d));
            } else if (step === "metric") parts.push(metricPage());
            else if (step === "duration") parts.push(durationPage({ d, tz: d.tz, canEditStart: d.canEditStart, startsImmediately: false, constrainEnd: true, scheduleError: sched.error, tzSpec: `nfTzOpen:for=edit&id=${p.id}` }));
            else if (step === "people") parts.push(peoplePage({ d, people: d.people.map((x) => ({ ...x, link: x.pendingAdd ? null : x.id === D().you ? "tab:you" : `present:profileSheet?id=${x.id}` })), createMode: false, addSpec: "efAdd", removeSpec: "efRemove" }));
            else if (step === "details") parts.push(detailsPage(d));
            else {
                parts.push(reviewPage({ isEditing: true, d, tz: d.tz, durationStart: sched.startsAt, handles: d.people.filter((x) => !x.isOwner).map((x) => x.handle), healthConnected: healthAsked(), changeSpec: (s) => `efStep:${s}`, connectSpec: "efHealth" }));
                if (fight.joinCode) parts.push(`<div class="vstack" style="gap:8px"><span class="t-rowTitle">Fight code</span>${fieldBox({ placeholder: "K7M2", value: d.joinCode, bind: "joinCode", caps: "characters" })}<p class="t-caption c-2">4 to 12 letters or numbers, not used by another fight. The old code and link stop working.</p></div>`);
                parts.push(deadlineRow(d));
            }
            parts.push('<div style="height:20px"></div>');
            if (step === "review") {
                parts.push(FF.cta(d.saving ? "Saving…" : "Save changes", { enabled: canSave, busy: d.saving, on: "efSave" }));
                if (isOwner && !friends) parts.push(`<div style="margin-top:8px">${FF.cta(d.deleting ? "Deleting…" : "Delete", { kind: "ember", enabled: !d.saving && !d.deleting, busy: d.deleting, on: `present:editFightDelete?id=${p.id}` })}</div>`);
                if (d.createError) parts.push(emberNotice(d.createError));
                if (sched.error) parts.push(emberNotice(sched.error, "calendar"));
            } else {
                parts.push(FF.cta("Done", { enabled: step !== "duration" || !sched.error, on: "efDone" }));
            }
            return `<div class="nf-glyphs ${d.still ? "ef-still" : ""}" style="position:absolute;inset:0">${FF.screen(parts.join(""), { top: header, clearance: false })}</div>`;
        },
    });
    screen("editFightDelete", {
        kind: "actions",
        alert: () => ({
            title: "Delete fight?",
            message: "This ends the fight for everyone in it. If it repeats, the next windows stop too. This can’t be undone.",
            buttons: [{ title: "Delete", role: "destructive", on: "efDelete" }, { title: "Cancel", role: "cancel", on: "close" }],
        }),
    });

    const editEntry = (id) => S.modals.find((m) => m.id === "editFight" && m.p.id === id);
    function setEditStep(ctx, step) {
        const entry = ctx.entry || editEntry(ctx.p.id);
        const d = editDraft(ctx.p.id);
        if (!entry || !d) return;
        const { id, friends, upcoming } = entry.p;
        entry.p = { id, ...(friends ? { friends } : {}), ...(upcoming ? { upcoming } : {}), ...(step === "review" ? {} : { step }) };
        d.still = true;
        render();
    }
    action("efStep", (step, ctx) => setEditStep({ p: ctx.p }, step));
    // EditFightView.returnToSummary: a typed username is added first; an invalid one keeps you on People.
    action("efDone", (arg, ctx) => {
        const d = editDraft(ctx.p.id);
        if (ctx.p.step === "people" && d.username.trim()) {
            addUsername(d, d.people.map((x) => x.handle), (h) => d.people.push({ id: `handle:${h}`, handle: h, name: `@${h}`, isOwner: false, invited: true, deferred: false, pendingAdd: true }));
            if (d.usernameError) return render();
        }
        setEditStep({ p: ctx.p }, "review");
    });
    action("efAdd", (arg, ctx) => {
        const d = editDraft(ctx.p.id);
        addUsername(d, d.people.map((x) => x.handle), (h) => d.people.push({ id: `handle:${h}`, handle: h, name: `@${h}`, isOwner: false, invited: true, deferred: false, pendingAdd: true }));
        render();
    });
    action("efRemove", (id, ctx) => { const d = editDraft(ctx.p.id); d.people = d.people.filter((x) => x.id !== id); render(); });
    action("efHealth", () => { markHealthAsked(); present("sysHealthPermission"); });

    // EditFightView.save -> AppModel.updateFight. A code another fight uses is refused like the server does.
    action("efSave", (arg, ctx) => {
        const d = editDraft(ctx.p.id);
        if (!d || d.saving) return;
        d.saving = true;
        d.createError = null;
        render();
        setTimeout(() => {
            d.saving = false;
            const fight = findFight(ctx.p.id);
            if (!fight) { d.createError = "Couldn’t save the fight."; return render(); }
            const code = d.joinCode;
            if (fight.joinCode && code !== fight.joinCode && [...allFights(), ...D().discovery.public.map((s) => ({ id: s.fightId, joinCode: s.joinCode }))].some((f) => f.id !== fight.id && f.joinCode === code)) {
                d.createError = "That code is taken. Try another.";
                return render();
            }
            const sched = editSchedule(d);
            fight.name = d.fight.friends ? fight.name : storedName(d.title, d.action);
            fight.actionText = d.action.trim();
            if (!d.fight.friends) {
                fight.visibility = d.joinable ? "joinable" : "invite_only";
                fight.recurring = d.recurring;
                if (d.recurring && !fight.seriesId) fight.seriesId = `series-${fight.id}`;
                if (!d.upcomingPreview) {
                    if (d.canEditStart) fight.windowStart = iso(sched.startsAt);
                    fight.windowEnd = iso(sched.endsAt);
                    fight.lengthDays = Math.max(1, Math.floor((sched.endsAt - Date.parse(fight.windowStart)) / DAY));
                    if (d.canEditStart) fight.timeZone = d.tz;
                }
                if (fight.joinCode) fight.joinCode = code;
                const keep = new Set(d.people.filter((x) => !x.pendingAdd).map((x) => x.id));
                fight.standings = fight.standings.filter((s) => keep.has(s.person) || s.person === fight.inviter || s.person === D().you);
                for (const x of d.people.filter((y) => y.pendingAdd)) {
                    const pid = personForHandle(x.handle);
                    if (!fight.standings.some((s) => s.person === pid)) fight.standings.push({ person: pid, score: 0, rank: fight.standings.length + 1, invited: true });
                }
            }
            if (d.closesAfterGrace) fight.graceEndsAt = iso(Date.parse(fight.windowEnd) + DAY);
            else delete fight.graceEndsAt;
            fight.closesAfterGrace = d.closesAfterGrace;
            dismiss();
        }, 700);

        const s = elapsed(value);

        if (s < 60) return `${s} sec. ago`;
        const m = Math.floor(s / 60);
        if (m < 60) return `${m} min. ago`;

        const days = Math.floor(h / 24);

        return people.filter((p) => wanted.has(handleOf(p.id).toLowerCase())).map((p) => p.id);
    };
    // FeedMentionField: up to five matches above the field once an "@" is being typed.
    function mentionList(text, people, bind) {
        const active = activeQuery(text || "");
        if (!active) return "";
        const matches = (active.query ? people.filter((p) => handleOf(p.id).toLowerCase().startsWith(active.query) || p.name.toLowerCase().includes(active.query)) : people).slice(0, 5);
        if (!matches.length) return "";
        return `<div class="fd-mentions">${matches.map((p, i) => `<button type="button" class="fd-mention"${on(`feedMention:${bind}|${handleOf(p.id)}`)}><span class="t-label">${esc(p.handle)}</span>${p.name.trim() ? `<span class="t-caption c-2">${esc(p.name)}</span>` : ""}</button>${i < matches.length - 1 ? FF.divider() : ""}`).join("")}</div>`;
    }
    action("feedMention", (arg, ctx) => {
        const [bind, handle] = arg.split("|");
        ctx.ui[bind] = applyMention(handle, ctx.ui[bind] || "");
        ctx.ui.focus = true;
        render();
    });
    // A growing TextField(axis: .vertical) with lineLimit(min...max).
    const textarea = (bind, value, placeholder, key, ui, lines, max) => `<textarea class="fd-input" rows="${lines[0]}" data-bind="${bind}" data-fd-grow="${lines.join(",")}" placeholder="${esc(placeholder)}"${max ? ` maxlength="${max}"` : ""}${ui.focus ? ` data-fd-focus="${esc(key)}"` : ""} autocomplete="off" spellcheck="false">${esc(value || "")}</textarea>`;

    // ─── Pieces ───
    // CompanionAvatar: transparent companion art, full body in a square; initials when there is no companion.
    const avatar = (p, size) => (p?.companion ? `<span class="fd-cav" style="width:${size}px;height:${size}px">${companionImg(p, { w: size, h: size })}</span>` : FF.avatar(p?.initials || "?", { size }));
    const dots = (size) => `<svg class="fd-dots" width="${size + 2}" height="${size / 3.5}" viewBox="0 0 16 4" aria-hidden="true"><circle cx="2" cy="2" r="1.7"/><circle cx="8" cy="2" r="1.7"/><circle cx="14" cy="2" r="1.7"/></svg>`;
    const translateButton = (text, center) => (foreign(text) ? `<button type="button" class="fd-iconbtn fd-translate ${center ? "center" : ""}" aria-label="Translate"${on(`feedTranslate:${encodeURIComponent(text)}`)}>${icon("character.bubble")}</button>` : "");
    // A fake photo: companion art on a soft scene, sized like the real attachment.
    const fakePhoto = (m, cls = "") => `<span class="fd-photo ${cls}" style="aspect-ratio:${m.width || 4}/${m.height || 3}"><img src="${companionArt(m.companion, m.pose)}" alt=""></span>`;
    // MediaAttachment (RequestsView.swift): photo opens the viewer, video plays inline, anything else is a link row.
    function mediaAttachment(post, m, ui) {
        if (m.kind === "photo") return `<button type="button" class="fd-media" aria-label="View photo"${on(`present:feedPhoto?id=${post.id}&m=${post.media.indexOf(m)}`)}>${fakePhoto(m)}</button>`;
        if (m.kind === "video") {
            const playing = ui.playing === m.id;
            return `<button type="button" class="fd-video ${playing ? "playing" : ""}" aria-label="Video"${on(`feedPlay:${m.id}`)}><img src="${companionArt(m.companion, m.pose)}" alt=""><span class="fd-play">${icon(playing ? "pause.fill" : "play.fill")}</span><span class="fd-scrub"><span></span></span></button>`;
        }
        return `<button type="button" class="fd-file"${on(`present:sysExternal?url=${encodeURIComponent(`https://fitfight.app/media/${m.name}`)}`)}><span class="c-moss">${icon("doc.fill")}</span><span class="t-caption grow ellipsis">${esc(m.name)}</span></button>`;
    }

    // ─── FightPostCard ───
    function postCard(post, o = {}) {
        const key = `feedPost:${post.id}`;
        const ui = uiOf(key);
        const author = person(post.author) || { id: post.author, handle: "@someone", initials: "?" };
        const openSpec = o.onOpen && post.fightId ? `feedOpenFight:${post.fightId}` : "";
        const head = `<div class="fd-head">
            <button type="button" class="fd-id" aria-label="${esc(author.handle)}"${on(`feedProfile:${author.id}`)}>${avatar(author, 38)}</button>
            <div class="fd-who">
                <button type="button" class="fd-id fd-handle"${on(`feedProfile:${author.id}`)}><span class="ellipsis">${esc(author.handle)}</span></button>
                <div class="fd-meta"${on(openSpec)}><span class="ch">${esc(channelLabel(post))}</span><span>·</span><span>${esc(relNamed(post.createdAt))}</span></div>
            </div>
            <div class="fd-trail">${translateButton(post.body)}<button type="button" class="fd-iconbtn" aria-label="Post actions"${on(`present:feedPostActions?id=${post.id}`)}>${dots(14)}</button></div>
        </div>`;
        const tags = post.tags.length ? `<p class="t-caption c-moss">${esc(post.tags.map((id) => person(id)?.handle || "").join(" "))}</p>` : "";
        const body = post.body ? `<p class="t-body c-text fd-text">${esc(post.body)}</p>` : "";
        const media = post.media.map((m) => mediaAttachment(post, m, ui)).join("");
        return `<div class="fd-post" data-key="${esc(key)}">${FF.card(`<div class="fd-stack">${head}${tags}${body}${media}${engagement(post, ui, key, o)}</div>`, { padding: 16 })}</div>`;
    }

    // ─── FightPostEngagement ───
    function displayedComments(postID) {
        const list = D().comments.filter((c) => c.postId === postID);
        const ids = new Set(list.map((c) => c.id));
        const ordered = (items) => [...items].sort((a, b) => b.createdAt.localeCompare(a.createdAt) || (b.id > a.id ? 1 : -1));
        const rows = [];
        const walk = (c, depth) => {
            rows.push([c, depth]);
            ordered(list.filter((x) => x.parentId === c.id)).forEach((child) => walk(child, depth + 1));
        };
        ordered(list.filter((c) => !c.parentId || !ids.has(c.parentId))).forEach((c) => walk(c, 0));
        return rows;
    }
    function engagement(post, ui, key, o) {
        const ranked = [...post.reactions].sort((a, b) => b.count - a.count || (a.emoji < b.emoji ? -1 : a.emoji > b.emoji ? 1 : 0)).map((r) => r.emoji);
        const options = [...ranked, ...QUICK_EMOJI.filter((e) => !ranked.includes(e))];
        const chips = options.map((emoji) => {
            const r = post.reactions.find((x) => x.emoji === emoji);
            return `<button type="button" class="fd-chip ${r?.mine ? "mine" : r ? "has" : ""}" aria-label="${emoji}"${on(`feedReactTo:${post.id}|${emoji}`)}><span><span class="e">${emoji}</span>${r ? `<span>${r.count}</span>` : ""}</span></button>`;
        }).join("");
        const count = post.commentCount;
        const open = ui.open ?? (count > 0 || !!o.target);
        const actions = `<div class="fd-actions">${FF.divider(0)}
            <div class="fd-chips"><div class="fd-chiprow">${chips}</div><button type="button" class="fd-iconbtn fd-plus" aria-label="Other emoji…"${on(`feedOpenReact:${post.id}`)}>${icon("plus")}</button></div>
            <div class="fd-row2"><button type="button" class="t-caption c-moss fd-toggle"${on(`feedToggleThread:${post.id}`)}>${count === 0 ? "Comment" : count === 1 ? "1 comment" : `${count} comments`}</button><span class="grow"></span>${post.reactions.length ? `<button type="button" class="t-micro c-2 fd-toggle"${on(`present:feedReactions?id=${post.id}`)}>View reactions</button>` : ""}</div>
        </div>`;
        if (!open) return `<div class="fd-engage">${actions}</div>`;
        const rows = displayedComments(post.id).map(([c, depth]) => commentRow(post, c, depth, o)).join("");
        const reply = ui.replyTo && D().comments.find((c) => c.id === ui.replyTo);
        const draft = ui.draft || "";
        const canSend = !ui.sending && draft.trim().length > 0;
        const composer = `<div class="fd-mention-field">${mentionList(draft, directory(postIsMain(post), postFightIDs(post)), "draft")}
            <div class="fd-composer">${textarea("draft", draft, reply ? `Reply to ${person(reply.author)?.handle || "@someone"}…` : "Write a comment…", key, ui, [1, 4])}${reply ? `<button type="button" class="fd-iconbtn fd-cancel" aria-label="Cancel reply"${on("set:replyTo=")}>${icon("xmark")}</button>` : ""}<button type="button" class="fd-iconbtn fd-send ${canSend ? "on" : ""}" aria-label="${ui.sending ? "Posting…" : "Send"}"${on(`feedSendComment:${post.id}`)}${canSend ? "" : " disabled"}>${ui.sending ? '<span class="spinner"></span>' : icon("arrow.up.circle.fill")}</button></div>
        </div>`;
        return `<div class="fd-engage">${actions}${rows}${composer}</div>`;
    }
    function commentRow(post, c, depth, o) {
        const author = person(c.author) || { id: c.author, handle: "@someone", initials: "?" };
        const liked = c.likedByMe === true;
        const scroll = o.target === c.id && o.scrollKey && !uiOf(o.scrollKey).scrolled ? ` data-fd-scroll="${esc(o.scrollKey)}"` : "";
        return `<div class="fd-comment" style="padding-left:${Math.min(depth, 4) * 14}px"${scroll}>
            <button type="button" class="fd-cav-btn" aria-label="${esc(author.handle)}"${on(`feedProfile:${author.id}`)}>${avatar(author, 28)}</button>
            <div class="fd-cbody">
                <div class="fd-chead"><button type="button" class="fd-chandle"${on(`present:profileSheet?id=${author.id}`)}>${esc(author.handle)}</button><span class="fd-ctime">${esc(relNarrow(c.createdAt))}</span></div>
                <p class="fd-ctext">${esc(c.body)}</p>
                <div class="fd-cactions"><button type="button" class="fd-reply"${on(`feedReply:${c.id}`)}>Reply</button>${translateButton(c.body, true)}<button type="button" class="fd-iconbtn fd-cmenu" aria-label="Comment actions"${on(`feedCommentMenu:${c.id}`)}>${dots(12)}</button></div>
            </div>
            <button type="button" class="fd-like ${liked ? "on" : ""}" aria-label="${liked ? "Unlike comment" : "Like comment"}"${on(`feedLike:${c.id}`)}>${icon(liked ? "heart.fill" : "heart")}${c.likeCount > 0 ? `<span>${c.likeCount}</span>` : ""}</button>
        </div>`;
    }

    // FeedPostList: the cards, then a load-more row while the server has another page.
    function postList(posts, ui, o) {
        const shown = ui.fdShown || PAGE;
        const cards = posts.slice(0, shown).map((post) => postCard(post, o)).join("");
        if (posts.length <= shown) return cards;
        const error = D().feedError && !ui.fdMoreRetried;
        const more = error
            ? `<span class="t-caption c-ember fd-clamp">${esc(D().feedError)}</span><button type="button" class="t-label c-moss"${on(`feedRetryMore:${o.key}`)}>Try again</button>`
            : `<span class="spinner c-2" aria-label="Loading"></span>`;
        return `${cards}<div class="fd-more"${error ? "" : ` data-fd-more="${esc(o.key)}"`}>${more}</div>`;
    }

    // ═══ SCREENS ═══
    const navBar = (title) => `<div class="fd-navbar"><button type="button" class="fd-back" aria-label="Back"${on("back")}>${icon("chevron.left")}</button><span class="fd-navtitle">${esc(title)}</span></div><div style="height:8px"></div>`;

    // FeedView: tab root.
    screen("feed", {
        kind: "root",
        title: "Feed",
        render: (p, ui, ctx) => {
            const loading = S.scenario === "loading";
            const posts = loading ? [] : visiblePosts();
            let html = FF.screenTitle("Feed", "Posts from fights you’re in.", FF.compose("New post", { on: "present:feedCompose" }));
            if (D().feedError) html += FF.notice(D().feedError, { tone: "ember", icon: "exclamationmark.triangle" });
            if (!posts.length && loading) html += FF.loading();
            else if (!posts.length) html += FF.card(`<p class="t-body c-2">Nothing here yet. Tap + to post.</p>`);
            html += postList(posts, ui, { key: ctx.key, onOpen: true });
            return FF.screen(html);
        },
    });

    // FightPostDetailView: pushed from a notification or Activity.
    screen("post", {
        kind: "push",
        title: "Post",
        render: (p, ui, ctx) => {
            if (ui.entry !== ctx.entry) {
                for (const k of Object.keys(ui)) delete ui[k];
                ui.entry = ctx.entry;
                // Mirror-only deep links into a thread state: ?reply=<comment id> or ?draft=@
                const card = uiOf(`feedPost:${p.id}`);
                if (p.reply) Object.assign(card, { open: true, replyTo: p.reply });
                if (p.draft) Object.assign(card, { open: true, draft: p.draft });
            }
            const post = visiblePosts().find((x) => x.id === p.id);
            const error = D().feedError && !ui.retried;
            let html = "";
            if (error) html += FF.notice(D().feedError, { tone: "ember", icon: "exclamationmark.triangle" }) + FF.button("Try again", { kind: "ghost", full: true, on: "feedRetry" });
            if (post && !error && !ui.loading) html += postCard(post, { onOpen: true, target: p.comment, scrollKey: ctx.key });
            else if (S.scenario === "loading" || ui.loading) html += FF.loading();
            else if (!error) html += `<p class="t-body c-2">This post is no longer available.</p>`;
            return FF.screen(html, { top: navBar("Post") });
        },
    });

    // FeedActivityView: pushed from Profile > Settings > Notifications & activity.
    screen("activity", {
        kind: "push",
        title: "Activity",
        render: (p, ui, ctx) => {
            if (ui.entry !== ctx.entry) {
                for (const k of Object.keys(ui)) delete ui[k];
                ui.entry = ctx.entry;
            }
            const error = D().feedError && !ui.retried;
            const loading = S.scenario === "loading" || ui.loading;
            const all = error || ui.loading ? [] : D().activity;
            const events = all.slice(0, ui.shown || ACTIVITY_PAGE);
            let html = `<p class="t-body c-2">Posts, comments, reactions and membership history from your fights.</p>`;
            if (error) html += FF.notice(D().feedError, { tone: "ember", icon: "exclamationmark.triangle" }) + FF.button("Try again", { kind: "ghost", full: true, on: "feedRetry" });
            if (!events.length && loading) html += FF.loading();
            else if (!events.length && !error) html += `<p class="t-body c-2">No activity yet.</p>`;
            html += events.map((e) => FF.card(`<span class="vstack" style="gap:6px">
                <span class="t-rowTitle c-text">${esc(activitySummary(e))}</span>
                <span class="t-caption c-moss">${esc(fightById(e.fightId)?.name || e.fightName)}</span>
                ${e.body ? `<span class="t-body c-2 fd-clamp3">${esc(e.body)}</span>` : ""}
                <span class="t-micro c-2">${esc(e.occurredAt ? activityDate(e.occurredAt) : "Time not recorded")}</span>
            </span>`, { padding: 16, on: `feedOpenActivity:${e.id}` })).join("");
            if (all.length > events.length) html += FF.button("More", { kind: "ghost", full: true, on: "feedActivityMore", enabled: !ui.loadingMore });
            return FF.screen(html, { top: navBar("Activity") });
        },
    });
    function activitySummary(e) {
        const actor = handleOf(e.actor);
        switch (e.kind) {
            case "feed_post": return `@${actor} posted`;
            case "post_comment": return `@${actor} commented`;
            case "comment_reply": return `@${actor} replied`;
            case "post_reaction": return `@${actor} reacted`;
            case "invited": return e.subject ? `@${actor} invited @${handleOf(e.subject)}` : "Invitation";
            case "accepted": return `@${actor} joined`;
            case "deferred": return `@${actor} joined the next round`;
            case "declined": return `@${actor} declined`;
            case "withdrawn": return `@${actor} left`;
            case "disqualified": return `@${actor} was disqualified`;
            default: return "Fight activity";
        }
    }

    // "Post" confirmationDialog (title hidden): Edit/Delete on yours, Report/Hide on someone else's.
    screen("feedPostActions", {
        kind: "actions",
        alert: (p) => {
            const post = postById(p.id);
            const buttons = post && isMine(post)
                ? [{ title: "Edit", on: `close ; feedEdit:${p.id}` }, { title: "Delete", role: "destructive", on: `close ; present:feedDeletePost?id=${p.id}` }]
                : [{ title: "Report", on: "close" }, { title: "Hide this person", role: "destructive", on: `close ; feedHide:${post?.author || ""}` }];
            return { buttons: [...buttons, { title: "Cancel", role: "cancel", on: "close" }] };
        },
    });
    screen("feedDeletePost", {
        kind: "alert",
        // A two-button iOS alert puts Cancel on the leading side.
        alert: (p) => ({ title: "Delete this post?", buttons: [{ title: "Cancel", role: "cancel", on: "close" }, { title: "Delete", role: "destructive", on: `close ; feedDelete:${p.id}` }] }),
    });

    // "React" alert with an Emoji field; React stays disabled until the text starts with an emoji.
    const firstEmoji = (value) => {
        const first = [...new Intl.Segmenter("en", { granularity: "grapheme" }).segment(String(value || "").normalize("NFC"))][0]?.segment;
        return first && /\p{Emoji}/u.test(first) ? first : null;
    };
    screen("feedReact", {
        kind: "alert",
        alert: (p, ui) => ({
            title: "React",
            field: `<input class="sys-field" type="text" placeholder="Emoji" data-bind="emoji" value="${esc(ui.emoji || "")}" autocomplete="off" spellcheck="false">`,
            buttons: [{ title: "Cancel", role: "cancel", on: "close" }, { title: "React", on: firstEmoji(ui.emoji) ? `close ; feedReactCustom:${p.id}` : "feedNoop" }],
        }),
    });

    // FightPostReactionsSheet: one card per person, newest page first.
    screen("feedReactions", {
        kind: "sheet",
        title: "Reactions",
        render: (p, ui, ctx) => {
            if (ui.entry !== ctx.entry) {
                for (const k of Object.keys(ui)) delete ui[k];
                ui.entry = ctx.entry;
            }
            const post = postById(p.id);
            // A retry clears the error while it loads; the list stays empty until it answers.
            const failed = D().feedError && !ui.retried;
            const error = failed && !ui.loading;
            const others = Object.keys(D().people).filter((id) => id !== D().you);
            const people = [];
            for (const r of [...(post?.reactions || [])].sort((a, b) => b.count - a.count)) {
                if (r.mine) people.push([D().you, r.emoji]);
                for (let i = r.mine ? 1 : 0; i < r.count && others.length; i++) people.push([others.shift(), r.emoji]);
            }
            const rows = failed ? [] : people.slice(0, ui.shown || REACTION_PAGE);
            let html = FF.sheetHeader("Reactions");
            html += rows.map(([id, emoji]) => FF.card(`<button type="button" class="fd-react-row"${on(`feedProfile:${id}`)}><span class="t-title">${emoji}</span><span class="vstack" style="gap:2px"><span class="t-label c-text">${esc(person(id).handle)}</span><span class="t-caption c-2">${esc(person(id).name)}</span></span></button>`)).join("");
            if (!rows.length && !error && !ui.loading) html += `<p class="t-body c-2">No reactions yet</p>`;
            // FFScreen stacks leading: the spinner and the ghost buttons sit on the left at their own width.
            if (ui.loading) html += `<span class="spinner c-moss fd-lead"></span>`;
            if (error) html += FF.notice(D().feedError, { tone: "ember", icon: "exclamationmark.triangle" }) + FF.button("Retry", { kind: "ghost", on: "feedRetry", cls: "fd-lead" });
            else if (!failed && people.length > rows.length) html += FF.button("More reactions", { kind: "ghost", on: "feedReactionsMore", enabled: !ui.loading, cls: "fd-lead" });
            return FF.screen(html, { clearance: false });
        },
    });

    // FightPostEditSheet
    screen("feedEditPost", {
        kind: "sheet",
        title: "Edit post",
        render: (p, ui, ctx) => {
            const post = postById(p.id);
            if (ui.entry !== ctx.entry) {
                for (const k of Object.keys(ui)) delete ui[k];
                Object.assign(ui, { entry: ctx.entry, draft: post?.body || "" });
            }
            const people = post ? directory(postIsMain(post), postFightIDs(post)) : [];
            let html = FF.sheetHeader("Edit post");
            html += FF.card(`<div class="fd-mention-field">${mentionList(ui.draft, people, "draft")}${textarea("draft", ui.draft, "Add a note or some proof…", ctx.key, ui, [3, 8], 500)}</div>`);
            // The sheet shares the Feed's store, so the Feed's error shows here too.
            if (D().feedError) html += FF.notice(D().feedError, { tone: "ember", icon: "exclamationmark.triangle" });
            html += FF.button(ui.saving ? "Saving…" : "Save", { full: true, on: `feedSaveEdit:${p.id}`, enabled: !ui.saving });
            return FF.screen(html, { clearance: false });
        },
    });

    // FightPostPhotoViewer: full screen, fit to screen; a tap anywhere or Close dismisses.
    screen("feedPhoto", {
        kind: "cover",
        title: "Photo",
        render: (p) => {
            const m = postById(p.id)?.media?.[Number(p.m || 0)];
            return `<div class="fd-viewer"${on("close")}>${m ? fakePhoto(m, "fit") : ""}<button type="button" class="fd-viewer-close t-label c-moss"${on("close")}>Close</button></div>`;
        },
    });

    // ─── FeedComposeSheet + FightPostComposer ───
    let activeComposer = null;
    let pendingPick = null; // { key, kind } while the system photo picker or camera is up
    const composeState = (p, ui) => {
        const broadcast = p.broadcast === "1" || p.broadcast === "true";
        const fights = postableFights();
        const allIDs = fights.map((f) => f.id);
        const sendsToFriends = ui.everyone || ui.friends;
        const chosen = ui.everyone ? allIDs : [...allIDs.filter((id) => ui.fightIDs.includes(id)), ...ui.fightIDs.filter((id) => !allIDs.includes(id))];
        const destinations = broadcast ? ["broadcast"] : [...(sendsToFriends ? ["friends"] : []), ...chosen];
        const friendList = sendsToFriends ? D().friends : [];
        const audience = [...new Set([...friendList, ...fights.filter((f) => chosen.includes(f.id)).flatMap(members)])];
        return { broadcast, fights, sendsToFriends, chosen, destinations, audience };
    };
    function addPicked(key, count) {
        const ui = uiOf(key);
        const room = 4 - ui.images.length;
        for (let i = 0; i < Math.min(count, room); i++) ui.images.push({ companion: PHOTO_ART[(ui.images.length + i) % PHOTO_ART.length], pose: "effort-3", width: 3, height: 4 });
        ui.error = null;
    }
    screen("feedCompose", {
        kind: "sheet",
        title: "New post",
        render: (p, ui, ctx) => {
            activeComposer = ctx.key;
            if (ui.entry !== ctx.entry) {
                for (const k of Object.keys(ui)) delete ui[k];
                // Same composer from Feed and from a fight; only what starts ticked differs.
                Object.assign(ui, { entry: ctx.entry, text: "", images: [], video: false, everyone: !p.fightId, friends: false, fightIDs: p.fightId ? [p.fightId] : [] });
                // Mirror-only states for the map: ?demo=photos|video|error|choose
                if (p.demo === "photos") { ui.text = "Lunch walk receipts."; addPicked(ctx.key, 2); }
                if (p.demo === "video") ui.video = true;
                if (p.demo === "error") ui.error = "Choose up to four photos or one video per post.";
                if (p.demo === "choose") Object.assign(ui, { everyone: false, friends: true, fightIDs: postableFights().map((f) => f.id) });
                if (p.demo === "none") Object.assign(ui, { everyone: false, friends: false, fightIDs: [] });
            }
            // When the system picker closes without reporting back (or is not drawn yet), treat it as a pick.
            if (pendingPick?.key === ctx.key && !S.modals.some((m) => m.id === "sysPhotoPicker" || m.id === "sysCamera")) {
                if (!SCREENS[pendingPick.kind === "camera" ? "sysCamera" : "sysPhotoPicker"]) addPicked(ctx.key, pendingPick.kind === "camera" ? 1 : 2);
                pendingPick = null;
            }
            const st = composeState(p, ui);
            let html = FF.sheetHeader(st.broadcast ? "Broadcast" : "New post");
            if (st.broadcast) {
                html += `<p class="t-caption c-2">This post appears on Feed for everyone signed in.</p>` + composer(st, ui, ctx.key, "");
            } else if (!st.fights.length && !p.fightId && !D().friends.length) {
                html += FF.card(`<p class="t-body c-2">Add a friend or join a fight first, then post from here.</p>`);
            } else {
                html += composer(st, ui, ctx.key, audienceBlock(st, ui));
            }
            // feed.error is the Feed's own store, so its error (offline) shows here as well.
            const error = ui.error || D().feedError;
            if (error) html += FF.notice(error, { tone: "ember", icon: "exclamationmark.triangle" });
            return FF.screen(html, { clearance: false });
        },
    });
    function composer(st, ui, key, destination) {
        const main = st.destinations.includes("broadcast");
        const people = directory(main, st.destinations.filter((d) => d !== "friends" && d !== "broadcast"));
        const thumbs = ui.images.length ? `<div class="fd-thumbs">${ui.images.map((m, i) => `<button type="button" class="fd-thumb" aria-label="Remove photo"${on(`feedRemovePhoto:${i}`)}><img src="${companionArt(m.companion, m.pose)}" alt=""></button>`).join("")}</div>` : "";
        const video = ui.video ? `<button type="button" class="fd-videochip"${on("set:video=false")}><span class="c-moss">${icon("video.fill")}</span><span class="t-caption c-2">Video</span></button>` : "";
        const canPost = !ui.saving && st.destinations.length > 0 && ((ui.text || "").trim() || ui.images.length || ui.video);
        const mediaDisabled = ui.images.length >= 4 || ui.video || ui.saving;
        return `<div class="fd-composeblock">
            ${FF.card(`<div class="fd-compose-row">${avatar(you(), 36)}<div class="fd-compose-col"><div class="fd-mention-field">${mentionList(ui.text, people, "text")}${textarea("text", ui.text, "Add a note or some proof…", key, ui, [3, 6], 500)}</div>${thumbs}${video}</div></div>`)}
            <div class="hstack" style="gap:10px"><button type="button" class="fd-mediabtn"${on("feedMediaMenu")}${mediaDisabled ? " disabled" : ""}>${icon("photo.on.rectangle.angled")}Photo or video</button></div>
            ${destination}
            ${FF.button(ui.saving ? "Posting…" : "Post", { size: "large", full: true, on: "feedSubmit", enabled: !!canPost })}
        </div>`;
    }
    function audienceBlock(st, ui) {
        const stack = st.audience.length ? `<span class="fd-stackav">${st.audience.slice(0, 4).map((id, i) => `<span class="fd-half" style="z-index:${4 - i}"><img src="${companionArt(person(id).companion)}" alt=""></span>`).join("")}${st.audience.length > 4 ? `<span class="fd-more-count">+${st.audience.length - 4}</span>` : ""}</span>` : "";
        const check = (selected) => `<span class="fd-check ${selected ? "on" : ""}">${icon(selected ? "checkmark.circle.fill" : "circle")}</span>`;
        const picker = ui.everyone
            ? FF.card(`<div class="hstack" style="gap:12px">${stack}<span class="t-caption c-2">My friends and everyone in my fights</span></div>`)
            : FF.grouped([
                FF.groupedRow({ title: "My friends", subtitle: plural(D().friends.length, "%d person", "%d people"), icon: "person.2", subtitleTone: "neutral", trailing: check(ui.friends), on: "feedAudienceRow:friends" }),
                ...st.fights.map((f) => FF.groupedRow({ title: listTitle(f), subtitle: plural(members(f).length, "%d person", "%d people"), icon: "trophy", subtitleTone: "neutral", trailing: check(ui.fightIDs.includes(f.id)), on: `feedAudienceRow:${f.id}` })),
            ]);
        const footer = !st.destinations.length
            ? `<p class="t-caption c-ember">Pick who sees this</p>`
            : `<p class="t-caption c-2">${plural(st.audience.length, "Seen by %d person", "Seen by %d people")}</p>`;
        return `<div class="fd-audience"><span class="t-label c-text">Who sees this</span>${FF.segmented([[true, "Everyone"], [false, "Choose"]], ui.everyone, { on: "feedAudience:pick", fill: true })}${picker}${footer}</div>`;
    }

    // ═══ ACTIONS ═══
    action("feedNoop", () => {});
    action("feedProfile", (id) => {
        // Your own identity opens the Profile tab instead of a sheet about yourself.
        if (id === D().you) setTab("you");
        else present("profileSheet", { id });
    });
    action("feedOpenFight", (id) => go(`#fights/fight?id=${id}`));
    action("feedTranslate", (text) => present("sysTranslate", { text: decodeURIComponent(text) }));
    action("feedPlay", (id, ctx) => { ctx.ui.playing = ctx.ui.playing === id ? null : id; render(); });
    action("feedEdit", (id) => present("feedEditPost", { id }));
    action("feedDelete", (id) => {
        const d = D();
        d.posts = d.posts.filter((post) => post.id !== id);
        d.comments = d.comments.filter((c) => c.postId !== id);
        render();
    });
    action("feedHide", (author) => { D().feedHidden = [...(D().feedHidden || []), author]; render(); });
    // FeedStore.react: one reaction per person; tapping yours again removes it.
    function react(post, emoji) {
        const removing = post.reactions.some((r) => r.mine && r.emoji === emoji);
        const next = post.reactions.map((r) => ({ ...r, count: r.count - (r.mine ? 1 : 0), mine: false })).filter((r) => r.count > 0);
        if (!removing) {
            const index = next.findIndex((r) => r.emoji === emoji);
            if (index >= 0) next[index] = { emoji, count: next[index].count + 1, mine: true };
            else next.push({ emoji, count: 1, mine: true });
        }
        post.reactions = next;
        render();
    }
    action("feedReactTo", (arg) => {
        const [id, emoji] = arg.split("|");
        const post = postById(id);
        if (post) react(post, emoji);
    });
    action("feedOpenReact", (id) => { uiOf(`feedReact?id=${id}`).emoji = ""; present("feedReact", { id }); });
    action("feedReactCustom", (id, ctx) => {
        const emoji = firstEmoji(ctx.ui.emoji);
        ctx.ui.emoji = "";
        const post = postById(id);
        if (post && emoji) react(post, emoji);
    });
    action("feedToggleThread", (id, ctx) => {
        const post = postById(id);
        ctx.ui.open = !(ctx.ui.open ?? post.commentCount > 0);
        if (ctx.ui.open && post.commentCount === 0) ctx.ui.focus = true;
        render();
    });
    action("feedReply", (commentID, ctx) => { Object.assign(ctx.ui, { replyTo: commentID, focus: true }); render(); });
    action("feedSendComment", (postID, ctx) => {
        const ui = ctx.ui;
        const note = (ui.draft || "").trim();
        if (!note || ui.sending) return;
        ui.sending = true;
        render();
        setTimeout(() => {
            const post = postById(postID);
            ui.sending = false;
            if (post) {
                D().comments.push({ id: uid(), postId: postID, parentId: ui.replyTo || null, author: D().you, body: note, createdAt: iso(Date.now()), likeCount: 0, likedByMe: false });
                post.commentCount += 1;
                Object.assign(ui, { draft: "", replyTo: null, open: true });
            }
            render();
        }, 500);
    });
    action("feedLike", (id) => {
        const c = D().comments.find((x) => x.id === id);
        if (!c) return;
        const liked = c.likedByMe !== true;
        c.likedByMe = liked;
        c.likeCount = Math.max(0, (c.likeCount || 0) + (liked ? 1 : -1));
        render();
    });
    action("feedCommentMenu", (id, ctx) => {
        const c = D().comments.find((x) => x.id === id);
        if (!c) return;
        menu([c.author === D().you ? { title: "Delete", destructive: true, on: `feedDeleteComment:${id}` } : { title: "Report", on: "feedCloseMenu" }], ctx.el);
    });
    action("feedCloseMenu", () => { S.menu = null; render(); });
    action("feedDeleteComment", (id) => {
        S.menu = null;
        const d = D();
        const target = d.comments.find((c) => c.id === id);
        if (!target) return render();
        const removed = new Set();
        const pending = [id];
        while (pending.length) {
            const next = pending.pop();
            if (removed.has(next)) continue;
            removed.add(next);
            pending.push(...d.comments.filter((c) => c.parentId === next).map((c) => c.id));
        }
        d.comments = d.comments.filter((c) => !removed.has(c.id));
        const post = postById(target.postId);
        if (post) post.commentCount = Math.max(0, post.commentCount - removed.size);
        const ui = uiOf(`feedPost:${target.postId}`);
        if (removed.has(ui.replyTo)) ui.replyTo = null;
        render();
    });
    action("feedRetryMore", (key) => { uiOf(key).fdMoreRetried = true; render(); });
    // Try again / Retry on Post, Activity and Reactions: a short load, then the server answers.
    action("feedRetry", (arg, ctx) => {
        ctx.ui.loading = true;
        render();
        setTimeout(() => { Object.assign(ctx.ui, { loading: false, retried: true }); render(); }, 600);
    });
    action("feedActivityMore", (arg, ctx) => {
        ctx.ui.loadingMore = true;
        render();
        setTimeout(() => { Object.assign(ctx.ui, { loadingMore: false, shown: (ctx.ui.shown || ACTIVITY_PAGE) + ACTIVITY_PAGE }); render(); }, 500);
    });
    action("feedReactionsMore", (arg, ctx) => {
        ctx.ui.loading = true;
        render();
        setTimeout(() => { Object.assign(ctx.ui, { loading: false, shown: (ctx.ui.shown || REACTION_PAGE) + REACTION_PAGE }); render(); }, 500);
    });
    action("feedOpenActivity", (id) => {
        const e = D().activity.find((x) => x.id === id);
        if (!e) return;
        if (e.postId) go(`#feed/post?id=${e.postId}${e.commentId ? `&comment=${e.commentId}` : ""}`);
        else go(`#fights/fight?id=${e.fightId}`);
    });
    action("feedSaveEdit", (id, ctx) => {
        const ui = ctx.ui;
        ui.saving = true;
        render();
        setTimeout(() => {
            ui.saving = false;
            // Offline the update fails: the sheet stays open under the error.
            if (D().feedError) return render();
            const post = postById(id);
            if (post) post.body = (ui.draft || "").trim();
            S.modals = S.modals.filter((m) => keyOf(m) !== ctx.key);
            render();
        }, 600);
    });
    // Composer
    action("feedAudience", (arg, ctx) => {
        const picked = arg.split("=")[1] === "true";
        const ui = ctx.ui;
        // Choose starts from everything Everyone had, so you untick what to leave out.
        if (ui.everyone && !picked) Object.assign(ui, { friends: true, fightIDs: postableFights().map((f) => f.id) });
        ui.everyone = picked;
        render();
    });
    action("feedAudienceRow", (id, ctx) => {
        const ui = ctx.ui;

        render();

    action("feedMediaMenu", (_, ctx) => {
        menu([{ title: "Take Photo", icon: "camera", on: "feedPickMedia:camera" }, { title: "Photo Library", icon: "photo", on: "feedPickMedia:library" }], ctx.el);
    });

        const ui = ctx.ui;

        const st = composeState(p, ui);
        ui.saving = true;
        render();
        setTimeout(() => {
            // Offline the upload fails: the sheet stays open under the error.
            if (D().feedError) { ui.saving = false; return render(); }
            const note = (ui.text || "").trim();
            const fightIDs = st.destinations.filter((d) => d !== "friends" && d !== "broadcast");
            const people = directory(st.broadcast, fightIDs);
            D().posts.unshift({
                id: uid(), author: D().you, fightId: fightIDs[0] || null,
                audience: st.broadcast ? "main" : fightIDs.length ? "fight" : "friends",
                broadcast: st.broadcast, toFriends: st.destinations.includes("friends"),
                channels: fightIDs.map((id) => ({ fightId: id, name: fightById(id)?.name || "" })),
                fightName: fightById(fightIDs[0])?.name || "",
                body: note, createdAt: iso(Date.now()), reactions: [], commentCount: 0,
                tags: taggedIDs(note, people),
                media: [...(ui.video ? [{ id: uid(), kind: "video", companion: you().companion, pose: "effort-4" }] : []), ...ui.images.map((m) => ({ id: uid(), kind: "photo", ...m }))],
            });
            ui.saving = false;
            S.modals = S.modals.filter((m) => keyOf(m) !== ctx.key);
            // Broadcast from Profile switches to the Feed tab once it posts.
            if (st.broadcast) setTab("feed");
            else render();
        }, 700);
    });

    // ─── After each draw: grow text fields, focus a field that asked for it, scroll to a target comment, load the next page when its row shows ───
    const loadingMore = new Set();
    // FeedPostList's load-more row starts the next page once it scrolls into view.
    function checkMore() {
        for (const el of phone.querySelectorAll("[data-fd-more]")) {
            const scroller = el.closest("[data-scroll]");
            const key = el.dataset.fdMore;
            if (!scroller || loadingMore.has(key) || el.getBoundingClientRect().top > scroller.getBoundingClientRect().bottom) continue;
            loadingMore.add(key);
            setTimeout(() => { loadingMore.delete(key); uiOf(key).fdShown = (uiOf(key).fdShown || PAGE) + PAGE; render(); }, 900);
        }
    }
    phone.addEventListener("scroll", checkMore, true);
    new MutationObserver(() => {
        phone.querySelectorAll("textarea[data-fd-grow]").forEach((el) => {
            const [min, max] = el.dataset.fdGrow.split(",").map(Number);
            const line = parseFloat(getComputedStyle(el).lineHeight) || 18;
            el.style.height = "auto";
            el.style.height = `${Math.min(max * line, Math.max(min * line, el.scrollHeight))}px`;
        });
        checkMore();
        const focus = phone.querySelector("[data-fd-focus]");
        if (focus) {
            uiOf(focus.dataset.fdFocus).focus = false;
            focus.removeAttribute("data-fd-focus");
            focus.focus({ preventScroll: true });
            focus.setSelectionRange(focus.value.length, focus.value.length);
        }
        const target = phone.querySelector("[data-fd-scroll]");
        if (target) {
            uiOf(target.dataset.fdScroll).scrolled = true;
            const scroller = target.closest("[data-scroll]");
            const zoom = phone.getBoundingClientRect().width / phone.offsetWidth;
            if (scroller) scroller.scrollTop += (target.getBoundingClientRect().top - scroller.getBoundingClientRect().top) / zoom - scroller.clientHeight / 2 + target.offsetHeight / 2;

    }).observe(phone, { childList: true });

{

    // Capabilities stand in for the server: canArchive and canLaunchFix are admins (S.admin); canDelete is

    // ─── Icons this tab needs ───────────────────────────────────────
    Object.assign(ICONS, {
        "arrow.up.circle": '<circle cx="12" cy="12" r="9.2"/><path d="M12 16.8V7.6M7.9 11.4L12 7.3l4.1 4.1"/>',

        "paperclip": '<path d="M16.5 7.5l-7.6 7.6a1.8 1.8 0 0 0 2.5 2.5l7.9-7.9a3.6 3.6 0 0 0-5.1-5.1L6 12.8a5.4 5.4 0 0 0 7.6 7.6l6.6-6.6"/>',
        "pause.fill": '<rect x="6" y="4.5" width="4" height="15" rx="1.2"/><rect x="14" y="4.5" width="4" height="15" rx="1.2"/>',
    });
    // SF "ellipsis" at 14pt bold: the shell's dots are drawn for 17pt regular, too thin for this menu.
    const ELLIPSIS = '<svg class="i f" viewBox="0 0 24 24" aria-hidden="true"><circle cx="4.5" cy="12" r="2.3"/><circle cx="12" cy="12" r="2.3"/><circle cx="19.5" cy="12" r="2.3"/></svg>';
    // ProgressView(): the system's eight-spoke activity indicator, not the gold FFLoadingBlock.
    const PROGRESS = `<svg class="fb-progress" viewBox="0 0 24 24" aria-label="Loading">${[0, 1, 2, 3, 4, 5, 6, 7].map((i) => `<line x1="12" y1="2.8" x2="12" y2="7.2" transform="rotate(${i * 45} 12 12)" opacity="${(1 - i * 0.1).toFixed(2)}"/>`).join("")}</svg>`;

    // ─── Fake data: FeedbackStore.previewPosts / previewComments (authors mapped onto the shell's people so every
    // handle opens a player card), plus three posts for media, yours and archived ───
    const SHOTS = `${ROOT}docs/app-store/2026-10-16/en-US/`;
    function seed(d, scenario) {
        const now = Date.now();
        const base = now - 3 * DAY;
        const empty = scenario === "empty" || scenario === "loading";
        const post = (o) => ({ voted: false, commentCount: 0, media: [], archived: false, archiveReason: null, ...o });
        d.feedback = {
            posts: empty ? [] : [
                post({ id: "req-chart", kind: "bug", title: "Steps chart is blank", body: "The daily Steps chart on a live fight stays empty after a successful sync.", voteCount: 8, commentCount: 2, voted: true, author: "theo", createdAt: iso(base) }),

                post({
                    id: "req-media", kind: "bug", title: "Pace chart stops a day early", body: "On our 3 day fight the Pace chart stops at day 2. Screenshot, screen recording and the sync log attached.", voteCount: 2, author: "nina", createdAt: iso(now - 26 * HOUR),

            ],
            comments: empty ? [] : [
                { id: "fc1", postId: "req-chart", author: "sam", body: "Same here after the Watch catches up.", createdAt: iso(base + HOUR) },
                { id: "fc2", postId: "req-chart", author: "theo", body: "Pulling to refresh did not fill the bars.", createdAt: iso(base + 2 * HOUR) },
                { id: "fc3", postId: "req-weekly", author: "theo", body: "Yes, and last week next to it for comparison.", createdAt: iso(base - 3 * HOUR) },
                { id: "fc4", postId: "req-rename", author: "nina", body: "Same, ours still says Stpe it Up.", createdAt: iso(now - 19 * DAY) },
            ],
            hidden: [],
            reported: [],
            loading: scenario === "loading",
            // A first load with no connection: FeedbackStore keeps no cache, so the board is empty with the error.

    }
    DATA_HOOKS.push(seed);
    // Saved data from a page built before this part existed has no board yet.
    const FB = () => { if (!D().feedback) seed(D(), S.scenario); return D().feedback; };

    // ─── Filter: AppModel.feedbackRequestFilter, kept in the Feedback root's ui ───
    const DEFAULT_FILTER = { type: "all", status: "open", sort: "votes" };
    // A route like #feedback?status=archived&type=bug opens the board already filtered.
    const filterOf = () => {
        const ui = uiOf("feedback");
        const from = JSON.stringify(S.rootParams.feedback || {});
        if (!ui.filter || ui.filterFrom !== from) { ui.filter = { ...DEFAULT_FILTER, ...(S.rootParams.feedback || {}) }; ui.filterFrom = from; }
        return ui.filter;
    };
    const isDefault = (f) => f.type === "all" && f.status === "open" && f.sort === "votes";
    const SORTS = [["votes", "Most upvoted"], ["newest", "Newest first"], ["oldest", "Oldest first"]];
    // FFTabBar.onReselect: tapping Feedback again resets the filter. Wrap whatever another area installed.
    const previousReselect = ACT.reselectTab;
    action("reselectTab", (tab) => {
        if (tab === "feedback") { S.rootParams.feedback = {}; Object.assign(uiOf("feedback"), { filter: { ...DEFAULT_FILTER }, filterFrom: "{}" }); }
        previousReselect?.(tab);

    // FeedbackStore.load + sortPosts: status, kind, hidden authors, then votes / newest / oldest.
    function boardPosts() {
        const f = filterOf();
        const fb = FB();
        if (fb.loading || fb.error) return [];
        const newer = (a, b) => (a.createdAt === b.createdAt ? (a.id < b.id ? -1 : 1) : (f.sort === "oldest") === (a.createdAt < b.createdAt) ? -1 : 1);
        return fb.posts
            .filter((p) => !fb.hidden.includes(p.author) && p.archived === (f.status === "archived") && (f.type === "all" || p.kind === f.type))
            .sort((a, b) => (f.sort === "votes" && a.voteCount !== b.voteCount ? b.voteCount - a.voteCount : newer(a, b)));
    }
    const postOf = (id) => (FB().error ? null : FB().posts.find((p) => p.id === id && !FB().hidden.includes(p.author)));
    const mine = (post) => post.author === D().you;
    const handleOf = (id) => person(id)?.handle || `@${id}`;

    // Date.RelativeFormatStyle(presentation: .named): "now", "12 minutes ago", "yesterday", "last week".
    function relativeNamed(date) {
        const seconds = Math.max(0, (Date.now() - new Date(date).getTime()) / 1000);
        const named = { year: "last year", month: "last month", week: "last week", day: "yesterday" };
        for (const [unit, size] of [["year", 365 * 86400], ["month", 30 * 86400], ["week", 7 * 86400], ["day", 86400], ["hour", 3600], ["minute", 60], ["second", 1]]) {
            const n = Math.floor(seconds / size);
            if (n >= 1) return n === 1 && named[unit] ? named[unit] : `${n} ${unit}${n === 1 ? "" : "s"} ago`;
        }
        return "now";
    }
