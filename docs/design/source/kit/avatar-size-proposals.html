            * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
            html, body { margin: 0; }
            body { background: var(--canvas); color: var(--text); font-family: Nunito, system-ui, sans-serif; font-weight: 700; -webkit-font-smoothing: antialiased; }
            button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; touch-action: manipulation; }

            /* Lab shell: phone on the left, navigator on the right. On a phone the navigator becomes a bar at the bottom. */
            .lab { display: grid; grid-template-columns: 1fr 360px; min-height: 100vh; }
            .stage { display: flex; gap: 32px; justify-content: center; align-items: flex-start; padding: 24px; }
            .panel { position: sticky; top: 0; height: 100vh; overflow: auto; padding: 24px; background: var(--bg); border-left: 1px solid var(--line); }
            .panel h1 { margin: 0 0 6px; font-size: 22px; font-weight: 800; letter-spacing: -0.02em; }
            .panel p.lede { margin: 0 0 22px; font-size: 13px; color: var(--textSecondary); line-height: 1.45; }
            .panel h2 { margin: 22px 0 8px; font-size: 11px; font-weight: 800; letter-spacing: 0.14em; text-transform: uppercase; color: var(--textTertiary); }
            .opt { display: block; width: 100%; text-align: left; padding: 12px 14px; margin-bottom: 8px; border-radius: 16px; background: var(--card); border: 1px solid var(--hairline); }
            .opt.on { border-color: var(--mossEdge); background: var(--mossWash); }
            .opt b { display: block; font-size: 15px; font-weight: 800; }
            .opt i { font-style: normal; color: var(--mossText); font-weight: 800; }
            .opt span { display: block; margin-top: 2px; font-size: 12px; color: var(--textSecondary); line-height: 1.4; }
            .pick { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
            .pick .opt { margin: 0; }
            .pick .opt b { font-size: 14px; }
            .pick .opt span { font-size: 11px; }
            .seg { display: flex; gap: 4px; padding: 3px; border-radius: 14px; background: var(--control); }
            .seg button { flex: 1; min-height: 38px; border-radius: 11px; font-size: 13px; font-weight: 800; color: var(--textSecondary); }
            .seg button.on { background: var(--card); color: var(--text); border: 1px solid var(--hairline); }
            .seg.wideOnly { display: flex; }

            .phoneWrap { flex: none; width: calc(393px * var(--k, 1)); height: calc(852px * var(--k, 1)); position: relative; }
            .phoneTag { position: absolute; left: 0; right: 0; top: -2px; transform: translateY(-100%); text-align: center; font-size: 13px; font-weight: 800; color: var(--textSecondary); }
            .stage.compare { padding-top: 48px; }
            .phone { position: absolute; left: 0; top: 0; width: 393px; height: 852px; transform: scale(var(--k, 1)); transform-origin: 0 0; overflow: hidden; border-radius: 52px; background: var(--bg); border: 1px solid var(--line); }
            .status { position: absolute; left: 0; right: 0; top: 0; height: 54px; z-index: 3; display: flex; justify-content: space-between; align-items: flex-end; padding: 0 34px 8px; font-size: 15px; font-weight: 800; background: var(--bg); }
            .status .bat { width: 25px; height: 12px; border-radius: 4px; border: 1.5px solid var(--textTertiary); position: relative; }
            .status .bat::after { content: ""; position: absolute; inset: 1.5px 5px 1.5px 1.5px; border-radius: 2px; background: var(--textSecondary); }
            .scroll { position: absolute; left: 0; right: 0; top: 54px; bottom: 0; overflow-y: auto; padding: 8px 20px 118px; scrollbar-width: none; }
            .scroll::-webkit-scrollbar { display: none; }
            .tabbar { position: absolute; left: 0; right: 0; bottom: 0; z-index: 3; height: 88px; padding: 8px 10px 26px; display: flex; gap: 2px; background: var(--tabBar); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px); border-top: 1px solid var(--tabBarLine); }
            .tab { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; border-radius: 16px; font-size: 10px; font-weight: 800; color: var(--tabInkOff); }
            .tab.on { background: var(--tabPillOn); color: var(--tabInkOn); }
            .tab svg { width: 22px; height: 22px; }
            .toast { position: absolute; left: 50%; bottom: 100px; z-index: 4; transform: translate(-50%, 8px); opacity: 0; transition: opacity 0.2s, transform 0.2s; padding: 9px 14px; border-radius: 999px; background: var(--overlay); border: 1px solid var(--overlayLine); font-size: 12px; font-weight: 800; white-space: nowrap; pointer-events: none; }
            .toast.show { opacity: 1; transform: translate(-50%, 0); }

            svg.i { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

            /* Kit pieces */
            .title { margin: 0; font-size: 26px; font-weight: 800; letter-spacing: -0.025em; line-height: 1.1; }
            .metric { font-size: 34px; font-weight: 800; letter-spacing: -0.03em; line-height: 1; font-variant-numeric: tabular-nums; }
            .heading { font-size: 16px; font-weight: 800; letter-spacing: -0.01em; }
            .caption { font-size: 12px; font-weight: 700; color: var(--textSecondary); }
            .micro { font-size: 11px; font-weight: 700; color: var(--textTertiary); }
            .link { font-size: 12px; font-weight: 800; color: var(--mossText); min-height: 32px; display: inline-flex; align-items: center; gap: 5px; }
            .card { background: var(--card); border: 1px solid var(--hairline); border-radius: 22px; }
            .stack3 { display: flex; flex-direction: column; gap: 12px; }
            .sectionHead { display: flex; justify-content: space-between; align-items: center; margin: 22px 0 6px; font-size: 14px; font-weight: 800; }
            .version { text-align: center; padding: 4px 0 2px; }
            .segApp { display: flex; padding: 3px; border-radius: 14px; background: var(--control); margin-bottom: 12px; }
            .segApp span { flex: 1; text-align: center; padding: 8px 0; border-radius: 11px; font-size: 13px; font-weight: 800; color: var(--textSecondary); }
            .segApp span.on { background: var(--card); color: var(--text); border: 1px solid var(--hairline); padding: 7px 0; }
            .segApp em { font-style: normal; margin-left: 4px; color: var(--mossText); }

            /* Fights home */
            .hero { display: flex; justify-content: space-between; align-items: stretch; padding-top: 14px; min-height: 168px; }
            .hero .copy { display: flex; flex-direction: column; gap: 10px; justify-content: space-between; padding: 6px 0 4px; }
            .hero img { height: 154px; width: auto; align-self: flex-end; }
            .live { display: block; width: 100%; text-align: left; padding: 16px; }
            .live .top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
            .live .gap { font-size: 22px; font-weight: 800; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
            .live .who { display: flex; align-items: center; gap: 8px; margin-top: 6px; }
            .bar { height: 5px; border-radius: 99px; background: var(--track); margin: 8px 0 6px; overflow: hidden; }
            .bar i { display: block; height: 100%; border-radius: 99px; background: var(--gold); }
            .live .foot { display: flex; justify-content: space-between; }
            .ahead { color: var(--mossText); }
            .behind { color: var(--emberText); }

            /* Pictures */
            .av { position: relative; flex: none; display: inline-block; }
            .av img { display: block; width: 100%; height: 100%; }
            .av-A { width: var(--s); height: var(--s); border-radius: 50%; background: var(--control); overflow: hidden; }
            .av-A img { object-fit: cover; }
            .av-half, .av-full { width: var(--w); height: var(--h); }
            .av-half img, .av-full img { object-fit: contain; }
            /* Soft fade so the half body has no hard cut at the waist. */
            .av-half img { -webkit-mask-image: linear-gradient(to bottom, #000 88%, transparent 100%); mask-image: linear-gradient(to bottom, #000 88%, transparent 100%); }
            .badge { position: absolute; right: -2px; bottom: -2px; width: 18px; height: 18px; border-radius: 50%; background: var(--control); display: grid; place-items: center; }
            .badge svg { width: 10px; height: 10px; stroke-width: 2.4; }
            .stackAv { display: flex; align-items: flex-end; }
            .stackAv .av + .av { margin-left: -12px; }
            .stackAv.s-A .av-A { border: 2px solid var(--card); }
            .stackAv.s-B .av + .av, .stackAv.s-C .av + .av { margin-left: -9px; }

            /* Standings */
            .row { display: flex; align-items: center; gap: 13px; padding: 12px 15px; border-radius: 22px; background: var(--card); border: 1px solid var(--hairline); }
            .row.you { background: var(--mossWash); border-color: var(--mossEdge); }
            .row .rank { width: 22px; text-align: center; font-size: 14px; font-weight: 800; color: var(--textTertiary); }
            .row .rank.first { color: var(--gold); }
            .row .name { font-size: 15px; font-weight: 800; letter-spacing: -0.01em; }
            .row .mid { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
            .row .val { font-size: 17px; font-weight: 800; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
            .back { display: inline-flex; align-items: center; gap: 4px; min-height: 40px; font-size: 14px; font-weight: 800; color: var(--mossText); }
            .detailHead { padding: 2px 0 6px; }
            .detailHead .caption { margin-top: 8px; }

            /* Fight posts and Feed */
            .msg { display: flex; gap: 10px; align-items: flex-end; }
            .msg + .msg { margin-top: 12px; }
            .msg .who { font-size: 12px; font-weight: 800; }
            .msg .text { font-size: 14px; font-weight: 700; line-height: 1.35; margin-top: 2px; }
            .post { padding: 16px; }
            .post .head { display: flex; gap: 10px; align-items: center; }
            .post .head .mid { flex: 1; min-width: 0; }
            .post .handle { font-size: 15px; font-weight: 800; letter-spacing: -0.01em; }
            .post .body { margin: 10px 0 0; font-size: 14px; line-height: 1.4; }
            .post .acts { display: flex; gap: 18px; margin-top: 12px; color: var(--textTertiary); font-size: 12px; font-weight: 800; }
            .post .acts span { display: inline-flex; align-items: center; gap: 5px; }

            /* Profile */
            .you-head { display: flex; align-items: center; gap: 12px; padding-top: 12px; }
            .you-head .mid { flex: 1; min-width: 0; }
            .hbtn { width: 40px; height: 40px; display: grid; place-items: center; color: var(--textSecondary); }
            .glyph { display: flex; align-items: flex-end; gap: 4px; }
            .glyph i { width: 2px; border-radius: 2px; background: currentColor; }
            .week { padding: 18px; margin-top: 22px; }
            .week .bars { display: flex; align-items: flex-end; justify-content: space-between; gap: 8px; height: 76px; margin-top: 14px; }
            .week .bars div { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 6px; height: 100%; }
            .week .bars i { display: block; width: 100%; border-radius: 6px; background: var(--mossFill); }
            .tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 12px; }
            .tile { padding: 14px 12px; }
            .tile b { display: block; font-size: 22px; font-weight: 800; letter-spacing: -0.02em; margin-top: 4px; }

            @media (max-width: 900px) {
                .lab { display: block; }
                .stage { padding: 6px 0 0; }
                .panel { position: fixed; z-index: 10; left: 0; right: 0; bottom: 0; top: auto; height: auto; max-height: none; overflow: visible; padding: 10px 12px calc(10px + env(safe-area-inset-bottom)); border-left: 0; border-top: 1px solid var(--line); }
                .panel h1, .panel p.lede, .panel h2, .seg.wideOnly { display: none; }
                .seg button { min-height: 34px; }
                .variants { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-bottom: 8px; }
                .variants .opt { margin: 0; padding: 8px 4px; text-align: center; }
                .variants .opt b { font-size: 13px; }
                .variants .opt span { display: none; }
                .screens { grid-template-columns: repeat(4, 1fr); gap: 6px; }
                .screens .opt span { display: none; }
                .screens .opt { padding: 8px 4px; text-align: center; }
                .screens .opt b { font-size: 12px; }
                .look { margin-top: 8px; display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
                .look .seg { margin-top: 0 !important; }
            }
        </style>
    </head>
    <body>
        <main class="lab">
            <div class="stage" id="stage"></div>
            <aside class="panel">
                <h1>Profile picture size</h1>
                <p class="lede">Every card stays the same size as today. Only the picture changes: head, half body or full body. Same fights and people on every screen.</p>
                <h2>Picture</h2>
                <div class="variants">
                    <button class="opt" data-act="variant" data-v="A"><b>A. Head</b><span>Today. A round crop of the face.</span><span><i>Right when</i> a face is enough to know who it is.</span></button>
                    <button class="opt" data-act="variant" data-v="B"><b>B. Half body</b><span>Head to waist, no circle.</span><span><i>Right when</i> you want more character and a face that still reads.</span></button>
                    <button class="opt" data-act="variant" data-v="C"><b>C. Full body</b><span>The whole animal. Half body on the Fights list, where full body gets too small.</span><span><i>Right when</i> the whole animal matters more than reading the face.</span></button>
                </div>
                <h2>Screen</h2>
                <div class="pick screens">
                    <button class="opt" data-act="screen" data-s="detail"><b>Inside a fight</b><span>Standings and fight posts</span></button>
                    <button class="opt" data-act="screen" data-s="fights"><b>Fights</b><span>Outside, the list</span></button>
                    <button class="opt" data-act="screen" data-s="feed"><b>Feed</b><span>Outside, posts</span></button>
                    <button class="opt" data-act="screen" data-s="profile"><b>Profile</b><span>Outside, your page</span></button>
                </div>
                <div class="look">
                    <h2>Look</h2>
                    <div class="seg">
                        <button data-act="theme" data-t="night">Night</button>
                        <button data-act="theme" data-t="day">Day</button>
                    </div>
                    <div class="seg wideOnly" style="margin-top: 8px">
                        <button data-act="compare" data-c="0">One phone</button>
                        <button data-act="compare" data-c="1">Side by side</button>
                    </div>
                </div>
            </aside>
        </main>

                const size = SIZE[place][{ A: 0, B: 1, C: 2 }[v]];
                const bleed = Math.max(0, (size - LAYOUT[place]) / 2);

                return `<span class="av av-${kind}" style="${z}--h:${size}px;--w:${(size * ratio).toFixed(1)}px"><img src="${art[kind]}" alt="">${badge}</span>`;

            function fit() {
                const wide = innerWidth > 900;
                const panelH = wide ? 0 : document.querySelector(".panel").offsetHeight;
                const phones = stage.children.length;
                const room = wide ? stage.clientWidth - 48 - 32 * (phones - 1) : innerWidth - 12;
                const k = Math.min(1, room / (393 * phones), (innerHeight - panelH - (wide ? (phones > 1 ? 96 : 48) : 12)) / 852);
                stage.style.setProperty("--k", Math.max(k, 0.3).toFixed(3));
            }

            function toast(message) {
                document.querySelectorAll(".toast").forEach((t) => { t.textContent = message; t.classList.add("show"); });
                clearTimeout(toast.timer);
                toast.timer = setTimeout(() => document.querySelectorAll(".toast").forEach((t) => t.classList.remove("show")), 1600);
            }

            document.addEventListener("click", (event) => {
                const el = event.target.closest("[data-act]");
                if (!el) return;
                const act = el.dataset.act;
                if (act === "variant") state.variant = el.dataset.v;
                else if (act === "theme") state.theme = el.dataset.t;
                else if (act === "compare") state.compare = el.dataset.c === "1";
                else if (act === "screen") state.screen = el.dataset.s;
                else if (act === "open") { state.fight = el.dataset.f; state.screen = "detail"; }
                else if (act === "back") state.screen = "fights";
                else if (act === "tab") {
                    if (el.dataset.k === "new" || el.dataset.k === "feedback") return toast("Not part of this test");
                    state.screen = el.dataset.k;
                }
                render(act === "variant" || act === "theme" || act === "compare");
            });
            addEventListener("resize", () => render());
            render(false);
        </script>
    </body>
</html>
