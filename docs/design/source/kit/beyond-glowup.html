:root {
    --r-pill: 999px;
    --r-card: 22px;
    --r-field: 14px;
    --r-glyph: 9px;
    --r-shell: 28px;
    --s-xs: 4px;
    --s-sm: 8px;
    --s-md: 12px;
    --s-base: 16px;
    --s-lg: 20px;
    --s-xl: 26px;
    --s-screen-padding: 20px;
    --s-card-padding: 22px;
    --s-row-padding-x: 16px;
    --s-row-padding-y: 14px;
    --s-section-gap: 34px;
    --s-card-gap: 12px;
    --s-tab-bar-clearance: 112px;
}
.t-metric { font-size: 34px; font-weight: 800; letter-spacing: -0.03em; }
.t-title { font-size: 26px; font-weight: 800; letter-spacing: -0.025em; }
.t-heading { font-size: 16px; font-weight: 800; letter-spacing: -0.01em; }
.t-row-title { font-size: 15px; font-weight: 800; letter-spacing: -0.01em; }
.t-button { font-size: 14px; font-weight: 800; }
.t-button-large { font-size: 16px; font-weight: 800; letter-spacing: 0.01em; }
.t-button-small { font-size: 12px; font-weight: 800; }

.t-body { font-size: 13px; font-weight: 700; }
.t-caption { font-size: 12px; font-weight: 700; }
.t-micro { font-size: 11px; font-weight: 700; }
.t-eyebrow { font-size: 12px; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; }
.t-section-eyebrow { font-size: 12px; font-weight: 800; letter-spacing: 0.16em; text-transform: uppercase; }
.t-tag { font-size: 10px; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; }

/* ===== FRAMEWORK: page chrome, phone frame, picker (do not edit) ===== */
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
    font-family: "Nunito", -apple-system, system-ui, sans-serif;
    background: var(--canvas);
    color: var(--text);
    -webkit-font-smoothing: antialiased;
    font-variant-numeric: tabular-nums;
    min-height: 100dvh;
}
button { font: inherit; color: inherit; }
.gx-page { max-width: 1080px; margin: 0 auto; padding: 18px 16px 120px; }
.gx-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
.gx-top h1 { margin: 0; font-size: 20px; font-weight: 800; letter-spacing: -0.01em; }
.gx-top .gx-kicker { font-size: 11px; font-weight: 800; letter-spacing: 0.14em; text-transform: uppercase; color: var(--moss-text); margin-bottom: 2px; }
.gx-top .gx-kicker a { color: inherit; text-decoration: none; }
.gx-pagenav { display: flex; align-items: center; gap: 6px; margin-left: auto; }
.gx-pagenav .gx-pg { width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--line); background: var(--chip); color: var(--text); display: grid; place-items: center; cursor: pointer; }
.gx-pagenav select { height: 36px; max-width: 220px; padding: 0 12px; border-radius: 999px; border: 1px solid var(--moss-edge); background: var(--card); color: var(--text); font: 800 13px "Nunito", sans-serif; cursor: pointer; }
.gx-seg { display: inline-flex; padding: 3px; border-radius: 999px; background: var(--chip); border: 1px solid var(--hairline); }
.gx-seg button { border: 0; background: transparent; padding: 6px 12px; border-radius: 999px; font-size: 12px; font-weight: 800; color: var(--text-secondary); cursor: pointer; }
.gx-seg button[aria-pressed="true"] { background: var(--moss-fill); color: var(--moss-on); }
.gx-stage { display: grid; grid-template-columns: auto 1fr; gap: 28px; align-items: start; }
.gx-side { position: sticky; top: 16px; display: flex; flex-direction: column; gap: 12px; max-height: calc(100dvh - 32px); min-width: 0; }
.gx-notes { flex: none; padding: 18px 20px; border-radius: 22px; background: var(--card); border: 1px solid var(--hairline); }
.gx-list { position: relative; flex: 1; min-height: 0; overflow-y: auto; padding: 6px; border-radius: 22px; background: var(--card); border: 1px solid var(--hairline); }
.gx-numrow { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.gx-steps { display: flex; gap: 6px; }
.gx-steps button { width: 32px; height: 32px; border-radius: 50%; border: 1px solid var(--line); background: var(--chip); color: var(--text); display: grid; place-items: center; cursor: pointer; }
.gx-keys { font-size: 11px; font-weight: 700; color: var(--text-faint); margin-top: 8px; }
.gx-notes .gx-num { font-size: 12px; font-weight: 800; color: var(--text-tertiary); letter-spacing: 0.08em; text-transform: uppercase; }
.gx-notes h2 { margin: 4px 0 6px; font-size: 22px; font-weight: 800; letter-spacing: -0.02em; }
.gx-notes .gx-when { margin: 0 0 12px; font-size: 14px; font-weight: 700; color: var(--moss-text); line-height: 1.4; }
.gx-notes ul { margin: 0; padding-left: 18px; color: var(--text-secondary); font-size: 13px; font-weight: 700; line-height: 1.5; }
.gx-notes .gx-actions { display: flex; gap: 8px; margin-top: 14px; flex-wrap: wrap; }
.gx-btn { border: 1px solid var(--line); background: var(--chip); color: var(--text); border-radius: 999px; padding: 8px 14px; font-size: 12px; font-weight: 800; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
.gx-btn[aria-pressed="true"] { background: var(--moss-wash); border-color: var(--moss-edge); color: var(--moss-text); }
.gx-btn.hide[aria-pressed="true"] { background: var(--ember-wash); border-color: var(--ember-fill); color: var(--ember-text); }
.gx-notes { overflow-y: auto; min-height: 0; flex: 0 1 auto; }
.gx-list { flex: 1 1 200px; min-height: 150px; }
.gx-btn kbd, .gx-help kbd { font: 800 10px "Nunito", sans-serif; padding: 1px 5px; border-radius: 5px; border: 1px solid var(--line); color: var(--text-tertiary); }
.gx-reacts { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
.gx-reacts:empty { display: none; }
.gx-chip { display: inline-flex; align-items: center; gap: 4px; padding: 4px 10px; border-radius: 999px; font-size: 12px; font-weight: 800; background: var(--chip); color: var(--text-secondary); }
.gx-chip.keep { background: var(--moss-wash); color: var(--moss-text); }
.gx-chip.hide { background: var(--ember-wash); color: var(--ember-text); }
.gx-comments { margin-top: 14px; display: flex; flex-direction: column; gap: 8px; }
.gx-comments:empty { display: none; }
.gx-comment { padding: 9px 12px; border-radius: 14px; background: var(--chip); font-size: 13px; font-weight: 700; line-height: 1.4; }
.gx-comment b { font-weight: 800; }
.gx-comment .gx-meta { color: var(--text-faint); font-size: 11px; margin-left: 6px; }
.gx-comment button { float: right; border: 0; background: none; color: var(--text-faint); cursor: pointer; font: 800 11px "Nunito", sans-serif; }
.gx-cform { display: flex; gap: 8px; margin-top: 10px; }
.gx-cform input { flex: 1; min-width: 0; height: 38px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--line); background: var(--bg); color: var(--text); font: 700 13px "Nunito", sans-serif; }
.gx-cform input:focus { outline: 2px solid var(--moss-edge); outline-offset: 0; }
.gx-foot { margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--hairline); font-size: 12px; font-weight: 700; color: var(--text-secondary); }
.gx-link { border: 0; background: none; padding: 0; color: var(--moss-text); font: inherit; font-weight: 800; cursor: pointer; text-decoration: none; }
.gx-whopick { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.gx-whopick button { border: 1px solid var(--line); background: var(--chip); color: var(--text); border-radius: 999px; padding: 5px 12px; font: 800 12px "Nunito", sans-serif; cursor: pointer; }
.gx-whopick input { height: 30px; width: 130px; padding: 0 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--bg); color: var(--text); font: 700 12px "Nunito", sans-serif; }
.gx-rows .gx-badges { display: flex; gap: 3px; margin-top: 4px; }
.gx-rows .gx-badge { display: inline-flex; align-items: center; gap: 3px; height: 18px; padding: 0 6px; border-radius: 9px; font-size: 10px; font-weight: 800; background: var(--chip); color: var(--text-secondary); }
.gx-rows .gx-badge.keep { background: var(--moss-wash); color: var(--moss-text); }
.gx-rows .gx-badge.hide { background: var(--ember-wash); color: var(--ember-text); }
.gx-help { position: fixed; inset: 0; z-index: 3000; background: var(--scrim); display: grid; place-items: center; padding: 16px; }
.gx-help[hidden] { display: none; }
.gx-help-card { width: min(420px, 100%); max-height: 86vh; overflow-y: auto; padding: 20px 22px; border-radius: 22px; background: var(--overlay); border: 1px solid var(--overlay-line); }
.gx-help-card h3 { margin: 0 0 10px; font-size: 18px; font-weight: 800; }
.gx-help-card .gx-hrow { display: flex; justify-content: space-between; gap: 12px; padding: 7px 0; border-bottom: 1px solid var(--hairline); font-size: 13px; font-weight: 700; }
.gx-help-card p { margin: 12px 0 0; font-size: 12px; font-weight: 700; color: var(--text-secondary); }
.gx-notes .gx-sync { margin: 12px 0 0; font-size: 11px; font-weight: 700; color: var(--text-faint); }
.gx-notes .gx-hidden-note { margin: 0 0 10px; padding: 8px 12px; border-radius: 12px; background: var(--ember-wash); color: var(--ember-text); font-size: 12px; font-weight: 800; }
.gx-intro { color: var(--text-secondary); font-size: 13px; font-weight: 700; line-height: 1.5; margin: 0 0 16px; max-width: 720px; }
.gx-phone-wrap { width: 393px; }
.phone {
    position: relative; width: 393px; height: 852px; border-radius: 54px; overflow: hidden;
    background: var(--bg); color: var(--text);
    box-shadow: 0 0 0 10px var(--canvas), 0 0 0 11px var(--line);
    isolation: isolate;
}
.phone .ff-status { position: absolute; top: 0; left: 0; right: 0; height: 54px; z-index: 40; display: flex; align-items: center; justify-content: space-between; padding: 6px 30px 0 44px; font-size: 16px; font-weight: 800; pointer-events: none; color: var(--text); }
.phone .ff-status .ff-island { position: absolute; left: 50%; top: 11px; width: 124px; height: 36px; margin-left: -62px; border-radius: 20px; background: #000; }
.phone .ff-status .ff-sys { display: flex; gap: 6px; align-items: center; }
.phone .ff-screen { position: absolute; inset: 0; overflow-y: auto; overflow-x: hidden; padding-top: 54px; scrollbar-width: none; }
.phone .ff-screen::-webkit-scrollbar { display: none; }
.phone .ff-dock { position: absolute; left: 0; right: 0; bottom: 0; z-index: 30; }
.phone .ff-overlay { position: absolute; inset: 0; z-index: 35; pointer-events: none; }
.phone .ff-overlay > * { pointer-events: auto; }
.phone .ff-home { position: absolute; left: 50%; bottom: 8px; width: 134px; height: 5px; margin-left: -67px; border-radius: 3px; background: var(--text); opacity: 0.85; z-index: 50; pointer-events: none; }
/* default native tab bar (current app), variants may replace the dock */
.ff-tabbar { display: flex; padding: 8px 10px 30px; background: var(--tab-bar); border-top: 1px solid var(--tab-bar-line); -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px); }
.ff-tabbar .ff-tab { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; color: var(--tab-ink-off); font-size: 11px; font-weight: 700; background: none; border: 0; padding: 0; }
.ff-tabbar .ff-tab .ff-tab-glyph { width: 32px; height: 32px; display: grid; place-items: center; border-radius: 9px; }
.ff-tabbar .ff-tab.on { color: var(--tab-ink-on); font-weight: 800; }
.ff-tabbar .ff-tab.on .ff-tab-glyph { background: var(--tab-pill-on); }
.ff-version { text-align: center; font-size: 11px; font-weight: 700; color: var(--text-faint); padding: 4px 0 8px; }
.ff-avatar { display: inline-block; border-radius: 50%; object-fit: cover; background: var(--control); flex: none; vertical-align: middle; }
.ff-icon { display: inline-block; vertical-align: middle; flex: none; }
.num { font-variant-numeric: tabular-nums; }
/* picker */
.gx-picker { position: fixed; right: 16px; bottom: 16px; z-index: 1000; display: flex; align-items: center; gap: 6px; touch-action: none; user-select: none; -webkit-user-select: none; }
.gx-picker .gx-arrow { width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--overlay-line); background: var(--overlay); color: var(--text); display: grid; place-items: center; cursor: pointer; }
.gx-picker .gx-trigger { width: 200px; min-width: 200px; max-width: 200px; height: 44px; border-radius: 999px; border: 1px solid var(--moss-edge); background: var(--overlay); color: var(--text); display: flex; align-items: center; gap: 8px; padding: 0 14px; cursor: grab; overflow: hidden; }
.gx-picker .gx-trigger:active { cursor: grabbing; }
.gx-picker .gx-trigger .gx-count { font-size: 11px; font-weight: 800; color: var(--moss-text); flex: none; }
.gx-picker .gx-trigger .gx-label { font-size: 13px; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; flex: 1; text-align: left; }
.gx-picker:focus-visible, .gx-picker button:focus-visible { outline: 2px solid var(--moss-edge); outline-offset: 2px; }
.gx-menu { position: absolute; right: 0; bottom: 54px; width: min(340px, calc(100vw - 24px)); max-height: 62vh; overflow-y: auto; border-radius: 20px; background: var(--overlay); border: 1px solid var(--overlay-line); padding: 6px; display: none; }
.gx-menu.open { display: block; }
.gx-menu.below { bottom: auto; top: 54px; }
.gx-rows .gx-item { display: flex; align-items: center; gap: 2px; border-radius: 14px; }
.gx-rows .gx-open { flex: 1; min-width: 0; display: grid; grid-template-columns: 28px 1fr; gap: 8px; text-align: left; border: 0; background: transparent; padding: 10px 4px 10px 10px; cursor: pointer; color: var(--text); }
.gx-rows .gx-act { width: 36px; height: 36px; flex: none; border: 0; border-radius: 50%; background: transparent; color: var(--text-faint); display: grid; place-items: center; cursor: pointer; }
.gx-rows .gx-act[aria-pressed="true"] { color: var(--moss-text); background: var(--moss-wash); }
.gx-rows .gx-act.hide[aria-pressed="true"] { color: var(--ember-text); background: var(--ember-wash); }
.gx-rows .gx-sep { padding: 12px 12px 6px; font-size: 11px; font-weight: 800; letter-spacing: 0.1em; text-transform: uppercase; color: var(--text-tertiary); }
.gx-rows .gx-item.gx-hidden .gx-open { opacity: 0.5; }
.gx-rows .gx-item:hover { background: var(--chip); }
.gx-rows .gx-item[aria-current="true"] { background: var(--moss-wash); }
.gx-rows .gx-item .gx-i { font-size: 12px; font-weight: 800; color: var(--text-tertiary); padding-top: 1px; }
.gx-rows .gx-item .gx-n { font-size: 14px; font-weight: 800; display: block; }
.gx-rows .gx-item .gx-w { font-size: 12px; font-weight: 700; color: var(--text-secondary); display: block; margin-top: 2px; line-height: 1.35; }
.gx-errors { display: none; position: fixed; left: 8px; right: 8px; top: 8px; z-index: 5000; background: var(--ember-fill); color: var(--ember-on); font: 700 12px/1.4 ui-monospace, monospace; padding: 10px; border-radius: 10px; white-space: pre-wrap; }
.gx-errors.show { display: block; }
@media (min-width: 761px) {
    .gx-picker { display: none; }
    .gx-page { padding-bottom: 16px; }
}
@media (max-width: 760px) {
    .gx-stage { grid-template-columns: 1fr; gap: 16px; }
    .gx-side { position: static; order: -1; max-height: none; }
    .gx-list, .gx-keys { display: none; }
    .gx-phone-wrap { margin: 0 auto; }
}
@media (max-width: 440px) {
    .gx-page { padding: 12px 0 110px; }
    .gx-top, .gx-intro { padding: 0 14px; }
    .gx-notes { margin: 0 10px; }
    .phone { border-radius: 0; box-shadow: none; }
    .phone .ff-status .ff-island { display: none; }
}
/* shot mode: only the phone, no chrome, for screenshots */
html.shot body { background: var(--bg); }
html.shot .gx-help, html.shot .gx-top, html.shot .gx-side, html.shot .gx-picker, html.shot .gx-intro { display: none !important; }
html.shot .gx-page { padding: 0; max-width: none; }

        <script>
/* ===== FRAMEWORK: shared data, assets, helpers (do not edit) ===== */
const GX_PAGES = [{"group": "Every day", "id": "fights-home", "title": "Fights home"}, {"group": "Every day", "id": "fight-row", "title": "Fight row"}, {"group": "Every day", "id": "today", "title": "Today"}, {"group": "Every day", "id": "tab-bar", "title": "Tab bar and chrome"}, {"group": "Inside a fight", "id": "fight-detail", "title": "Fight detail"}, {"group": "Inside a fight", "id": "race", "title": "Race hero"}, {"group": "Inside a fight", "id": "race-track", "title": "Oval and race track"}, {"group": "Inside a fight", "id": "standings", "title": "Standings"}, {"group": "Inside a fight", "id": "charts", "title": "Charts"}, {"group": "Inside a fight", "id": "overtake", "title": "Overtake moment"}, {"group": "Inside a fight", "id": "result", "title": "Fight result"}, {"group": "Inside a fight", "id": "fight-recap", "title": "Past fight recap"}, {"group": "Inside a fight", "id": "share-card", "title": "Share card"}, {"group": "Inside a fight", "id": "profile-sheet", "title": "Profile sheet"}, {"group": "Start and join", "id": "new-fight", "title": "New fight"}, {"group": "Start and join", "id": "join-invite", "title": "Join and invites"}, {"group": "Start and join", "id": "states", "title": "Empty and loading"}, {"group": "Social", "id": "feed", "title": "Feed"}, {"group": "Social", "id": "post-thread", "title": "Post thread"}, {"group": "Social", "id": "activity", "title": "Notifications inbox"}, {"group": "Social", "id": "feedback", "title": "Feedback board"}, {"group": "You", "id": "you", "title": "You"}, {"group": "You", "id": "settings", "title": "Settings and preferences"}, {"group": "You", "id": "companion", "title": "Companion and Specials"}, {"group": "System and beyond", "id": "controls", "title": "Controls"}, {"group": "System and beyond", "id": "app-icon", "title": "App icon"}, {"group": "System and beyond", "id": "beyond", "title": "Beyond the app"}];
// Shared by every glow-up page: who is looking, likes / dislikes / comments, shortcuts, file sync.
// Truth: kit/glowup-state.json when glowup-serve.py runs (agents read it). Otherwise this browser's localStorage,
// with unsent changes queued and replayed the next time the server is reachable.
const GX = (() => {
    const preview = location.host === "htmlpreview.github.io";
    const ENDPOINT = preview ? null : location.protocol === "file:" ? "http://localhost:8765/glowup-state" : "/glowup-state";
    const get = (k, d) => { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } };
    const set = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} };

    const ACTIONS = [
        ["prev", "Previous option", "ArrowLeft"],
        ["next", "Next option", "ArrowRight"],
        ["prevPage", "Previous page", "ArrowUp"],
        ["nextPage", "Next page", "ArrowDown"],
        ["like", "Like", "l"],
        ["dislike", "Dislike (hides it for you)", "d"],
        ["comment", "Write a comment", "c"],
        ["open", "Open the selected favorite", "Enter"],
        ["theme", "Switch Night and Day", "t"],
        ["replay", "Replay the animation", "r"],
        ["favorites", "Go to Favorites", "f"],
        ["home", "Go to all pages", "h"],
        ["settings", "Go to Settings", "s"],
        ["help", "Show shortcuts", "?"],
    ];
    const keys = () => ({ ...Object.fromEntries(ACTIONS.map(([id, , k]) => [id, k])), ...get("glowup.keys", {}) });
    const keyLabel = (k) => ({ ArrowLeft: "←", ArrowRight: "→", ArrowUp: "↑", ArrowDown: "↓", Enter: "Enter", " ": "Space", Escape: "Esc" })[k] || (k || "").toUpperCase();
    const actionFor = (e) => {
        if (e.metaKey || e.ctrlKey || e.altKey || e.target.closest?.("input, textarea, select, [contenteditable]")) return null;
        const pressed = e.key.toLowerCase();
        const map = keys();
        return Object.keys(map).find((a) => (map[a] || "").toLowerCase() === pressed) || null;
    };

    const who = () => get("glowup.who", "") || "Marc";
    const hasName = () => !!get("glowup.who", "");
    const setWho = (name) => {
        const clean = String(name).replace(/[\u0000-\u001f]/g, "").trim().slice(0, 24);
        if (clean) set("glowup.who", clean);
        return clean;
    };

    let state = { choices: {}, comments: {} };
    let synced = false;
    let status = () => {};
    // Version 1 files were { page: { option: "keep" | "hide" } } with no names.
    const normalize = (raw) => {
        if (raw && (raw.choices || raw.comments)) return { choices: raw.choices || {}, comments: raw.comments || {} };
        const choices = {};
        for (const [page, map] of Object.entries(raw || {})) for (const [id, v] of Object.entries(map || {})) ((choices[page] ||= {})[id] ||= {}).Marc = v;

    };
    // Same rules as apply() in glowup-serve.py.
    const apply = (s, op) => {
        if (op.op === "choice") {
            const byWho = ((s.choices[op.page] ||= {})[op.id] ||= {});
            if (op.value) byWho[op.who] = op.value;
            else delete byWho[op.who];
            if (!Object.keys(byWho).length) delete s.choices[op.page][op.id];
            if (!Object.keys(s.choices[op.page]).length) delete s.choices[op.page];
        } else if (op.op === "comment") {
            ((s.comments[op.page] ||= {})[op.id] ||= []).push({ who: op.who, text: op.text, at: op.at });
        } else if (op.op === "uncomment") {
            const left = ((s.comments[op.page] || {})[op.id] || []).filter((c) => !(c.at === op.at && c.who === op.who));
            if (left.length) s.comments[op.page][op.id] = left;
            else if (s.comments[op.page]) {
                delete s.comments[op.page][op.id];
                if (!Object.keys(s.comments[op.page]).length) delete s.comments[op.page];
            }
        }
        return s;
    };
    const statusText = () => synced ? "Saved to glowup-state.json, shared with everyone using the server."
        : ENDPOINT ? "Saved in this browser only. Start glowup-serve.py to share and sync." : "Saved in this browser only.";
    const queue = (op) => set("glowup.pending", [...get("glowup.pending", []), op]);
    const post = (op) => fetch(ENDPOINT, { method: "POST", headers: { "Content-Type": "text/plain" }, body: JSON.stringify(op) })
        .then((r) => { if (!r.ok) throw new Error("refused"); return r.json(); });
    const send = async (op) => {
        apply(state, op);
        set("glowup.state", state);
        if (!synced) { queue(op); return status(statusText()); }
        try {
            await post(op);
            status(statusText());
        } catch {
            synced = false;
            queue(op);
            status("Server not reachable. Saved in this browser; it syncs next time.");
        }
    };
    const load = async ({ remote = true } = {}) => {
        state = normalize(get("glowup.state", null));
        if (!get("glowup.migrated", false)) {
            // Keep / Hide from the first version lived in per-page keys.
            for (const p of typeof GX_PAGES === "undefined" ? [] : GX_PAGES) {
                const old = get(`glowup-${p.id}.status`, null) || Object.fromEntries(get(`glowup-${p.id}.picks`, []).map((id) => [id, "keep"]));
                for (const [id, value] of Object.entries(old)) {
                    const op = { op: "choice", page: p.id, id, who: who(), value };
                    apply(state, op);
                    queue(op);
                }
                try { localStorage.removeItem(`glowup-${p.id}.status`); localStorage.removeItem(`glowup-${p.id}.picks`); } catch {}
            }
            set("glowup.migrated", true);
        }
        if (remote) {
            try {
                if (ENDPOINT) {
                    const r = await fetch(ENDPOINT, { cache: "no-store" });
                    if (r.ok) {
                        state = normalize(await r.json());
                        synced = true;
                        const pending = get("glowup.pending", []);
                        set("glowup.pending", []);
                        for (const op of pending) await send(op);
                    }
                } else if (preview && !Object.keys(state.choices).length && !Object.keys(state.comments).length) {
                    const r = await fetch(location.search.slice(1).replace(/[^/]+\.html.*$/, "glowup-state.json"), { cache: "no-store" });
                    if (r.ok) state = normalize(await r.json());
                }
            } catch {}
        }
        set("glowup.state", state);
        status(statusText());
        return state;
    };

    const choice = (page, id, w = who()) => state.choices[page]?.[id]?.[w] || null;
    const reactions = (page, id) => state.choices[page]?.[id] || {};
    const comments = (page, id) => state.comments[page]?.[id] || [];
    const people = () => [...new Set([
        who(),
        ...Object.values(state.choices).flatMap((o) => Object.values(o).flatMap((r) => Object.keys(r))),
        ...Object.values(state.comments).flatMap((o) => Object.values(o).flatMap((l) => l.map((c) => c.who))),
    ])];
    const toggle = (page, id, value) => send({ op: "choice", page, id, who: who(), value: choice(page, id) === value ? null : value });
    const comment = (page, id, text) => send({ op: "comment", page, id, who: who(), text: String(text).trim().slice(0, 2000), at: new Date().toISOString() });
    const uncomment = (page, id, at) => send({ op: "uncomment", page, id, who: who(), at });
    // htmlpreview sets <base> to the raw file, so preview links must be absolute or they open raw text.
    const fileHref = (file) => preview && location.search.length > 1 ? location.origin + location.pathname + "?" + location.search.slice(1).replace(/[^/]+\.html.*$/, file) : file;
    const open = (file) => { location.href = fileHref(file); };
    const ago = (iso) => {
        const s = (Date.now() - Date.parse(iso)) / 1000;
        return s < 60 ? "now" : s < 3600 ? `${Math.floor(s / 60)} min` : s < 86400 ? `${Math.floor(s / 3600)} h` : `${Math.floor(s / 86400)} d`;
    };
    const escHtml = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
    // Reaction chips for everyone except `except`: "Chloé likes", "Marc disliked".
    const reactionChips = (page, id, except) => Object.entries(reactions(page, id)).filter(([w]) => w !== except)
        .map(([w, v]) => `<span class="gx-chip ${v}">${escHtml(w)} ${v === "keep" ? "likes it" : "disliked it"}</span>`).join("");

    return {
        ACTIONS, keys, keyLabel, actionFor, who, hasName, setWho, load, send, choice, reactions, comments, people,
        toggle, comment, uncomment, fileHref, open, ago, reactionChips, statusText, get, set,
        onStatus: (fn) => { status = fn; },
        get state() { return state; },
        get synced() { return synced; },
        endpoint: ENDPOINT,
    };
})();

        if (e.key === "Escape") {
            setOpen(false);
            help(false);
            if (document.activeElement && document.activeElement.matches("input")) document.activeElement.blur();
            return;
        }
        const a = GX.actionFor(e);
        if (!a) return;
        const run = {
            prev: () => step(-1), next: () => step(1),
            prevPage: () => openPage(-1), nextPage: () => openPage(1),
            like: () => toggle(index, "keep"), dislike: () => toggle(index, "hide"),
            comment: () => $("gx-cinput").focus(),
            theme: () => setTheme(theme === "night" ? "day" : "night"),
            replay: renderPhone,
            favorites: () => GX.open("glowup-favorites.html"), home: () => GX.open("glowup-index.html"), settings: () => GX.open("glowup-settings.html"),
            help: () => help($("gx-help").hidden),
        }[a];
        if (!run) return;
        e.preventDefault();
        run();
    });
    document.addEventListener("pointerdown", (e) => { if (!$("gx-picker").contains(e.target)) setOpen(false); });

    // drag: position lives in a transform, never in re-rendered state; 6px threshold separates drag from tap
    const picker = $("gx-picker");
    let pos = store.get("switcherPos", { x: 0, y: 0 });
    const clamp = () => {
        const r = picker.getBoundingClientRect();
        const baseLeft = r.left - pos.x, baseTop = r.top - pos.y;
        pos.x = Math.min(Math.max(pos.x, 8 - baseLeft), window.innerWidth - 8 - r.width - baseLeft);
        pos.y = Math.min(Math.max(pos.y, 8 - baseTop), window.innerHeight - 8 - r.height - baseTop);
    };
    const place = () => { picker.style.transform = `translate(${pos.x}px, ${pos.y}px)`; };
    place();
    requestAnimationFrame(() => { clamp(); place(); });
    window.addEventListener("resize", () => { clamp(); place(); fit(); });
    let drag = null;
    $("gx-trigger").addEventListener("pointerdown", (e) => {
        drag = { sx: e.clientX, sy: e.clientY, ox: pos.x, oy: pos.y, moved: false, id: e.pointerId };
        $("gx-trigger").setPointerCapture(e.pointerId);
    });
    $("gx-trigger").addEventListener("pointermove", (e) => {
        if (!drag) return;
        const dx = e.clientX - drag.sx, dy = e.clientY - drag.sy;
        if (!drag.moved && Math.hypot(dx, dy) < 6) return;
        drag.moved = true;
        setOpen(false);
        pos = { x: drag.ox + dx, y: drag.oy + dy };
        clamp();
        place();
    });
    const endDrag = () => {
        if (!drag) return;
        const moved = drag.moved;
        drag = null;
        if (moved) store.set("switcherPos", pos);
        else setOpen(!menu.classList.contains("open"));
    };
    $("gx-trigger").addEventListener("pointerup", endDrag);
    $("gx-trigger").addEventListener("pointercancel", () => { drag = null; });

    document.querySelectorAll("[data-theme-set]").forEach((b) => b.addEventListener("click", () => setTheme(b.dataset.themeSet)));
    $("gx-keep").addEventListener("click", () => toggle(index, "keep"));
    $("gx-hide").addEventListener("click", () => toggle(index, "hide"));
    $("gx-replay").addEventListener("click", renderPhone);

    // fit the 393pt phone to narrow screens
    const fit = () => {
        const wrap = $("gx-phone-wrap");
        if (shot || embed) { wrap.style.zoom = ""; return; }
        const avail = Math.min(window.innerWidth, document.documentElement.clientWidth) - (window.innerWidth <= 440 ? 0 : 24);
        let z = Math.min(1, avail / 393);
        // Side-by-side layout: shrink the phone so all of it fits in the window height.
        if (window.innerWidth > 760) z = Math.min(z, Math.max(0.6, (window.innerHeight - wrap.getBoundingClientRect().top - 16) / 852));
        wrap.style.zoom = z < 1 ? String(z) : "";
        document.querySelector(".gx-side").style.maxHeight = window.innerWidth > 760 ? 852 * z + "px" : "";
    };
    fit();
    GX.onStatus((text) => { $("gx-sync").textContent = text; });
    // Pick up the other person's likes and comments when coming back to the tab.
    window.addEventListener("focus", () => { if (!shot && !embed) GX.load().then(renderMeta); });
    GX.load({ remote: !shot && !embed }).then(() => {
        if (fromParam == null && isHidden(index) && VARIANTS.some((_, j) => !isHidden(j))) step(1);
        else render();
    });
})();
        </script>
    </body>
</html>
