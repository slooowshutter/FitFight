<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
        <title>FitFight - Companion picker proposals</title>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=swap" rel="stylesheet" />
        <style>
            /* Colours copied from docs/design/source/tokens.json palettes.day / palettes.night */
            :root {
                --canvas: #fdfaf4; --bg: #f6f3eb; --card: #fdfaf4; --control: #f2ede3; --controlAlt: #dfd8c6;
                --text: #33302b; --text2: #6b665c; --text3: rgba(51, 48, 43, 0.55); --faint: rgba(51, 48, 43, 0.42);
                --hair: rgba(51, 48, 43, 0.08); --line: rgba(51, 48, 43, 0.12); --chip: rgba(51, 48, 43, 0.05);
                --mossFill: #2f6b44; --mossEdge: #4b9a65; --mossText: #2f6b44; --mossWash: #edf3ea; --mossOn: #fff;
                --disabledText: rgba(51, 48, 43, 0.32); --plate: #eae4d8; --scrim: rgba(51, 48, 43, 0.35);
                --tabBar: rgba(253, 250, 244, 0.92); --tabBarLine: #f0e9db; --tabPillOn: #e4f3e9; --tabInkOn: #2f6b44; --tabInkOff: #6b6f66;
            }
            body.night {
                --canvas: #0c0d08; --bg: #171912; --card: #24271e; --control: #2e3227; --controlAlt: #383d2f;
                --text: #f0ede1; --text2: #9e9c8e; --text3: #8c8a7d; --faint: #6f6d62;
                --hair: rgba(255, 255, 255, 0.07); --line: rgba(255, 255, 255, 0.1); --chip: rgba(255, 255, 255, 0.05);
                --mossFill: #35804f; --mossEdge: #4b9a65; --mossText: #8fd6a6; --mossWash: rgba(53, 128, 79, 0.18); --mossOn: #fff;
                --disabledText: #5e5c53; --plate: #2e3227; --scrim: rgba(6, 7, 4, 0.68);
                --tabBar: rgba(20, 22, 16, 0.94); --tabBarLine: rgba(255, 255, 255, 0.07); --tabPillOn: rgba(53, 128, 79, 0.18); --tabInkOn: #8fd6a6; --tabInkOff: #8c8a7d;
            }
            * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
            html, body { margin: 0; }
            body {
                font-family: Nunito, system-ui, sans-serif; font-weight: 700; background: var(--canvas); color: var(--text);
                min-height: 100dvh; display: flex; flex-direction: column; align-items: center; padding: 16px 0 120px;
            }
            button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
            .intro { width: min(393px, 100%); padding: 0 16px 12px; }
            .intro h1 { font-size: 20px; font-weight: 900; margin: 0 0 4px; letter-spacing: -0.02em; }
            .intro p { font-size: 13px; color: var(--text2); margin: 0; }
            .when { margin-top: 10px; padding: 12px 14px; border-radius: 14px; background: var(--mossWash); color: var(--mossText); font-size: 13px; font-weight: 800; }

            /* Phone frame: 393 x 852 */
            .phone {
                width: min(393px, 100%); height: 852px; position: relative; overflow: hidden;
                background: var(--bg); border-radius: 44px; border: 1px solid var(--line);
            }
            @media (max-width: 430px) { .phone { border-radius: 0; border: 0; height: calc(100dvh - 0px); } body { padding-top: 0; } .intro { padding-top: 14px; } }
            .status { height: 54px; display: flex; align-items: center; justify-content: space-between; padding: 0 30px; font-size: 15px; font-weight: 800; }
            .screen { position: absolute; inset: 54px 0 0; overflow-y: auto; padding: 4px 20px 180px; scrollbar-width: none; }
            .screen::-webkit-scrollbar { display: none; }

            /* Shared bits */
            .hdr { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
            .title { font-size: 26px; font-weight: 800; letter-spacing: -0.025em; margin: 0; }
            .close { color: var(--mossText); font-size: 13px; font-weight: 800; min-height: 44px; }
            .sub { font-size: 13px; color: var(--text2); margin: 4px 0 14px; }
            .card { background: var(--card); border: 1px solid var(--hair); border-radius: 22px; }
            .sel { background: var(--mossWash) !important; border-color: var(--mossEdge) !important; }
            .caption { font-size: 12px; color: var(--text2); }
            .micro { font-size: 11px; color: var(--text3); }
            .eyebrow { font-size: 12px; font-weight: 800; letter-spacing: 0.16em; text-transform: uppercase; color: var(--text3); margin: 22px 0 10px; }
            .tag { font-size: 10px; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; padding: 3px 7px; border-radius: 999px; background: var(--chip); color: var(--text2); white-space: nowrap; }
            .tag.new { background: var(--mossWash); color: var(--mossText); }
            .tag.price { background: var(--mossFill); color: var(--mossOn); }
            .taken img { opacity: 0.35; filter: grayscale(1); }
            .taken .nm { color: var(--disabledText); }
            .nm { font-size: 12px; font-weight: 800; }
            img.pic { display: block; width: 100%; height: 100%; object-fit: contain; }
            .btn { display: flex; align-items: center; justify-content: center; min-height: 52px; border-radius: 999px; font-size: 16px; font-weight: 800; width: 100%; }
            .btn.primary { background: var(--mossFill); color: var(--mossOn); }
            .btn.secondary { background: var(--control); color: var(--text); }
            .savebar { position: absolute; left: 0; right: 0; bottom: 0; padding: 12px 20px 30px; background: var(--bg); border-top: 1px solid var(--hair); z-index: 5; }
            .prompt { padding: 16px; font-size: 13px; line-height: 1.35; display: flex; gap: 12px; align-items: flex-start; text-align: left; width: 100%; }
            .prompt .ic { color: var(--mossText); font-weight: 900; }
            .field { min-height: 110px; padding: 14px; border-radius: 14px; border: 1px solid var(--line); background: var(--card); color: var(--faint); font-size: 13px; text-align: left; }
            .note { font-size: 12px; color: var(--text2); margin: 10px 0 0; }

            /* Segmented */
            .seg { display: grid; grid-template-columns: repeat(3, 1fr); background: var(--control); border-radius: 999px; padding: 4px; gap: 4px; }
            .seg button { min-height: 38px; border-radius: 999px; font-size: 13px; font-weight: 800; color: var(--text2); }
            .seg button.on { background: var(--card); color: var(--text); border: 1px solid var(--hair); }
            /* Pills */
            .pills { display: flex; gap: 8px; }
            .pills button { min-height: 44px; padding: 0 16px; border-radius: 999px; font-size: 13px; font-weight: 800; background: var(--card); border: 1px solid var(--hair); color: var(--text2); }
            .pills button.on { background: var(--mossWash); border-color: var(--mossEdge); color: var(--mossText); }

            /* Grids */
            .grid { display: grid; gap: 10px; }
            .g2 { grid-template-columns: repeat(2, 1fr); }
            .g3 { grid-template-columns: repeat(3, 1fr); }
            .g4 { grid-template-columns: repeat(4, 1fr); gap: 8px; }
            .tile { padding: 8px; display: flex; flex-direction: column; align-items: center; gap: 3px; text-align: center; position: relative; }
            .tile .im { width: 100%; height: 96px; }
            .g4 .tile .im { height: 70px; }
            .g4 .tile { padding: 6px; border-radius: 16px; }
            .tile .corner { position: absolute; top: 8px; right: 8px; }

            .pager { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; margin: 0 -20px; scrollbar-width: none; overscroll-behavior-x: contain; }
            .card .pager { margin: 0; }
            .pager::-webkit-scrollbar { display: none; }
            .page { flex: 0 0 100%; scroll-snap-align: center; text-align: center; padding: 0 20px; }
            .pager.peek .page { flex-basis: 72%; padding: 0 6px; }
            .pager.peek { padding: 0 14%; scroll-padding: 0 14%; }
            .dots { display: flex; justify-content: center; gap: 5px; margin-top: 10px; flex-wrap: wrap; padding: 0 20px; }
            .dots i { width: 6px; height: 6px; border-radius: 9px; background: var(--line); }
            .dots i.on { background: var(--mossFill); width: 16px; }
            .strip { display: flex; gap: 8px; overflow-x: auto; margin: 14px -20px 0; padding: 0 20px 6px; scrollbar-width: none; }
            .strip::-webkit-scrollbar { display: none; }
            .strip button { flex: 0 0 64px; height: 76px; padding: 5px; border-radius: 16px; }
            .vt { display: flex; background: var(--control); border-radius: 999px; padding: 3px; }
            .vt button { width: 36px; height: 32px; border-radius: 999px; font-size: 15px; color: var(--text2); }
            .vt button.on { background: var(--card); color: var(--text); border: 1px solid var(--hair); }
            /* Picker switcher (dev tool for this page) */
            #switcher { position: fixed; right: 16px; bottom: 110px; z-index: 100; touch-action: none; user-select: none; }
            #switcher .trig { width: 200px; height: 48px; display: grid; grid-template-columns: 40px 1fr 40px; align-items: center; background: var(--text); color: var(--bg); border-radius: 999px; }
            #switcher .trig button { height: 48px; font-size: 18px; font-weight: 900; color: var(--bg); }
            #switcher .lbl { text-align: center; font-size: 13px; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: grab; }
            #switcher .menu { position: absolute; bottom: 56px; right: 0; width: 260px; max-height: 60vh; overflow: auto; background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 6px; display: none; }
            #switcher.open .menu { display: block; }
            #switcher .menu button { display: block; width: 100%; text-align: left; padding: 10px 12px; border-radius: 12px; font-size: 13px; font-weight: 800; }
            #switcher .menu button.on { background: var(--mossWash); color: var(--mossText); }
            #switcher .menu small { display: block; font-weight: 700; color: var(--text2); font-size: 11px; margin-top: 2px; }
            .theme { margin-top: 10px; height: 36px; padding: 0 16px; border-radius: 999px; background: var(--control); font-size: 13px; font-weight: 800; }
            @media (prefers-reduced-motion: no-preference) { .tile, .seg button, .pills button { transition: background 0.15s, border-color 0.15s; } }
        </style>
    </head>
    <body>
        <div class="intro">
            <h1>Choose your companion: round 2</h1>
            <p>Built from your picks: swipeable big stage (6), see-them-all preview (2), app-style segmented tabs, dense shop grid. Swipe the big animal with your finger. Same fake data everywhere.</p>
            <div class="when" id="when"></div>
            <button class="theme" id="theme">Night</button>
        </div>
        <div class="phone">
            <div class="status"><span>9:41</span><span>&#9679;&#9679;&#9679;</span></div>
            <div class="screen" id="screen"></div>
            <div id="bar"></div>
        </div>
        <div id="switcher" tabindex="0" aria-label="Choose layout">
            <div class="menu" id="menu" role="listbox"></div>
            <div class="trig"><button id="prev" aria-label="Previous layout">&#8249;</button><div class="lbl" id="lbl"></div><button id="next" aria-label="Next layout">&#8250;</button></div>
        </div>

                ["limited-puffin", "Puffin", "Small wings. Big plans.", "available"],
                ["limited-okapi", "Okapi", "Half zebra. All effort.", "taken"],
            ].map(([id, name, cap, st]) => ({ id, name, cap, img: IMG[id], special: true, status: st }));
            const PRICE = "$4.99";
            const CURRENT = "fox";
            const SAVED = [
                "A grey Maine Coon with round glasses, slightly annoyed, green headband that says MARC.",
                "A black labrador in a rain jacket, calm and a bit smug.",
            ];
            const ALL = [...FREE, ...SPECIAL];
            const find = (id) => ALL.find((a) => a.id === id);

            const state = { tab: "all", sel: CURRENT };
            const listFor = (tab) => (tab === "specials" ? SPECIAL : tab === "yours" ? ALL.filter((a) => a.id === CURRENT || a.status === "yours") : ALL);
            const TABS = [["all", "All"], ["specials", "Specials"], ["yours", "Yours"]];

            // Small shared render helpers
            const status = (a) => (!a.special ? "" : a.status === "yours" ? "Your special" : a.status === "taken" ? "Taken" : PRICE);
            const statusTag = (a) =>
                !a.special ? "" : a.status === "yours" ? `<span class="tag new">Yours</span>` : a.status === "taken" ? `<span class="tag">Taken</span>` : a.status === "new" ? `<span class="tag new">New</span>` : `<span class="tag">1 of 1</span>`;
            const tile = (a, cls = "") =>
                `<button class="card tile ${cls} ${a.status === "taken" ? "taken" : ""} ${state.sel === a.id ? "sel" : ""}" data-pick="${a.id}" ${a.status === "taken" ? "disabled" : ""}>
                    <div class="im"><img class="pic" src="${a.img}" alt=""></div>
                    <div class="nm">${a.name}</div>${a.special ? `<div class="micro">${status(a)}</div>` : ""}</button>`;
            const header = (title = "Choose your companion", sub = true) =>
                `<div class="hdr"><h2 class="title">${title}</h2><button class="close">Close</button></div>${sub ? `<p class="sub">This is how other people see you in fights and Feed.</p>` : ""}`;
            const seg = () => `<div class="seg">${TABS.map(([k, l]) => `<button data-tab="${k}" class="${state.tab === k ? "on" : ""}">${l}</button>`).join("")}</div>`;
            const pills = () => `<div class="pills">${TABS.map(([k, l]) => `<button data-tab="${k}" class="${state.tab === k ? "on" : ""}">${l}</button>`).join("")}</div>`;
            const specialsNote = () => `<p class="note">One of each. One Special per account. Buy once and keep it, even when you change companions. <b style="color:var(--mossText)">Restore purchases</b></p>`;
            const yoursExtras = () =>
                `<div class="eyebrow">Saved descriptions</div><div class="grid" style="gap:10px">${SAVED.map((p) => `<button class="card prompt"><span style="flex:1">${p}</span><span class="ic">&#8634;</span></button>`).join("")}</div>
                 <div class="eyebrow">Make it yours</div><div class="field">Species, breed, accessories, colors...</div>
                 <div style="height:10px"></div><button class="btn secondary">Create character</button>`;
            const saveBar = (compact) => {
                const a = find(state.sel);
                if (!a) return "";
                const buy = a.special && a.status !== "yours";
                const label = a.status === "taken" ? "Taken" : buy ? `Buy for ${PRICE}` : a.id === CURRENT ? "Current companion" : "Save companion";
                return `<div class="savebar">${compact ? "" : `<div style="display:flex;gap:12px;align-items:center;margin-bottom:10px"><img src="${a.img}" style="width:48px;height:60px;object-fit:contain" alt=""><div><div style="font-size:13px;font-weight:800">${a.name}</div><div class="caption">${a.cap}</div></div></div>`}
                    <button class="btn primary" ${a.id === CURRENT ? 'style="opacity:.45"' : ""}>${label}</button></div>`;
            };
            const grid = (list, cols = "g3") => `<div class="grid ${cols}">${list.map((a) => tile(a)).join("")}</div>`;

            // Pager: native horizontal scroll-snap, so a finger swipe pages between animals.
            const pageFor = (a, h) =>
                `<div class="page"><div style="display:flex;justify-content:center"><img src="${a.img}" style="width:100%;max-width:${h}px;aspect-ratio:1;object-fit:contain" alt=""></div>
                 <div style="font-size:26px;font-weight:900;letter-spacing:-.025em;margin-top:4px">${a.name}</div><div class="caption" style="margin:4px 0 8px">${a.cap}</div>${statusTag(a) || "&nbsp;"}</div>`;
            const pager = (h, peek = false) => `<div class="pager ${peek ? "peek" : ""}">${listFor(state.tab).map((a) => pageFor(a, h)).join("")}</div>`;
            const dots = () => { const l = listFor(state.tab); const i = l.findIndex((a) => a.id === state.sel); if (l.length > 12) return `<div class="caption" style="text-align:center;margin-top:10px;font-weight:800">${i + 1} / ${l.length}</div>`; return `<div class="dots">${l.map((_, j) => `<i class="${j === i ? "on" : ""}"></i>`).join("")}</div>`; };
            const strip = () => `<div class="strip">${listFor(state.tab).map((x) => `<button data-pick="${x.id}" class="card ${x.status === "taken" ? "taken" : ""} ${state.sel === x.id ? "sel" : ""}"><img class="pic" src="${x.img}" alt=""></button>`).join("")}</div>`;
            const viewToggle = () => `<div class="vt"><button data-view="stage" class="${state.view === "stage" ? "on" : ""}" aria-label="One at a time">&#9645;</button><button data-view="grid" class="${state.view === "grid" ? "on" : ""}" aria-label="See all">&#9638;</button></div>`;
            const shopGrid = () => `<div class="grid g4">${listFor(state.tab).map((a) => `<button class="card tile ${a.status === "taken" ? "taken" : ""} ${state.sel === a.id ? "sel" : ""}" data-pick="${a.id}"><div class="im"><img class="pic" src="${a.img}" alt=""></div><div class="nm" style="font-size:11px">${a.name}</div>${a.special ? `<div class="micro" style="${a.status === "new" || a.status === "available" ? "color:var(--mossText);font-weight:800" : ""}">${status(a)}</div>` : ""}</button>`).join("")}</div>`;
            const extras = () => (state.tab === "specials" ? specialsNote() : "") + (state.tab === "yours" ? yoursExtras() : "");

            const V = [
                {
                    name: "A+C. Peek stage, grid toggle",
                    when: "Your mix: C's swipe stage with neighbours peeking in, and A's toggle next to Close to see every animal in a grid.",
                    render: () =>
                        `<div class="hdr"><h2 class="title">Pick your fighter</h2><div style="display:flex;gap:8px;align-items:center">${viewToggle()}<button class="close">Close</button></div></div><div style="height:8px"></div>${seg()}<div style="height:14px"></div>` +
                        (state.view === "grid" ? shopGrid() : pager(310, true) + dots()) + extras(),
                    bar: () => saveBar(true),
                },
                {
                    name: "A+C. Peek stage, strip, grid toggle",
                    when: "Same mix, plus C's thumbnail strip under the stage for quick jumps without leaving stage view.",
                    render: () =>
                        `<div class="hdr"><h2 class="title">Pick your fighter</h2><div style="display:flex;gap:8px;align-items:center">${viewToggle()}<button class="close">Close</button></div></div><div style="height:8px"></div>${seg()}<div style="height:14px"></div>` +
                        (state.view === "grid" ? shopGrid() : pager(290, true) + dots() + `<div style="height:8px"></div>` + strip()) + extras(),
                    bar: () => saveBar(true),
                },
                {
                    name: "A. Swipe stage + see all",
                    when: "Your combo: big swipeable stage by default, tap the grid icon to see every animal at once. Tabs match the rest of the app.",
                    render: () =>
                        `<div class="hdr"><h2 class="title">Your companion</h2><div style="display:flex;gap:8px;align-items:center">${viewToggle()}<button class="close">Close</button></div></div><div style="height:8px"></div>${seg()}<div style="height:12px"></div>` +
                        (state.view === "grid" ? shopGrid() : pager(330) + dots()) + extras(),
                    bar: () => saveBar(true),
                },
                {
                    name: "B. Swipe stage over shop grid",
                    when: "Both at once: swipe the big stage on top, the full 4-per-row grid stays right below. Tapping the grid jumps the stage.",
                    render: () => header("Your companion", false) + seg() + `<div style="height:10px"></div><div class="card" style="padding:10px 0 12px">${pager(210)}${dots()}</div><div style="height:12px"></div>` + shopGrid() + extras(),
                    bar: () => saveBar(true),
                },
                {
                    name: "C. Stage with peeking neighbours",
                    when: "Right when you want the swipe to be obvious: the next and previous animals peek in from the sides.",
                    render: () => header("Pick your fighter", false) + seg() + `<div style="height:14px"></div>` + pager(300, true) + dots() + `<div style="height:8px"></div>` + strip() + extras(),
                    bar: () => saveBar(true),
                },
                {
                    name: "D. Full-bleed stage, sticky grid",
                    when: "Most dramatic: the animal fills the top half on a soft plate, grid underneath for browsing.",
                    render: () => `<div style="margin:-4px -20px 0;padding:0 20px 14px;background:var(--plate);border-radius:0 0 32px 32px">${header("Your companion", false)}${seg()}<div style="height:6px"></div>${pager(280)}${dots()}</div><div style="height:14px"></div>` + shopGrid() + extras(),
                    bar: () => saveBar(true),
                },
                {
                    name: "E. Stage + thumbnail strip",
                    when: "Original 6, now with the app's segmented tabs and real swiping. Strip below for quick jumps.",
                    render: () => header("Pick your fighter", false) + seg() + `<div style="height:14px"></div>` + pager(320) + strip() + extras(),
                    bar: () => saveBar(true),
                },
                {
                    name: "F. Big preview (original 2)",
                    when: "Original 2 as you liked it: big preview card on top, see them all below. Preview card now swipes too.",
                    render: () =>
                        header("Your companion", false) +
                        `<div class="card" style="margin:6px 0 14px;padding:10px 0">${`<div class="pager">${listFor(state.tab).map((a) => `<div class="page" style="display:flex;align-items:flex-end;gap:14px;padding:6px 16px;text-align:left"><img src="${a.img}" style="width:130px;height:150px;object-fit:contain" alt=""><div style="padding-bottom:10px"><div style="font-size:22px;font-weight:900;letter-spacing:-.02em">${a.name}</div><div class="caption" style="margin:4px 0 8px">${a.cap}</div>${statusTag(a)}</div></div>`).join("")}</div>`}</div>` +
                        seg() + `<div style="height:12px"></div>` + grid(listFor(state.tab), "g4") + extras(),
                    bar: () => saveBar(true),
                },
                {
                    name: "G. Stage carousel (original 6)",
                    when: "Original 6 as you saw it, pill tabs kept for comparison against the app-style segmented tabs.",
                    render: () => header("Pick your fighter", false) + pills() + `<div style="height:18px"></div>` + pager(300) + strip() + extras(),
                    bar: () => saveBar(true),
                },
            ];

            // Rendering and interaction
            const KEY = "companionPicker3";
            state.view = "stage";
            let cur = Math.min(+(new URLSearchParams(location.search).get("v") ?? localStorage.getItem(KEY + ".variant") ?? 0), V.length - 1);
            const qtab = new URLSearchParams(location.search).get("tab"); if (qtab) state.tab = qtab;
            const qview = new URLSearchParams(location.search).get("view"); if (qview) state.view = qview;
            const screen = document.getElementById("screen");
            function render(keepScroll, smooth) {
                const v = V[cur];
                const top = screen.scrollTop;
                if (!listFor(state.tab).some((a) => a.id === state.sel)) state.sel = listFor(state.tab)[0].id;
                screen.innerHTML = v.render();
                document.getElementById("bar").innerHTML = v.bar();
                document.getElementById("lbl").textContent = v.name;
                document.getElementById("when").textContent = v.when;
                document.getElementById("menu").innerHTML = V.map((x, i) => `<button data-v="${i}" class="${i === cur ? "on" : ""}">${x.name}<small>${x.when}</small></button>`).join("");
                if (keepScroll) screen.scrollTop = top;
                const pg = screen.querySelector(".pager");
                if (pg) {
                    const pages = [...pg.children];
                    const idx = listFor(state.tab).findIndex((a) => a.id === state.sel);
                    pg.scrollTo({ left: pages[idx].offsetLeft - pages[0].offsetLeft, behavior: smooth ? "smooth" : "instant" });
                    let t;
                    pg.addEventListener("scroll", () => {
                        clearTimeout(t);
                        t = setTimeout(() => {
                            const i = Math.round((pg.scrollLeft) / (pages[1] ? pages[1].offsetLeft - pages[0].offsetLeft : 1));
                            const a = listFor(state.tab)[Math.max(0, Math.min(i, pages.length - 1))];
                            if (a && a.id !== state.sel) { state.sel = a.id; render(true); }
                        }, 140);
                    });
                    const strip = screen.querySelector(".strip .sel");
                    if (strip) strip.scrollIntoView({ inline: "center", block: "nearest" });
                }
            }
            screen.addEventListener("click", (e) => {
                const t = e.target.closest("[data-tab]");
                const p = e.target.closest("[data-pick]");
                const vw = e.target.closest("[data-view]");
                if (vw) { state.view = vw.dataset.view; render(true); }
                if (t) { state.tab = t.dataset.tab; render(false); }
                if (p) { state.sel = p.dataset.pick; render(true, true); }
            });
            const go = (i) => { cur = (i + V.length) % V.length; localStorage.setItem(KEY + ".variant", cur); state.tab = "all"; state.view = "stage"; screen.scrollTop = 0; render(false); };
            document.getElementById("prev").onclick = (e) => { e.stopPropagation(); go(cur - 1); };
            document.getElementById("next").onclick = (e) => { e.stopPropagation(); go(cur + 1); };

            // Switcher: draggable, 6px threshold, persisted position, Escape closes
            const sw = document.getElementById("switcher");
            const pos = JSON.parse(localStorage.getItem(KEY + ".switcherPos") || "null");
            if (pos) { sw.style.transform = `translate(${pos.x}px, ${pos.y}px)`; }
            let drag = null, off = pos || { x: 0, y: 0 };
            document.getElementById("lbl").addEventListener("pointerdown", (e) => { drag = { sx: e.clientX, sy: e.clientY, ox: off.x, oy: off.y, moved: false }; e.target.setPointerCapture(e.pointerId); });
            document.getElementById("lbl").addEventListener("pointermove", (e) => {
                if (!drag) return;
                const dx = e.clientX - drag.sx, dy = e.clientY - drag.sy;
                if (!drag.moved && Math.hypot(dx, dy) < 6) return;
                drag.moved = true;
                off = { x: drag.ox + dx, y: drag.oy + dy };
                sw.style.transform = `translate(${off.x}px, ${off.y}px)`;
            });
            document.getElementById("lbl").addEventListener("pointerup", () => {
                if (!drag) return;
                if (drag.moved) localStorage.setItem(KEY + ".switcherPos", JSON.stringify(off));
                else sw.classList.toggle("open");
                drag = null;
            });
            document.getElementById("menu").addEventListener("click", (e) => { const b = e.target.closest("[data-v]"); if (b) { go(+b.dataset.v); sw.classList.remove("open"); } });
            sw.addEventListener("keydown", (e) => {
                if (e.key === "ArrowLeft") go(cur - 1);
                if (e.key === "ArrowRight") go(cur + 1);
                if (e.key === "Escape") sw.classList.remove("open");
            });
            document.addEventListener("click", (e) => { if (!sw.contains(e.target)) sw.classList.remove("open"); });
            const themeBtn = document.getElementById("theme");
            themeBtn.onclick = () => { document.body.classList.toggle("night"); themeBtn.textContent = document.body.classList.contains("night") ? "Day" : "Night"; };
            render(false);
        </script>
    </body>
</html>
