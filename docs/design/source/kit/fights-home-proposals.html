<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FitFight — Fights home proposals</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --canvas: #0C0D08;
    --bg: #171912;
    --card: #24271E;
    --control: #2E3227;
    --text: #F0EDE1;
    --text-dim: #D9D5C6;
    --text-2: #9E9C8E;
    --text-3: #8C8A7D;
    --text-faint: #6F6D62;
    --hairline: rgba(255,255,255,0.07);
    --line: rgba(255,255,255,0.10);
    --track: rgba(255,255,255,0.09);
    --moss: #35804F;
    --moss-edge: #4B9A65;
    --moss-text: #8FD6A6;
    --moss-on: #FFFFFF;
    --moss-soft: #DCF0E2;
    --moss-wash: rgba(53,128,79,0.18);
    --ember: #C2551D;
    --ember-text: #EF9457;
    --ember-wash: rgba(194,85,29,0.16);
    --gold: #F6C450;
    --tab-bar: rgba(23,25,18,0.94);
    --tab-line: rgba(255,255,255,0.08);
    --tab-pill: rgba(53,128,79,0.22);
    --tab-on: #8FD6A6;
    --tab-off: #6B6F66;
    --radius: 22px;
    --gap: 12px;
    --pad: 20px;
  }
  *, *::before, *::after { box-sizing: border-box; }
  html, body {
    margin: 0;
    background: var(--canvas);
    color: var(--text);
    font-family: Nunito, -apple-system, sans-serif;
    font-weight: 600;
    -webkit-font-smoothing: antialiased;
  }
  button { font-family: inherit; }
  .page {
    max-width: 1180px;
    margin: 0 auto;
    padding: 36px 24px 80px;
  }
  .kicker {
    font-size: 12px;
    font-weight: 800;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--text-3);
  }
  h1 {
    margin: 10px 0 0;
    font-size: 36px;
    font-weight: 800;
    letter-spacing: -0.03em;
    line-height: 1.05;
  }
  .lede {
    margin: 14px 0 0;
    max-width: 640px;
    font-size: 15px;
    font-weight: 600;
    line-height: 1.6;
    color: var(--text-2);
  }
  .stage {
    display: grid;
    grid-template-columns: 280px 393px minmax(0, 1fr);
    gap: 28px;
    align-items: start;
    margin-top: 32px;
  }
  .picker {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .pick {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 2px;
    width: 100%;
    text-align: left;
    border: 1px solid var(--hairline);
    border-radius: 14px;
    padding: 11px 13px;
    background: var(--bg);
    color: var(--text);
    cursor: pointer;
  }
  .pick[aria-current="true"] {
    border-color: var(--moss-edge);
    background: var(--moss-wash);
  }
  .pick b {
    font-size: 13px;
    font-weight: 800;
    letter-spacing: -0.01em;
  }
  .pick span {
    font-size: 11px;
    font-weight: 700;
    color: var(--text-3);
    line-height: 1.35;
  }
  .why {
    background: var(--bg);
    border: 1px solid var(--hairline);
    border-radius: var(--radius);
    padding: 18px 20px 20px;
  }
  .why h2 {
    margin: 0;
    font-size: 16px;
    font-weight: 800;
    letter-spacing: -0.01em;
  }
  .why p {
    margin: 8px 0 0;
    font-size: 13px;
    font-weight: 700;
    line-height: 1.55;
    color: var(--text-2);
  }
  .phone-wrap {
    width: 393px;
  }
  .phone {
    width: 393px;
    height: 852px;
    background: var(--bg);
    border-radius: 44px;
    border: 1px solid var(--line);
    overflow: hidden;
    position: relative;
    display: flex;
    flex-direction: column;
  }
  .status {
    height: 54px;
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    padding: 0 28px 8px;
    font-size: 15px;
    font-weight: 800;
    font-variant-numeric: tabular-nums;
  }
  .version {
    text-align: center;
    font-size: 10px;
    font-weight: 800;
    letter-spacing: 0.04em;
    color: var(--text-faint);
    padding: 4px 0 6px;
  }
  .scroll {
    flex: 1;
    overflow: auto;
    padding: 16px var(--pad) 24px;
    display: flex;
    flex-direction: column;
    gap: var(--gap);
  }
  .scroll::-webkit-scrollbar { width: 0; }
  .title {
    font-size: 26px;
    font-weight: 800;
    letter-spacing: -0.025em;
    line-height: 1.1;
  }
  .sub {
    font-size: 13px;
    font-weight: 700;
    color: var(--text-2);
    padding-top: 3px;
  }
  .section {
    font-size: 12px;
    font-weight: 800;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--text-3);
    padding-top: 8px;
  }
  .tabbar {
    height: 83px;
    background: var(--tab-bar);
    border-top: 1px solid var(--tab-line);
    display: flex;
    padding: 6px 10px 0;
  }
  .tab {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3px;
    color: var(--tab-off);
    font-size: 11px;
    font-weight: 700;
  }
  .tab.on { color: var(--tab-on); font-weight: 800; }
  .tab i {
    width: 46px;
    height: 30px;
    border-radius: 9px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .tab.on i { background: var(--tab-pill); }
  .home-bar {
    position: absolute;
    left: 50%;
    bottom: 8px;
    width: 128px;
    height: 5px;
    margin-left: -64px;
    border-radius: 999px;
    background: var(--text);
  }
  .card {
    background: var(--card);
    border: 1px solid var(--hairline);
    border-radius: var(--radius);
    padding: 14px 16px;
  }
  .hero {
    background: var(--moss);
    border: 0;
    border-radius: var(--radius);
    padding: 17px 19px 18px;
    color: var(--moss-on);
  }
  .invite {
    background: var(--moss-wash);
    border: 1px solid rgba(143,214,166,0.18);
    border-radius: var(--radius);
    padding: 14px 16px;
    display: flex;
    align-items: center;
    gap: 13px;
  }
  .join {
    flex: none;
    background: var(--moss);
    color: #fff;
    border: 0;
    border-radius: 999px;
    padding: 6px 13px;
    font-size: 12px;
    font-weight: 800;
  }
  .avatar {
    flex: none;
    border-radius: 999px;
    background: var(--control);
    border: 1px solid var(--line);
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 800;
    color: var(--text-dim);
  }
  .row {
    display: flex;
    align-items: center;
    gap: 13px;
  }
  .grow { flex: 1; min-width: 0; }
  .right { text-align: right; flex: none; }
  .name { font-size: 16px; font-weight: 800; letter-spacing: -0.01em; }
  .row-title { font-size: 15px; font-weight: 800; letter-spacing: -0.01em; }
  .cap { font-size: 12px; font-weight: 700; color: var(--text-2); padding-top: 2px; }
  .metric { font-size: 18px; font-weight: 800; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
  .metric-lg { font-size: 34px; font-weight: 800; letter-spacing: -0.03em; line-height: 1; font-variant-numeric: tabular-nums; }
  .metric-md { font-size: 26px; font-weight: 800; letter-spacing: -0.03em; line-height: 1; font-variant-numeric: tabular-nums; }
  .delta-moss { color: var(--moss-text); font-size: 12px; font-weight: 800; }
  .delta-ember { color: var(--ember-text); font-size: 12px; font-weight: 800; }
  .eyebrow {
    font-size: 12px;
    font-weight: 800;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--text-3);
  }
  .hero .eyebrow { color: var(--moss-soft); }
  .tag {
    display: inline-flex;
    align-items: center;
    border-radius: 999px;
    padding: 4px 9px;
    font-size: 10px;
    font-weight: 800;
    background: rgba(53,128,79,0.22);
    color: var(--moss-text);
  }
  .hero .tag { background: rgba(255,255,255,0.16); color: #fff; }
  .tag.ember { background: rgba(194,85,29,0.22); color: var(--ember-text); }
  .bar, .bar > span {
    display: block;
    height: 10px;
    border-radius: 999px;
  }
  .bar { background: var(--track); overflow: hidden; }
  .bar > span { background: var(--gold); height: 100%; }
  .hero .bar { background: rgba(0,0,0,0.32); }
  .bar.thin { height: 7px; }
  .bar.thin > span { height: 7px; }
  .grid2 {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }
  .group {
    background: var(--card);
    border: 1px solid var(--hairline);
    border-radius: var(--radius);
    overflow: hidden;
  }
  .group .item { padding: 13px 16px; }
  .rule { height: 1px; background: rgba(255,255,255,0.06); margin: 0 16px; }
  .vs {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    gap: 8px;
    align-items: center;
    padding-top: 12px;
  }
  .vs .side { text-align: center; }
  .vs .who { font-size: 11px; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; }
  .carousel {
    display: flex;
    gap: 12px;
    overflow-x: auto;
    margin: 0 -20px;
    padding: 0 20px;
    scroll-snap-type: x mandatory;
  }
  .carousel::-webkit-scrollbar { height: 0; }
  .slide {
    flex: none;
    width: 214px;
    scroll-snap-align: start;
    background: var(--card);
    border: 1px solid var(--hairline);
    border-radius: var(--radius);
    padding: 16px 17px 17px;
  }
  .dots { display: flex; gap: 6px; }
  .dots b { width: 22px; height: 6px; border-radius: 999px; background: var(--moss-text); }
  .dots i { width: 6px; height: 6px; border-radius: 999px; background: rgba(255,255,255,0.20); }
  .wallet { position: relative; height: 268px; }
  .wallet .peek {
    position: absolute;
    left: 0;
    right: 0;
    height: 156px;
  }
  .seg {
    display: flex;
    gap: 6px;
    background: var(--card);
    border: 1px solid var(--hairline);
    border-radius: 999px;
    padding: 4px;
  }
  .seg button {
    flex: 1;
    border: 0;
    background: transparent;
    color: var(--text-2);
    border-radius: 999px;
    padding: 8px 0;
    font-size: 12px;
    font-weight: 800;
    cursor: pointer;
  }
  .seg button[aria-current="true"] {
    background: var(--moss);
    color: #fff;
  }
  .rail { display: grid; grid-template-columns: 44px 1fr; gap: 10px; }
  .when {
    font-size: 11px;
    font-weight: 800;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--text-3);
    padding-top: 16px;
  }
  .wash-moss { background: var(--moss-wash); border-color: rgba(143,214,166,0.18); }
  .wash-ember { background: var(--ember-wash); border-color: rgba(239,148,87,0.22); }
  .stack { display: flex; }
  .stack span { margin-left: -10px; box-shadow: 0 0 0 2px var(--card); }
  .stack span:first-child { margin-left: 0; }
  @media (max-width: 1100px) {
    .stage { grid-template-columns: 1fr; justify-items: center; }
    .picker { flex-direction: row; flex-wrap: wrap; width: 100%; }
    .pick { width: auto; }
    .why { width: 393px; }
  }
</style>
</head>
<body>
<div class="page">
  <div class="kicker">FitFight · not shipped</div>
  <h1>Fights home</h1>
  <p class="lede">The live app makes the first fight a moss hero and the rest compact rows. Same three live fights, one invite, two finished — ten equal-weight layouts plus what ships now. Tap a layout. Nothing here goes to TestFlight.</p>

  <div class="stage">
    <nav class="picker" id="picker" aria-label="Layouts"></nav>
    <div class="phone-wrap">
      <div class="phone" id="phone"></div>
    </div>
    <aside class="why" id="why"></aside>
  </div>
</div>

<script>
const live = [
  { name: "Step Derby vs Marc", tag: "Head to head", days: "Ends in 3 days", initials: "MB", score: "26,410", delta: "up 4,310", ahead: true, progress: 0.84, theirs: "22,100", other: "Marc" },
  { name: "Sunday Climb", tag: "Head to head", days: "Ends in 6 days", initials: "NK", score: "18,240", delta: "840 back", ahead: false, progress: 0.38, theirs: "19,080", other: "Nina" },
  { name: "Office Steps", tag: "3 in this fight", days: "Ends in 12 days", initials: "TD", score: "41,200", delta: "up 1,120", ahead: true, progress: 0.62, theirs: "40,080", other: "Group" },
];

const layouts = [
  { id: "now", label: "0 · Now", blurb: "What ships", title: "Now — one hero", why: "First live fight is a moss hero. The others are compact rows. That is the weird hierarchy: three equal fights do not look equal." },
  { id: "equal", label: "1 · Equal cards", blurb: "Same card, every fight", title: "Equal stacked cards", why: "Every live fight uses the same ink card: days left, name, your steps, lead/behind, gold bar. Rank is the moss/ember line, not the card size. Closest to shipping." },
  { id: "wallet", label: "2 · Wallet stack", blurb: "Same card, overlapping", title: "Wallet stack", why: "Apple Wallet: one template, peeks of the others. Color stripe for winning/losing. Use only if you rarely have more than four live fights." },
  { id: "tiles", label: "3 · Two-up tiles", blurb: "Grid of two", title: "Two-up tiles", why: "The kit already has a stat tile for a grid of two. Fast to scan. Tight for long fight names." },
  { id: "inbox", label: "4 · Grouped inbox", blurb: "One card, equal rows", title: "Grouped inbox", why: "Mail / Duolingo league: one grouped card, hairline rows, identical height. Best if you often have five or more fights." },
  { id: "matchup", label: "5 · Matchup", blurb: "You vs them", title: "Matchup cards", why: "The product is a private Steps fight. You on the left, them on the right, same card every time. Group fights use an avatar stack." },
  { id: "carousel", label: "6 · Carousel", blurb: "Swipe equal cards", title: "Snap carousel", why: "The kit already has this 214pt card. Swipe hides fights off-screen — skip unless you want browsing, not a list." },
  { id: "rings", label: "7 · Ring cards", blurb: "Dial = share of lead", title: "Ring cards", why: "The kit ring card, one per fight, same height. The dial is your score against the leader. Clear “am I close?” without a hero." },
  { id: "segments", label: "8 · Live / Waiting / Done", blurb: "Filter, then equal cards", title: "Segmented buckets", why: "Invitations stop sitting on top of live fights. Inside Live, cards stay equal. Tap the segments in the phone." },
  { id: "timeline", label: "9 · Ending soon", blurb: "Sorted by ends_at", title: "Ending-soon rail", why: "Reminders: first is soonest, not biggest. Same card geometry down the rail." },
  { id: "wash", label: "10 · Status wash", blurb: "Color = rank, size equal", title: "Status wash", why: "Winning gets moss wash, losing ember wash, same padding and type. Color carries rank. No giant moss fill." },
];

function avatar(initials, size) {
  return `<span class="avatar" style="width:${size}px;height:${size}px;font-size:${Math.round(size*0.32)}px">${initials}</span>`;
}

function bar(p, thin) {
  return `<span class="bar${thin ? " thin" : ""}"><span style="width:${Math.round(p*100)}%"></span></span>`;
}

function delta(f) {
  return `<div class="${f.ahead ? "delta-moss" : "delta-ember"}">${f.delta}</div>`;
}

function invite() {
  return `<div class="invite">
    ${avatar("NK", 44)}
    <div class="grow"><div class="name">Weekend Walk</div><div class="cap">Nina invited you · 7 days</div></div>
    <span class="join">Join</span>
  </div>`;
}

function finished() {
  return `<div class="section">Finished</div>
    <div class="card row">
      <span class="avatar" style="width:28px;height:28px;font-size:14px;background:var(--moss);border:0;color:#fff">✓</span>
      <div class="grow"><div class="row-title">10K Club</div><div class="cap">Ended 2 days ago · you won</div></div>
      ${avatar("MB", 26)}
    </div>
    <div class="card row">
      <span class="avatar" style="width:28px;height:28px;font-size:14px;background:var(--ember);border:0;color:#fff">–</span>
      <div class="grow"><div class="row-title">March Derby</div><div class="cap">Ended last week · you lost</div></div>
      ${avatar("TD", 26)}
    </div>`;
}

function titleBlock() {
  return `<div><div class="title">Fights</div><div class="sub">3 live · 1 waiting</div></div>`;
}

function listRow(f) {
  return `<div class="card row">
    ${avatar(f.initials, 44)}
    <div class="grow"><div class="name">${f.name}</div><div class="cap">${f.tag} · steps</div></div>
    <div class="right"><div class="metric">${f.score}</div>${delta(f)}</div>
  </div>`;
}

function equalCard(f) {
  return `<div class="card">
    <div class="row" style="justify-content:space-between">
      <span class="eyebrow">${f.days}</span>
      <span class="tag${f.ahead ? "" : " ember"}">${f.tag}</span>
    </div>
    <div class="name" style="padding-top:8px">${f.name}</div>
    <div class="row" style="align-items:flex-end;padding-top:10px">
      <div class="grow"><div class="metric-md">${f.score}</div><div class="cap" style="padding-top:4px">steps · ${f.delta}</div></div>
      ${avatar(f.initials, 44)}
    </div>
    <div style="padding-top:12px">${bar(f.progress, true)}</div>
  </div>`;
}

function matchup(f) {
  const right = f.other === "Group"
    ? `<div class="stack" style="justify-content:center">${avatar("TD", 36)}${avatar("AM", 36)}${avatar("NK", 36)}</div>`
    : avatar(f.initials, 44);
  return `<div class="card">
    <div class="row" style="justify-content:space-between">
      <span class="eyebrow">${f.days}</span>
      <span class="tag">${f.tag}</span>
    </div>
    <div class="row-title" style="padding-top:8px">${f.name}</div>
    <div class="vs">
      <div class="side">
        <div class="who" style="color:var(--moss-text)">You</div>
        <div style="display:flex;justify-content:center;padding:8px 0">${avatar("YO", 44)}</div>
        <div class="metric">${f.score}</div>
      </div>
      <div style="font-size:12px;font-weight:800;color:var(--text-faint)">VS</div>
      <div class="side">
        <div class="who" style="color:${f.ahead ? "var(--text-3)" : "var(--ember-text)"}">${f.other}</div>
        <div style="display:flex;justify-content:center;padding:8px 0">${right}</div>
        <div class="metric">${f.theirs}</div>
      </div>
    </div>
    <div style="padding-top:12px">${bar(f.progress, true)}</div>
  </div>`;
}

function ring(f) {
  const c = 188.5;
  const off = (c * (1 - f.progress)).toFixed(1);
  const stroke = f.ahead ? "#35804F" : "#C2551D";
  return `<div class="card row" style="padding:16px 18px">
    <div style="position:relative;width:76px;height:76px;flex:none">
      <svg width="76" height="76" viewBox="0 0 76 76" style="transform:rotate(-90deg);display:block">
        <circle cx="38" cy="38" r="30" fill="none" stroke="rgba(255,255,255,0.09)" stroke-width="9"></circle>
        <circle cx="38" cy="38" r="30" fill="none" stroke="${stroke}" stroke-width="9" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${off}"></circle>
      </svg>
      <div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:800">${Math.round(f.progress*100)}%</div>
    </div>
    <div class="grow">
      <div class="row-title">${f.name}</div>
      <div class="cap">${f.days}</div>
      <div class="row" style="gap:8px;padding-top:6px;align-items:baseline">
        <div class="metric" style="font-size:22px">${f.score}</div>
        ${delta(f)}
      </div>
    </div>
  </div>`;
}

function trophy() {
  return `<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round"><path d="M8 4h8v5a4 4 0 0 1-8 0V4Z"/><path d="M8 6H5a2 2 0 0 0 2 4"/><path d="M16 6h3a2 2 0 0 1-2 4"/><path d="M12 13v3"/><path d="M8 20h8"/></svg>`;
}
function plus() {
  return `<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg>`;
}
function person() {
  return `<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round"><circle cx="12" cy="8" r="3.2"/><path d="M5.5 19c1.2-3.2 3.5-4.8 6.5-4.8S16.8 15.8 18 19"/></svg>`;
}

function chrome(inner) {
  return `
    <div class="status"><span>9:41</span><span>●●●●</span></div>
    <div class="version">1.0.0 · build 42 · staging · 4 Sep</div>
    <div class="scroll">${titleBlock()}${inner}</div>
    <div class="tabbar">
      <div class="tab on"><i>${trophy()}</i>Fights</div>
      <div class="tab"><i>${plus()}</i>New</div>
      <div class="tab"><i>${person()}</i>You</div>
    </div>
    <div class="home-bar"></div>`;
}

const render = {
  now() {
    const f = live[0];
    return chrome(`${invite()}
      <div class="hero">
        <div class="row" style="justify-content:space-between">
          <span class="eyebrow">${f.days}</span>
          <span class="tag">${f.tag}</span>
        </div>
        <div style="font-size:21px;font-weight:800;letter-spacing:-0.015em;padding-top:9px">${f.name}</div>
        <div class="row" style="align-items:flex-end;padding-top:14px">
          <div class="grow"><div class="metric-lg">${f.score}</div><div class="cap" style="color:var(--moss-soft);padding-top:4px">steps · you lead by 4,310</div></div>
          <span class="avatar" style="width:52px;height:52px;font-size:16px;background:rgba(0,0,0,0.28);border:3px solid rgba(255,255,255,0.25);color:#fff">${f.initials}</span>
        </div>
        <div style="padding-top:14px">${bar(f.progress)}</div>
      </div>
      ${live.slice(1).map(listRow).join("")}
      ${finished()}`);
  },
  equal() { return chrome(`${invite()}${live.map(equalCard).join("")}${finished()}`); },
  wallet() {
    const stripe = (f, i) => `<div class="peek card" style="top:${i*56}px;z-index:${3-i};padding-left:18px">
      <span style="position:absolute;left:0;top:16px;bottom:16px;width:6px;border-radius:0 6px 6px 0;background:${f.ahead ? "var(--moss)" : "var(--ember)"}"></span>
      <div class="eyebrow">${f.days}</div>
      <div class="name" style="padding-top:6px">${f.name}</div>
      <div class="metric-md" style="padding-top:8px">${f.score}</div>
      <div class="cap" style="padding-top:4px">${f.delta}</div>
    </div>`;
    return chrome(`${invite()}<div class="wallet">${live.map(stripe).join("")}</div>${finished()}`);
  },
  tiles() {
    const tile = (f) => `<div class="card" style="padding:14px 15px 15px">
      <span class="tag${f.ahead ? "" : " ember"}">${f.tag === "Head to head" ? "1V1" : "GROUP"}</span>
      <div class="row-title" style="padding-top:9px">${f.name}</div>
      <div class="metric-md" style="padding-top:8px;font-size:22px">${f.score}</div>
      <div class="cap">${f.days}</div>
      <div style="padding-top:10px">${bar(f.progress, true)}</div>
    </div>`;
    return chrome(`${invite()}<div class="grid2">${live.map(tile).join("")}</div>${finished()}`);
  },
  inbox() {
    const row = (f, i) => `${i ? '<div class="rule"></div>' : ""}
      <div class="item row${f.ahead ? " wash-moss" : ""}" style="border:0;background:transparent;min-height:64px">
        ${avatar(f.initials, 36)}
        <div class="grow"><div class="row-title">${f.name}</div><div class="cap">${f.days}</div></div>
        <div class="right"><div class="metric">${f.score}</div>${delta(f)}</div>
      </div>`;
    return chrome(`${invite()}<div class="group">${live.map(row).join("")}</div>${finished()}`);
  },
  matchup() { return chrome(`${invite()}${live.map(matchup).join("")}${finished()}`); },
  carousel() {
    const slide = (f) => `<div class="slide">
      <span class="tag">${f.tag === "Head to head" ? "1V1" : "GROUP"}</span>
      <div class="row-title" style="padding-top:10px">${f.name}</div>
      <div class="metric-md" style="padding-top:8px">${f.score}</div>
      <div class="cap">steps</div>
    </div>`;
    return chrome(`${invite()}
      <div class="carousel">${live.map(slide).join("")}</div>
      <div class="dots"><b></b><i></i><i></i></div>
      ${live.map(listRow).join("")}
      ${finished()}`);
  },
  rings() { return chrome(`${invite()}${live.map(ring).join("")}${finished()}`); },
  segments() {
    const mode = window.segment || "live";
    const body = mode === "waiting" ? invite()
      : mode === "finished" ? finished().replace('<div class="section">Finished</div>', "")
      : live.map(equalCard).join("");
    return chrome(`<div class="seg">
        <button type="button" data-seg="live" aria-current="${mode==="live"}">Live 3</button>
        <button type="button" data-seg="waiting" aria-current="${mode==="waiting"}">Waiting 1</button>
        <button type="button" data-seg="finished" aria-current="${mode==="finished"}">Done 2</button>
      </div>${body}`);
  },
  timeline() {
    const row = (label, html) => `<div class="rail"><div class="when">${label}</div>${html}</div>`;
    return chrome(`${row("Now", invite())}
      ${row("3d", equalCard(live[0]))}
      ${row("6d", equalCard(live[1]))}
      ${row("12d", equalCard(live[2]))}
      ${finished()}`);
  },
  wash() {
    const card = (f) => {
      const wash = f.ahead ? " wash-moss" : " wash-ember";
      return `<div class="card${wash}">
        <div class="row" style="justify-content:space-between">
          <span class="eyebrow">${f.days}</span>
          <span class="tag${f.ahead ? "" : " ember"}">${f.ahead ? "Lead" : "Behind"}</span>
        </div>
        <div class="name" style="padding-top:8px">${f.name}</div>
        <div class="row" style="align-items:flex-end;padding-top:10px">
          <div class="grow"><div class="metric-md">${f.score}</div>${delta(f)}</div>
          ${avatar(f.initials, 44)}
        </div>
        <div style="padding-top:12px">${bar(f.progress, true)}</div>
      </div>`;
    };
    return chrome(`${invite()}${live.map(card).join("")}${finished()}`);
  },
};

function show(id) {
  const layout = layouts.find((item) => item.id === id) || layouts[0];
  document.getElementById("phone").innerHTML = render[layout.id]();
  document.getElementById("why").innerHTML = `<h2>${layout.title}</h2><p>${layout.why}</p>`;
  for (const btn of document.querySelectorAll(".pick")) {
    btn.setAttribute("aria-current", btn.dataset.id === layout.id ? "true" : "false");
  }
  history.replaceState(null, "", "#" + layout.id);
}

document.getElementById("picker").innerHTML = layouts.map((item) =>
  `<button type="button" class="pick" data-id="${item.id}"><b>${item.label}</b><span>${item.blurb}</span></button>`
).join("");

document.getElementById("picker").addEventListener("click", (event) => {
  const btn = event.target.closest(".pick");
  if (btn) show(btn.dataset.id);
});

document.getElementById("phone").addEventListener("click", (event) => {
  const btn = event.target.closest("[data-seg]");
  if (!btn) return;
  window.segment = btn.dataset.seg;
  show("segments");
});

show((location.hash || "#equal").slice(1));
</script>
</body>
</html>
