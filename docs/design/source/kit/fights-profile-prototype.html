            :root { --them: #8C8A7D; --themSoft: color-mix(in srgb, var(--them) 55%, var(--card)); --goldMark: var(--gold); --goldWash: color-mix(in srgb, var(--gold) 14%, var(--card)); --ease-out: cubic-bezier(0.23, 1, 0.32, 1); }
            [data-theme="day"] { --them: #9A958A; --goldMark: color-mix(in srgb, var(--gold) 70%, var(--goldInk)); --goldWash: color-mix(in srgb, var(--gold) 22%, var(--card)); }
            :root { --level0: color-mix(in srgb, var(--gold) 28%, var(--card)); --level1: color-mix(in srgb, var(--gold) 46%, var(--card)); --level2: color-mix(in srgb, var(--gold) 64%, var(--card)); --level3: color-mix(in srgb, var(--gold) 82%, var(--card)); --level4: var(--goldMark); }
            * { box-sizing: border-box; }
            html, body { margin: 0; min-height: 100%; }
            body { background: var(--canvas); color: var(--text); font: 700 13px/1.45 Nunito, -apple-system, sans-serif; -webkit-font-smoothing: antialiased; }
            button { font: inherit; color: inherit; background: none; border: 0; padding: 0; margin: 0; cursor: pointer; text-align: inherit; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
            button:focus-visible { outline: 2px solid var(--text); outline-offset: 3px; }
            h1, h2, p { margin: 0; }
            img { display: block; }
            svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }
            [hidden] { display: none !important; }
            .num { font-variant-numeric: tabular-nums; letter-spacing: -0.03em; }
            .muted { color: var(--textSecondary); }
            .faint { color: var(--textFaint); }
            .moss { color: var(--mossText); }
            .ember { color: var(--emberText); }
            .gold { color: var(--goldMark); }

            /* Phone */
            .stage { min-height: 100dvh; display: grid; place-items: center; padding: 24px 0; }
            .phone { position: relative; width: 393px; height: 852px; background: var(--bg); border: 1px solid var(--line); border-radius: 44px; overflow: hidden; display: flex; flex-direction: column; }
            .status { flex: none; height: 50px; padding: 17px 32px 0; display: flex; justify-content: space-between; font-size: 15px; font-weight: 800; }
            .status span { display: flex; gap: 6px; align-items: center; }
            .status svg { width: 17px; height: 17px; }
            .screen { flex: 1; overflow-y: auto; overscroll-behavior: contain; padding: 6px 20px 120px; scrollbar-width: none; }
            .screen::-webkit-scrollbar, .sheet-body::-webkit-scrollbar { display: none; }
            .screen > * + *, .sheet-body > * + * { margin-top: 12px; }
            .tabbar { position: absolute; z-index: 10; left: 0; right: 0; bottom: 0; display: grid; grid-template-columns: repeat(5, 1fr); padding: 8px 10px 26px; background: var(--tabBar); border-top: 1px solid var(--tabBarLine); -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px); }
            .tab { display: flex; flex-direction: column; align-items: center; gap: 4px; color: var(--tabInkOff); font-size: 11px; }
            .tab .glyph { display: grid; place-items: center; width: 32px; height: 32px; border-radius: 9px; }
            .tab[aria-current] { color: var(--tabInkOn); font-weight: 800; }
            .tab[aria-current] .glyph { background: var(--tabPillOn); }

            /* App pieces */
            .card { background: var(--card); border: 1px solid var(--hairline); border-radius: 22px; }
            .pad { padding: 22px; }
            .sec { display: flex; align-items: center; gap: 14px; padding-top: 20px; }
            .sec h2 { font-size: 12px; font-weight: 800; letter-spacing: 0.16em; text-transform: uppercase; color: var(--mossText); white-space: nowrap; }
            .sec::after { content: ""; flex: 1; height: 1px; background: var(--track); }
            .eyebrow { font-size: 12px; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; color: var(--textSecondary); }
            .title { font-size: 26px; font-weight: 800; letter-spacing: -0.025em; line-height: 1.15; }
            .heading { font-size: 16px; font-weight: 800; letter-spacing: -0.01em; }
            .caption { font-size: 12px; color: var(--textSecondary); }
            .micro { font-size: 11px; color: var(--textSecondary); }
            .split { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
            .char { object-fit: contain; object-position: bottom; flex: none; }
            .chev { width: 15px; height: 15px; color: var(--textFaint); }
            .bar { height: 5px; border-radius: 999px; background: var(--track); overflow: hidden; }
            .bar span { display: block; height: 100%; background: var(--gold); border-radius: inherit; }
            .btn { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; min-height: 50px; border-radius: 999px; font-size: 14px; font-weight: 800; }
            .btn.primary { background: var(--mossFill); color: var(--mossOn); }
            .btn.secondary { background: var(--control); color: var(--text); border: 1px solid var(--chipEdge); }
            .btn.add { background: var(--mossWash); color: var(--mossText); border: 1px solid color-mix(in srgb, var(--mossText) 30%, transparent); }
            .btn.pending { background: var(--control); color: var(--textSecondary); border: 1px solid var(--chipEdge); }
            .btn.sm { width: auto; min-height: 36px; padding: 0 14px; font-size: 12px; }
            .btn.link { width: auto; min-height: 44px; padding: 0 12px; color: var(--textSecondary); font-size: 13px; }
            .btn svg { width: 16px; height: 16px; }
            .live-dot { display: inline-block; width: 7px; height: 7px; margin-right: 5px; border-radius: 50%; background: var(--mossText); vertical-align: 1px; }

            /* Fights home */
            .hero { display: grid; grid-template-columns: 1fr 142px; gap: 8px; align-items: start; }
            .hero-copy { display: grid; gap: 12px; align-content: start; }
            .hero h1 { font-size: 26px; font-weight: 800; letter-spacing: -0.025em; line-height: 1.15; }
            .title-row { display: flex; align-items: center; gap: 10px; }
            .tagline { font-size: 16px; font-weight: 800; line-height: 1.3; }
            .today b { display: block; font-size: 34px; font-weight: 800; line-height: 1.05; }
            .today small { display: block; font-size: 12px; color: var(--textSecondary); margin-top: 3px; }
            .character { width: 142px; height: 156px; }
            .character img { width: 100%; height: 100%; object-fit: contain; object-position: bottom; }
            .flame-pill { position: relative; display: inline-flex; align-items: center; gap: 3px; height: 24px; padding: 0 9px 0 7px; border-radius: 999px; background: var(--goldWash); color: var(--goldMark); font-size: 12px; font-weight: 800; line-height: 1; flex: none; }
            .flame-pill::before { content: ""; position: absolute; inset: -10px -6px; }
            .flame-pill svg { width: 13px; height: 13px; stroke-width: 2; }
            .flame-pill b { font-size: 12px; font-weight: 800; }
            .ch-head { display: flex; align-items: center; justify-content: space-between; padding-top: 6px; }
            .ch-head b { font-size: 14px; font-weight: 800; }
            .ch-head span { display: flex; align-items: center; gap: 5px; min-height: 44px; font-size: 13px; font-weight: 800; color: var(--mossText); }
            .ch-head svg { width: 15px; height: 15px; }
            .seg { display: grid; grid-template-columns: repeat(3, 1fr); padding: 3px; border-radius: 999px; background: var(--control); }
            .seg.four { grid-template-columns: repeat(4, 1fr); }
            .seg span { display: grid; place-items: center; min-height: 34px; border-radius: 999px; font-size: 13px; font-weight: 800; color: var(--textSecondary); }
            .seg span.on { background: var(--card); color: var(--text); }
            .ch-head + .seg { margin-top: 6px; }
            .hosted { display: flex; align-items: center; gap: 13px; width: 100%; padding: 14px 16px; text-align: left; }
            .hosted .grow { flex: 1; }
            .hosted strong { display: block; font-size: 16px; font-weight: 800; }
            .hosted small { display: block; font-size: 12px; color: var(--textSecondary); }
            .live { display: grid; gap: 6px; width: 100%; padding: 6px 16px 14px; text-align: left; }
            .live-top { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
            .live-top strong { font-size: 16px; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
            .live-top b { font-size: 22px; font-weight: 800; letter-spacing: -0.02em; white-space: nowrap; }
            .who { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--textSecondary); }
            .stack { display: flex; }
            .stack span { width: 22px; height: 22px; margin-left: -12px; overflow: hidden; }
            .stack span:first-child { margin-left: 0; }
            .stack img { width: 22px; height: 40px; object-fit: cover; object-position: top; }
            .meta { display: flex; justify-content: space-between; font-size: 12px; color: var(--textSecondary); }

            /* A Fight */
            .nav { display: flex; align-items: flex-start; gap: 8px; margin-left: -12px; }
            .nav button { display: grid; place-items: center; width: 44px; height: 44px; flex: none; }
            .nav .nav-title { min-height: 44px; display: grid; align-content: center; }
            .nav strong { font-size: 18px; font-weight: 800; line-height: 1.2; }
            .nav small { font-size: 12px; color: var(--textSecondary); }
            .summary { display: grid; gap: 10px; padding: 16px 18px; }
            .summary-top { display: grid; grid-template-columns: 64px 1fr 64px; align-items: end; text-align: center; }
            .summary-top img { width: 64px; height: 74px; }
            .summary-top b { display: block; font-size: 32px; font-weight: 800; line-height: 1; }
            .band { display: grid; gap: 12px; padding: 4px; border-radius: 22px; background: var(--mossWash); border: 1px solid var(--mossEdge); }
            .band .lrow { border-radius: 18px; }
            .sep { display: flex; align-items: center; gap: 10px; }
            .sep span { font-size: 12px; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; color: var(--textTertiary); white-space: nowrap; }
            .sep::after { content: ""; flex: 1; height: 1px; background: var(--track); }
            .lrow { display: flex; align-items: center; gap: 13px; width: 100%; padding: 10px 15px; background: var(--card); border: 1px solid var(--hairline); border-radius: 22px; text-align: left; }
            .lrow .rank { width: 22px; text-align: center; font-size: 14px; font-weight: 800; color: var(--textTertiary); }
            .lrow .rank.first { color: var(--goldMark); }
            .lrow img { width: 38px; height: 38px; }
            .lrow .grow { flex: 1; min-width: 0; }
            .lrow strong { display: block; font-size: 15px; font-weight: 800; }
            .lrow small { display: block; font-size: 11px; color: var(--textSecondary); }
            .lrow .val { font-size: 17px; font-weight: 800; }
            .lrow.you strong { color: var(--mossText); }

            /* Profile sheet */
            .sheet-wrap { position: absolute; inset: 0; z-index: 20; }
            .sheet-wrap .scrim { position: absolute; inset: 0; background: var(--scrim); animation: fade 160ms var(--ease-out); }
            .psheet { position: absolute; top: 58px; left: 0; right: 0; bottom: 0; display: flex; flex-direction: column; background: var(--bg); border-radius: 38px 38px 0 0; animation: rise 260ms var(--ease-out); }
            .grabber { flex: none; width: 36px; height: 5px; margin: 8px auto 0; border-radius: 999px; background: var(--handle); }
            .sheet-head { flex: none; display: flex; align-items: center; justify-content: space-between; min-height: 44px; padding: 12px 20px 0; }
            .sheet-head h1 { font-size: 16px; font-weight: 800; letter-spacing: -0.01em; }
            .sheet-head button { min-height: 44px; min-width: 44px; text-align: right; font-size: 13px; font-weight: 800; color: var(--mossText); }
            .sheet-body { flex: 1; overflow-y: auto; overscroll-behavior: contain; padding: 16px 20px 48px; scrollbar-width: none; }
            .foot-actions { display: flex; min-height: 44px; align-items: center; font-size: 13px; font-weight: 800; color: var(--textSecondary); }
            .rows { overflow: hidden; }
            .rowi { display: flex; align-items: center; gap: 12px; width: 100%; min-height: 58px; padding: 12px 16px; text-align: left; }
            .rowi + .rowi { border-top: 1px solid var(--hairline); }
            .rowi .grow { flex: 1; min-width: 0; }
            .rowi strong { display: block; font-size: 15px; font-weight: 800; letter-spacing: -0.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
            .rowi small { display: block; font-size: 12px; color: var(--textSecondary); margin-top: 1px; }
            .rowi.more { justify-content: center; min-height: 48px; font-size: 13px; font-weight: 800; color: var(--mossText); }
            .result { font-size: 13px; font-weight: 800; text-align: right; white-space: nowrap; }
            .form { display: grid; grid-template-columns: repeat(10, minmax(0, 1fr)); gap: 5px; }
            .form span { display: grid; place-items: center; height: 26px; border-radius: 8px; font-size: 11px; font-weight: 800; }
            .form .w { background: var(--mossWash); color: var(--mossText); }
            .form .l { background: var(--emberWash); color: var(--emberText); }
            .form .d { background: var(--chip); color: var(--textSecondary); }
            .form-row { display: grid; gap: 8px; min-width: 0; }
            .locked { display: grid; justify-items: center; gap: 4px; padding: 22px; text-align: center; }
            .locked .lock { width: 22px; height: 22px; color: var(--textSecondary); margin-bottom: 4px; }
            .locked p { max-width: 270px; }
            .locked .btn.add { width: auto; min-height: 44px; margin-top: 10px; padding: 0 18px; }
            .against .locked { border-top: 1px solid var(--hairline); margin: 0 -18px; }
            .ask { display: grid; gap: 12px; padding: 16px 18px; border-color: color-mix(in srgb, var(--mossText) 30%, transparent); background: color-mix(in srgb, var(--mossFill) 10%, var(--card)); }
            .ask .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
            .ask .btn { min-height: 44px; }
            .player { overflow: hidden; }
            .player-top { display: grid; grid-template-columns: 124px 1fr; gap: 12px; padding: 18px 18px 14px 10px; align-items: end; }
            .player-top img { width: 124px; height: 140px; }
            .player-top .who-col { display: grid; gap: 2px; padding-bottom: 6px; min-width: 0; }
            .player-top .name-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; min-width: 0; }
            .player-top .title { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
            .player-top .title span { color: var(--textSecondary); }
            .player-top .quote { font-size: 13px; font-style: italic; color: var(--textDim); }
            .player-top .btn { justify-self: start; margin-top: 10px; }
            .stat-grid { display: grid; grid-template-columns: 1fr 1fr; border-top: 1px solid var(--hairline); }
            .stat-grid > div { padding: 14px 18px; }
            .stat-grid > div:nth-child(even) { border-left: 1px solid var(--hairline); }
            .stat-grid > div:nth-child(n+3) { border-top: 1px solid var(--hairline); }
            .stat-grid b { display: block; font-size: 20px; font-weight: 800; line-height: 1.2; }
            .stat-grid small { display: block; font-size: 12px; color: var(--textSecondary); }
            .against { padding: 16px 18px; display: grid; gap: 12px; }
            .against-top { display: grid; grid-template-columns: 52px 1fr 52px; align-items: end; text-align: center; }
            .against-top img { width: 52px; height: 60px; }
            .against-top b { font-size: 30px; font-weight: 800; line-height: 1; }
            .against-top b i { font-style: normal; color: var(--textFaint); margin: 0 4px; }
            .expand { display: flex; align-items: center; justify-content: center; gap: 6px; min-height: 44px; border-top: 1px solid var(--hairline); margin: 0 -18px -16px; font-size: 13px; font-weight: 800; color: var(--mossText); }
            .expand svg { width: 15px; height: 15px; transition: transform 200ms var(--ease-out); }
            .expand[aria-expanded="true"] svg { transform: rotate(180deg); }
            .cmp { display: grid; border-top: 1px solid var(--hairline); margin: 0 -18px; padding: 0 18px; }
            .scope { padding: 12px 0 4px; font-size: 12px; font-weight: 800; color: var(--textSecondary); text-align: center; }
            .empty-note { padding: 4px 0 14px; font-size: 13px; color: var(--textSecondary); text-align: center; }
            .mstats { margin: 0 -2px; }
            .mstat { padding: 12px 2px; border-top: 1px solid var(--hairline); }
            .scope + .mstats .mstat:first-child { border-top: 0; }
            .mstat .lbl { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); font-size: 15px; font-weight: 800; margin-bottom: 8px; }
            .mstat .lbl span { text-align: center; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--textSecondary); align-self: center; white-space: nowrap; }
            .mstat .lbl b { color: var(--textSecondary); }
            .mstat .lbl b:last-child { text-align: right; }
            .lead-you { color: var(--mossText) !important; }
            .lead-them { color: var(--emberText) !important; }
            .possession { position: relative; display: flex; gap: 4px; height: 6px; }
            .possession span { border-radius: 999px; }
            .possession::after { content: ""; position: absolute; left: 50%; top: -4px; bottom: -4px; width: 2px; margin-left: -1px; border-radius: 2px; background: var(--text); opacity: 0.55; }
            .bars { display: flex; gap: 3px; align-items: flex-end; height: 64px; }
            .bars i { flex: 1; border-radius: 3px 3px 1px 1px; background: var(--level2); }
            .bars i.ten { background: var(--level3); }
            .bars i.top { background: var(--goldMark); }
            .levelbar { display: flex; height: 10px; gap: 2px; border-radius: 999px; overflow: hidden; }
            .levelbar span { display: block; height: 100%; }
            .legend { display: flex; flex-wrap: wrap; gap: 6px 12px; font-size: 11px; color: var(--textSecondary); }
            .legend i { display: inline-block; width: 9px; height: 9px; border-radius: 3px; margin-right: 4px; vertical-align: -1px; }
            .l0 { background: var(--level0); } .l1 { background: var(--level1); } .l2 { background: var(--level2); } .l3 { background: var(--level3); } .l4 { background: var(--level4); }

            /* Overlays above everything inside the phone */
            .layer { position: absolute; inset: 0; z-index: 30; pointer-events: none; }
            .layer .scrim { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: flex-end; gap: 8px; padding: 0 10px 30px; background: var(--scrim); pointer-events: auto; animation: fade 160ms var(--ease-out); }
            .layer .scrim.clear { background: transparent; }
            .dialog { overflow: hidden; border-radius: 16px; background: var(--overlay); text-align: center; animation: pop 200ms var(--ease-out); }
            .dialog p { padding: 16px 18px 14px; font-size: 13px; color: var(--textSecondary); border-bottom: 1px solid var(--overlayLine); }
            .dialog p strong { display: block; margin-bottom: 2px; font-size: 14px; color: var(--text); }
            .dialog button { display: block; width: 100%; min-height: 56px; font-size: 17px; font-weight: 800; text-align: center; }
            .dialog button + button { border-top: 1px solid var(--overlayLine); }
            .dialog .destructive { color: var(--emberText); }
            .popover { position: absolute; width: 260px; padding: 16px 16px 6px; border-radius: 18px; background: var(--overlay); border: 1px solid var(--overlayLine); pointer-events: auto; animation: pop 180ms var(--ease-out); }
            .popover::before { content: ""; position: absolute; top: -7px; right: 22px; width: 12px; height: 12px; background: var(--overlay); border-left: 1px solid var(--overlayLine); border-top: 1px solid var(--overlayLine); transform: rotate(45deg); }
            .popover strong { display: flex; align-items: center; gap: 6px; font-size: 15px; color: var(--goldMark); }
            .popover strong svg { width: 17px; height: 17px; }
            .popover p { margin-top: 6px; font-size: 13px; color: var(--textSecondary); line-height: 1.45; }
            .popover button { display: block; width: 100%; min-height: 44px; margin-top: 6px; font-size: 14px; font-weight: 800; color: var(--mossText); text-align: center; }
            .toast { position: absolute; left: 50%; bottom: 100px; transform: translateX(-50%); padding: 10px 16px; border-radius: 16px; background: var(--overlay); border: 1px solid var(--overlayLine); font-size: 13px; white-space: nowrap; animation: pop 200ms var(--ease-out); }
            .drawer { position: absolute; left: 0; right: 0; bottom: 0; padding: 10px 22px 34px; border-radius: 28px 28px 0 0; background: var(--overlay); border-top: 1px solid var(--overlayLine); pointer-events: auto; animation: rise 240ms var(--ease-out); }
            .drawer .handle { width: 36px; height: 5px; margin: 0 auto 14px; border-radius: 999px; background: var(--handle); }
            .drawer-top { display: flex; align-items: center; gap: 14px; }
            .big-flame { display: grid; place-items: center; width: 64px; height: 64px; border-radius: 20px; background: var(--goldWash); color: var(--goldMark); flex: none; }
            .big-flame svg { width: 30px; height: 30px; stroke-width: 2; }
            .drawer-top b { display: block; font-size: 30px; font-weight: 800; line-height: 1.05; }
            .drawer-top small { display: block; font-size: 13px; color: var(--textSecondary); margin-top: 2px; }
            .drawer .today-bar { display: grid; gap: 6px; margin-top: 18px; }
            .drawer .today-bar .split { font-size: 12px; color: var(--textSecondary); }
            .drawer .today-bar .split b { color: var(--text); }
            .drawer .bar { height: 8px; }
            .fourteen { display: grid; grid-template-columns: repeat(14, 1fr); gap: 4px; margin-top: 18px; }
            .fourteen i { aspect-ratio: 1; border-radius: 6px; background: var(--chip); display: grid; place-items: center; color: var(--goldInk); }
            .fourteen i.hit { background: var(--goldMark); }
            .fourteen i svg { width: 11px; height: 11px; stroke-width: 2.2; }
            .fourteen i.today { background: conic-gradient(var(--goldMark) calc(var(--p) * 1turn), var(--chip) 0); }
            .fourteen i.today::after { content: ""; width: 60%; height: 60%; border-radius: 4px; background: var(--overlay); grid-area: 1 / 1; }
            .fourteen-label { display: flex; justify-content: space-between; margin-top: 6px; font-size: 11px; color: var(--textFaint); }
            .facts { display: grid; grid-template-columns: 1fr 1fr; margin-top: 18px; border: 1px solid var(--overlayLine); border-radius: 16px; }
            .facts div { padding: 12px 14px; }
            .facts div + div { border-left: 1px solid var(--overlayLine); }
            .facts b { display: block; font-size: 18px; font-weight: 800; }
            .facts small { font-size: 12px; color: var(--textSecondary); }
            .facts .when { margin-left: 8px; font-size: 12px; font-weight: 700; letter-spacing: 0; color: var(--textSecondary); white-space: nowrap; }
            .drawer p { margin-top: 14px; font-size: 13px; color: var(--textSecondary); line-height: 1.45; }
            .drawer .done { display: block; width: 100%; min-height: 50px; margin-top: 16px; border-radius: 999px; background: var(--control); font-size: 14px; font-weight: 800; text-align: center; }

            /* Prototype controls. Never part of the design, never in the app. */
            .controls { position: fixed; z-index: 50; right: 16px; bottom: max(16px, env(safe-area-inset-bottom)); display: flex; gap: 4px; padding: 4px; border-radius: 999px; background: var(--overlay); border: 1px solid var(--overlayLine); }
            .controls button { min-height: 40px; padding: 0 14px; border-radius: 999px; font-size: 12px; font-weight: 800; color: var(--textSecondary); }
            .controls button:hover { color: var(--text); }
            @keyframes fade { from { opacity: 0; } }
            @keyframes pop { from { opacity: 0; transform: translateY(6px) scale(0.98); } }
            @keyframes rise { from { transform: translateY(100%); } }
            @media (prefers-reduced-motion: reduce) { .scrim, .psheet, .dialog, .popover, .toast, .drawer { animation: none !important; } .expand svg { transition: none; } }

                const names = ["Couch", "Warming up", "Moving", "Active", "Ripped"];
                const month = !isFriend ? "" : `<div class="card pad" style="display:grid;gap:10px">

                    <div class="legend">${names.map((name, index) => `<span><i class="l${index}"></i>${name} ${d.levels[index]}</span>`).join("")}</div></div>`;
                const rows = showAll ? d.together : d.together.slice(0, 5);
                const result = (row) => {
                    if (row.live) return `<span class="result ${row.gap >= 0 ? "moss" : "ember"}"><i class="live-dot"></i>${n(Math.abs(row.gap))} ${row.gap >= 0 ? "ahead" : "behind"}</span>`;
                    const color = { you: "moss", them: "ember", draw: "muted" }[row.outcome];
                    if (row.places) return `<span class="result ${color}">You ${ordinal(row.places[0])} · ${p.name} ${ordinal(row.places[1])}</span>`;
                    return `<span class="result ${color}">${{ you: "You won", them: `${p.name} won`, draw: "Draw" }[row.outcome]}</span>`;
                };
                const together = `<div class="sec"><h2>Fights together</h2></div>${d.together.length ? `<div class="card rows">${rows.map((row) => `<button type="button" class="rowi" ${row.live ? `data-open-fight="${row.live}"` : 'data-act="past"'}>
                        <span class="grow"><strong>${row.name}</strong><small>${row.detail} · ${row.live ? `ends ${shortDate(row.date)}` : shortDate(row.date)}</small></span>${result(row)}${chev}</button>`).join("")}
                    ${d.together.length > 5 ? `<button type="button" class="rowi more" data-act="all">${showAll ? "Show fewer" : `Show all ${d.together.length}`}</button>` : ""}</div>` : `<div class="caption">No Fights together yet.</div>`}`;
                return `${card}${ask}${against}${month}${together}<div class="foot-actions">Report profile</div>`;
            }

            function openProfile(id) {
                profileId = id;
                showAll = false;
                expanded = false;
                sheetHost.innerHTML = `<div class="sheet-wrap"><div class="scrim" data-act="close-profile"></div><div class="psheet" role="dialog" aria-label="Profile">
                    <div class="grabber"></div><div class="sheet-head"><h1>Profile</h1><button type="button" data-act="close-profile">Close</button></div>
                    <div class="sheet-body" id="sheet-body"></div></div></div>`;
                drawProfile(false);
            }

            function drawProfile(keepScroll) {
                const body = document.getElementById("sheet-body");
                const top = body.scrollTop;
                body.innerHTML = profile(profileId);
                body.scrollTop = keepScroll ? top : 0;
            }

            function closeProfile() {
                sheetHost.innerHTML = "";
                profileId = null;
            }

            function setFriendship(state, message) {
                const person = PEOPLE[profileId];
                person.friendship = state;
                if (state === "friends" && !person.friendsSince) person.friendsSince = "2026-10-15";
                if (state !== "friends") person.friendsSince = null;
                drawProfile(true);
                if (message) toast(message);
            }

            function confirmAction(title, detail, action, onConfirm, keep) {
                closeLayer();
                layer.insertAdjacentHTML("afterbegin", `<div class="scrim"><div class="dialog"><p><strong>${title}</strong>${detail}</p>
                    <button type="button" class="destructive" data-dialog="confirm">${action}</button></div>
                    <div class="dialog"><button type="button" data-dialog="dismiss">${keep}</button></div></div>`);
                layer.onclick = (event) => {
                    const button = event.target.closest("button[data-dialog]");
                    if (!button && !event.target.classList.contains("scrim")) return;
                    closeLayer();
                    if (button?.dataset.dialog === "confirm") onConfirm();
                };
            }

            function theirStreakPopover(anchor) {
                const d = derive(profileId);
                const phone = layer.getBoundingClientRect();
                const box = anchor.getBoundingClientRect();
                closeLayer();
                layer.insertAdjacentHTML("afterbegin", `<div class="scrim clear"></div><div class="popover" role="dialog" style="top:${box.bottom - phone.top + 12}px;right:${phone.right - box.right - 6}px">
                    <strong>${flame}${d.streak}-day 10K streak</strong>
                    <p>${d.person.name} has walked 10,000 steps or more ${d.streak} days in a row. A day under 10,000 starts it over.</p>
                    <button type="button">Got it</button></div>`);
                layer.onclick = (event) => { if (event.target.closest("button") || event.target.classList.contains("scrim")) closeLayer(); };
            }

            // ─── Navigation ─────────────────────────────────────────────────

            function draw() {
                screen.innerHTML = route.screen === "home" ? home() : fightScreen(route.fight);
                screen.scrollTop = 0;
            }

            function go(next) {
                route = next;
                closeProfile();
                closeLayer();
                draw();
            }

            document.querySelector(".phone").addEventListener("click", (event) => {
                const target = event.target.closest("[data-act], [data-fight], [data-person], [data-open-fight], [data-tab]");
                if (!target || layer.contains(target)) return;
                if (target.dataset.fight) return go({ screen: "fight", fight: target.dataset.fight });
                if (target.dataset.openFight) return go({ screen: "fight", fight: target.dataset.openFight });
                if (target.dataset.person) return target.dataset.person === "you" ? toast("Your own name opens your Profile tab") : openProfile(target.dataset.person);
                if (target.dataset.tab) return target.dataset.tab === "fights" ? go({ screen: "home" }) : toast("Only Fights is in this prototype");
                const act = target.dataset.act;
                const person = profileId && PEOPLE[profileId];
                if (act === "my-streak") openStreakDrawer();
                if (act === "hosted") toast("Your hosted rounds aren't in this prototype");
                if (act === "back") go({ screen: "home" });
                if (act === "close-profile") closeProfile();
                if (act === "add") setFriendship("outgoing", `Friend request sent to ${person.name}`);
                if (act === "accept") setFriendship("friends", `You and ${person.name} are friends`);
                if (act === "decline") setFriendship("none", "Request declined");
                if (act === "cancel") confirmAction(`Cancel your request to ${person.name}?`, "", "Cancel request", () => setFriendship("none", "Request cancelled"), "Keep request");
                if (act === "unfriend") confirmAction(`Remove ${person.name} as a friend?`, "You stop seeing each other's steps. Fights together and your record stay.", "Remove friend", () => setFriendship("none", `${person.name} removed from friends`), "Cancel");
                if (act === "their-streak") theirStreakPopover(target);
                if (act === "expand") { expanded = !expanded; drawProfile(true); }
                if (act === "all") { showAll = !showAll; drawProfile(true); }
                if (act === "past") toast("Past Fights aren't in this prototype");
            });

            const themeButton = document.getElementById("theme");
            const syncThemeLabel = () => { themeButton.textContent = document.documentElement.dataset.theme === "day" ? "Night" : "Day"; };
            themeButton.addEventListener("click", () => {
                const next = document.documentElement.dataset.theme === "day" ? "night" : "day";
                document.documentElement.dataset.theme = next;
                try { localStorage.setItem("fitfight-prototype.theme", next); } catch {}
                syncThemeLabel();
            });
            document.getElementById("restart").addEventListener("click", () => {
                Object.entries(START).forEach(([id, start]) => Object.assign(PEOPLE[id], start));
                go({ screen: "home" });
            });
            document.addEventListener("keydown", (event) => {
                if (event.key !== "Escape") return;
                if (layer.querySelector(".scrim")) closeLayer();
                else if (profileId) closeProfile();
            });
            syncThemeLabel();
            draw();
        </script>
    </body>
</html>
