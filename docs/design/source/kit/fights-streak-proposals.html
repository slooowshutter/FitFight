            :root { --goldMark: var(--gold); --goldWash: color-mix(in srgb, var(--gold) 14%, var(--card)); --ease-out: cubic-bezier(0.23, 1, 0.32, 1); }
            [data-theme="day"] { --goldMark: color-mix(in srgb, var(--gold) 70%, var(--goldInk)); --goldWash: color-mix(in srgb, var(--gold) 22%, var(--card)); }
            * { box-sizing: border-box; }
            html, body { margin: 0; min-height: 100%; }
            body { background: var(--canvas); color: var(--text); font: 700 13px/1.45 Nunito, -apple-system, sans-serif; -webkit-font-smoothing: antialiased; }
            button { font: inherit; color: inherit; background: none; border: 0; padding: 0; margin: 0; cursor: pointer; text-align: inherit; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
            button:focus-visible, .switcher:focus-visible { outline: 2px solid var(--text); outline-offset: 3px; }
            h1, h2, p { margin: 0; }
            img { display: block; }
            svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }
            [hidden] { display: none !important; }
            .num { font-variant-numeric: tabular-nums; letter-spacing: -0.03em; }
            .muted { color: var(--textSecondary); }
            .moss { color: var(--mossText); }
            .ember { color: var(--emberText); }
            .gold { color: var(--goldMark); }

            /* Phone */
            .stage { min-height: 100dvh; display: grid; place-items: center; padding: 24px 0; }
            .phone { position: relative; width: 393px; height: 852px; background: var(--bg); border: 1px solid var(--line); border-radius: 44px; overflow: hidden; display: flex; flex-direction: column; }
            .status { flex: none; height: 50px; padding: 17px 32px 0; display: flex; justify-content: space-between; font-size: 15px; font-weight: 800; }
            .status span { display: flex; gap: 6px; align-items: center; }
            .status svg { width: 17px; height: 17px; }
            .screen { flex: 1; overflow-y: auto; overscroll-behavior: contain; padding: 6px 20px 120px; scrollbar-width: none; }
            .screen::-webkit-scrollbar { display: none; }
            .screen > * + * { margin-top: 12px; }
            .tabbar { position: absolute; z-index: 10; left: 0; right: 0; bottom: 0; display: grid; grid-template-columns: repeat(5, 1fr); padding: 8px 10px 26px; background: var(--tabBar); border-top: 1px solid var(--tabBarLine); -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px); }
            .tab { display: flex; flex-direction: column; align-items: center; gap: 4px; color: var(--tabInkOff); font-size: 11px; }
            .tab .glyph { display: grid; place-items: center; width: 32px; height: 32px; border-radius: 9px; }
            .tab[aria-current] { color: var(--tabInkOn); font-weight: 800; }
            .tab[aria-current] .glyph { background: var(--tabPillOn); }

            /* Fights header, as CompanionIntroduction draws it */
            .hero { display: grid; grid-template-columns: 1fr 142px; gap: 8px; align-items: start; }
            .hero-copy { display: grid; gap: 12px; align-content: start; }
            .hero h1 { font-size: 26px; font-weight: 800; letter-spacing: -0.025em; line-height: 1.15; }
            .tagline { font-size: 16px; font-weight: 800; line-height: 1.3; }
            .today b { display: block; font-size: 34px; font-weight: 800; line-height: 1.05; }
            .today small { display: block; font-size: 12px; color: var(--textSecondary); margin-top: 3px; }
            .character { position: relative; width: 142px; height: 156px; }
            .character img { width: 100%; height: 100%; object-fit: contain; object-position: bottom; }

            /* Challenges */
            .ch-head { display: flex; align-items: center; justify-content: space-between; padding-top: 6px; }
            .ch-head b { font-size: 14px; font-weight: 800; }
            .ch-head span { display: flex; align-items: center; gap: 5px; min-height: 44px; font-size: 13px; font-weight: 800; color: var(--mossText); }
            .ch-head svg { width: 15px; height: 15px; }
            .seg { display: grid; grid-template-columns: repeat(3, 1fr); padding: 3px; border-radius: 999px; background: var(--control); margin-top: 6px !important; }
            .seg span { display: grid; place-items: center; min-height: 34px; border-radius: 999px; font-size: 13px; font-weight: 800; color: var(--textSecondary); }
            .seg span.on { background: var(--card); color: var(--text); }
            .card { background: var(--card); border: 1px solid var(--hairline); border-radius: 22px; }
            .hosted { display: flex; align-items: center; gap: 13px; padding: 14px 16px; }
            .hosted .grow { flex: 1; }
            .hosted strong { display: block; font-size: 16px; font-weight: 800; }
            .hosted small { display: block; font-size: 12px; color: var(--textSecondary); }
            .chev { width: 15px; height: 15px; color: var(--textFaint); }
            .live { display: grid; gap: 6px; padding: 6px 16px 14px; }
            .live-top { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
            .live-top strong { font-size: 16px; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
            .live-top b { font-size: 22px; font-weight: 800; letter-spacing: -0.02em; }
            .who { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--textSecondary); }
            .stack { display: flex; }
            .stack span { width: 22px; height: 22px; margin-left: -12px; overflow: hidden; }
            .stack span:first-child { margin-left: 0; }
            .stack img { width: 22px; height: 40px; object-fit: cover; object-position: top; }
            .bar { height: 5px; border-radius: 999px; background: var(--track); overflow: hidden; margin-top: 2px; }
            .bar span { display: block; height: 100%; background: var(--gold); border-radius: inherit; }
            .meta { display: flex; justify-content: space-between; font-size: 12px; color: var(--textSecondary); }

            /* The streak pieces the five variants arrange differently */
            .flame-pill { display: inline-flex; align-items: center; gap: 3px; height: 24px; padding: 0 9px 0 7px; border-radius: 999px; background: var(--goldWash); color: var(--goldMark); font-size: 12px; font-weight: 800; position: relative; vertical-align: middle; }
            .flame-pill::before { content: ""; position: absolute; inset: -10px -6px; }
            .flame-pill svg { width: 13px; height: 13px; stroke-width: 2; }
            .flame-pill.off { background: var(--chip); color: var(--textSecondary); }
            .title-row { display: flex; align-items: center; gap: 10px; }

            /* Overlays inside the phone */
            .layer { position: absolute; inset: 0; z-index: 30; pointer-events: none; }
            .scrim { position: absolute; inset: 0; background: var(--scrim); pointer-events: auto; animation: fade 160ms var(--ease-out); }
            .sheet { position: absolute; left: 0; right: 0; bottom: 0; padding: 10px 22px 34px; border-radius: 28px 28px 0 0; background: var(--overlay); border-top: 1px solid var(--overlayLine); pointer-events: auto; animation: rise 240ms var(--ease-out); }
            .sheet .handle { width: 36px; height: 5px; margin: 0 auto 14px; border-radius: 999px; background: var(--handle); }
            .sheet-top { display: flex; align-items: center; gap: 14px; }
            .big-flame { display: grid; place-items: center; width: 64px; height: 64px; border-radius: 20px; background: var(--goldWash); color: var(--goldMark); flex: none; }
            .big-flame svg { width: 30px; height: 30px; stroke-width: 2; }
            .sheet-top b { display: block; font-size: 30px; font-weight: 800; line-height: 1.05; }
            .sheet-top small { display: block; font-size: 13px; color: var(--textSecondary); margin-top: 2px; }
            .sheet .today-bar { display: grid; gap: 6px; margin-top: 18px; }
            .sheet .today-bar .split { display: flex; justify-content: space-between; font-size: 12px; color: var(--textSecondary); }
            .sheet .today-bar .split b { color: var(--text); }
            .sheet .bar { height: 8px; margin: 0; }
            .sheet .fourteen { display: grid; grid-template-columns: repeat(14, 1fr); gap: 4px; margin-top: 18px; }
            .sheet .fourteen i { aspect-ratio: 1; border-radius: 6px; background: var(--chip); display: grid; place-items: center; color: var(--goldInk); }
            .sheet .fourteen i.hit { background: var(--goldMark); }
            .sheet .fourteen i svg { width: 11px; height: 11px; stroke-width: 2.2; }
            .sheet .fourteen i.today { background: conic-gradient(var(--goldMark) calc(var(--p) * 1turn), var(--chip) 0); }
            .sheet .fourteen i.today::after { content: ""; width: 60%; height: 60%; border-radius: 4px; background: var(--overlay); grid-area: 1 / 1; }
            .sheet .fourteen-label { display: flex; justify-content: space-between; margin-top: 6px; font-size: 11px; color: var(--textFaint); }
            .sheet .facts { display: grid; grid-template-columns: 1fr 1fr; margin-top: 18px; border: 1px solid var(--overlayLine); border-radius: 16px; }
            .sheet .facts div { padding: 12px 14px; }
            .sheet .facts div + div { border-left: 1px solid var(--overlayLine); }
            .sheet .facts b { display: block; font-size: 18px; font-weight: 800; }
            .sheet .facts small { font-size: 12px; color: var(--textSecondary); }
            .sheet .facts .when { margin-left: 8px; font-size: 12px; font-weight: 700; letter-spacing: 0; color: var(--textSecondary); white-space: nowrap; }
            .sheet p { margin-top: 14px; font-size: 13px; color: var(--textSecondary); line-height: 1.45; }
            .sheet .done { display: block; width: 100%; min-height: 50px; margin-top: 16px; border-radius: 999px; background: var(--control); font-size: 14px; font-weight: 800; text-align: center; }

            /* Variant switcher. Never part of the design, never in the app. */
            .switcher { position: fixed; z-index: 50; right: 16px; bottom: max(16px, env(safe-area-inset-bottom)); border-radius: 22px; background: var(--overlay); border: 1px solid var(--overlayLine); touch-action: none; -webkit-user-select: none; user-select: none; animation: fade 200ms var(--ease-out); }
            .switcher.dragging { cursor: grabbing; }
            .switcher-trigger { display: grid; grid-template-columns: 44px 112px 44px; width: 200px; align-items: center; }
            .switcher-trigger > button { display: grid; place-items: center; min-height: 48px; }
            .switcher-trigger svg { width: 18px; height: 18px; }
            .switcher .name { min-width: 0; line-height: 1.15; text-align: center; }
            .switcher .name small, .switcher .name strong { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
            .switcher .name small { font-size: 10px; color: var(--textSecondary); }
            .switcher .name strong { font-size: 14px; }
            .switcher-menu { position: absolute; right: 0; bottom: calc(100% + 10px); width: min(330px, calc(100vw - 24px)); max-height: min(600px, 75dvh); overflow-y: auto; padding: 8px; border-radius: 22px; background: var(--overlay); border: 1px solid var(--overlayLine); touch-action: pan-y; animation: pop 180ms var(--ease-out); }
            .switcher-menu.below { top: calc(100% + 10px); bottom: auto; }
            .switcher-menu.left { right: auto; left: 0; }
            .switcher-menu .intro { padding: 8px 10px 4px; font-size: 12px; color: var(--textSecondary); }
            .pick { display: grid; grid-template-columns: repeat(3, 1fr); padding: 3px; margin: 6px 4px; border-radius: 999px; background: var(--control); }
            .pick.two { grid-template-columns: 1fr 1fr; }
            .pick button { min-height: 36px; border-radius: 999px; font-size: 12px; font-weight: 800; text-align: center; color: var(--textSecondary); }
            .pick button[aria-pressed="true"] { background: var(--card); color: var(--text); }
            .option { display: grid; grid-template-columns: 26px 1fr 20px; gap: 8px; align-items: center; width: 100%; padding: 11px 8px; border-radius: 15px; }
            .option[aria-pressed="true"] { background: var(--mossWash); }
            .option .n { font-size: 12px; font-weight: 800; color: var(--textSecondary); text-align: center; }
            .option strong { display: block; font-size: 14px; font-weight: 800; }
            .option small { display: block; font-size: 12px; color: var(--textSecondary); line-height: 1.35; margin-top: 2px; }
            .option svg { width: 17px; height: 17px; color: var(--mossText); }
            @keyframes fade { from { opacity: 0; } }
            @keyframes pop { from { opacity: 0; transform: translateY(6px) scale(0.98); } }
            @keyframes rise { from { transform: translateY(100%); } }
            @media (prefers-reduced-motion: reduce) { .switcher, .switcher-menu, .scrim, .sheet { animation: none; } }
        </style>
    </head>

            // The last 13 finished days, oldest first. Today is drawn separately because it only counts once it passes 10,000.
            const STATES = {
                going: { label: "Streak going", today: 6120, days: [8120, 10450, 11800, 9200, 10010, 12400, 7600, 6400, 9100, 10300, 11240, 12980, 10570] },
                done: { label: "Done today", today: 10840, days: [8120, 10450, 11800, 9200, 10010, 12400, 7600, 6400, 9100, 10300, 11240, 12980, 10570] },
                none: { label: "No streak", today: 3450, days: [8120, 10450, 11800, 9200, 10010, 12400, 7600, 6400, 9100, 10300, 11240, 12980, 8570] },
            };
            // Your best run, from all your Apple Health history. Only you see its dates; friends see the number.
            const BEST = { days: 12, when: "3 to 14 Jun 2024" };

            function streakOf(state) {
                const run = state.days.length - 1 - state.days.findLastIndex((value) => value < GOAL);
                return run + (state.today >= GOAL ? 1 : 0);
            }

            const s = () => STATES[stateId];
            const streak = () => streakOf(s());
            const toGo = () => Math.max(0, GOAL - s().today);
            const pill = () => streak()
                ? `<button type="button" class="flame-pill" data-act="streak" aria-label="${streak()}-day 10K streak">${flame}<b class="num">${streak()}</b></button>`
                : `<button type="button" class="flame-pill off" data-act="streak" aria-label="No 10K streak yet">${flame}<b class="num">0</b></button>`;

            // ─── The same Fights home under every variant ───────────────────

            const PEOPLE = { you: ART.badger, fox: ART.fox, bear: ART.bear, otter: ART.otter, rabbit: ART.rabbit };
            const stack = (names) => `<span class="stack">${names.map((name) => `<span><img src="${PEOPLE[name]}" alt=""></span>`).join("")}</span>`;
            const FIGHTS = [
                { name: "Office step-off", gap: "+1,240", tone: "moss", people: ["you", "fox", "bear", "otter"], place: "1st of 5", progress: 0.4, day: "Day 3 of 7", left: "4 days left" },
                { name: "Weekend warriors", gap: "−2,860", tone: "ember", people: ["rabbit", "you", "fox"], place: "2nd of 3", progress: 0.86, day: "Day 6 of 7", left: "1 day left", soon: true },
                { name: "Rematch", gap: "Scheduled", tone: "", people: ["you", "bear"], place: "", progress: 0, day: "1 week", left: "Starts Mon" },
            ];

            function challenges() {
                return `<div class="ch-head"><b>Challenges</b><span>${sortIcon}Recently started</span></div>
                    <div class="seg"><span class="on">Current</span><span>Invited</span><span>Past</span></div>
                    <div class="card hosted"><div class="grow"><strong>Fight Marc</strong><small>Leading 2 of 3</small></div>${chev}</div>
                    ${FIGHTS.map((fight) => `<div class="card live">
                        <div class="live-top"><strong>${fight.name}</strong><b class="num ${fight.tone}">${fight.gap}</b></div>
                        <div class="who">${stack(fight.people)}${fight.place}</div>
                        <div class="bar"><span style="width:${fight.progress * 100}%"></span></div>
                        <div class="meta"><span>${fight.day}</span><span class="${fight.soon ? "ember" : ""}">${fight.left}</span></div>
                    </div>`).join("")}`;
            }

            const tagline = '<div class="tagline">A little further.<br><span class="moss">Together.</span></div>';
            const todaySteps = () => `<div class="today"><b class="num">${n(s().today)}</b><small>steps today</small></div>`;
            const character = () => `<div class="character"><img src="${ART.you}" alt=""></div>`;

            // ─── The streak next to the title ───────────────────────────────

            function nextToTitle() {
                return `<div class="hero"><div class="hero-copy"><div class="title-row"><h1>Fights</h1>${pill()}</div>${tagline}${todaySteps()}</div>${character()}</div>${challenges()}`;
            }

            const VARIANTS = [
                { id: "title", name: "Next to Fights", render: nextToTitle },
            ];

            // ─── Streak sheet: the same explanation from every variant ──────

            function openSheet() {
                const state = s();
                const fourteen = state.days.map((value) => `<i class="${value >= GOAL ? "hit" : ""}">${value >= GOAL ? flame : ""}</i>`).join("")
                    + `<i class="${state.today >= GOAL ? "hit" : "today"}" style="--p:${Math.min(1, state.today / GOAL)}">${state.today >= GOAL ? flame : ""}</i>`;
                const headline = streak() ? `${streak()} day${streak() === 1 ? "" : "s"}` : "No streak";
                const sub = !streak() ? `Walk 10,000 steps today to start one.`
                    : state.today >= GOAL ? `Today counts. ${streak()} days of 10,000+ in a row.`
                    : `Walk ${n(toGo())} more today to make it ${streak() + 1}.`;
                layer.innerHTML = `<div class="scrim" data-close></div><div class="sheet" role="dialog" aria-label="Your 10K streak">
                    <div class="handle"></div>
                    <div class="sheet-top"><span class="big-flame">${flame}</span><div><b class="num">${headline}</b><small>${sub}</small></div></div>
                    <div class="today-bar"><div class="split"><span>Today</span><span><b class="num">${n(state.today)}</b> / 10,000</span></div><div class="bar"><span style="width:${Math.min(1, state.today / GOAL) * 100}%"></span></div></div>
                    <div class="fourteen">${fourteen}</div>
                    <div class="fourteen-label"><span>2 weeks ago</span><span>Today</span></div>
                    <div class="facts"><div><b class="num">${streak()}</b><small>current streak</small></div><div><b class="num">${BEST.days}<span class="when">${BEST.when}</span></b><small>best streak</small></div></div>
                    <p>A day with 10,000 steps or more keeps it going; a day under starts it over. Today counts once you pass 10,000. Counted from all your Apple Health history, not only since you joined.</p>
                    <button type="button" class="done" data-close>Got it</button></div>`;
                layer.onclick = (event) => { if (event.target.closest("[data-close]")) { layer.innerHTML = ""; layer.onclick = null; } };
            }

            // ─── Variant switcher ───────────────────────────────────────────
            // The ui-variant-explorer picker in plain JS, since kit pages have no build step or framework.

            const FEATURE = "fitfight-fights-streak";
            const store = {
                get: (key) => { try { return localStorage.getItem(`${FEATURE}.${key}`); } catch { return null; } },
                set: (key, value) => { try { localStorage.setItem(`${FEATURE}.${key}`, value); } catch {} },
            };
            const screen = document.getElementById("screen");
            const layer = document.getElementById("layer");
            const switcher = document.getElementById("switcher");
            const menu = document.getElementById("switcher-menu");
            const nameButton = document.getElementById("name");
            const fromHash = VARIANTS.findIndex((variant) => variant.id === location.hash.slice(1));
            const STATE_IDS = Object.keys(STATES);
            let active = 0;
            let stateId = STATE_IDS.includes(location.hash.slice(1)) ? location.hash.slice(1) : "going";

            function draw() {
                screen.innerHTML = VARIANTS[active].render();
                nameButton.innerHTML = `<small>${VARIANTS[active].name}</small><strong>${s().label}</strong>`;
            }

            function select(index) {
                stateId = STATE_IDS[(index + STATE_IDS.length) % STATE_IDS.length];
                layer.innerHTML = "";
                draw();
                history.replaceState(null, "", `#${stateId}`);
                if (!menu.hidden) drawMenu();
            }

            screen.addEventListener("click", (event) => { if (event.target.closest("[data-act=streak]")) openSheet(); });

            function drawMenu() {
                const theme = document.documentElement.dataset.theme;
                menu.innerHTML = `<p class="intro">The streak next to Fights. Tap it to open your streak.</p>
                    <div class="pick">${STATE_IDS.map((id) => `<button type="button" data-state="${id}" aria-pressed="${id === stateId}">${STATES[id].label}</button>`).join("")}</div>
                    <div class="pick two"><button type="button" data-theme="night" aria-pressed="${theme === "night"}">Night</button><button type="button" data-theme="day" aria-pressed="${theme === "day"}">Day</button></div>`;
            }

            function setMenu(open) {
                menu.hidden = !open;
                nameButton.setAttribute("aria-expanded", String(open));
                if (!open) return;
                drawMenu();
                const box = switcher.getBoundingClientRect();
                menu.classList.toggle("below", box.top < window.innerHeight / 2);
                menu.classList.toggle("left", box.left + box.width / 2 < window.innerWidth / 2);
            }

            // Drag lives in a transform, not in re-rendered state; a 6px threshold keeps taps as taps.
            let offset = { x: 0, y: 0 };
            try { offset = { ...offset, ...JSON.parse(store.get("switcherPos") || "{}") }; } catch {}
            const place = () => { switcher.style.transform = `translate(${offset.x}px, ${offset.y}px)`; };
            function clampIntoView() {
                switcher.style.transform = "";
                const base = switcher.getBoundingClientRect();
                offset.x = Math.min(window.innerWidth - 8 - base.right, Math.max(8 - base.left, offset.x));
                offset.y = Math.min(window.innerHeight - 8 - base.bottom, Math.max(8 - base.top, offset.y));
                place();
            }
            let drag = null;
            let suppressClick = false;
            switcher.addEventListener("pointerdown", (event) => {
                if (event.target.closest(".switcher-menu")) return;
                drag = { id: event.pointerId, x: event.clientX, y: event.clientY, from: { ...offset }, moved: false };
            });
            window.addEventListener("pointermove", (event) => {
                if (!drag || event.pointerId !== drag.id) return;
                const dx = event.clientX - drag.x;
                const dy = event.clientY - drag.y;
                if (!drag.moved && Math.hypot(dx, dy) < 6) return;
                if (!drag.moved) { drag.moved = true; switcher.classList.add("dragging"); setMenu(false); }
                offset = { x: drag.from.x + dx, y: drag.from.y + dy };
                place();
            });
            window.addEventListener("pointerup", (event) => {
                if (!drag || event.pointerId !== drag.id) return;
                if (drag.moved) {
                    suppressClick = true;
                    switcher.classList.remove("dragging");
                    clampIntoView();
                    store.set("switcherPos", JSON.stringify(offset));
                }
                drag = null;
            });
            switcher.addEventListener("click", (event) => {
                if (suppressClick) { suppressClick = false; event.stopPropagation(); event.preventDefault(); }
            }, true);

            nameButton.addEventListener("click", () => setMenu(menu.hidden));
            document.getElementById("prev").addEventListener("click", () => select(STATE_IDS.indexOf(stateId) - 1));
            document.getElementById("next").addEventListener("click", () => select(STATE_IDS.indexOf(stateId) + 1));
            menu.addEventListener("click", (event) => {
                const button = event.target.closest("button");
                if (!button) return;
                if (button.dataset.state) {
                    select(STATE_IDS.indexOf(button.dataset.state));
                } else if (button.dataset.theme) {
                    document.documentElement.dataset.theme = button.dataset.theme;
                    store.set("theme", button.dataset.theme);
                    drawMenu();
                }
            });
            switcher.addEventListener("keydown", (event) => {
                if (event.key === "ArrowLeft") { event.preventDefault(); select(STATE_IDS.indexOf(stateId) - 1); }
                if (event.key === "ArrowRight") { event.preventDefault(); select(STATE_IDS.indexOf(stateId) + 1); }
            });
            document.addEventListener("keydown", (event) => {
                if (event.key !== "Escape") return;
                if (!menu.hidden) { setMenu(false); nameButton.focus(); }
                layer.innerHTML = "";
            });
            document.addEventListener("pointerdown", (event) => { if (!menu.hidden && !switcher.contains(event.target)) setMenu(false); });
            window.addEventListener("resize", clampIntoView);
            place();
            clampIntoView();
            select(STATE_IDS.indexOf(stateId));
        </script>
    </body>
</html>
