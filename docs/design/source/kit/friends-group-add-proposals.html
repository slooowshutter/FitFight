* { box-sizing: border-box; }
body { margin: 0; background: var(--canvas); color: var(--text); font-family: Nunito, -apple-system, sans-serif; font-weight: 700; -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
.lab { display: flex; flex-direction: column; align-items: center; gap: 14px; padding: 16px 8px 40px; }
.picker { width: 393px; max-width: 100%; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chips button { background: var(--card); border: 1px solid var(--hairline); border-radius: 999px; padding: 9px 14px; font-weight: 800; font-size: 14px; }
.chips button.on { background: var(--mossFill); border-color: var(--mossFill); color: var(--mossOn); }
.why { margin: 10px 2px 0; font-size: 14px; color: var(--textSecondary); line-height: 1.35; min-height: 38px; }
.why b { color: var(--text); }
.why .pick { display: inline-block; background: var(--mossWash); color: var(--mossText); border-radius: 999px; padding: 1px 8px; font-size: 11px; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; margin-left: 4px; vertical-align: 1px; }

.phone { width: 393px; height: 852px; border-radius: 48px; background: var(--bg); overflow: hidden; position: relative; border: 1px solid var(--hairline); flex: none; }
.status { height: 54px; display: flex; align-items: center; justify-content: space-between; padding: 6px 34px 0 40px; font-weight: 800; font-size: 16px; }
.status i { display: inline-block; width: 26px; height: 12px; border: 1.5px solid var(--text); border-radius: 4px; position: relative; opacity: 0.9; }
.status i::after { content: ""; position: absolute; inset: 1.5px 6px 1.5px 1.5px; background: var(--text); border-radius: 1.5px; }
.strip { height: 32px; display: flex; align-items: center; justify-content: center; gap: 6px; background: var(--emberWash); color: var(--emberText); font-size: 13px; font-weight: 800; }
.screen { position: absolute; top: 86px; left: 0; right: 0; bottom: 0; overflow-y: auto; scrollbar-width: none; }
.screen::-webkit-scrollbar { display: none; }

.nav { display: flex; align-items: flex-start; gap: 8px; padding: 0 20px 4px; position: sticky; top: 0; background: var(--bg); z-index: 2; }
.nav .back { width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; flex: none; }
.nav .t { flex: 1; min-height: 44px; display: flex; flex-direction: column; justify-content: center; gap: 3px; }
.nav .t b { font-size: 18px; font-weight: 800; }
.nav .t span { font-size: 12px; color: var(--textSecondary); }
.nav .act { height: 44px; display: flex; align-items: center; flex: none; }
.plus { width: 36px; height: 36px; border-radius: 50%; background: var(--mossFill); color: var(--mossOn); display: flex; align-items: center; justify-content: center; }
.pillbtn { display: inline-flex; align-items: center; gap: 6px; background: var(--mossFill); color: var(--mossOn); border-radius: 999px; padding: 9px 14px; font-size: 12px; font-weight: 800; }

.body { padding: 16px 20px 112px; display: flex; flex-direction: column; gap: 12px; }
.sec { display: flex; align-items: center; gap: 14px; font-size: 12px; font-weight: 800; letter-spacing: 0.16em; text-transform: uppercase; color: var(--mossText); }
.sec::after { content: ""; flex: 1; height: 1px; background: var(--track); }
.sec.gap { margin-top: 20px; }
.card { background: var(--card); border: 1px solid var(--hairline); border-radius: 22px; }
.live { padding: 6px 16px 14px; display: flex; flex-direction: column; gap: 6px; }
.live .r1 { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
.live .r1 b { font-size: 16px; font-weight: 800; letter-spacing: -0.01em; }
.live .r1 .gap { font-size: 22px; font-weight: 800; letter-spacing: -0.02em; }
.ahead { color: var(--mossText); } .behind { color: var(--emberText); }
.live .r2 { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--textSecondary); }
.stack { display: flex; } .stack .hb { margin-right: -12px; } .stack .hb:last-child { margin-right: 0; }
.hb { width: 22px; height: 22px; overflow: hidden; flex: none; }
.hb img { width: 35px; height: 40px; display: block; margin-left: -6.5px; }
.bar { height: 5px; border-radius: 3px; background: var(--track); overflow: hidden; margin-top: 2px; }
.bar i { display: block; height: 100%; background: var(--gold); border-radius: 3px; }
.live .r3 { display: flex; justify-content: space-between; font-size: 12px; color: var(--textSecondary); }
.done { padding: 14px 16px; display: flex; align-items: center; gap: 13px; }
.glyph { width: 24px; height: 24px; border-radius: 9px; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 800; flex: none; }
.glyph.w { background: rgba(53,128,79,0.24); color: var(--mossText); }
.glyph.l { background: rgba(194,85,29,0.22); color: var(--emberText); }
.done .who { flex: 1; } .done .who b { display: block; font-size: 15px; font-weight: 800; } .done .who span { font-size: 12px; color: var(--textSecondary); }
.done .stack .hb { width: 26px; height: 26px; } .done .stack .hb img { width: 41.6px; height: 47.3px; margin-left: -7.8px; }

.field { display: flex; align-items: center; gap: 10px; min-height: 50px; padding: 0 14px; background: var(--control); border-radius: 14px; color: var(--textSecondary); }
.field input { flex: 1; min-width: 0; background: none; border: 0; outline: none; color: var(--text); font: inherit; font-size: 13px; font-weight: 700; }
.field input::placeholder { color: var(--textTertiary); }
.field .find { color: var(--mossText); font-size: 13px; font-weight: 800; min-height: 44px; }
.lbl { font-size: 13px; font-weight: 800; color: var(--textSecondary); padding-top: 8px; }
.person { padding: 22px; display: flex; align-items: center; gap: 12px; }
.person img { width: 44px; height: 44px; object-fit: contain; flex: none; }
.person .who { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.person .who b { font-size: 13px; font-weight: 800; } .person .who span { font-size: 12px; color: var(--textSecondary); }
.small { border-radius: 999px; padding: 8px 15px; font-size: 12px; font-weight: 800; background: var(--mossFill); color: var(--mossOn); flex: none; }
.small.off { background: var(--disabledBg); color: var(--disabledText); box-shadow: inset 0 0 0 1px var(--disabledLine); }

.addrow { padding: 14px 16px; display: flex; align-items: center; gap: 13px; text-align: left; width: 100%; }
.addrow .ic { width: 44px; height: 44px; border-radius: 50%; background: var(--mossWash); color: var(--mossText); display: flex; align-items: center; justify-content: center; flex: none; }
.addrow .who { flex: 1; } .addrow .who b { display: block; font-size: 16px; font-weight: 800; } .addrow .who span { font-size: 12px; color: var(--textSecondary); }
.addrow .faces { display: flex; } .addrow .faces img { width: 30px; height: 34px; object-fit: contain; margin-left: -10px; }
.chev { color: var(--textFaint); flex: none; }

.tabbar { position: absolute; left: 0; right: 0; bottom: 0; padding: 8px 10px 26px; background: var(--tabBar); border-top: 1px solid var(--tabBarLine); display: flex; z-index: 3; }
.tabbar div { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 11px; color: var(--tabInkOff); }
.tabbar div svg { width: 32px; height: 32px; padding: 6px; border-radius: 9px; }
.tabbar .on { color: var(--tabInkOn); font-weight: 800; } .tabbar .on svg { background: var(--tabPillOn); }

.scrim { position: absolute; inset: 0; background: var(--scrim); opacity: 0; pointer-events: none; transition: opacity 0.25s; z-index: 4; }
.sheet { position: absolute; left: 0; right: 0; bottom: 0; top: 64px; background: var(--bg); border-radius: 28px 28px 0 0; transform: translateY(100%); transition: transform 0.32s cubic-bezier(0.16, 1, 0.3, 1); z-index: 5; display: flex; flex-direction: column; }
.phone.open .scrim { opacity: 1; pointer-events: auto; }
.phone.open .sheet { transform: none; }
.grab { width: 36px; height: 5px; border-radius: 3px; background: var(--handle); margin: 6px auto 0; flex: none; }
.sheet .head { display: flex; align-items: center; justify-content: space-between; padding: 12px 20px 0; flex: none; }
.sheet .head b { font-size: 26px; font-weight: 800; letter-spacing: -0.025em; }
.sheet .head button { color: var(--mossText); font-size: 13px; font-weight: 800; min-width: 44px; min-height: 44px; text-align: right; }
.sheet .scroll { overflow-y: auto; flex: 1; padding: 16px 20px 40px; display: flex; flex-direction: column; gap: 12px; scrollbar-width: none; }
.sheet .scroll::-webkit-scrollbar { display: none; }
</style>
</head>

const THIS_MONTH = [
  { name: 'Bertille', art: 'fox', gap: '+1,240', ahead: true, place: '1st of 2' },
  { name: 'Léa', art: 'rabbit', gap: '−860', ahead: false, place: '2nd of 2' },
  { name: 'Tom', art: 'turtle', gap: '+3,105', ahead: true, place: '1st of 2' },
];
const LAST_MONTH = [
  { name: 'Bertille', art: 'fox', won: true },
  { name: 'Léa', art: 'rabbit', won: false },
];
const SUGGESTED = [
  { name: 'Inès Martin', handle: 'ines', art: 'otter' },
  { name: 'Hugo Petit', handle: 'hugop', art: 'bear' },
  { name: 'Chloé Durand', handle: 'chloe.d', art: 'raccoon' },
  { name: 'Sam Lefèvre', handle: 'samwalks', art: 'dog' },
];
const OPTIONS = [
  { key: 'today', chip: 'Today', title: 'Today', why: 'What the app does now: Add friends, the search and every suggestion sit under your fights. Scroll down to see them.' },
  { key: 'plus', chip: 'A · Plus', title: 'A · Plus in the corner', pick: true, why: 'The same moss + that Feed and Feedback already use. Quietest, and nothing new to learn. Tap it.' },
  { key: 'words', chip: 'B · Words', title: 'B · "Add friends" button', why: 'Says what it does. Right if a bare + could be read as "new fight". Tap it.' },
  { key: 'row', chip: 'C · Row', title: 'C · One row on top', why: 'One tappable row above your fights, with the faces of people you could add. Right if suggestions should stay visible. Tap it.' },
];
let st = { opt: 'plus', asked: {}, found: null, query: '' };

const icon = {
  back: '<svg width="11" height="18" viewBox="0 0 11 18" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 2 2 9l7 7"/></svg>',
  plus: '<svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M8 2v12M2 8h12"/></svg>',
  personPlus: (s) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="9.5" cy="8" r="3.8"/><path d="M2.5 20a7 7 0 0 1 14 0M19 8v6M16 11h6"/></svg>`,
  search: '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m20 20-4.8-4.8"/></svg>',
  chev: '<svg class="chev" width="8" height="13" viewBox="0 0 8 13" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m1.5 1.5 5 5-5 5"/></svg>',
};
const hb = (a) => `<span class="hb"><img src="${ART[a]}" alt=""></span>`;

function liveCard(f, i) {
  const day = 17, len = 31;
  return `<div class="card live"><div class="r1"><b>${f.name}</b><span class="gap ${f.ahead ? 'ahead' : 'behind'}">${f.gap}</span></div>
    <div class="r2"><span class="stack">${hb('badger')}${hb(f.art)}</span>${f.place}</div>
    <div class="bar"><i style="width:${(day / len) * 100}%"></i></div>
    <div class="r3"><span>Day ${day} of ${len}</span><span>14 days left</span></div></div>`;
}
function doneRow(f) {
  return `<div class="card done"><span class="glyph ${f.won ? 'w' : 'l'}">${f.won ? 'W' : 'L'}</span>
    <div class="who"><b>${f.name}</b><span>1 Sep - 30 Sep</span></div><span class="stack">${hb('badger')}${hb(f.art)}</span></div>`;
}
function personRow(p) {
  const asked = st.asked[p.handle];
  return `<div class="card person"><img src="${ART[p.art]}" alt=""><div class="who"><b>${p.name}</b><span>@${p.handle}</span></div>
    ${asked ? '<span class="small off">Requested</span>' : `<button class="small" data-add="${p.handle}">Add</button>`}</div>`;
}
function addFriends() {
  return `<div class="field">${icon.search}<input id="q" placeholder="Add a friend by username" value="${st.query}" autocomplete="off" autocapitalize="off" spellcheck="false">${st.query ? '<button class="find" id="find">Find</button>' : ''}</div>
    ${st.found ? personRow(st.found) : ''}
    <div class="lbl">People you’ve fought with</div>
    ${SUGGESTED.map(personRow).join('')}`;
}

function render() {
  const o = st.opt;
  const action = o === 'plus' ? `<button class="plus" data-open aria-label="Add friends">${icon.plus}</button>`
    : o === 'words' ? `<button class="pillbtn" data-open>${icon.personPlus(14)}Add friends</button>` : '';
  const top = o === 'row' ? `<button class="card addrow" data-open><span class="ic">${icon.personPlus(20)}</span>
      <span class="who"><b>Add friends</b><span>${SUGGESTED.length} people you’ve fought with</span></span>
      <span class="faces">${SUGGESTED.slice(0, 3).map(p => `<img src="${ART[p.art]}" alt="">`).join('')}</span>${icon.chev}</button>` : '';
  const scrollTop = document.getElementById('screen').scrollTop;
  document.getElementById('screen').innerHTML = `
    <div class="nav"><button class="back" aria-label="Back">${icon.back}</button>
      <div class="t"><b>Friends</b><span>Leading 2 of 3</span></div>${action ? `<div class="act">${action}</div>` : ''}</div>
    <div class="body">
      ${top}
      <div class="sec${top ? ' gap' : ''}">This month</div>${THIS_MONTH.map(liveCard).join('')}
      <div class="sec gap">Last month</div>${LAST_MONTH.map(doneRow).join('')}
      ${o === 'today' ? `<div class="sec gap">Add friends</div>${addFriends()}` : ''}
    </div>`;
  document.getElementById('screen').scrollTop = scrollTop;
  document.getElementById('sheet').innerHTML = `<div class="grab"></div>
    <div class="head"><b>Add friends</b><button data-close>Close</button></div>
    <div class="scroll">${addFriends()}</div>`;
  const cur = OPTIONS.find(x => x.key === o);
  document.getElementById('chips').innerHTML = OPTIONS.map(x => `<button data-opt="${x.key}" class="${x.key === o ? 'on' : ''}">${x.chip}</button>`).join('');
  document.getElementById('why').innerHTML = `<b>${cur.title}</b>${cur.pick ? '<span class="pick">My pick</span>' : ''}<br>${cur.why}`;
  wire();
}
function wire() {
  document.querySelectorAll('[data-opt]').forEach(b => b.onclick = () => { st.opt = b.dataset.opt; document.getElementById('phone').classList.remove('open'); document.getElementById('screen').scrollTop = 0; render(); });
  document.querySelectorAll('[data-open]').forEach(b => b.onclick = () => document.getElementById('phone').classList.add('open'));
  document.querySelectorAll('[data-close], #scrim').forEach(b => b.onclick = () => document.getElementById('phone').classList.remove('open'));
  document.querySelectorAll('[data-add]').forEach(b => b.onclick = () => { st.asked[b.dataset.add] = true; render(); });
  document.querySelectorAll('#q').forEach(q => {
    q.oninput = () => { const had = !!st.query; st.query = q.value; if (had !== !!st.query) { render(); refocus(q); } };
    q.onkeydown = (e) => { if (e.key === 'Enter') find(); };
  });
  document.querySelectorAll('#find').forEach(b => b.onclick = find);
}
function refocus(prev) {
  const inSheet = !!prev.closest('.sheet');
  const q = document.querySelector(inSheet ? '.sheet #q' : '.screen #q');
  q.focus(); q.setSelectionRange(q.value.length, q.value.length);
}
function find() {
  const h = st.query.trim().replace(/^@/, '').toLowerCase();
  if (!h) return;
  st.found = { name: h.charAt(0).toUpperCase() + h.slice(1), handle: h, art: 'goat' };
  render();
}
document.getElementById('scrim').onclick = () => document.getElementById('phone').classList.remove('open');
function fit() { document.getElementById('phone').style.zoom = Math.min(1, (window.innerWidth - 16) / 395); }
addEventListener('resize', fit); fit();
render();
</script>
</body>
</html>
