* { box-sizing: border-box; }
html, body { margin: 0; }
body { font-family: "Nunito", -apple-system, system-ui, sans-serif; background: var(--canvas); color: var(--text); -webkit-font-smoothing: antialiased; font-variant-numeric: tabular-nums; }
button { font: inherit; color: inherit; }
main { max-width: 1480px; margin: 0 auto; padding: 18px 20px 40px; }
.top { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.kicker { font-size: 11px; font-weight: 800; letter-spacing: 0.14em; text-transform: uppercase; color: var(--moss-text); text-decoration: none; }
h1 { margin: 2px 0 0; font-size: 26px; font-weight: 800; letter-spacing: -0.02em; }
.nav { margin-left: auto; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.pill { border: 1px solid var(--line); background: var(--chip); color: var(--text); border-radius: 999px; padding: 8px 14px; font-size: 12px; font-weight: 800; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; }
.seg { display: inline-flex; padding: 3px; border-radius: 999px; background: var(--chip); border: 1px solid var(--hairline); }
.seg button { border: 0; background: transparent; padding: 6px 12px; border-radius: 999px; font-size: 12px; font-weight: 800; color: var(--text-secondary); cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--moss-fill); color: var(--moss-on); }
.lede { margin: 8px 0 14px; color: var(--text-secondary); font-size: 13px; font-weight: 700; line-height: 1.5; }
.filters { display: flex; flex-direction: column; gap: 8px; margin-bottom: 14px; }
.frow { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.frow .lab { font-size: 11px; font-weight: 800; letter-spacing: 0.1em; text-transform: uppercase; color: var(--text-tertiary); width: 58px; }
.chip { border: 1px solid var(--hairline); background: var(--chip); color: var(--text-secondary); border-radius: 999px; padding: 7px 12px; font-size: 12px; font-weight: 800; cursor: pointer; }
.chip[aria-pressed="true"] { background: var(--moss-fill); border-color: var(--moss-fill); color: var(--moss-on); }
.chip .n { opacity: 0.7; margin-left: 4px; }
select { height: 34px; padding: 0 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--card); color: var(--text); font: 800 12px "Nunito", sans-serif; }
.stage { display: grid; grid-template-columns: 44px 1fr 44px; gap: 10px; align-items: start; }
.arrow { position: sticky; top: 40vh; width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--line); background: var(--overlay); color: var(--text); display: grid; place-items: center; cursor: pointer; }
.arrow:disabled { opacity: 0.3; cursor: default; }
.strip { display: flex; gap: 16px; justify-content: center; min-width: 0; }
.card { flex: none; display: flex; flex-direction: column; gap: 10px; padding: 10px; border-radius: 26px; background: var(--card); border: 1px solid var(--hairline); cursor: pointer; }
.card.sel { border-color: var(--moss-edge); outline: 2px solid var(--moss-edge); outline-offset: 0; }
.frame { position: relative; overflow: hidden; border-radius: 20px; background: var(--bg); }
.frame iframe { position: absolute; left: 0; top: 0; width: 393px; height: 852px; border: 0; transform-origin: 0 0; pointer-events: none; }
.meta { display: flex; flex-direction: column; gap: 8px; cursor: default; }
.where { font-size: 11px; font-weight: 800; letter-spacing: 0.1em; text-transform: uppercase; color: var(--text-tertiary); }
.meta h3 { margin: 0; font-size: 16px; font-weight: 800; letter-spacing: -0.01em; }
.reacts { display: flex; flex-wrap: wrap; gap: 5px; }
.gx-chip { display: inline-flex; padding: 3px 9px; border-radius: 999px; font-size: 11px; font-weight: 800; background: var(--chip); color: var(--text-secondary); }
.gx-chip.keep { background: var(--moss-wash); color: var(--moss-text); }
.gx-chip.hide { background: var(--ember-wash); color: var(--ember-text); }
.acts { display: flex; gap: 6px; flex-wrap: wrap; }
.act { border: 1px solid var(--line); background: var(--chip); color: var(--text); border-radius: 999px; padding: 6px 11px; font-size: 12px; font-weight: 800; cursor: pointer; display: inline-flex; align-items: center; gap: 5px; }
.act[aria-pressed="true"].like { background: var(--moss-wash); border-color: var(--moss-edge); color: var(--moss-text); }
.act[aria-pressed="true"].dislike { background: var(--ember-wash); border-color: var(--ember-fill); color: var(--ember-text); }
.comments { display: flex; flex-direction: column; gap: 6px; max-height: 160px; overflow-y: auto; }
.comment { padding: 7px 10px; border-radius: 12px; background: var(--chip); font-size: 12px; font-weight: 700; line-height: 1.4; }
.comment b { font-weight: 800; }
.comment .ago { color: var(--text-faint); font-size: 10px; margin-left: 5px; }
.comment button { float: right; border: 0; background: none; color: var(--text-faint); font-size: 10px; font-weight: 800; cursor: pointer; }
form { display: flex; gap: 6px; }
form input { flex: 1; min-width: 0; height: 34px; padding: 0 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--bg); color: var(--text); font: 700 12px "Nunito", sans-serif; }
form input:focus { outline: 2px solid var(--moss-edge); }
.count { text-align: center; margin-top: 14px; font-size: 12px; font-weight: 800; color: var(--text-tertiary); }
.empty { max-width: 520px; margin: 40px auto; padding: 26px; border-radius: 22px; background: var(--card); border: 1px solid var(--hairline); text-align: center; color: var(--text-secondary); font-size: 14px; font-weight: 700; line-height: 1.5; }
.empty b { color: var(--text); display: block; font-size: 18px; margin-bottom: 6px; }
.foot { margin-top: 18px; font-size: 11px; font-weight: 700; color: var(--text-faint); text-align: center; }
kbd { font: 800 10px "Nunito", sans-serif; padding: 1px 5px; border-radius: 5px; border: 1px solid var(--line); color: var(--text-tertiary); }
@media (max-width: 640px) {
    main { padding: 12px 10px 30px; }
    .stage { grid-template-columns: 1fr; }
    .arrow { display: none; }
    .frow .lab { width: 100%; }
}

// Shared by every glow-up page: who is looking, likes / dislikes / comments, shortcuts, file sync.
// Truth: kit/glowup-state.json when glowup-serve.py runs (agents read it). Otherwise this browser's localStorage,
// with unsent changes queued and replayed the next time the server is reachable.
const GX = (() => {
    const preview = location.host === "htmlpreview.github.io";
    const ENDPOINT = preview ? null : location.protocol === "file:" ? "http://localhost:8765/glowup-state" : "/glowup-state";
    const get = (k, d) => { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } };
    const set = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} };

    const ACTIONS = [
        ["prev", "Previous option", "ArrowLeft"],
        ["next", "Next option", "ArrowRight"],
        ["prevPage", "Previous page", "ArrowUp"],
        ["nextPage", "Next page", "ArrowDown"],
        ["like", "Like", "l"],
        ["dislike", "Dislike (hides it for you)", "d"],
        ["comment", "Write a comment", "c"],
        ["open", "Open the selected favorite", "Enter"],
        ["theme", "Switch Night and Day", "t"],
        ["replay", "Replay the animation", "r"],
        ["favorites", "Go to Favorites", "f"],
        ["home", "Go to all pages", "h"],
        ["settings", "Go to Settings", "s"],
        ["help", "Show shortcuts", "?"],
    ];
    const keys = () => ({ ...Object.fromEntries(ACTIONS.map(([id, , k]) => [id, k])), ...get("glowup.keys", {}) });
    const keyLabel = (k) => ({ ArrowLeft: "←", ArrowRight: "→", ArrowUp: "↑", ArrowDown: "↓", Enter: "Enter", " ": "Space", Escape: "Esc" })[k] || (k || "").toUpperCase();
    const actionFor = (e) => {
        if (e.metaKey || e.ctrlKey || e.altKey || e.target.closest?.("input, textarea, select, [contenteditable]")) return null;
        const pressed = e.key.toLowerCase();
        const map = keys();
        return Object.keys(map).find((a) => (map[a] || "").toLowerCase() === pressed) || null;
    };

    const who = () => get("glowup.who", "") || "Marc";
    const hasName = () => !!get("glowup.who", "");
    const setWho = (name) => {
        const clean = String(name).replace(/[\u0000-\u001f]/g, "").trim().slice(0, 24);
        if (clean) set("glowup.who", clean);
        return clean;
    };

    let state = { choices: {}, comments: {} };
    let synced = false;
    let status = () => {};
    // Version 1 files were { page: { option: "keep" | "hide" } } with no names.
    const normalize = (raw) => {
        if (raw && (raw.choices || raw.comments)) return { choices: raw.choices || {}, comments: raw.comments || {} };
        const choices = {};
        for (const [page, map] of Object.entries(raw || {})) for (const [id, v] of Object.entries(map || {})) ((choices[page] ||= {})[id] ||= {}).Marc = v;
        return { choices, comments: {} };
    };
    // Same rules as apply() in glowup-serve.py.
    const apply = (s, op) => {
        if (op.op === "choice") {
            const byWho = ((s.choices[op.page] ||= {})[op.id] ||= {});
            if (op.value) byWho[op.who] = op.value;
            else delete byWho[op.who];
            if (!Object.keys(byWho).length) delete s.choices[op.page][op.id];
            if (!Object.keys(s.choices[op.page]).length) delete s.choices[op.page];
        } else if (op.op === "comment") {
            ((s.comments[op.page] ||= {})[op.id] ||= []).push({ who: op.who, text: op.text, at: op.at });
        } else if (op.op === "uncomment") {
            const left = ((s.comments[op.page] || {})[op.id] || []).filter((c) => !(c.at === op.at && c.who === op.who));
            if (left.length) s.comments[op.page][op.id] = left;
            else if (s.comments[op.page]) {
                delete s.comments[op.page][op.id];
                if (!Object.keys(s.comments[op.page]).length) delete s.comments[op.page];
            }
        }
        return s;
    };
    const statusText = () => synced ? "Saved to glowup-state.json, shared with everyone using the server."
        : ENDPOINT ? "Saved in this browser only. Start glowup-serve.py to share and sync." : "Saved in this browser only.";
    const queue = (op) => set("glowup.pending", [...get("glowup.pending", []), op]);
    const post = (op) => fetch(ENDPOINT, { method: "POST", headers: { "Content-Type": "text/plain" }, body: JSON.stringify(op) })
        .then((r) => { if (!r.ok) throw new Error("refused"); return r.json(); });
    const send = async (op) => {
        apply(state, op);
        set("glowup.state", state);
        if (!synced) { queue(op); return status(statusText()); }
        try {
            await post(op);
            status(statusText());
        } catch {
            synced = false;
            queue(op);
            status("Server not reachable. Saved in this browser; it syncs next time.");
        }
    };
    const load = async ({ remote = true } = {}) => {
        state = normalize(get("glowup.state", null));
        if (!get("glowup.migrated", false)) {
            // Keep / Hide from the first version lived in per-page keys.
            for (const p of typeof GX_PAGES === "undefined" ? [] : GX_PAGES) {
                const old = get(`glowup-${p.id}.status`, null) || Object.fromEntries(get(`glowup-${p.id}.picks`, []).map((id) => [id, "keep"]));
                for (const [id, value] of Object.entries(old)) {
                    const op = { op: "choice", page: p.id, id, who: who(), value };
                    apply(state, op);
                    queue(op);
                }
                try { localStorage.removeItem(`glowup-${p.id}.status`); localStorage.removeItem(`glowup-${p.id}.picks`); } catch {}
            }
            set("glowup.migrated", true);
        }
        if (remote) {
            try {
                if (ENDPOINT) {
                    const r = await fetch(ENDPOINT, { cache: "no-store" });
                    if (r.ok) {
                        state = normalize(await r.json());
                        synced = true;
                        const pending = get("glowup.pending", []);
                        set("glowup.pending", []);
                        for (const op of pending) await send(op);
                    }
                } else if (preview && !Object.keys(state.choices).length && !Object.keys(state.comments).length) {
                    const r = await fetch(location.search.slice(1).replace(/[^/]+\.html.*$/, "glowup-state.json"), { cache: "no-store" });
                    if (r.ok) state = normalize(await r.json());
                }
            } catch {}
        }
        set("glowup.state", state);
        status(statusText());
        return state;
    };

    const choice = (page, id, w = who()) => state.choices[page]?.[id]?.[w] || null;
    const reactions = (page, id) => state.choices[page]?.[id] || {};
    const comments = (page, id) => state.comments[page]?.[id] || [];
    const people = () => [...new Set([
        who(),
        ...Object.values(state.choices).flatMap((o) => Object.values(o).flatMap((r) => Object.keys(r))),
        ...Object.values(state.comments).flatMap((o) => Object.values(o).flatMap((l) => l.map((c) => c.who))),
    ])];
    const toggle = (page, id, value) => send({ op: "choice", page, id, who: who(), value: choice(page, id) === value ? null : value });
    const comment = (page, id, text) => send({ op: "comment", page, id, who: who(), text: String(text).trim().slice(0, 2000), at: new Date().toISOString() });
    const uncomment = (page, id, at) => send({ op: "uncomment", page, id, who: who(), at });
    // htmlpreview sets <base> to the raw file, so preview links must be absolute or they open raw text.
    const fileHref = (file) => preview && location.search.length > 1 ? location.origin + location.pathname + "?" + location.search.slice(1).replace(/[^/]+\.html.*$/, file) : file;
    const open = (file) => { location.href = fileHref(file); };
    const ago = (iso) => {
        const s = (Date.now() - Date.parse(iso)) / 1000;
        return s < 60 ? "now" : s < 3600 ? `${Math.floor(s / 60)} min` : s < 86400 ? `${Math.floor(s / 3600)} h` : `${Math.floor(s / 86400)} d`;
    };
    const escHtml = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
    // Reaction chips for everyone except `except`: "Chloé likes", "Marc disliked".
    const reactionChips = (page, id, except) => Object.entries(reactions(page, id)).filter(([w]) => w !== except)
        .map(([w, v]) => `<span class="gx-chip ${v}">${escHtml(w)} ${v === "keep" ? "likes it" : "disliked it"}</span>`).join("");

    return {
        ACTIONS, keys, keyLabel, actionFor, who, hasName, setWho, load, send, choice, reactions, comments, people,
        toggle, comment, uncomment, fileHref, open, ago, reactionChips, statusText, get, set,
        onStatus: (fn) => { status = fn; },
        get state() { return state; },
        get synced() { return synced; },
        endpoint: ENDPOINT,
    };
})();

    };
    const inArea = (it, a) => a === "all" || it.group === a || it.page === a;
    const items = () => ALL.filter((it) => test(it, whose) && inArea(it, where));

    const renderFilters = () => {
        const me = GX.who(), others = GX.people().filter((p) => p !== me);
        const opts = [["mine", `My likes`], ...others.map((p) => [`person:${p}`, `${p}'s likes`]), ["everyone", "Everyone"], ...(others.length ? [["agree", "We agree"], ["disagree", "We disagree"]] : []), ["commented", "Commented"], ["mydislikes", "My dislikes"]];
        if (!opts.some(([v]) => v === whose)) whose = "mine";
        const n = (w) => ALL.filter((it) => test(it, w) && inArea(it, where)).length;
        $("whose").innerHTML = `<span class="lab">Whose</span>` + opts.map(([v, label]) => `<button type="button" class="chip" data-whose="${esc(v)}" aria-pressed="${v === whose}">${esc(label)}<span class="n">${n(v)}</span></button>`).join("");
        const groups = [...new Set(GX_PAGES.map((p) => p.group))];
        const m = (a) => ALL.filter((it) => test(it, whose) && inArea(it, a)).length;
        $("where").innerHTML = `<span class="lab">Where</span>` + [["all", "All areas"], ...groups.map((g) => [g, g])].map(([v, label]) => `<button type="button" class="chip" data-where="${esc(v)}" aria-pressed="${v === where}">${esc(label)}<span class="n">${m(v)}</span></button>`).join("")
            + `<select id="page-pick" aria-label="One page"><option value="">One page...</option>${GX_PAGES.map((p) => `<option value="${p.id}" ${where === p.id ? "selected" : ""}>${esc(p.title)} (${m(p.id)})</option>`).join("")}</select>`;
        $("page-pick").addEventListener("change", (e) => setWhere(e.target.value || "all"));
    };
    const areas = () => ["all", ...new Set(GX_PAGES.map((p) => p.group))];
    const setWhose = (w) => { whose = w; GX.set("glowup.fav.whose", w); sel = 0; start = 0; renderAll(); };
    const setWhere = (a) => { where = a; GX.set("glowup.fav.where", a); sel = 0; start = 0; renderAll(); };
    $("whose").addEventListener("click", (e) => { const b = e.target.closest("[data-whose]"); if (b) setWhose(b.dataset.whose); });
    $("where").addEventListener("click", (e) => { const b = e.target.closest("[data-where]"); if (b) setWhere(b.dataset.where); });

    // How many phones fit side by side, and how big.
    const layout = () => {
        const narrow = window.innerWidth <= 640;
        const stripW = $("strip").clientWidth || window.innerWidth - 120;
        let s = Math.max(0.42, Math.min(0.72, (window.innerHeight - 330) / 852));
        if (narrow) s = Math.min(1, (stripW - 22) / 393);
        const cardW = 393 * s + 22;
        const n = narrow ? 1 : Math.max(1, Math.floor((stripW + 16) / (cardW + 16)));
        return { s, n };
    };
    const metaHtml = (it) => {
        const me = GX.who(), c = GX.choice(it.page, it.id);
        const mineChip = c ? `<span class="gx-chip ${c}">You ${c === "keep" ? "like it" : "disliked it"}</span>` : "";
        return `<div class="where">${esc(it.group)} · ${esc(it.pageTitle)}</div><h3>${esc(it.name)}</h3>
<div class="reacts">${mineChip}${GX.reactionChips(it.page, it.id, me)}</div>
<div class="acts"><button type="button" class="act like" data-act="keep" aria-pressed="${c === "keep"}">${c === "keep" ? "Liked" : "Like"}</button><button type="button" class="act dislike" data-act="hide" aria-pressed="${c === "hide"}">${c === "hide" ? "Undo dislike" : "Dislike"}</button><button type="button" class="act" data-act="open">Open full size</button></div>
<div class="comments">${GX.comments(it.page, it.id).map((x) => `<div class="comment"><b>${esc(x.who)}</b><span class="ago">${GX.ago(x.at)}</span>${x.who === me ? `<button type="button" data-at="${esc(x.at)}">Delete</button>` : ""}<div>${esc(x.text)}</div></div>`).join("")}</div>
<form><input maxlength="2000" placeholder="Comment as ${esc(me)}" aria-label="Comment" /></form>`;
    };
    let shown = [];
    const renderStrip = () => {
        const list = items(), { s, n } = layout();
        sel = Math.min(sel, Math.max(0, list.length - 1));
        if (sel < start) start = sel;
        if (sel >= start + n) start = sel - n + 1;
        start = Math.max(0, Math.min(start, Math.max(0, list.length - n)));
        shown = list.slice(start, start + n);
        if (!list.length) {
            const hint = whose === "mine" ? `Open any page and press ${GX.keyLabel(k.like)} (or tap Like) on the options you like. They collect here.` : "Nothing matches these filters yet.";
            $("strip").innerHTML = `<div class="empty"><b>No favorites here yet</b>${esc(hint)}</div>`;
            $("count").textContent = "";
            $("prev").disabled = $("next").disabled = true;
            return;
        }
        $("strip").innerHTML = shown.map((it, i) => `<div class="card ${start + i === sel ? "sel" : ""}" data-i="${start + i}" style="width:${393 * s + 22}px"><div class="frame" style="width:${393 * s}px;height:${852 * s}px" data-open="1"><iframe title="${esc(it.pageTitle)}: ${esc(it.name)}" loading="lazy" src="${GX.fileHref(`${it.page}-glowup.html`)}#v=${encodeURIComponent(it.id)}&embed=1&theme=${theme}" style="transform:scale(${s})"></iframe></div><div class="meta">${metaHtml(it)}</div></div>`).join("");
        $("count").textContent = `${sel + 1} of ${list.length}` + (n > 1 ? ` · showing ${start + 1} to ${start + shown.length}` : "");
        $("prev").disabled = sel === 0;
        $("next").disabled = sel === list.length - 1;
    };
    const renderMetas = () => document.querySelectorAll(".card").forEach((card) => {
        const it = items()[+card.dataset.i];
        if (it) card.querySelector(".meta").innerHTML = metaHtml(it);
    });
    const renderAll = () => {
        document.documentElement.setAttribute("data-theme", theme);
        document.querySelectorAll("[data-theme-set]").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.themeSet === theme)));
        renderFilters();
        renderStrip();
    };
    const move = (d) => {
        const list = items();
        if (!list.length) return;
        const next = Math.max(0, Math.min(list.length - 1, sel + d));
        if (next === sel) return;
        sel = next;
        const { n } = layout();
        if (sel < start || sel >= start + n) return renderStrip();
        document.querySelectorAll(".card").forEach((c) => c.classList.toggle("sel", +c.dataset.i === sel));
        $("count").textContent = `${sel + 1} of ${list.length}` + (n > 1 ? ` · showing ${start + 1} to ${start + shown.length}` : "");
        $("prev").disabled = sel === 0;
        $("next").disabled = sel === list.length - 1;
    };
    const current = () => items()[sel];
    const openItem = (it) => it && GX.open(`${it.page}-glowup.html#v=${encodeURIComponent(it.id)}`);
    // Liking or disliking can move an option out of the current filter, so the strip is rebuilt.
    const act = (it, value) => { GX.toggle(it.page, it.id, value); renderAll(); };

    $("prev").addEventListener("click", () => move(-1));
    $("next").addEventListener("click", () => move(1));
    $("strip").addEventListener("click", (e) => {
        const card = e.target.closest(".card");
        if (!card) return;
        const it = items()[+card.dataset.i];
        const a = e.target.closest("[data-act]");
        if (e.target.closest("[data-open]") || (a && a.dataset.act === "open")) return openItem(it);
        if (a) return act(it, a.dataset.act);
        const del = e.target.closest("[data-at]");
        if (del) { GX.uncomment(it.page, it.id, del.dataset.at); return renderMetas(); }
        if (+card.dataset.i !== sel && !e.target.closest("input")) move(+card.dataset.i - sel);
    });
    $("strip").addEventListener("submit", (e) => {
        e.preventDefault();
        const card = e.target.closest(".card"), input = e.target.querySelector("input");
        const it = items()[+card.dataset.i];
        if (!input.value.trim()) return;
        GX.comment(it.page, it.id, input.value);
        renderMetas();
        renderFilters();
    });
    document.querySelectorAll("[data-theme-set]").forEach((b) => b.addEventListener("click", () => { theme = b.dataset.themeSet; GX.set("glowup.theme", theme); renderAll(); }));
    document.addEventListener("keydown", (e) => {
        if (e.key === "Escape" && document.activeElement.matches("input")) return document.activeElement.blur();
        const a = GX.actionFor(e);
        const it = current();
        const run = {
            prev: () => move(-1), next: () => move(1),
            prevPage: () => setWhere(areas()[(areas().indexOf(where) - 1 + areas().length) % areas().length]),
            nextPage: () => setWhere(areas()[(areas().indexOf(where) + 1) % areas().length]),
            like: () => it && act(it, "keep"), dislike: () => it && act(it, "hide"),
            comment: () => document.querySelector(".card.sel input")?.focus(),
            open: () => openItem(it),
            theme: () => { theme = theme === "night" ? "day" : "night"; GX.set("glowup.theme", theme); renderAll(); },
            home: () => GX.open("glowup-index.html"), settings: () => GX.open("glowup-settings.html"),
            help: () => GX.open("glowup-settings.html"),
        }[a];
        if (!run) return;
        e.preventDefault();
        run();
    });
    let resizeT;
    window.addEventListener("resize", () => { clearTimeout(resizeT); resizeT = setTimeout(renderStrip, 150); });
    window.addEventListener("focus", () => GX.load().then(() => { renderFilters(); renderMetas(); }));
    GX.onStatus((t) => { $("sync").textContent = t; });
    GX.load().then(renderAll);
})();
        </script>
    </body>
</html>
