:root {
    --r-pill: 999px;
    --r-card: 22px;
    --r-field: 14px;
    --r-glyph: 9px;
    --r-shell: 28px;
    --s-xs: 4px;
    --s-sm: 8px;
    --s-md: 12px;
    --s-base: 16px;
    --s-lg: 20px;
    --s-xl: 26px;
    --s-screen-padding: 20px;
    --s-card-padding: 22px;
    --s-row-padding-x: 16px;
    --s-row-padding-y: 14px;
    --s-section-gap: 34px;
    --s-card-gap: 12px;
    --s-tab-bar-clearance: 112px;
}
.t-metric { font-size: 34px; font-weight: 800; letter-spacing: -0.03em; }
.t-title { font-size: 26px; font-weight: 800; letter-spacing: -0.025em; }
.t-heading { font-size: 16px; font-weight: 800; letter-spacing: -0.01em; }
.t-row-title { font-size: 15px; font-weight: 800; letter-spacing: -0.01em; }
.t-button { font-size: 14px; font-weight: 800; }
.t-button-large { font-size: 16px; font-weight: 800; letter-spacing: 0.01em; }
.t-button-small { font-size: 12px; font-weight: 800; }
.t-label { font-size: 13px; font-weight: 800; }
.t-body { font-size: 13px; font-weight: 700; }
.t-caption { font-size: 12px; font-weight: 700; }
.t-micro { font-size: 11px; font-weight: 700; }
.t-eyebrow { font-size: 12px; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; }
.t-section-eyebrow { font-size: 12px; font-weight: 800; letter-spacing: 0.16em; text-transform: uppercase; }
.t-tag { font-size: 10px; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; }

* { box-sizing: border-box; }
html, body { margin: 0; }
body { font-family: "Nunito", -apple-system, system-ui, sans-serif; background: var(--bg); color: var(--text); -webkit-font-smoothing: antialiased; font-variant-numeric: tabular-nums; }
main { max-width: 760px; margin: 0 auto; padding: 28px 18px 80px; }
.top { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.kicker { font-size: 11px; font-weight: 800; letter-spacing: 0.14em; text-transform: uppercase; color: var(--moss-text); }
h1 { margin: 6px 0 8px; font-size: 34px; font-weight: 800; letter-spacing: -0.03em; line-height: 1.05; }
.lede { margin: 0 0 22px; color: var(--text-secondary); font-size: 15px; font-weight: 700; line-height: 1.5; }
.seg { display: inline-flex; padding: 3px; border-radius: 999px; background: var(--chip); border: 1px solid var(--hairline); flex: none; }
.seg button { border: 0; background: transparent; padding: 6px 12px; border-radius: 999px; font: 800 12px "Nunito", sans-serif; color: var(--text-secondary); cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--moss-fill); color: var(--moss-on); }
.topnav { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; justify-content: flex-end; }
.navpill { border: 1px solid var(--line); background: var(--chip); color: var(--text); border-radius: 999px; padding: 7px 13px; font-size: 12px; font-weight: 800; text-decoration: none; }
.who { font-size: 13px; font-weight: 700; color: var(--text-secondary); margin: -12px 0 18px; }
.who a { color: var(--moss-text); font-weight: 800; text-decoration: none; }
.stats { display: flex; gap: 10px; margin: 0 0 26px; }
.stat { flex: 1; padding: 14px 16px; border-radius: 22px; background: var(--card); border: 1px solid var(--hairline); }
.stat b { display: block; font-size: 28px; font-weight: 800; letter-spacing: -0.03em; }
.stat span { font-size: 12px; font-weight: 700; color: var(--text-secondary); }
.picks { padding: 16px 18px; border-radius: 22px; background: var(--moss-wash); border: 1px solid var(--moss-edge); margin-bottom: 30px; }
.picks h2 { margin: 0 0 4px; font-size: 16px; font-weight: 800; }
.picks p { margin: 0 0 10px; font-size: 13px; font-weight: 700; color: var(--text-secondary); line-height: 1.45; }
.picks pre { margin: 0 0 12px; white-space: pre-wrap; font: 700 13px/1.5 "Nunito", sans-serif; color: var(--text); }
.btn { border: 0; border-radius: 999px; background: var(--moss-fill); color: var(--moss-on); font: 800 14px "Nunito", sans-serif; padding: 11px 18px; cursor: pointer; }
.btn.ghost { background: var(--chip); color: var(--text); border: 1px solid var(--line); }
section { margin-bottom: 30px; }
.eyebrow { display: flex; align-items: center; gap: 12px; font-size: 12px; font-weight: 800; letter-spacing: 0.16em; text-transform: uppercase; color: var(--moss-text); margin: 0 0 12px; }
.eyebrow::after { content: ""; flex: 1; height: 1px; background: var(--hairline); }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; }
a.card { display: flex; gap: 14px; align-items: stretch; text-decoration: none; color: inherit; padding: 12px; border-radius: 22px; background: var(--card); border: 1px solid var(--hairline); min-height: 44px; }
a.card:active { background: var(--control); }
.thumb { width: 74px; height: 160px; border-radius: 12px; overflow: hidden; flex: none; background: var(--control); border: 1px solid var(--hairline); }
.thumb img { width: 100%; height: 100%; object-fit: cover; object-position: top; display: block; }
.body { display: flex; flex-direction: column; min-width: 0; padding: 2px 0; }
.body h3 { margin: 0; font-size: 16px; font-weight: 800; letter-spacing: -0.01em; }
.count { font-size: 12px; font-weight: 800; color: var(--text-tertiary); margin-top: 2px; }
.blurb { font-size: 12px; font-weight: 700; color: var(--text-secondary); line-height: 1.4; margin-top: 8px; }
.start { margin-top: auto; padding-top: 10px; font-size: 12px; font-weight: 800; color: var(--moss-text); line-height: 1.35; }
.kept { display: inline-block; margin-left: 6px; padding: 2px 7px; border-radius: 999px; background: var(--moss-fill); color: var(--moss-on); font-size: 10px; font-weight: 800; vertical-align: 2px; }
.foot { color: var(--text-faint); font-size: 12px; font-weight: 700; line-height: 1.5; margin-top: 30px; }
        </style>

                </div>

// Shared by every glow-up page: who is looking, likes / dislikes / comments, shortcuts, file sync.
// Truth: kit/glowup-state.json when glowup-serve.py runs (agents read it). Otherwise this browser's localStorage,
// with unsent changes queued and replayed the next time the server is reachable.
const GX = (() => {
    const preview = location.host === "htmlpreview.github.io";
    const ENDPOINT = preview ? null : location.protocol === "file:" ? "http://localhost:8765/glowup-state" : "/glowup-state";
    const get = (k, d) => { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } };
    const set = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} };

    const ACTIONS = [
        ["prev", "Previous option", "ArrowLeft"],
        ["next", "Next option", "ArrowRight"],
        ["prevPage", "Previous page", "ArrowUp"],
        ["nextPage", "Next page", "ArrowDown"],
        ["like", "Like", "l"],
        ["dislike", "Dislike (hides it for you)", "d"],
        ["comment", "Write a comment", "c"],
        ["open", "Open the selected favorite", "Enter"],
        ["theme", "Switch Night and Day", "t"],
        ["replay", "Replay the animation", "r"],
        ["favorites", "Go to Favorites", "f"],
        ["home", "Go to all pages", "h"],
        ["settings", "Go to Settings", "s"],
        ["help", "Show shortcuts", "?"],
    ];
    const keys = () => ({ ...Object.fromEntries(ACTIONS.map(([id, , k]) => [id, k])), ...get("glowup.keys", {}) });
    const keyLabel = (k) => ({ ArrowLeft: "←", ArrowRight: "→", ArrowUp: "↑", ArrowDown: "↓", Enter: "Enter", " ": "Space", Escape: "Esc" })[k] || (k || "").toUpperCase();
    const actionFor = (e) => {
        if (e.metaKey || e.ctrlKey || e.altKey || e.target.closest?.("input, textarea, select, [contenteditable]")) return null;
        const pressed = e.key.toLowerCase();
        const map = keys();
        return Object.keys(map).find((a) => (map[a] || "").toLowerCase() === pressed) || null;
    };

    const who = () => get("glowup.who", "") || "Marc";
    const hasName = () => !!get("glowup.who", "");
    const setWho = (name) => {
        const clean = String(name).replace(/[\u0000-\u001f]/g, "").trim().slice(0, 24);
        if (clean) set("glowup.who", clean);
        return clean;
    };

    let state = { choices: {}, comments: {} };
    let synced = false;
    let status = () => {};
    // Version 1 files were { page: { option: "keep" | "hide" } } with no names.
    const normalize = (raw) => {
        if (raw && (raw.choices || raw.comments)) return { choices: raw.choices || {}, comments: raw.comments || {} };
        const choices = {};
        for (const [page, map] of Object.entries(raw || {})) for (const [id, v] of Object.entries(map || {})) ((choices[page] ||= {})[id] ||= {}).Marc = v;
        return { choices, comments: {} };
    };
    // Same rules as apply() in glowup-serve.py.
    const apply = (s, op) => {
        if (op.op === "choice") {
            const byWho = ((s.choices[op.page] ||= {})[op.id] ||= {});
            if (op.value) byWho[op.who] = op.value;
            else delete byWho[op.who];
            if (!Object.keys(byWho).length) delete s.choices[op.page][op.id];
            if (!Object.keys(s.choices[op.page]).length) delete s.choices[op.page];
        } else if (op.op === "comment") {
            ((s.comments[op.page] ||= {})[op.id] ||= []).push({ who: op.who, text: op.text, at: op.at });
        } else if (op.op === "uncomment") {
            const left = ((s.comments[op.page] || {})[op.id] || []).filter((c) => !(c.at === op.at && c.who === op.who));
            if (left.length) s.comments[op.page][op.id] = left;
            else if (s.comments[op.page]) {
                delete s.comments[op.page][op.id];
                if (!Object.keys(s.comments[op.page]).length) delete s.comments[op.page];
            }
        }
        return s;
    };
    const statusText = () => synced ? "Saved to glowup-state.json, shared with everyone using the server."
        : ENDPOINT ? "Saved in this browser only. Start glowup-serve.py to share and sync." : "Saved in this browser only.";
    const queue = (op) => set("glowup.pending", [...get("glowup.pending", []), op]);
    const post = (op) => fetch(ENDPOINT, { method: "POST", headers: { "Content-Type": "text/plain" }, body: JSON.stringify(op) })
        .then((r) => { if (!r.ok) throw new Error("refused"); return r.json(); });
    const send = async (op) => {
        apply(state, op);
        set("glowup.state", state);
        if (!synced) { queue(op); return status(statusText()); }

            await post(op);
            status(statusText());
        } catch {
            synced = false;
            queue(op);
            status("Server not reachable. Saved in this browser; it syncs next time.");
        }
    };
    const load = async ({ remote = true } = {}) => {
        state = normalize(get("glowup.state", null));

            for (const p of typeof GX_PAGES === "undefined" ? [] : GX_PAGES) {

    ])];

    const fileHref = (file) => preview && location.search.length > 1 ? location.origin + location.pathname + "?" + location.search.slice(1).replace(/[^/]+\.html.*$/, file) : file;
    const open = (file) => { location.href = fileHref(file); };
    const ago = (iso) => {
        const s = (Date.now() - Date.parse(iso)) / 1000;
        return s < 60 ? "now" : s < 3600 ? `${Math.floor(s / 60)} min` : s < 86400 ? `${Math.floor(s / 3600)} h` : `${Math.floor(s / 86400)} d`;
    };
    const escHtml = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
    // Reaction chips for everyone except `except`: "Chloé likes", "Marc disliked".
    const reactionChips = (page, id, except) => Object.entries(reactions(page, id)).filter(([w]) => w !== except)
        .map(([w, v]) => `<span class="gx-chip ${v}">${escHtml(w)} ${v === "keep" ? "likes it" : "disliked it"}</span>`).join("");

    return {
        ACTIONS, keys, keyLabel, actionFor, who, hasName, setWho, load, send, choice, reactions, comments, people,
        toggle, comment, uncomment, fileHref, open, ago, reactionChips, statusText, get, set,
        onStatus: (fn) => { status = fn; },
        get state() { return state; },
        get synced() { return synced; },
        endpoint: ENDPOINT,
    };
})();

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const setTheme = (t) => {
    document.documentElement.setAttribute("data-theme", t);
    document.querySelectorAll("[data-theme-set]").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.themeSet === t)));
    GX.set("glowup.theme", t);
};
document.querySelectorAll("[data-theme-set]").forEach((b) => b.addEventListener("click", () => setTheme(b.dataset.themeSet)));
setTheme(new URLSearchParams(location.hash.slice(1)).get("theme") || GX.get("glowup.theme", "night"));
for (const [id, file] of [["to-fav", "glowup-favorites.html"], ["to-set", "glowup-settings.html"]]) $(id).addEventListener("click", (e) => { e.preventDefault(); GX.open(file); });

const pages = DATA.sections.flatMap((s) => s.pages);
const total = pages.reduce((a, p) => a + p.count, 0);
$("lede").textContent = DATA.lede;
const render = () => {
    const me = GX.who();
    const mine = (p, v) => Object.entries(GX.state.choices[p.id] || {}).filter(([, r]) => r[me] === v).map(([id]) => id);
    const liked = pages.reduce((a, p) => a + mine(p, "keep").length, 0);
    const everyone = Object.values(GX.state.choices).flatMap((o) => Object.values(o)).filter((r) => Object.values(r).includes("keep")).length;
    const comments = Object.values(GX.state.comments).flatMap((o) => Object.values(o)).flat().length;
    $("who").innerHTML = `You are <b>${esc(me)}</b> · <a href="#" id="who-set">${GX.hasName() ? "change" : "set your name"}</a> · ${esc(GX.statusText())}`;
    $("who-set").addEventListener("click", (e) => { e.preventDefault(); GX.open("glowup-settings.html"); });
    $("stats").innerHTML = `<div class="stat"><b>${total}</b><span>options</span></div><div class="stat"><b>${liked}</b><span>you like</span></div><div class="stat"><b>${everyone}</b><span>liked by anyone</span></div><div class="stat"><b>${comments}</b><span>comments</span></div>`;
    const k = GX.keys();
    $("picks").innerHTML = `<h2>How to use this</h2><p>Open a page and flip options with ${esc(GX.keyLabel(k.prev))} ${esc(GX.keyLabel(k.next))} (the floating picker on a phone). ${esc(GX.keyLabel(k.like))} likes, ${esc(GX.keyLabel(k.dislike))} dislikes (it disappears for you, nothing is deleted), ${esc(GX.keyLabel(k.comment))} writes a comment, ${esc(GX.keyLabel(k.prevPage))} ${esc(GX.keyLabel(k.nextPage))} switch pages, ${esc(GX.keyLabel(k.help))} shows every shortcut. Favorites puts everything liked side by side, with filters for each person, where you agree or disagree, and by area. Your partner sets their own name in Settings on their phone.</p><button class="btn" type="button" id="go-fav">Open Favorites</button>`;
    $("go-fav").addEventListener("click", () => GX.open("glowup-favorites.html"));
    $("sections").innerHTML = DATA.sections.map((s) => `
<section><h2 class="eyebrow">${esc(s.title)}</h2><div class="grid">${s.pages.map((p) => {
        const kept = mine(p, "keep").length, hid = mine(p, "hide").length;
        return `<a class="card" href="${GX.fileHref(p.file)}"><div class="thumb">${p.thumb ? `<img src="${p.thumb}" alt="" loading="lazy">` : ""}</div><div class="body"><h3>${esc(p.title)}${kept ? `<span class="kept">${kept} liked</span>` : ""}</h3><div class="count">${p.count - hid} options${hid ? ` · ${hid} disliked` : ""}</div><div class="blurb">${esc(p.blurb)}</div>${p.start ? `<div class="start">Start with ${esc(p.start)}</div>` : ""}</div></a>`;
    }).join("")}</div></section>`).join("");
};
document.addEventListener("keydown", (e) => {
    const a = GX.actionFor(e);
    const run = { favorites: () => GX.open("glowup-favorites.html"), settings: () => GX.open("glowup-settings.html"), help: () => GX.open("glowup-settings.html"), theme: () => setTheme(document.documentElement.getAttribute("data-theme") === "night" ? "day" : "night") }[a];
    if (run) { e.preventDefault(); run(); }
});
GX.load().then(render);
window.addEventListener("pageshow", (e) => { if (e.persisted) GX.load().then(render); });
        </script>
    </body>
</html>
