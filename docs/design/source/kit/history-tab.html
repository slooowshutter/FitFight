            :root, [data-theme="night"] { --medalGold: #F6C450; --medalGoldWash: rgba(246,196,80,0.16); --medalSilver: #DDE2EA; --medalSilverWash: rgba(221,226,234,0.22); --medalBronze: #E0A06A; --medalBronzeWash: rgba(205,127,50,0.18); }
            [data-theme="day"] { --medalGold: #8A6200; --medalGoldWash: #FBF0D2; --medalSilver: #5E6470; --medalSilverWash: #ECEDEF; --medalBronze: #8F5323; --medalBronzeWash: #F6E6D7; }
            * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
            html, body { margin: 0; }
            body { background: var(--canvas); color: var(--text); font-family: Nunito, system-ui, sans-serif; font-weight: 700; -webkit-font-smoothing: antialiased; }
            button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; touch-action: manipulation; }

            .lab { display: grid; grid-template-columns: 1fr 340px; min-height: 100dvh; }
            .stage { display: flex; justify-content: center; align-items: flex-start; padding: 24px; }
            .panel { position: sticky; top: 0; height: 100dvh; overflow: auto; padding: 24px; background: var(--bg); border-left: 1px solid var(--line); }
            .panel h1 { margin: 0 0 6px; font-size: 22px; font-weight: 800; letter-spacing: -0.02em; }
            .panel p { margin: 0 0 18px; font-size: 13px; color: var(--textSecondary); line-height: 1.45; }
            .seg { display: flex; gap: 4px; padding: 3px; border-radius: 14px; background: var(--control); }
            .seg button { flex: 1; min-height: 38px; border-radius: 11px; font-size: 13px; font-weight: 800; color: var(--textSecondary); }
            .seg button.on { background: var(--card); color: var(--text); border: 1px solid var(--hairline); }

            .phoneWrap { flex: none; width: calc(393px * var(--k, 1)); height: calc(852px * var(--k, 1)); position: relative; }
            .phone { position: absolute; left: 0; top: 0; width: 393px; height: 852px; transform: scale(var(--k, 1)); transform-origin: 0 0; overflow: hidden; border-radius: 52px; background: var(--bg); border: 1px solid var(--line); }
            .status { position: absolute; left: 0; right: 0; top: 0; height: 54px; z-index: 3; display: flex; justify-content: space-between; align-items: flex-end; padding: 0 34px 8px; font-size: 15px; font-weight: 800; background: var(--bg); }
            .status .bat { width: 25px; height: 12px; border-radius: 4px; border: 1.5px solid var(--textTertiary); position: relative; }
            .status .bat::after { content: ""; position: absolute; inset: 1.5px 5px 1.5px 1.5px; border-radius: 2px; background: var(--textSecondary); }
            .scroll { position: absolute; left: 0; right: 0; top: 54px; bottom: 0; overflow-y: auto; padding: 4px 20px 118px; scrollbar-width: none; }
            .scroll::-webkit-scrollbar { display: none; }
            .tabbar { position: absolute; left: 0; right: 0; bottom: 0; z-index: 3; height: 88px; padding: 8px 10px 26px; display: flex; gap: 2px; background: var(--tabBar); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px); border-top: 1px solid var(--tabBarLine); }
            .tab { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; border-radius: 16px; font-size: 10px; font-weight: 800; color: var(--tabInkOff); }
            .tab.on { background: var(--tabPillOn); color: var(--tabInkOn); }
            .tab svg { width: 22px; height: 22px; }
            svg.i { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

            .nav { display: flex; align-items: flex-start; gap: 10px; padding: 8px 0 14px; }
            .nav .back { width: 32px; height: 40px; display: grid; place-items: center; }
            .nav .back svg { width: 22px; height: 22px; stroke-width: 2.4; }
            .nav .t { flex: 1; min-width: 0; }
            .nav h1 { margin: 6px 0 2px; font-size: 22px; font-weight: 800; letter-spacing: -0.02em; }
            .nav .sub { font-size: 13px; color: var(--textSecondary); }
            .nav .edit { padding-top: 10px; font-size: 15px; font-weight: 800; color: var(--mossText); }
            .pills { display: inline-flex; gap: 3px; padding: 3px; border-radius: 99px; background: var(--chip); margin-bottom: 8px; }
            .pills span, .pills button { padding: 6px 15px; border-radius: 99px; font-size: 12px; font-weight: 800; color: var(--textSecondary); }
            .pills .on { background: var(--mossFill); color: var(--mossOn); }
            .pills.fill { display: flex; width: 100%; }
            .pills.fill button { flex: 1; }
            .sec { display: flex; align-items: center; gap: 14px; margin: 26px 0 12px; font-size: 13px; font-weight: 800; letter-spacing: 0.16em; text-transform: uppercase; color: var(--mossText); white-space: nowrap; }
            .sec::after { content: ""; flex: 1; height: 1px; background: var(--track); }
            .card { background: var(--card); border: 1px solid var(--hairline); border-radius: 22px; }
            .eyebrow { font-size: 11px; font-weight: 800; letter-spacing: 0.12em; text-transform: uppercase; color: var(--textTertiary); }
            .caption { font-size: 12px; font-weight: 700; color: var(--textSecondary); }
            .num { font-variant-numeric: tabular-nums; letter-spacing: -0.02em; font-weight: 800; }
            .moss { color: var(--mossText); }
            .stack { display: flex; flex-direction: column; gap: 10px; }
            .av { flex: none; width: var(--s, 38px); height: var(--s, 38px); object-fit: contain; display: block; }
            .more { display: block; width: 100%; min-height: 44px; font-size: 14px; font-weight: 800; color: var(--mossText); text-align: center; }

            /* Overview: the Stats tab's summary layout. */
            .over { display: flex; flex-direction: column; gap: 12px; padding-top: 4px; }
            .over .top { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
            .over .label { font-size: 14px; font-weight: 800; color: var(--textSecondary); }
            .over .big { font-size: 34px; font-weight: 800; letter-spacing: -0.02em; line-height: 1.05; font-variant-numeric: tabular-nums; }
            .places { display: flex; gap: 6px; margin-top: 8px; }
            .places button { width: 30px; height: 32px; border-radius: 9px; display: grid; place-items: center; background: var(--control); color: var(--textDim); font-size: 14px; font-weight: 800; font-variant-numeric: tabular-nums; }
            .places .p1 { background: var(--medalGoldWash); color: var(--medalGold); }
            .places .p2 { background: var(--medalSilverWash); color: var(--medalSilver); }
            .places .p3 { background: var(--medalBronzeWash); color: var(--medalBronze); }

            /* Round sheet, opened from a place. */
            .scrim { position: absolute; inset: 0; z-index: 5; background: var(--scrim); }
            .sheet { position: absolute; left: 0; right: 0; bottom: 0; z-index: 6; max-height: 78%; overflow-y: auto; padding: 8px 20px 34px; border-radius: 28px 28px 0 0; background: var(--bg); border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 10px; }
            .sheet .grab { width: 36px; height: 5px; border-radius: 3px; background: var(--handle); margin: 0 auto 6px; }
            .sheet .head { display: flex; justify-content: space-between; align-items: center; }
            .sheet h2 { margin: 0; font-size: 26px; font-weight: 800; letter-spacing: -0.02em; }
            .sheet .close { min-height: 44px; font-size: 14px; font-weight: 800; color: var(--mossText); }
            .sheet .mine { font-size: 17px; font-weight: 800; }
            .facts { padding: 4px 0; }
            .facts div { display: flex; justify-content: space-between; align-items: center; padding: 13px 16px; font-size: 15px; font-weight: 800; }
            .facts div + div { border-top: 1px solid var(--track); }
            .facts div span:last-child { font-size: 17px; font-variant-numeric: tabular-nums; }
            .rule { height: 1px; background: var(--track); margin-top: 8px; }

            /* Leaderboard row (FFLeaderboardRow). */
            .lb { display: flex; align-items: center; gap: 13px; padding: 11px 15px; border-radius: 22px; background: var(--card); border: 1px solid var(--hairline); }
            .lb.you { background: var(--mossWash); border-color: var(--mossEdge); }
            .lb .rk { width: 22px; text-align: center; font-size: 15px; font-weight: 800; color: var(--textTertiary); }
            .lb .rk.first { color: var(--gold); }
            .lb .mid { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px; }
            .lb .mid b { font-size: 16px; font-weight: 800; letter-spacing: -0.01em; display: inline-flex; align-items: center; gap: 4px; }
            .lb .mid small { font-size: 11px; font-weight: 700; color: var(--textSecondary); }
            .lb .dash { color: var(--textFaint); font-size: 11px; }
            .lb .v { font-size: 17px; }
            .trophy { color: var(--mossText); display: inline-flex; align-items: center; font-size: 11px; font-weight: 800; }
            .trophy svg { width: 14px; height: 14px; stroke-width: 2.2; }

            /* Records card. */
            .rec { padding: 18px 20px; }
            .rec .row + .row { border-top: 1px solid var(--track); margin-top: 14px; padding-top: 14px; }
            .rec .who { display: flex; align-items: center; gap: 12px; margin-top: 8px; }
            .rec .who .mid { flex: 1; min-width: 0; }
            .rec .who b { display: block; font-size: 16px; font-weight: 800; }
            .rec .who .v { font-size: 20px; }

            /* Past round card. */
            .round { padding: 16px; display: flex; flex-direction: column; gap: 10px; }
            .round .head { display: flex; gap: 12px; align-items: flex-start; margin-bottom: 2px; }
            .glyph { flex: none; width: 24px; height: 24px; border-radius: 8px; display: grid; place-items: center; font-size: 11px; font-weight: 800; }
            .glyph.W { background: color-mix(in srgb, var(--mossFill) 24%, transparent); color: var(--mossText); }
            .glyph.L { background: color-mix(in srgb, var(--emberFill) 22%, transparent); color: var(--emberText); }
            .round .head b { display: block; font-size: 16px; font-weight: 800; margin-top: 2px; }

            @media (max-width: 900px) {
                .lab { display: block; }
                .stage { padding: 0; }
                .panel { display: none; }
                .phoneWrap, .phone { width: 100vw; height: 100dvh; transform: none; border-radius: 0; border: 0; }
                .themeFab { display: grid; }
            }
            .themeFab { display: none; position: fixed; right: 14px; top: 14px; z-index: 9; width: 40px; height: 40px; border-radius: 50%; place-items: center; background: var(--overlay); border: 1px solid var(--overlayLine); }
            .shot .lab { display: block; }
            .shot .panel, .shot .themeFab { display: none; }
            .shot .stage { padding: 0; justify-content: flex-start; }
            .shot .phoneWrap, .shot .phone { width: 393px; height: 2600px; transform: none; border-radius: 0; border: 0; }
            .shot.short .phoneWrap, .shot.short .phone { height: 852px; }
        </style>
    </head>

                const value = (e) => (state.board === "steps" ? compact(e.steps) : `${e[state.board]}`);
                return `<div class="sec">All time</div>
                    <div class="pills fill">${[["wins", "Wins"], ["podiums", "Podiums"], ["steps", "Steps"]].map(([k, label]) => `<button class="${state.board === k ? "on" : ""}" data-act="board" data-b="${k}">${label}</button>`).join("")}</div>
                    <div class="stack" style="margin-top:12px">${topThreePlusYou(ranked, state.showAll, "board", (e, rank) => row(rank, e.id, value(e), `${e.rounds} rounds`))}</div>`;
            }

            function records() {
                const rec = (title, when, id, headline, value, mine) => `<div class="row">
                        <div class="eyebrow">${title} · ${when}</div>
                        <div class="who">${av(id)}<div class="mid"><b>${headline}</b>${mine ? `<span class="caption">${mine}</span>` : ""}</div><span class="v num ${P[id].you ? "moss" : ""}">${fmt(value)}</span></div>
                    </div>`;
                return `<div class="sec">Records</div><div class="card rec">
                        ${rec("Best day", BEST_DAY.when, BEST_DAY.who, name(BEST_DAY.who), BEST_DAY.value, P[BEST_DAY.who].you ? "" : `Your best: ${fmt(BEST_DAY.yours)}`)}
                        ${rec("Best round", bestRound.when, bestRound.who, name(bestRound.who), bestRound.value, P[bestRound.who].you ? "" : `Your best: ${fmt(yourBestRound)}`)}
                        ${rec("Closest finish", closest.when, closest.who, `${name(closest.who)} over ${name(closest.over)}`, closest.value)}
                        ${rec("Biggest win", biggest.when, biggest.who, `${name(biggest.who)} over ${name(biggest.over)}`, biggest.value)}
                    </div>`;
            }

            function pastRounds() {
                let streak = 0;
                const cards = ROUNDS.map((r, n) => {
                    streak = n > 0 && ROUNDS[n - 1].order[0] === r.order[0] ? streak + 1 : 1;
                    const won = r.order[0] === "marc";
                    const list = scores(r).map(([id, steps]) => ({ id, steps }));
                    return `<div class="sec">${r.start} - ${r.end}</div>
                        <div class="card round">
                            <div class="head"><span class="glyph ${won ? "W" : "L"}">${won ? "W" : "L"}</span><div><div class="caption">Ended ${r.ended}, 2026 at 00:00</div><b>${won ? "You won" : `${P[r.order[0]].name} won`}</b></div></div>
                            ${topThreePlusYou(list, state.open[n], `round${n}`, (e, rank) => row(rank, e.id, compact(e.steps), "Final steps synced", rank === 1 ? streak : 0))}
                        </div>`;
                });
                return cards.reverse().join("");
            }

            function roundSheet() {
                if (state.round === null) return "";
                const r = ROUNDS[state.round];
                const list = scores(r);
                const mine = list.findIndex(([id]) => P[id].you);
                return `<div class="scrim" data-act="close"></div>
                    <div class="sheet">
                        <div class="grab"></div>
                        <div class="head"><h2>${r.start} - ${r.end}</h2><button class="close" data-act="close">Close</button></div>
                        <div class="mine">Your place: ${mine + 1} of ${list.length}</div>
                        <div class="stack">${list.map(([id, steps], i) => [id, steps, i]).filter(([, , i]) => i < 3 || i === mine).map(([id, steps, i]) => row(i + 1, id, fmt(steps), "Final steps synced")).join("")}</div>
                        <div class="card facts">
                            <div><span>Racers</span><span>${list.length}</span></div>
                            <div><span>Steps together</span><span>${fmt(list.reduce((a, [, steps]) => a + steps, 0))}</span></div>
                            <div><span>Won by</span><span>${fmt(list[0][1] - list[1][1])}</span></div>
                            <div><span>Your steps</span><span>${fmt(list[mine][1])}</span></div>
                        </div>
                    </div>`;
            }

            const TABS = [["fights", "Fights", "trophy"], ["new", "New", "plus"], ["feed", "Feed", "feed"], ["feedback", "Feedback", "chat"], ["profile", "Profile", "person"]];
            const stage = document.getElementById("stage");
            function render() {
                const scroller = stage.querySelector("[data-scroll]");
                const top = scroller ? scroller.scrollTop : 0;
                document.documentElement.dataset.theme = state.theme;
                stage.innerHTML = `<div class="phoneWrap"><div class="phone">
                        <div class="status"><span>9:41</span><span class="bat"></span></div>
                        <div class="scroll" data-scroll>
                            <div class="nav"><span class="back">${icon("back")}</span><div class="t"><h1>The croissant run</h1><div class="sub">Brings croissants for everyone</div></div><span class="edit">Edit</span></div>
                            <div class="pills"><span>Stats</span><span class="on">History</span><span>Feed</span><span>Details</span></div>
                            ${overview()}${leaderboard()}${records()}${pastRounds()}
                        </div>
                        <nav class="tabbar">${TABS.map(([key, label, ic]) => `<span class="tab ${key === "fights" ? "on" : ""}">${icon(ic)}<span>${label}</span></span>`).join("")}</nav>
                        ${roundSheet()}
                    </div></div>`;
                stage.querySelector("[data-scroll]").scrollTop = top;
                document.querySelectorAll("[data-t]").forEach((b) => b.classList.toggle("on", b.dataset.t === state.theme));
                fit();
            }
            function fit() {
                if (innerWidth <= 900 || document.body.classList.contains("shot")) return;
                const k = Math.min(1, (stage.clientWidth - 48) / 393, (innerHeight - 48) / 852);
                stage.style.setProperty("--k", Math.max(k, 0.3).toFixed(3));
            }
            if (new URLSearchParams(location.search).has("shot")) document.body.classList.add("shot");
            if (new URLSearchParams(location.search).has("short")) document.body.classList.add("short");
            // ?round=N opens that round's sheet, for screenshots and links.
            if (new URLSearchParams(location.search).has("round")) state.round = Number(new URLSearchParams(location.search).get("round"));
            document.addEventListener("click", (event) => {
                const el = event.target.closest("[data-act]");
                if (!el) return;
                const act = el.dataset.act;
                if (act === "theme" || act === "flip") {
                    state.theme = act === "flip" ? (state.theme === "night" ? "day" : "night") : el.dataset.t;
                    localStorage.setItem("historyTab.theme", state.theme);
                } else if (act === "board") { state.board = el.dataset.b; state.showAll = false; }
                else if (act === "round") state.round = Number(el.dataset.n);
                else if (act === "close") state.round = null;
                else if (act === "toggle") {
                    if (el.dataset.k === "board") state.showAll = !state.showAll;
                    else state.open[el.dataset.k.slice(5)] = !state.open[el.dataset.k.slice(5)];
                }
                render();
            });
            addEventListener("resize", fit);
            render();
        </script>
    </body>
</html>
