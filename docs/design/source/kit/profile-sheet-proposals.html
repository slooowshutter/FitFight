            :root { --them: #8C8A7D; --themSoft: color-mix(in srgb, var(--them) 55%, var(--card)); --goldMark: var(--gold); --ease-out: cubic-bezier(0.23, 1, 0.32, 1); }
            [data-theme="day"] { --them: #9A958A; --goldMark: color-mix(in srgb, var(--gold) 70%, var(--goldInk)); }
            :root { --level0: color-mix(in srgb, var(--gold) 28%, var(--card)); --level1: color-mix(in srgb, var(--gold) 46%, var(--card)); --level2: color-mix(in srgb, var(--gold) 64%, var(--card)); --level3: color-mix(in srgb, var(--gold) 82%, var(--card)); --level4: var(--goldMark); }
            * { box-sizing: border-box; }
            html, body { margin: 0; min-height: 100%; }
            body { background: var(--canvas); color: var(--text); font: 700 13px/1.45 Nunito, -apple-system, sans-serif; -webkit-font-smoothing: antialiased; }
            button { font: inherit; color: inherit; background: none; border: 0; padding: 0; margin: 0; cursor: pointer; text-align: inherit; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
            button:focus-visible, .switcher:focus-visible { outline: 2px solid var(--text); outline-offset: 3px; }
            h1, h2, h3, p { margin: 0; }
            img { display: block; }
            svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }
            [hidden] { display: none !important; }
            .num { font-variant-numeric: tabular-nums; letter-spacing: -0.03em; }
            .muted { color: var(--textSecondary); }
            .faint { color: var(--textFaint); }
            .moss { color: var(--mossText); }
            .ember { color: var(--emberText); }
            .gold { color: var(--goldMark); }

            /* Phone with the Profile sheet raised over the app, as the app presents it. */
            .stage { min-height: 100dvh; display: grid; place-items: center; padding: 24px 0; }
            .phone { position: relative; width: 393px; height: 852px; background: var(--canvas); border: 1px solid var(--line); border-radius: 44px; overflow: hidden; }
            .status { position: absolute; top: 0; left: 0; right: 0; height: 54px; padding: 17px 32px 0; display: flex; justify-content: space-between; font-size: 15px; font-weight: 800; }
            .status span { display: flex; gap: 6px; align-items: center; }
            .status svg { width: 17px; height: 17px; }
            .sheet { position: absolute; top: 58px; left: 0; right: 0; bottom: 0; display: flex; flex-direction: column; background: var(--bg); border-radius: 38px 38px 0 0; }
            .grabber { flex: none; width: 36px; height: 5px; margin: 8px auto 0; border-radius: 999px; background: var(--handle); }
            .sheet-head { flex: none; display: flex; align-items: center; justify-content: space-between; min-height: 44px; padding: 12px 20px 0; }
            .sheet-head h1 { font-size: 16px; font-weight: 800; letter-spacing: -0.01em; }
            .sheet-head button { min-height: 44px; min-width: 44px; text-align: right; font-size: 13px; font-weight: 800; color: var(--mossText); }
            .screen { flex: 1; overflow-y: auto; overscroll-behavior: contain; padding: 16px 20px 48px; scrollbar-width: none; }
            .screen::-webkit-scrollbar { display: none; }
            .screen > * + * { margin-top: 12px; }

            /* App pieces */
            .card { background: var(--card); border: 1px solid var(--hairline); border-radius: 22px; }
            .pad { padding: 22px; }
            .sec { display: flex; align-items: center; gap: 14px; padding-top: 20px; }
            .sec h2 { font-size: 12px; font-weight: 800; letter-spacing: 0.16em; text-transform: uppercase; color: var(--mossText); white-space: nowrap; }
            .sec::after { content: ""; flex: 1; height: 1px; background: var(--track); }
            .eyebrow { font-size: 12px; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; color: var(--textSecondary); }
            .title { font-size: 26px; font-weight: 800; letter-spacing: -0.025em; line-height: 1.15; }
            .heading { font-size: 16px; font-weight: 800; letter-spacing: -0.01em; }
            .caption { font-size: 12px; color: var(--textSecondary); }
            .micro { font-size: 11px; color: var(--textSecondary); }
            .split { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
            .char { object-fit: contain; object-position: bottom; flex: none; }
            .btn { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; min-height: 50px; border-radius: 999px; font-size: 14px; font-weight: 800; }
            .btn.primary { background: var(--mossFill); color: var(--mossOn); }
            .btn.secondary { background: var(--control); color: var(--text); border: 1px solid var(--chipEdge); }
            .btn.add { background: var(--mossWash); color: var(--mossText); border: 1px solid color-mix(in srgb, var(--mossText) 30%, transparent); }
            .btn.pending { background: var(--control); color: var(--textSecondary); border: 1px solid var(--chipEdge); }
            .btn.sm { width: auto; min-height: 36px; padding: 0 14px; font-size: 12px; }
            .btn.link { width: auto; min-height: 44px; padding: 0 12px; color: var(--textSecondary); font-size: 13px; }
            .btn svg { width: 16px; height: 16px; }
            .foot-actions { display: flex; min-height: 44px; align-items: center; font-size: 13px; font-weight: 800; color: var(--textSecondary); }
            .live-dot { display: inline-block; width: 7px; height: 7px; margin-right: 5px; border-radius: 50%; background: var(--mossText); vertical-align: 1px; }

            /* Rows */
            .rows { overflow: hidden; }
            .rowi { display: flex; align-items: center; gap: 12px; width: 100%; min-height: 58px; padding: 12px 16px; }
            .rowi + .rowi { border-top: 1px solid var(--hairline); }
            .rowi .grow { flex: 1; min-width: 0; }
            .rowi strong { display: block; font-size: 15px; font-weight: 800; letter-spacing: -0.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
            .rowi small { display: block; font-size: 12px; color: var(--textSecondary); margin-top: 1px; }
            .rowi .chev { width: 15px; height: 15px; color: var(--textFaint); }
            .rowi.more { justify-content: center; min-height: 48px; font-size: 13px; font-weight: 800; color: var(--mossText); }
            .result { font-size: 13px; font-weight: 800; text-align: right; white-space: nowrap; }

            /* Form: little squares, oldest on the left, newest on the right. */
            .form { display: grid; grid-template-columns: repeat(10, minmax(0, 1fr)); gap: 5px; }
            .form span { display: grid; place-items: center; height: 26px; border-radius: 8px; font-size: 11px; font-weight: 800; }
            .form .w { background: var(--mossWash); color: var(--mossText); }
            .form .l { background: var(--emberWash); color: var(--emberText); }
            .form .d { background: var(--chip); color: var(--textSecondary); }
            .form-row { display: grid; gap: 8px; min-width: 0; }

            /* Locks */
            .locked { display: grid; justify-items: center; gap: 4px; padding: 22px; text-align: center; }
            .locked .lock { width: 22px; height: 22px; color: var(--textSecondary); margin-bottom: 4px; }
            .locked p { max-width: 270px; }
            .locked .btn.add { width: auto; min-height: 44px; margin-top: 10px; padding: 0 18px; }
            .against .locked { border-top: 1px solid var(--hairline); margin: 0 -18px; }
            .ask { display: grid; gap: 12px; padding: 16px 18px; border-color: color-mix(in srgb, var(--mossText) 30%, transparent); background: color-mix(in srgb, var(--mossFill) 10%, var(--card)); }
            .ask .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
            .ask .btn { min-height: 44px; }

            /* Player card */
            .player { position: relative; overflow: hidden; }
            .player-top { display: grid; grid-template-columns: 124px 1fr; gap: 12px; padding: 18px 18px 14px 10px; align-items: end; }
            .player-top img { width: 124px; height: 140px; }
            .player-top .who { display: grid; gap: 2px; padding-bottom: 6px; min-width: 0; }
            .player-top .name-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; min-width: 0; }
            .player-top .title { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
            .player-top .title span { color: var(--textSecondary); }
            .player-top .quote { font-size: 13px; font-style: italic; color: var(--textDim); }
            .player-top .btn { justify-self: start; margin-top: 10px; }
            /* A small pill on the username's line; the invisible ::before keeps a 44pt tap target around it. */
            .streak { position: relative; flex: none; display: inline-flex; align-items: center; gap: 3px; height: 24px; padding: 0 9px 0 7px; border-radius: 999px; background: color-mix(in srgb, var(--gold) 14%, var(--card)); color: var(--goldMark); line-height: 1; }
            .streak::before { content: ""; position: absolute; inset: -10px -6px; }
            .streak svg { width: 13px; height: 13px; stroke-width: 2; }
            .streak b { font-size: 12px; font-weight: 800; }
            .stat-grid { display: grid; grid-template-columns: 1fr 1fr; border-top: 1px solid var(--hairline); }
            .stat-grid > div { padding: 14px 18px; }
            .stat-grid > div:nth-child(even) { border-left: 1px solid var(--hairline); }
            .stat-grid > div:nth-child(n+3) { border-top: 1px solid var(--hairline); }
            .stat-grid b { display: block; font-size: 20px; font-weight: 800; line-height: 1.2; }
            .stat-grid small { display: block; font-size: 12px; color: var(--textSecondary); }

            /* Against you */
            .against { padding: 16px 18px; display: grid; gap: 12px; }
            .against-top { display: grid; grid-template-columns: 52px 1fr 52px; align-items: end; text-align: center; }
            .against-top img { width: 52px; height: 60px; }
            .against-top b { font-size: 30px; font-weight: 800; line-height: 1; }
            .against-top b i { font-style: normal; color: var(--textFaint); margin: 0 4px; }
            .expand { display: flex; align-items: center; justify-content: center; gap: 6px; min-height: 44px; border-top: 1px solid var(--hairline); margin: 0 -18px -16px; font-size: 13px; font-weight: 800; color: var(--mossText); }
            .expand svg { width: 15px; height: 15px; transition: transform 200ms var(--ease-out); }
            .expand[aria-expanded="true"] svg { transform: rotate(180deg); }

            /* Scoreboard rows: your number, the stat, their number, then a bar split by who had more.
               The tick marks the middle, so the split's distance from it reads at a glance. */
            .mstats { margin: 0 -2px; }
            .mstat { padding: 12px 2px; border-top: 1px solid var(--hairline); }
            .scope + .mstats .mstat:first-child { border-top: 0; }
            .mstat .lbl { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); font-size: 15px; font-weight: 800; margin-bottom: 8px; }
            .mstat .lbl span { text-align: center; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--textSecondary); align-self: center; line-height: 1.2; }
            .mstat .lbl span small { display: block; font-size: 10px; letter-spacing: 0; text-transform: none; color: var(--textFaint); }
            .mstat .lbl b { color: var(--textSecondary); }
            .mstat .lbl b:last-child { text-align: right; }
            .lead-you { color: var(--mossText) !important; }
            .lead-them { color: var(--emberText) !important; }
            .possession { position: relative; display: flex; gap: 4px; height: 6px; }
            .possession span { border-radius: 999px; }
            .possession::after { content: ""; position: absolute; left: 50%; top: -4px; bottom: -4px; width: 2px; margin-left: -1px; border-radius: 2px; background: var(--text); opacity: 0.55; }

            /* Compare steps: one line per stat, the period said once above. */
            .cmp { display: grid; border-top: 1px solid var(--hairline); margin: 0 -18px; padding: 0 18px; }
            .scope { padding: 12px 0 4px; font-size: 12px; font-weight: 800; color: var(--textSecondary); text-align: center; }
            .mstat .lbl span { white-space: nowrap; }

            /* Their last 30 days */
            .bars { display: flex; gap: 3px; align-items: flex-end; height: 64px; }
            .bars i { flex: 1; border-radius: 3px 3px 1px 1px; background: var(--level2); }
            .bars i.ten { background: var(--level3); }
            .bars i.top { background: var(--goldMark); }
            .levelbar { display: flex; height: 10px; gap: 2px; border-radius: 999px; overflow: hidden; }
            .levelbar span { display: block; height: 100%; }
            .legend { display: flex; flex-wrap: wrap; gap: 6px 12px; font-size: 11px; color: var(--textSecondary); }
            .legend i { display: inline-block; width: 9px; height: 9px; border-radius: 3px; margin-right: 4px; vertical-align: -1px; }
            .l0 { background: var(--level0); } .l1 { background: var(--level1); } .l2 { background: var(--level2); } .l3 { background: var(--level3); } .l4 { background: var(--level4); }

            /* Overlays inside the phone */
            .layer { position: absolute; inset: 0; z-index: 30; pointer-events: none; }
            .scrim { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: flex-end; gap: 8px; padding: 0 10px 30px; background: var(--scrim); pointer-events: auto; animation: fade 160ms var(--ease-out); }
            .scrim.clear { background: transparent; }
            .dialog { overflow: hidden; border-radius: 16px; background: var(--overlay); text-align: center; animation: pop 200ms var(--ease-out); }
            .dialog p { padding: 16px 18px 14px; font-size: 13px; color: var(--textSecondary); border-bottom: 1px solid var(--overlayLine); }
            .dialog p strong { display: block; margin-bottom: 2px; font-size: 14px; color: var(--text); }
            .dialog button { display: block; width: 100%; min-height: 56px; font-size: 17px; font-weight: 800; text-align: center; }
            .dialog button + button { border-top: 1px solid var(--overlayLine); }
            .dialog .destructive { color: var(--emberText); }
            .popover { position: absolute; width: 260px; padding: 16px 16px 6px; border-radius: 18px; background: var(--overlay); border: 1px solid var(--overlayLine); pointer-events: auto; animation: pop 180ms var(--ease-out); transform-origin: top right; }
            .popover::before { content: ""; position: absolute; top: -7px; right: 22px; width: 12px; height: 12px; background: var(--overlay); border-left: 1px solid var(--overlayLine); border-top: 1px solid var(--overlayLine); transform: rotate(45deg); }
            .popover strong { display: flex; align-items: center; gap: 6px; font-size: 15px; color: var(--goldMark); }
            .popover strong svg { width: 17px; height: 17px; }
            .popover p { margin-top: 6px; font-size: 13px; color: var(--textSecondary); line-height: 1.45; }
            .popover button { display: block; width: 100%; min-height: 44px; margin-top: 6px; font-size: 14px; font-weight: 800; color: var(--mossText); text-align: center; }
            .toast { position: absolute; left: 50%; bottom: 40px; transform: translateX(-50%); padding: 10px 16px; border-radius: 16px; background: var(--overlay); border: 1px solid var(--overlayLine); font-size: 13px; white-space: nowrap; animation: pop 200ms var(--ease-out); }

            /* State switcher. Never part of the design, never in the app. */
            .switcher { position: fixed; z-index: 50; right: 16px; bottom: max(16px, env(safe-area-inset-bottom)); border-radius: 22px; background: var(--overlay); border: 1px solid var(--overlayLine); touch-action: none; -webkit-user-select: none; user-select: none; animation: fade 200ms var(--ease-out); }
            .switcher.dragging { cursor: grabbing; }
            .switcher-trigger { display: grid; grid-template-columns: 44px 112px 44px; width: 200px; align-items: center; }
            .switcher-trigger > button { display: grid; place-items: center; min-height: 48px; }
            .switcher-trigger svg { width: 18px; height: 18px; }
            .switcher .name { min-width: 0; line-height: 1.15; text-align: center; }
            .switcher .name small, .switcher .name strong { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
            .switcher .name small { font-size: 10px; color: var(--textSecondary); }
            .switcher .name strong { font-size: 14px; }
            .switcher-menu { position: absolute; right: 0; bottom: calc(100% + 10px); width: min(330px, calc(100vw - 24px)); max-height: min(600px, 75dvh); overflow-y: auto; padding: 8px; border-radius: 22px; background: var(--overlay); border: 1px solid var(--overlayLine); touch-action: pan-y; animation: pop 180ms var(--ease-out); }
            .switcher-menu.below { top: calc(100% + 10px); bottom: auto; }
            .switcher-menu.left { right: auto; left: 0; }
            .switcher-menu .intro { padding: 8px 10px 4px; font-size: 12px; color: var(--textSecondary); }
            .seg { display: grid; grid-template-columns: 1fr 1fr; padding: 3px; margin: 6px 4px; border-radius: 999px; background: var(--control); }
            .seg button { min-height: 36px; border-radius: 999px; font-size: 12px; font-weight: 800; text-align: center; color: var(--textSecondary); }
            .seg button[aria-pressed="true"] { background: var(--card); color: var(--text); }
            .option { display: grid; grid-template-columns: 26px 1fr 20px; gap: 8px; align-items: center; width: 100%; padding: 11px 8px; border-radius: 15px; }
            .option[aria-pressed="true"] { background: var(--mossWash); }
            .option .n { font-size: 12px; font-weight: 800; color: var(--textSecondary); text-align: center; }
            .option strong { display: block; font-size: 14px; font-weight: 800; }
            .option small { display: block; font-size: 12px; color: var(--textSecondary); line-height: 1.35; margin-top: 2px; }
            .option svg { width: 17px; height: 17px; color: var(--mossText); }
            @keyframes fade { from { opacity: 0; } }
            @keyframes pop { from { opacity: 0; transform: translateY(6px) scale(0.98); } }
            @media (prefers-reduced-motion: reduce) { .switcher, .switcher-menu, .scrim, .dialog, .popover, .toast { animation: none; } .expand svg { transition: none; } }
        </style>
    </head>

            const last30 = (list) => list.slice(-30);
            const THEM_STEPS = {

                { name: "Fight Marc", detail: "Round 3 · 1v1", live: true, date: "2026-10-18" },
                { name: "Fight Marc", detail: "Round 2 · 1v1", outcome: "you", date: "2026-10-11" },

            const FRIENDS_SINCE = { iso: "2026-08-14", label: "14 Aug" };

            // ─── What you can see depends on the friendship ─────────────────

            const isFriend = () => friendship === "friends";

            /** A lock where this viewer cannot see: steps (friends only) or the whole profile (private). */

                const text = friendship === "outgoing" ? `Request sent. You'll see ${what} once ${THEM.name} accepts.`

                    : isPrivate ? `Only ${THEM.name}'s friends see their record and steps. Fights you were both in stay visible.`
                    : `${THEM.name} shares steps with friends only.`;
                return `<div class="locked ${isPrivate ? "card" : ""}">${lock}<div class="heading">${isPrivate ? "Private profile" : "Steps are for friends"}</div><p class="caption">${text}</p>
                    ${friendship === "none" ? `<button type="button" class="btn add" data-act="add">${personPlus}Add friend</button>` : ""}
                    ${friendship === "outgoing" ? '<button type="button" class="btn link" data-act="cancel">Cancel request</button>' : ""}</div>`;
            }

            const img = (src, width, height) => `<img class="char" src="${src}" width="${width}" height="${height}" alt="">`;
            const form = (list = FORM) => `<div class="form">${list.map((result) => `<span class="${result}">${result.toUpperCase()}</span>`).join("")}</div>`;

            function playerCard() {
                const record = THEM.record;
                return `<div class="card player">
                    <div class="player-top">${img(THEM.art, 124, 140)}
                        <div class="who"><div class="name-row"><div class="title"><span>@</span>${THEM.handle}</div>
                            ${isFriend() && THEM_STEPS.streak ? `<button type="button" class="streak" data-act="streak" aria-label="${THEM_STEPS.streak}-day 10K streak">${flame}<b class="num">${THEM_STEPS.streak}</b></button>` : ""}</div>
                            <div class="quote">${THEM.caption}</div>
                            <div class="micro" style="margin-top:4px">Member since ${THEM.since}</div>${friendButton()}</div></div>
                    ${canSeeRecord() ? `<div class="stat-grid">
                        <div><b class="num">${record.won}-${record.lost}-${record.drew}</b><small>won · lost · drew</small></div>
                        <div><b class="num">${Math.round(record.won / record.played * 100)}%</b><small>win rate · ${record.played} Fights</small></div>
                        ${isFriend() ? `<div><b class="num">${n(THEM_STEPS.monthly)}</b><small>30-day average</small></div>
                        <div><b class="num gold">${n(THEM_STEPS.best)}</b><small>best day · 30 days</small></div>` : ""}
                    </div>` : ""}
                </div>`;
            }

            function askBanner() {
                if (friendship !== "incoming") return "";
                return `<div class="card ask"><div><div class="heading">${THEM.name} wants to be friends</div><div class="caption">Friends see each other's steps and stats.</div></div>
                    <div class="row2"><button type="button" class="btn primary" data-act="accept">Accept</button><button type="button" class="btn secondary" data-act="decline">Decline</button></div></div>`;
            }

            function againstYou() {
                if (!canSeeRecord()) return locked();
                return `<div class="card against" id="against">
                    <div class="split"><span class="heading">Against you</span><span class="caption">${FINISHED.length} Fights</span></div>
                    <div class="against-top">${img(YOU.art, 52, 60)}<div><b class="num"><span class="moss">${SCORE.you}</span><i>-</i><span class="muted">${SCORE.draw}</span><i>-</i><span class="ember">${SCORE.them}</span></b><div class="micro">you · draw · ${THEM.name}</div></div>${img(THEM.art, 52, 60)}</div>
                    <div class="form-row"><span class="eyebrow">Last 10</span>${form()}</div>
                    ${expanded ? (isFriend() ? compareSteps() : locked()) : ""}
                    <button type="button" class="expand" data-act="expand" aria-expanded="${expanded}">${expanded ? "Hide steps" : "Compare steps"}${chevDown}</button>
                </div>`;
            }

            // ─── Compare steps ──────────────────────────────────────────────
            // One line per stat, the period said once above. The bar splits by who had more; its tick marks even.

            const lead = (row, who) => (who === "you" ? row.you > row.them : row.them > row.you) ? (who === "you" ? "lead-you" : "lead-them") : "";

            function compareSteps() {
                return `<div class="cmp"><div class="scope">Since you became friends on ${FRIENDS_SINCE.label}</div><div class="mstats">${COMPARE.map((row) => `<div class="mstat">
                    <div class="lbl"><b class="num ${lead(row, "you")}">${n(row.you)}</b><span>${row.label}</span><b class="num ${lead(row, "them")}">${n(row.them)}</b></div>
                    <div class="possession"><span style="flex:${row.you};background:${row.you > row.them ? "var(--mossFill)" : "var(--themSoft)"}"></span><span style="flex:${row.them};background:${row.them > row.you ? "var(--emberFill)" : "var(--themSoft)"}"></span></div></div>`).join("")}</div></div>`;
            }

            function lastThirty() {
                if (!isFriend()) return "";
                const max = THEM_STEPS.best;
                const names = ["Couch", "Warming up", "Moving", "Active", "Ripped"];
                return `<div class="card pad" style="display:grid;gap:10px">
                    <div class="split"><span class="heading">${THEM.name}'s last 30 days</span><span class="caption">${THEM_STEPS.tenK} days at 10K+</span></div>
                    <div class="bars" aria-label="${THEM.name}'s last 30 days">${last30(STEPS.them).map((value) => `<i class="${value === max ? "top" : value >= 10000 ? "ten" : ""}" style="height:${Math.max(6, value / max * 100)}%"></i>`).join("")}</div>
                    <div class="levelbar">${THEM_STEPS.levels.map((days, index) => days ? `<span class="l${index}" style="flex:${days}"></span>` : "").join("")}</div>
                    <div class="legend">${names.map((name, index) => `<span><i class="l${index}"></i>${name} ${THEM_STEPS.levels[index]}</span>`).join("")}</div>
                </div>`;
            }

            function resultCell(row) {
                if (row.live) return `<span class="result ember"><i class="live-dot"></i>${n(LIVE.them - LIVE.you)} behind</span>`;
                const color = { you: "moss", them: "ember", draw: "muted" }[row.outcome];
                if (row.places) return `<span class="result ${color}">You ${ordinal(row.places[0])} · ${THEM.name} ${ordinal(row.places[1])}</span>`;
                return `<span class="result ${color}">${{ you: "You won", them: `${THEM.name} won`, draw: "Draw" }[row.outcome]}</span>`;
            }

            function fightsTogether() {
                // A private profile hides the live Fight too: you only see it as a current opponent.
                const rows = TOGETHER.filter((row) => canSeeRecord() || !row.live);
                const shown = showAll ? rows : rows.slice(0, 5);
                return `<div class="sec"><h2>Fights together</h2></div><div class="card rows">${shown.map((row) => `<div class="rowi">
                    <div class="grow"><strong>${row.name}</strong><small>${row.detail} · ${row.live ? `ends ${shortDate(row.date)}` : shortDate(row.date)}</small></div>
                    ${resultCell(row)}${chev}</div>`).join("")}
                    ${rows.length > 5 ? `<button type="button" class="rowi more" data-act="all">${showAll ? "Show fewer" : `Show all ${rows.length}`}</button>` : ""}</div>`;
            }

            // No Block: hiding someone would leave scores against a player nobody can see.
            const render = () => `${playerCard()}${askBanner()}${againstYou()}${lastThirty()}${fightsTogether()}<div class="foot-actions">Report profile</div>`;

            // ─── State switcher ─────────────────────────────────────────────
            // The ui-variant-explorer picker in plain JS (kit pages have no build step). One design, so the arrows step through states.

            const STATES = [
                { id: "friends", name: "Friends", friendship: "friends", privacy: "public" },
                { id: "public", name: "Not friends", friendship: "none", privacy: "public" },
                { id: "private", name: "Private", friendship: "none", privacy: "private" },
                { id: "asked", name: "Asked you", friendship: "incoming", privacy: "public" },
            ];
            const FEATURE = "fitfight-profile-sheet";
            const store = {
                get: (key) => { try { return localStorage.getItem(`${FEATURE}.${key}`); } catch { return null; } },
                set: (key, value) => { try { localStorage.setItem(`${FEATURE}.${key}`, value); } catch {} },
            };
            const fromHash = STATES.findIndex((state) => state.id === location.hash.slice(1));
            let active = Math.max(0, fromHash);
            let { friendship, privacy } = STATES[active];
            let showAll = false;
            let expanded = true;
            const screen = document.getElementById("screen");
            const layer = document.getElementById("layer");
            const switcher = document.getElementById("switcher");
            const menu = document.getElementById("switcher-menu");
            const nameButton = document.getElementById("name");
            let toastTimer;

            function draw(keepScroll) {
                const top = screen.scrollTop;
                screen.innerHTML = render();
                screen.scrollTop = keepScroll ? top : 0;
                const current = friendship === "friends" ? "Friends" : friendship === "incoming" ? "Asked you" : friendship === "outgoing" ? "Requested" : privacy === "private" ? "Not friends, private" : "Not friends";
                nameButton.innerHTML = `<small>Player card</small><strong>${current}</strong>`;
            }

            function select(index) {
                active = (index + STATES.length) % STATES.length;
                ({ friendship, privacy } = STATES[active]);
                layer.innerHTML = "";
                draw(false);
                history.replaceState(null, "", `#${STATES[active].id}`);
                if (!menu.hidden) drawMenu();
            }

            function setFriendship(state, message) {
                friendship = state;
                draw(true);
                if (!menu.hidden) drawMenu();
                if (!message) return;
                layer.querySelector(".toast")?.remove();
                layer.insertAdjacentHTML("beforeend", `<div class="toast" role="status">${message}</div>`);
                clearTimeout(toastTimer);
                toastTimer = setTimeout(() => layer.querySelector(".toast")?.remove(), 2200);
            }

            function closeLayer() {
                layer.innerHTML = "";
                layer.onclick = null;
            }

            // The confirmation the app shows before undoing a friendship, drawn inside the phone.
            function confirmAction(title, detail, action, onConfirm, keep) {
                layer.innerHTML = `<div class="scrim"><div class="dialog"><p><strong>${title}</strong>${detail}</p>
                    <button type="button" class="destructive" data-dialog="confirm">${action}</button></div>
                    <div class="dialog"><button type="button" data-dialog="dismiss">${keep}</button></div></div>`;
                layer.onclick = (event) => {
                    const button = event.target.closest("button[data-dialog]");
                    if (!button && !event.target.classList.contains("scrim")) return;
                    closeLayer();
                    if (button?.dataset.dialog === "confirm") onConfirm();
                };
            }

            // Explains the flame, anchored under it; any tap closes it.
            function streakPopover(anchor) {
                const phone = layer.getBoundingClientRect();
                const box = anchor.getBoundingClientRect();
                layer.innerHTML = `<div class="scrim clear"></div><div class="popover" role="dialog" style="top:${box.bottom - phone.top + 12}px;right:${phone.right - box.right - 6}px">
                    <strong>${flame}${THEM_STEPS.streak}-day 10K streak</strong>
                    <p>${THEM.name} has walked 10,000 steps or more ${THEM_STEPS.streak} days in a row. A day under 10,000 starts it over.</p>
                    <button type="button">Got it</button></div>`;
                layer.onclick = (event) => { if (event.target.closest("button") || event.target.classList.contains("scrim")) closeLayer(); };
            }

            screen.addEventListener("click", (event) => {
                const target = event.target.closest("[data-act]");
                if (!target) return;
                const act = target.dataset.act;
                if (act === "add") setFriendship("outgoing", `Friend request sent to ${THEM.name}`);
                if (act === "accept") setFriendship("friends", `You and ${THEM.name} are friends`);
                if (act === "decline") setFriendship("none", "Request declined");
                if (act === "cancel") confirmAction(`Cancel your request to ${THEM.name}?`, "", "Cancel request", () => setFriendship("none", "Request cancelled"), "Keep request");
                if (act === "unfriend") confirmAction(`Remove ${THEM.name} as a friend?`, "You stop seeing each other's steps. Fights together and your record stay.", "Remove friend", () => setFriendship("none", `${THEM.name} removed from friends`), "Cancel");
                if (act === "streak") streakPopover(target);
                if (act === "all") { showAll = !showAll; draw(true); }
                if (act === "expand") { expanded = !expanded; draw(true); }
            });

            function drawMenu() {
                const theme = document.documentElement.dataset.theme;
                menu.innerHTML = `<p class="intro">Player card. Pick a starting state, then tap inside: Add friend, Requested, Accept, Friends, the flame and Compare steps.</p>
                    <div class="seg"><button type="button" data-theme="night" aria-pressed="${theme === "night"}">Night</button><button type="button" data-theme="day" aria-pressed="${theme === "day"}">Day</button></div>
                    ${STATES.map((state, index) => `<button type="button" class="option" data-index="${index}" aria-pressed="${index === active}">
                        <span class="n">${index + 1}</span><span><strong>${state.name}</strong></span>${index === active ? check : "<span></span>"}</button>`).join("")}`;
            }

            function setMenu(open) {
                menu.hidden = !open;
                nameButton.setAttribute("aria-expanded", String(open));
                if (!open) return;
                drawMenu();
                const box = switcher.getBoundingClientRect();
                menu.classList.toggle("below", box.top < window.innerHeight / 2);
                menu.classList.toggle("left", box.left + box.width / 2 < window.innerWidth / 2);
            }

            // Drag lives in a transform, not in re-rendered state; a 6px threshold keeps taps as taps.
            let offset = { x: 0, y: 0 };
            try { offset = { ...offset, ...JSON.parse(store.get("switcherPos") || "{}") }; } catch {}
            const place = () => { switcher.style.transform = `translate(${offset.x}px, ${offset.y}px)`; };
            function clampIntoView() {
                switcher.style.transform = "";
                const base = switcher.getBoundingClientRect();
                offset.x = Math.min(window.innerWidth - 8 - base.right, Math.max(8 - base.left, offset.x));
                offset.y = Math.min(window.innerHeight - 8 - base.bottom, Math.max(8 - base.top, offset.y));
                place();
            }
            let drag = null;
            let suppressClick = false;
            switcher.addEventListener("pointerdown", (event) => {
                if (event.target.closest(".switcher-menu")) return;
                drag = { id: event.pointerId, x: event.clientX, y: event.clientY, from: { ...offset }, moved: false };
            });
            window.addEventListener("pointermove", (event) => {
                if (!drag || event.pointerId !== drag.id) return;
                const dx = event.clientX - drag.x;
                const dy = event.clientY - drag.y;
                if (!drag.moved && Math.hypot(dx, dy) < 6) return;
                if (!drag.moved) { drag.moved = true; switcher.classList.add("dragging"); setMenu(false); }
                offset = { x: drag.from.x + dx, y: drag.from.y + dy };
                place();
            });
            window.addEventListener("pointerup", (event) => {
                if (!drag || event.pointerId !== drag.id) return;
                if (drag.moved) {
                    suppressClick = true;
                    switcher.classList.remove("dragging");
                    clampIntoView();
                    store.set("switcherPos", JSON.stringify(offset));
                }
                drag = null;
            });
            switcher.addEventListener("click", (event) => {
                if (suppressClick) { suppressClick = false; event.stopPropagation(); event.preventDefault(); }
            }, true);

            nameButton.addEventListener("click", () => setMenu(menu.hidden));
            document.getElementById("prev").addEventListener("click", () => select(active - 1));
            document.getElementById("next").addEventListener("click", () => select(active + 1));
            menu.addEventListener("click", (event) => {
                const button = event.target.closest("button");
                if (!button) return;
                if (button.dataset.theme) {
                    document.documentElement.dataset.theme = button.dataset.theme;
                    store.set("theme", button.dataset.theme);
                    drawMenu();
                } else if (button.dataset.index) {
                    select(Number(button.dataset.index));
                    setMenu(false);
                }
            });
            switcher.addEventListener("keydown", (event) => {
                if (event.key === "ArrowLeft") { event.preventDefault(); select(active - 1); }
                if (event.key === "ArrowRight") { event.preventDefault(); select(active + 1); }
            });
            document.addEventListener("keydown", (event) => {
                if (event.key !== "Escape") return;
                if (!menu.hidden) { setMenu(false); nameButton.focus(); }
                closeLayer();
            });
            document.addEventListener("pointerdown", (event) => { if (!menu.hidden && !switcher.contains(event.target)) setMenu(false); });
            window.addEventListener("resize", clampIntoView);
            place();
            clampIntoView();
            select(active);
        </script>
    </body>
</html>
