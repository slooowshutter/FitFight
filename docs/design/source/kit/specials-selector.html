<style>
*{box-sizing:border-box;margin:0}
body{background:#161a14;color:#eee8d8;font:600 12px Nunito,system-ui,sans-serif;padding:10px 12px}
header{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:8px}
h1{font-size:16px;font-weight:800}
.count{font-weight:800}
.ok{color:#7fd39a}.short{color:#e3a35c}
button.copy{background:#3a7d4f;color:#fff;border:0;border-radius:999px;padding:6px 14px;font:800 12px Nunito;cursor:pointer}
.hint{color:#9a9a88}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:10px}
.col{background:#1e231c;border:1px solid #2c3329;border-radius:14px;padding:8px}
.col h2{font-size:13px;font-weight:800;margin-bottom:6px;display:flex;justify-content:space-between}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(66px,1fr));gap:4px}
.t{position:relative;border:2px solid transparent;border-radius:10px;background:#252b22;cursor:pointer;aspect-ratio:3/4;overflow:hidden}
.t img{width:100%;height:100%;object-fit:contain;display:block}
.t.on{border-color:#5fcf86;background:#24402c}
.t.on::after{content:"\2713";position:absolute;top:1px;right:3px;color:#5fcf86;font-weight:800;font-size:11px}
.t span{position:absolute;left:0;right:0;bottom:0;font-size:10px;line-height:1.1;text-align:center;background:#161a14cc;padding:1px}
#peek{position:fixed;right:12px;bottom:12px;width:300px;background:#1e231c;border:1px solid #3a4336;border-radius:16px;padding:10px;display:none;pointer-events:none;z-index:5}
#peek img{width:100%;height:330px;object-fit:contain}
#peek b{display:block;font-size:15px}#peek i{color:#c9b36a;font-style:normal}#peek p{color:#9a9a88;margin-top:2px}
</style></head><body>

const PRESELECT = ["v3:special-black-panther", "v3:special-lone-wolf", "v3:special-snow-leopard", "v3:special-tiger", "v3:special-night-owl", "v3:special-crocodile", "v3:special-peacock", "v3:special-flamingo", "v3:special-persian-cat", "v3:special-silverback", "v3:special-kangaroo", "v3:special-hamster", "v3:special-tree-frog", "v3:special-panda", "v3:special-capybara", "v3:special-hedgehog", "v3:special-ginger-cat", "v3:special-alpaca", "v5:special-ostrich", "v6:special-bald-eagle-plain"];
const SERIES = [["night-hunters","Night Hunters"],["royals","Royals"],["gym-bros","Gym Bros"],["cozy-club","Cozy Club"],["odd-squad","Odd Squad"],["other","Other"]];
const KEY = "ff-specials-pick-v2";
let picked = new Set(JSON.parse(localStorage.getItem(KEY) || "null") || PRESELECT);
const peek = document.getElementById("peek");
function show(t){peek.querySelector("img").src=t.url;peek.querySelector("b").textContent=t.name+" ("+t.ver+")";peek.querySelector("i").textContent=t.detail;peek.querySelector("p").textContent=t.caption||"";peek.style.display="block"}
function hide(){peek.style.display="none"}
function render(){
  const cols=document.getElementById("cols");cols.innerHTML="";
  let total=0;
  for(const [key,label] of SERIES){
    const items=TILES.filter(t=>t.series===key); if(!items.length) continue;
    items.sort((a,b)=>picked.has(b.id)-picked.has(a.id));
    const n=items.filter(t=>picked.has(t.id)).length; if(key!=="other") total+=n;
    const col=document.createElement("div");col.className="col";
    col.innerHTML='<h2><span>'+label+'</span><span class="'+(key==="other"?"":(n===6?"ok":"short"))+'">'+n+(key==="other"?"":"/6")+'</span></h2><div class="grid"></div>';
    const grid=col.querySelector(".grid");
    for(const t of items){
      const d=document.createElement("div");d.className="t"+(picked.has(t.id)?" on":"");d.title=t.name+": "+t.detail;
      d.innerHTML='<img loading="eager" src="'+t.url+'" alt=""><span>'+t.name+'</span>';
      d.onclick=()=>{picked.has(t.id)?picked.delete(t.id):picked.add(t.id);localStorage.setItem(KEY,JSON.stringify([...picked]));render()};
      d.onmouseenter=()=>show(t);d.onmouseleave=hide;
      let timer;d.ontouchstart=()=>{timer=setTimeout(()=>show(t),350)};d.ontouchend=()=>{clearTimeout(timer);setTimeout(hide,1200)};
      grid.appendChild(d);
    }
    cols.appendChild(col);
  }
  const el=document.getElementById("total");el.textContent=total+"/30";el.className="count "+(total===30?"ok":"short");
}
document.getElementById("copy").onclick=()=>{const list=TILES.filter(t=>picked.has(t.id)).map(t=>t.name+" ("+t.ver+", "+t.series+")");navigator.clipboard.writeText(list.join("\n"));document.getElementById("copy").textContent="Copied "+list.length};
render();
</script></body></html>
