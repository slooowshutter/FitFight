<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FitFight Specials selector</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
    :root { --bg: #161A14; --card: #20261D; --line: rgba(240, 236, 220, 0.12); --text: #F0ECDC; --muted: #A7AE9C; --moss: #8DB36B; --gold: #D9B45A; }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body { margin: 0; background: var(--bg); color: var(--text); font-family: Nunito, system-ui, sans-serif; }
    header { position: sticky; top: 0; z-index: 5; background: rgba(22, 26, 20, 0.96); border-bottom: 1px solid var(--line); padding: 10px 12px calc(10px); }
    .top { display: flex; align-items: center; gap: 10px; max-width: 900px; margin: 0 auto; }
    h1 { font-size: 18px; font-weight: 900; margin: 0; flex: 1; }
    #total { font-weight: 900; font-size: 15px; }
    #copy { border: 0; border-radius: 999px; padding: 9px 14px; background: var(--moss); color: #10140d; font: 900 13px Nunito, sans-serif; }
    .counts { display: flex; gap: 6px; overflow-x: auto; max-width: 900px; margin: 8px auto 0; }
    .count { flex: none; border: 1px solid var(--line); border-radius: 999px; padding: 6px 10px; font-size: 12px; font-weight: 800; color: var(--text); background: transparent; }
    .count.full { border-color: var(--moss); color: var(--moss); }
    .count.over { border-color: #C8553D; color: #E0806B; }
    .filters { display: flex; gap: 6px; max-width: 900px; margin: 8px auto 0; }
    .filters button { border: 1px solid var(--line); background: transparent; color: var(--muted); border-radius: 999px; padding: 5px 10px; font: 800 12px Nunito, sans-serif; }
    .filters button[aria-pressed="true"] { background: var(--text); color: var(--bg); }
    main { max-width: 900px; margin: 0 auto; padding: 8px 12px 60px; }
    h2 { font-size: 20px; font-weight: 900; margin: 22px 0 4px; }
    .hint { color: var(--muted); font-size: 13px; margin: 0 0 10px; }
    .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
    @media (min-width: 600px) { .grid { grid-template-columns: repeat(3, 1fr); } }
    .tile { position: relative; background: var(--card); border: 2px solid var(--line); border-radius: 22px; overflow: hidden; }
    .tile.sel { border-color: var(--moss); }
    .tile button.pick { display: block; width: 100%; border: 0; padding: 0; background: #0f120d; aspect-ratio: 1 / 1; }
    .tile img { width: 100%; height: 100%; object-fit: contain; display: block; }
    .check { position: absolute; top: 8px; right: 8px; width: 28px; height: 28px; border-radius: 50%; border: 2px solid var(--line); background: rgba(0,0,0,0.45); color: transparent; display: flex; align-items: center; justify-content: center; font-weight: 900; pointer-events: none; }
    .tile.sel .check { background: var(--moss); border-color: var(--moss); color: #10140d; }
    .ver { position: absolute; top: 8px; left: 8px; background: rgba(0,0,0,0.55); padding: 2px 8px; border-radius: 999px; font-size: 11px; font-weight: 800; pointer-events: none; }
    .ver.v2 { color: #E0806B; }
    .meta { padding: 8px 10px 10px; }
    .nm { font-weight: 900; font-size: 15px; }
    .dt { color: var(--gold); font-size: 12px; font-weight: 700; }
    .cp { color: var(--muted); font-size: 12px; font-style: italic; margin-top: 3px; }
    select { margin-top: 6px; width: 100%; background: var(--bg); color: var(--text); border: 1px solid var(--line); border-radius: 10px; padding: 5px 6px; font: 700 12px Nunito, sans-serif; }
</style>
</head>
<body>
<header>
    <div class="top"><h1>Specials selector</h1><span id="total"></span><button id="copy" type="button">Copy selection</button></div>
    <div class="counts" id="counts"></div>
    <div class="filters" id="filters">
        <button type="button" data-f="all" aria-pressed="true">All</button>
        <button type="button" data-f="sel" aria-pressed="false">Selected only</button>
        <button type="button" data-f="new" aria-pressed="false">Hide v2</button>
    </div>
</header>
<main id="main"></main>

                '<span class="ver ' + t.ver.split(" ")[0] + '">' + esc(t.ver) + '</span><span class="check">&#10003;</span>' +
                '<div class="meta"><div class="nm">' + esc(t.name) + '</div><div class="dt">' + esc(t.detail) + '</div><div class="cp">"' + esc(t.caption) + '"</div>' +
                '<select data-move="' + esc(t.id) + '" aria-label="Series">' + opts.replace('value="' + seriesOf(t) + '"', 'value="' + seriesOf(t) + '" selected') + "</select></div></div>"
            ).join("") + "</div>";
    }).join("");
    renderCounts();
}

document.addEventListener("click", (e) => {
    const pick = e.target.closest(".pick");
    if (pick) {
        const id = pick.dataset.id;
        sel.has(id) ? sel.delete(id) : sel.add(id);
        save();
        pick.parentElement.classList.toggle("sel", sel.has(id));
        renderCounts();
        return;
    }
    const f = e.target.closest("[data-f]");
    if (f) {
        filter = f.dataset.f;
        document.querySelectorAll("[data-f]").forEach((b) => b.setAttribute("aria-pressed", String(b === f)));
        render();
    }
});

document.addEventListener("change", (e) => {
    const id = e.target.dataset.move;
    if (!id) return;
    const t = TILES.find((x) => x.id === id);
    if (e.target.value === t.series) delete moves[id]; else moves[id] = e.target.value;
    save();
    render();
});

document.getElementById("copy").addEventListener("click", async () => {
    const out = TILES.filter((t) => sel.has(t.id)).map((t) => ({ id: t.id, name: t.name, series: seriesOf(t) }));
    const text = JSON.stringify(out, null, 2);
    const btn = document.getElementById("copy");
    try { await navigator.clipboard.writeText(text); btn.textContent = "Copied"; }
    catch { window.prompt("Copy your selection", text); }
    setTimeout(() => { btn.textContent = "Copy selection"; }, 1500);
});

render();
</script>
</body>
</html>
