        return '<article class="card"><div class="name"><span class="dot" style="background:' + (COLOURS[sp.signatureColour] || "#888") + '"></span>' + esc(sp.name) +
            '</div><div class="colour">' + esc(sp.signatureColour) + "</div>" +
            '<p class="caption">"' + esc(sp.caption) + '"</p>' +
            '<p class="brief"><b>' + esc(sp.species) + ".</b> " + esc(sp.outfit) + ". <b>Accessory:</b> " + esc(sp.accessory) + ". <b>Attitude:</b> " + esc(sp.attitude) + ".</p>" +
            '<div class="pair">' + cands + "</div></article>";
    }).join("");
    document.getElementById("count").textContent = Object.keys(picks).length + " / 24";
}

document.addEventListener("click", (e) => {
    const tab = e.target.closest(".tab");
    if (tab) { current = tab.dataset.id; render(); window.scrollTo({ top: document.getElementById("tabs").offsetTop }); return; }
    const cand = e.target.closest(".cand");
    if (cand) {
        const i = Number(cand.dataset.i);
        if (picks[cand.dataset.sp] === i) delete picks[cand.dataset.sp]; else picks[cand.dataset.sp] = i;
        localStorage.setItem(KEY, JSON.stringify(picks));
        render();
    }
});

document.getElementById("copy").addEventListener("click", async () => {
    const text = JSON.stringify(picks, null, 2);
    const btn = document.getElementById("copy");
    try { await navigator.clipboard.writeText(text); btn.textContent = "Copied"; }
    catch { window.prompt("Copy your picks", text); }
    setTimeout(() => { btn.textContent = "Copy my picks"; }, 1500);
});

render();
</script>
</body>
</html>
